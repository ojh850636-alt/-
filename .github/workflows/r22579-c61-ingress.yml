name: R22579 C61 Receipt Ledger Verifier-First Ingress

on:
  pull_request:
    branches: [main]

jobs:
  ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r22579-c61-receipt-ledger

      - name: Verify sealed source-zero suite before any Adapter bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence source
          python -B tmp_r22579/c61_suite_builder.py --out evidence/C61_FRESH_SUITE.jsonl | tee evidence/C61_SUITE_BUILD.json
          test "$(sha256sum evidence/C61_FRESH_SUITE.jsonl | awk '{print $1}')" = "22592968b52e19a1a68249d09c58e553632899ca3301ddd76d1cab5758a529ad"
          python -B - <<'PY'
          import json,importlib.util,pathlib
          def load(path,name):
              s=importlib.util.spec_from_file_location(name,path); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); return m
          A=load('tmp_r22579/c61_verifier_a.py','va'); B=load('tmp_r22579/c61_verifier_b.py','vb')
          rows=[json.loads(x) for x in pathlib.Path('evidence/C61_FRESH_SUITE.jsonl').read_text().splitlines() if x.strip()]
          good=mut=0
          for c in rows:
              if A.score(c['target_json'],c['target'])['strict']==1 and B.integrity(c['target_json'],c['target'])['integrity']==1: good+=1
              bad=dict(c['target'])
              if bad['total_amount'] is not None: bad['total_amount']=round(float(bad['total_amount'])+1.0,2)
              else: bad['company_name']='HALLUCINATED'
              txt=json.dumps(bad,separators=(',',':'))
              if A.score(txt,c['target'])['strict']==0 or B.integrity(txt,c['target'])['integrity']==0: mut+=1
          out={'schema':'R22579_C61_REMOTE_VERIFIER_FIRST_V1','suite_count':len(rows),'selfcheck_pass':good,'mutation_detected':mut,'model_output_count':0,'adapter_bytes_at_verifier_gate':0,'verdict':'PASS' if (len(rows),good,mut)==(256,256,256) else 'FAIL'}
          pathlib.Path('evidence/C61_VERIFIER_FIRST.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          assert out['verdict']=='PASS'
          PY
          sha256sum tmp_r22579/C61_PREOUTPUT_SEAL.json > evidence/C61_REMOTE_PREOUTPUT_SEAL_SHA256.txt

      - name: Resolve immutable Adapter identity and one-use ingress only after verifier PASS
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir huggingface_hub==0.36.0 safetensors==0.7.0 numpy==2.3.5 requests==2.32.5
          python -B - <<'PY'
          import json,hashlib,pathlib,requests,numpy as np
          from huggingface_hub import hf_hub_download
          from safetensors import safe_open
          repo='avatar63/qwen-receipt-extractor'
          r=requests.get(f'https://huggingface.co/api/models/{repo}',timeout=30); r.raise_for_status(); meta=r.json(); rev=meta['sha']
          card=meta.get('cardData') or {}; lic=card.get('license') or meta.get('license'); base=card.get('base_model')
          assert str(lic).lower()=='apache-2.0', (lic,base)
          if isinstance(base,list): assert 'Qwen/Qwen2.5-0.5B-Instruct' in base
          else: assert base=='Qwen/Qwen2.5-0.5B-Instruct', base
          out=pathlib.Path('source'); out.mkdir(exist_ok=True)
          files={}
          for fn in ['adapter_config.json','adapter_model.safetensors','README.md','chat_template.jinja','tokenizer_config.json']:
              try: p=pathlib.Path(hf_hub_download(repo_id=repo,filename=fn,revision=rev,local_dir=out))
              except Exception as e: files[fn]={'status':'ABSENT_OR_UNAVAILABLE','error':type(e).__name__}; continue
              b=p.read_bytes(); files[fn]={'status':'CAPTURED','size':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          cfg=json.loads((out/'adapter_config.json').read_text())
          stats=[]
          with safe_open(out/'adapter_model.safetensors',framework='np',device='cpu') as f:
              keys=list(f.keys()); ks=set(keys)
              for k in keys:
                  if '.lora_A.' not in k or not k.endswith('.weight'): continue
                  bk=k.replace('.lora_A.','.lora_B.')
                  if bk not in ks: continue
                  A=np.asarray(f.get_tensor(k),dtype=np.float64); B=np.asarray(f.get_tensor(bk),dtype=np.float64)
                  an=float(np.linalg.norm(A)); bn=float(np.linalg.norm(B)); prod=an*bn
                  fam=next((z for z in ['q_proj','k_proj','v_proj','o_proj','gate_proj','up_proj','down_proj'] if z in k),'OTHER')
                  stats.append({'pair_id':hashlib.sha256(k.encode()).hexdigest()[:16],'family':fam,'a_shape':list(A.shape),'b_shape':list(B.shape),'rank_a':int(np.linalg.matrix_rank(A)),'rank_b':int(np.linalg.matrix_rank(B)),'a_norm':an,'b_norm':bn,'norm_product':prod,'alive':bool(prod>0 and np.isfinite(prod))})
              tensor_count=len(keys)
          rec={'schema':'R22579_C61_ADAPTER_ONLY_INGRESS_V1','repo':repo,'resolved_revision':rev,'license':lic,'base_model_api':base,'files':files,'adapter_config':cfg,'tensor_count':tensor_count,'pair_count':len(stats),'alive_pair_count':sum(x['alive'] for x in stats),'dead_pair_count':sum(not x['alive'] for x in stats),'nonfinite_count':sum(not np.isfinite(x['norm_product']) for x in stats),'pair_stats':stats,'base_downloaded':False,'base_new_source_credit':0,'training_time_base_revision_proven':False,'raw_committed_to_git':False,'adapter_hf_ingress_count':1}
          pathlib.Path('evidence/C61_ADAPTER_ONLY_INGRESS.json').write_text(json.dumps(rec,indent=2,sort_keys=True))
          assert rec['pair_count']>0 and rec['alive_pair_count']==rec['pair_count'] and rec['dead_pair_count']==0 and rec['nonfinite_count']==0
          print(json.dumps({k:rec[k] for k in ['resolved_revision','license','base_model_api','tensor_count','pair_count','alive_pair_count','dead_pair_count']},indent=2))
          PY

      - name: Upload one-use short-lived Adapter escrow
        uses: actions/upload-artifact@v4
        with:
          name: r22579-c61-adapter-escrow
          path: |
            source/adapter_config.json
            source/adapter_model.safetensors
            source/README.md
            source/chat_template.jinja
            source/tokenizer_config.json
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false

      - name: Delete runner raw source after escrow creation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source ~/.cache/huggingface
          test ! -e source
          printf '%s\n' '{"schema":"R22579_C61_INGRESS_LOCAL_CLEANUP_V1","local_raw_remaining":0,"base_downloaded":false,"raw_committed_to_git":false,"escrow_retention_days":1}' > evidence/C61_INGRESS_LOCAL_CLEANUP.json

      - name: Upload raw-free ingress evidence
        uses: actions/upload-artifact@v4
        with:
          name: r22579-c61-rawfree-ingress
          path: evidence/**
          retention-days: 1
          if-no-files-found: error
