name: LAA R22531 C30 Exact Courier

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Exact safe source capture
        shell: bash
        run: |
          set -euo pipefail
          POS_REPO='Daxuxu36/Blip-senticap-positive-LoRA'
          POS_REV='10cccdb9d18b409daa9e928912d1170345709a14'
          NEG_REPO='Daxuxu36/Blip-senticap-negative-LoRA'
          NEG_REV='5fc86a401daef7e62c1076ca6f54393c32114927'
          BASE_REPO='Salesforce/blip-image-captioning-base'
          BASE_REV='0f2f8a0ad1d98ce568b8de8e6a4c83e06af93c57'
          test "$(git ls-remote https://huggingface.co/${POS_REPO} refs/heads/main | awk '{print $1}')" = "$POS_REV"
          test "$(git ls-remote https://huggingface.co/${NEG_REPO} refs/heads/main | awk '{print $1}')" = "$NEG_REV"
          test "$(git ls-remote https://huggingface.co/${BASE_REPO} refs/pr/42 | awk '{print $1}')" = "$BASE_REV"

          python -m pip install --disable-pip-version-check -q 'huggingface_hub[hf_xet]==0.26.2'
          mkdir -p out/{pos,neg,base,meta,wheels,parts}
          python - <<'PY'
          from huggingface_hub import snapshot_download
          from pathlib import Path
          import hashlib,json,shutil,struct
          pos_repo='Daxuxu36/Blip-senticap-positive-LoRA'; pos_rev='10cccdb9d18b409daa9e928912d1170345709a14'
          neg_repo='Daxuxu36/Blip-senticap-negative-LoRA'; neg_rev='5fc86a401daef7e62c1076ca6f54393c32114927'
          base_repo='Salesforce/blip-image-captioning-base'; base_rev='0f2f8a0ad1d98ce568b8de8e6a4c83e06af93c57'
          out=Path('out'); p=out/'pos'; n=out/'neg'; b=out/'base'; m=out/'meta'
          adapter_allow=['adapter_config.json','adapter_model.safetensors','preprocessor_config.json','tokenizer_config.json','special_tokens_map.json','vocab.txt']
          base_allow=['model.safetensors','config.json','preprocessor_config.json','tokenizer.json','tokenizer_config.json','special_tokens_map.json','vocab.txt']
          snapshot_download(repo_id=pos_repo,revision=pos_rev,allow_patterns=adapter_allow,local_dir=p)
          snapshot_download(repo_id=neg_repo,revision=neg_rev,allow_patterns=adapter_allow,local_dir=n)
          snapshot_download(repo_id=base_repo,revision=base_rev,allow_patterns=base_allow,local_dir=b)
          for x in (p,n,b):
              c=x/'.cache'
              if c.exists(): shutil.rmtree(c)
          def sha(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for z in iter(lambda:f.read(1024*1024),b''): h.update(z)
              return h.hexdigest()
          def header(path):
              with open(path,'rb') as f:
                  nbytes=struct.unpack('<Q',f.read(8))[0]; meta=json.loads(f.read(nbytes))
              keys=[k for k in meta if k!='__metadata__']
              return {'tensor_count':len(keys),'sample':[{'key':k,'shape':meta[k].get('shape'),'dtype':meta[k].get('dtype')} for k in keys[:120]]}
          pw=p/'adapter_model.safetensors'; nw=n/'adapter_model.safetensors'; bw=b/'model.safetensors'
          expected={
            'positive':{'bytes':7088952,'sha256':'edb95309112453813c6911871397a6d2ae2f63bf68e7b65acdbf7d60df5797f2'},
            'negative':{'bytes':7088952,'sha256':'71f833923ac62717d4e79dda2aa33be137a9feec22a9043391c7355c1d3d9129'},
            'base':{'bytes':989721336,'sha256':'9339497cee045b8434a4ebf8f5a30e2f83984e7695a53030e99283a5786693d9'},
          }
          observed={
            'positive':{'bytes':pw.stat().st_size,'sha256':sha(pw),'header':header(pw)},
            'negative':{'bytes':nw.stat().st_size,'sha256':sha(nw),'header':header(nw)},
            'base':{'bytes':bw.stat().st_size,'sha256':sha(bw),'header':header(bw)},
          }
          for role in expected:
              assert observed[role]['bytes']==expected[role]['bytes'],(role,observed[role]['bytes'])
              assert observed[role]['sha256']==expected[role]['sha256'],(role,observed[role]['sha256'])
          blocked=[]
          for root in (p,n,b):
              for q in root.rglob('*'):
                  if q.is_file() and q.suffix.lower() in {'.bin','.pt','.pth','.pkl','.pickle','.h5','.msgpack'}: blocked.append(str(q))
          assert not blocked,blocked
          # Move small files into metadata artifact. Keep only safetensors in source artifacts.
          small=[]
          for role,root,weight in [('positive',p,'adapter_model.safetensors'),('negative',n,'adapter_model.safetensors'),('base',b,'model.safetensors')]:
              for q in root.rglob('*'):
                  if q.is_file() and q.name!=weight:
                      rel=f'{role}/{q.relative_to(root).as_posix()}'; dest=m/rel;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(q,dest)
                      small.append({'path':rel,'bytes':q.stat().st_size,'sha256':sha(q)})
          manifest={
            'schema':'LUCIA_AA_R22531_C30_COURIER_V1','positive_repo':pos_repo,'positive_revision':pos_rev,
            'negative_repo':neg_repo,'negative_revision':neg_rev,'base_repo':base_repo,'base_revision':base_rev,
            'expected':expected,'observed':observed,'small_files':small,'blocked_files_present':blocked,'raw_committed_to_git':False,
            'preseal_sha256':'PLACEHOLDER_FILLED_LOCALLY_BEFORE_AUTHORITY','suite_sha256':'deeb319f09d5266c73a3b17f2cfc766214de0df296aea9819b21f2b1bf4ab3e9'
          }
          (m/'SOURCE_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
          split -b 220M out/base/model.safetensors out/parts/base_
          rm out/base/model.safetensors
          python -m pip download --disable-pip-version-check --no-deps -q -d out/wheels \
            'transformers==4.46.2' 'peft==0.13.2' 'tokenizers==0.20.3' 'accelerate==1.1.1' 'huggingface_hub==0.26.2'
          sha256sum out/wheels/* > out/meta/WHEEL_SHA256.txt
      - name: Upload C30 metadata
        uses: actions/upload-artifact@v4
        with: {name: r22531-c30-meta, path: out/meta, retention-days: 1, compression-level: 6}
      - name: Upload C30 positive adapter
        uses: actions/upload-artifact@v4
        with: {name: r22531-c30-positive, path: out/pos/adapter_model.safetensors, retention-days: 1, compression-level: 0}
      - name: Upload C30 negative adapter
        uses: actions/upload-artifact@v4
        with: {name: r22531-c30-negative, path: out/neg/adapter_model.safetensors, retention-days: 1, compression-level: 0}
      - name: Upload C30 base 00
        uses: actions/upload-artifact@v4
        with: {name: r22531-c30-base-00, path: out/parts/base_aa, retention-days: 1, compression-level: 0}
      - name: Upload C30 base 01
        uses: actions/upload-artifact@v4
        with: {name: r22531-c30-base-01, path: out/parts/base_ab, retention-days: 1, compression-level: 0}
      - name: Upload C30 base 02
        uses: actions/upload-artifact@v4
        with: {name: r22531-c30-base-02, path: out/parts/base_ac, retention-days: 1, compression-level: 0}
      - name: Upload C30 base 03
        uses: actions/upload-artifact@v4
        with: {name: r22531-c30-base-03, path: out/parts/base_ad, retention-days: 1, compression-level: 0}
      - name: Upload C30 base 04
        uses: actions/upload-artifact@v4
        with: {name: r22531-c30-base-04, path: out/parts/base_ae, retention-days: 1, compression-level: 0}
      - name: Upload C30 runtime
        uses: actions/upload-artifact@v4
        with: {name: r22531-c30-runtime, path: out/wheels, retention-days: 1, compression-level: 0}
