name: LAA R22531 C30 Safe Base Metadata Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve Salesforce BLIP safetensors reference without weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, subprocess, urllib.request, urllib.parse, pathlib

          base='Salesforce/blip-image-captioning-base'
          safe_ref='refs/pr/42'
          p=subprocess.run(['git','ls-remote',f'https://huggingface.co/{base}',safe_ref],capture_output=True,text=True,check=True)
          if not p.stdout.strip():
              raise SystemExit('safe ref not found')
          rev=p.stdout.split()[0]

          def req(url):
              return urllib.request.Request(url,headers={'User-Agent':'LUCIA-AA-R22531-safe-base-audit'})
          def get_json(url):
              with urllib.request.urlopen(req(url),timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))
          def get_text(url):
              with urllib.request.urlopen(req(url),timeout=30) as r:
                  return r.read().decode('utf-8',errors='replace')

          enc=urllib.parse.quote(safe_ref, safe='')
          api=get_json(f'https://huggingface.co/api/models/{base}/revision/{enc}?blobs=true')
          siblings=[]
          for s in api.get('siblings',[]):
              rec={'rfilename':s.get('rfilename'),'size':s.get('size')}
              if s.get('lfs'): rec['lfs']=s.get('lfs')
              if s.get('xetHash'): rec['xetHash']=s.get('xetHash')
              siblings.append(rec)
          st=[x for x in siblings if x['rfilename']=='model.safetensors']
          if len(st)!=1:
              raise SystemExit(f'exact model.safetensors count={len(st)}')

          # Processor/config files are also required on the same ref.
          names={x['rfilename'] for x in siblings}
          required={'model.safetensors','config.json','preprocessor_config.json','tokenizer.json','vocab.txt'}
          missing=sorted(required-names)
          if missing:
              raise SystemExit(f'missing required files: {missing}')

          out={
            'schema':'LUCIA_AA_R22531_C30_SAFE_BASE_METADATA_V1',
            'raw_weight_bytes_downloaded':0,
            'model_outputs_observed':0,
            'repo':base,
            'safe_ref':safe_ref,
            'revision':rev,
            'license':(api.get('cardData') or {}).get('license'),
            'pipeline_tag':api.get('pipeline_tag'),
            'model_safetensors':st[0],
            'required_files_present':True,
            'siblings':siblings,
          }
          pathlib.Path('out/C30_SAFE_BASE_METADATA.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'revision':rev,'model_safetensors':st[0],'raw_weight_bytes_downloaded':0},indent=2))
          PY
      - name: Upload safe-base metadata
        uses: actions/upload-artifact@v4
        with:
          name: r22531-c30-safe-base-metadata
          path: out/C30_SAFE_BASE_METADATA.json
          retention-days: 1
          compression-level: 6
