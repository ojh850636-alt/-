name: LUCIA AA C3 source capture

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ADAPTER_REPO: rambodazimi/roberta-base-finetuned-LoRA-SST2
      ADAPTER_REV: 419dcf3145523eec5cb0a98ecfa087a2a59a9c33
      BASE_REPO: FacebookAI/roberta-base
      BASE_REV: e2da8e2f811d1448a5b465c236feacd80ffbac7b
      ADAPTER_SHA: 4139d6540aaa20455dfa661ac7d06b10bda537dfac520e8efd64b0ba7e5931be
      ADAPTER_SIZE: '4735200'
      BASE_SHA: 5bde1d28afb363d0103324efeb5afc8b2b397fe5e04beabb9b1ef355255ade81
    steps:
      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/adapter source/base source/adapter_tokenizer

      - name: Download pinned source files
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            local repo="$1" rev="$2" file="$3" out="$4"
            local url="https://huggingface.co/${repo}/resolve/${rev}/${file}?download=true"
            echo "Downloading ${repo}@${rev}:${file}"
            curl --location --fail --show-error --silent \
              --retry 5 --retry-all-errors --connect-timeout 30 \
              --output "$out" "$url"
          }
          fetch_optional() {
            local repo="$1" rev="$2" file="$3" out="$4"
            local url="https://huggingface.co/${repo}/resolve/${rev}/${file}?download=true"
            if ! curl --location --fail --show-error --silent \
              --retry 3 --retry-all-errors --connect-timeout 30 \
              --output "$out" "$url"; then
              rm -f "$out"
              echo "Optional file absent: ${repo}@${rev}:${file}"
            fi
          }

          fetch "$ADAPTER_REPO" "$ADAPTER_REV" adapter_config.json source/adapter/adapter_config.json
          fetch "$ADAPTER_REPO" "$ADAPTER_REV" adapter_model.safetensors source/adapter/adapter_model.safetensors

          fetch "$BASE_REPO" "$BASE_REV" config.json source/base/config.json
          fetch "$BASE_REPO" "$BASE_REV" model.safetensors source/base/model.safetensors
          fetch "$BASE_REPO" "$BASE_REV" tokenizer.json source/base/tokenizer.json
          fetch "$BASE_REPO" "$BASE_REV" tokenizer_config.json source/base/tokenizer_config.json
          fetch "$BASE_REPO" "$BASE_REV" vocab.json source/base/vocab.json
          fetch "$BASE_REPO" "$BASE_REV" merges.txt source/base/merges.txt
          fetch_optional "$BASE_REPO" "$BASE_REV" special_tokens_map.json source/base/special_tokens_map.json

          fetch "$ADAPTER_REPO" "$ADAPTER_REV" tokenizer.json source/adapter_tokenizer/tokenizer.json
          fetch "$ADAPTER_REPO" "$ADAPTER_REV" tokenizer_config.json source/adapter_tokenizer/tokenizer_config.json
          fetch "$ADAPTER_REPO" "$ADAPTER_REV" vocab.json source/adapter_tokenizer/vocab.json
          fetch "$ADAPTER_REPO" "$ADAPTER_REV" merges.txt source/adapter_tokenizer/merges.txt
          fetch_optional "$ADAPTER_REPO" "$ADAPTER_REV" special_tokens_map.json source/adapter_tokenizer/special_tokens_map.json

      - name: Verify pinned identities and build receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, struct

          root = Path('source')
          expected = {
              'adapter/adapter_model.safetensors': {
                  'sha256': os.environ['ADAPTER_SHA'],
                  'size_bytes': int(os.environ['ADAPTER_SIZE']),
              },
              'base/model.safetensors': {
                  'sha256': os.environ['BASE_SHA'],
                  'size_bytes': None,
              },
          }

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          files = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(root).as_posix()
              size = path.stat().st_size
              digest = sha256(path)
              row = {'path': rel, 'size_bytes': size, 'sha256': digest}
              if path.suffix == '.safetensors':
                  with path.open('rb') as f:
                      header_len_raw = f.read(8)
                      if len(header_len_raw) != 8:
                          raise SystemExit(f'invalid safetensors header: {rel}')
                      header_len = struct.unpack('<Q', header_len_raw)[0]
                      if header_len <= 0 or header_len > size - 8:
                          raise SystemExit(f'invalid safetensors header length: {rel}')
                      header = f.read(header_len)
                      json.loads(header)
                  row['safetensors_header_bytes'] = header_len
              files.append(row)

          for rel, identity in expected.items():
              path = root / rel
              if not path.is_file():
                  raise SystemExit(f'missing required file: {rel}')
              actual_size = path.stat().st_size
              actual_sha = sha256(path)
              if identity['size_bytes'] is not None and actual_size != identity['size_bytes']:
                  raise SystemExit(f'size mismatch {rel}: {actual_size} != {identity["size_bytes"]}')
              if actual_sha != identity['sha256']:
                  raise SystemExit(f'sha mismatch {rel}: {actual_sha} != {identity["sha256"]}')

          receipt = {
              'schema': 'LUCIA_AA_C3_GITHUB_ACTIONS_SOURCE_CAPTURE_V1',
              'candidate_id': 'R224-C3-ROBERTA-SST2',
              'adapter': {
                  'repo_id': os.environ['ADAPTER_REPO'],
                  'revision': os.environ['ADAPTER_REV'],
              },
              'base': {
                  'repo_id': os.environ['BASE_REPO'],
                  'revision': os.environ['BASE_REV'],
                  'claim_boundary': 'PINNED_RUNTIME_REFERENCE_NOT_PROVEN_AS_TRAINING_TIME_BASE',
              },
              'files': files,
              'raw_weight_redistribution_scope': 'TEMPORARY_ANALYSIS_TRANSFER_ONLY_PUBLIC_UPSTREAM_SOURCE',
              'verdict': 'PASS_PINNED_SOURCE_CAPTURE',
          }
          Path('source/SOURCE_CAPTURE_RECEIPT.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'file_count': len(files),
              'base_model_size_bytes': (root / 'base/model.safetensors').stat().st_size,
              'verdict': receipt['verdict'],
          }, indent=2))
          PY

      - name: Upload temporary source capsule artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucia-aa-c3-pinned-source-capsule
          path: source/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
