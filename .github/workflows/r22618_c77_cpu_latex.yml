name: R22618 C77 CPU LaTeX exact source courier
on:
  push:
    branches: [r22618-c77-cpu-latex]
jobs:
  courier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify exact safe source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/adapter src/base
          ADAPTER_REPO='piyushgupta53/smollm2-135m-english-to-latex-notation-lora'
          ADAPTER_REV='c200d3fd796cca1baa29cc87f8c912043f10cf88'
          BASE_REPO='HuggingFaceTB/SmolLM2-135M-Instruct'
          BASE_REV='12fd25f77366fa6b3b4b768ec3050bf629380bac'
          hfget() { curl -L --retry 5 --retry-delay 2 --fail --silent --show-error "https://huggingface.co/$1/resolve/$2/$3?download=true" -o "$4"; }
          hfget "$ADAPTER_REPO" "$ADAPTER_REV" adapter_model.safetensors src/adapter/adapter_model.safetensors
          hfget "$ADAPTER_REPO" "$ADAPTER_REV" adapter_config.json src/adapter/adapter_config.json
          hfget "$BASE_REPO" "$BASE_REV" model.safetensors src/base/model.safetensors
          for f in config.json generation_config.json tokenizer.json tokenizer_config.json special_tokens_map.json merges.txt vocab.json; do
            hfget "$BASE_REPO" "$BASE_REV" "$f" "src/base/$f"
          done
          test "$(stat -c%s src/adapter/adapter_model.safetensors)" = '39131224'
          echo 'bb8086d19ef704e4d195ea4125ea800edb1a9623a7fd49b3472904c500cba60a  src/adapter/adapter_model.safetensors' | sha256sum -c -
          test "$(stat -c%s src/base/model.safetensors)" = '269060552'
          echo '5af571cbf074e6d21a03528d2330792e532ca608f24ac70a143f6b369968ab8c  src/base/model.safetensors' | sha256sum -c -
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('src')
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              rows.append({'path':p.as_posix(),'bytes':p.stat().st_size,'sha256':h})
          manifest={'schema':'R22618_C77_EXACT_SOURCE_MANIFEST_V1','adapter_repo':'piyushgupta53/smollm2-135m-english-to-latex-notation-lora','adapter_revision':'c200d3fd796cca1baa29cc87f8c912043f10cf88','base_repo':'HuggingFaceTB/SmolLM2-135M-Instruct','base_revision':'12fd25f77366fa6b3b4b768ec3050bf629380bac','files':rows}
          pathlib.Path('src/SOURCE_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload exact source as ephemeral artifact
        uses: actions/upload-artifact@v4
        with:
          name: r22618-c77-exact-source
          path: src
          retention-days: 1
          compression-level: 0
