name: R22576 C58 raw-free source export
on:
  push:
    branches: [r22574-c58-behavior]
permissions:
  contents: read
jobs:
  export:
    if: github.event.head_commit.message == 'Package C58 rawfree source for handoff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export only source-zero contracts and runtime source
        run: |
          set -euo pipefail
          mkdir -p export/r22574/runtime_source
          for f in \
            r22574/C58_CANDIDATE_AUDIT.json \
            r22574/C58_PREOUTPUT_SEAL.json \
            r22574/C58_PREOUTPUT_AMENDMENTS.json \
            r22574/build_c58_procedural_rte.py \
            r22574/runtime_source/c58_prepare_source.py \
            r22574/runtime_source/c58_behavior_causal.py; do
            test -f "$f"; cp "$f" "export/${f}";
          done
          python - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path('export'); rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rows.append({'path':p.relative_to(root).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'R22576_C58_RAWFREE_SOURCE_MANIFEST.json').write_text(json.dumps({'schema':'R22576_C58_RAWFREE_SOURCE_EXPORT_V1','files':rows,'raw_weights':0,'model_outputs':0},indent=2,sort_keys=True)+'\n')
          print(json.dumps({'files':len(rows)},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22576-c58-rawfree-source-export
          path: export
          retention-days: 1
          if-no-files-found: error
