name: R22570 C54 PTBR Simplification Archaeology
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  archaeology:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Decode and bind exact presealed runner
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/scripts/r22570_c54_runner.py.gz.b64 | gzip -d > "$RUNNER_TEMP/r22570_c54_runner.py"
          echo 'a43623e8f58f72b9b8f9dae9ad9664fc47e5f3b07ba8b7fcb2b23566f855d189  '"$RUNNER_TEMP"'/r22570_c54_runner.py' | sha256sum -c -
          PYTHONDONTWRITEBYTECODE=1 python -m py_compile "$RUNNER_TEMP/r22570_c54_runner.py"
          find "$RUNNER_TEMP" -name '__pycache__' -type d -prune -exec rm -rf {} +
      - name: Source-free preoutput seal and verifier mutation smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf rawfree c54-work
          PYTHONDONTWRITEBYTECODE=1 python "$RUNNER_TEMP/r22570_c54_runner.py" preseal --out rawfree
          python - <<'PY'
          import json
          s=json.load(open('rawfree/C54_PREOUTPUT_SEAL.json'))
          assert s['weights_present']==0 and s['model_outputs_observed']==0 and s['suite_n']==256
          assert s['suite_sha256']=='0f6ccd7148ffeb299995ec26edb4560b2cfc6e3cdeb5ef01a024d27fb42ce18c'
          assert s['training_rows_used']==0
          print('PRESEAL_PASS',s['suite_sha256'])
          PY
      - name: Install bounded safe analysis runtime
        shell: bash
        run: |
          set -euo pipefail
          export HF_HOME="$RUNNER_TEMP/hf-home-c54"
          python -m pip install -q --upgrade pip
          python -m pip install -q 'torch>=2.6,<3' 'transformers>=4.48,<6' 'peft>=0.14,<1' 'safetensors>=0.5,<1' 'huggingface_hub>=0.27,<2' 'accelerate>=1,<2' sentencepiece
      - name: One-use exact ingress behavior controls and conditional broad causal screen
        shell: bash
        run: |
          set -euo pipefail
          export HF_HOME="$RUNNER_TEMP/hf-home-c54"
          PYTHONDONTWRITEBYTECODE=1 python "$RUNNER_TEMP/r22570_c54_runner.py" execute --out rawfree --work c54-work
      - name: Verify raw deletion and raw-free export contract
        shell: bash
        run: |
          set -euo pipefail
          test ! -e c54-work/raw
          test ! -e c54-work/variants
          test ! -e c54-work/escrow
          python - <<'PY'
          import json, pathlib, re, hashlib
          root=pathlib.Path('rawfree')
          c=json.load(open(root/'C54_CLEANUP.json'))
          assert c['raw_root_deleted'] and c['variant_root_deleted'] and c['escrow_deleted']
          assert c['raw_weights_remaining']==0 and c['raw_tokenizer_remaining']==0
          bad=[]
          for p in root.rglob('*'):
            if not p.is_file(): continue
            n=p.name.lower()
            if re.search(r'\.(safetensors|bin|pt|pth|pkl|pickle|model)$',n): bad.append(str(p))
            if n.startswith('tokenizer') or n in {'vocab.json','merges.txt','special_tokens_map.json'}: bad.append(str(p))
          assert not bad, bad
          lines=[]
          for p in sorted(root.glob('*')):
            if p.is_file() and p.name!='SHA256SUMS.txt':
              lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")
          (root/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          print('RAW_FREE_PASS',len(lines))
          PY
          find rawfree -maxdepth 1 -type f -printf '%f\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: r22570-c54-rawfree-evidence
          path: rawfree/
          retention-days: 1
          if-no-files-found: error
