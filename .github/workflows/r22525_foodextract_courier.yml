name: R22525 FoodExtract exact-source courier

on:
  push:
    branches:
      - agent/r22525-foodextract-courier
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install capture-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'huggingface_hub==1.4.1' 'safetensors==0.7.0'

      - name: Exact revision capture and audit
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_ENABLE_HF_TRANSFER: '0'
        run: |
          cat > /tmp/capture.py <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil
          from huggingface_hub import snapshot_download
          from safetensors import safe_open

          ROOT = Path('bundle')
          ADAPTER = ROOT / 'adapter'
          BASE = ROOT / 'base'
          WHEELS = ROOT / 'wheels'
          for p in (ADAPTER, BASE, WHEELS):
              p.mkdir(parents=True, exist_ok=True)

          adapter_repo = 'berkeruveyik/smolvlm2-256m-FoodExtract-Vision-v1'
          adapter_revision = '9a1c701146c491b3379f00420123cb4c73899c96'
          base_repo = 'HuggingFaceTB/SmolVLM2-256M-Video-Instruct'
          base_revision = '067788b187b95ebe7b2e040b3e4299e342e5b8fd'

          adapter_allow = [
              'README.md', 'adapter_config.json', 'adapter_model.safetensors',
              'chat_template.jinja', 'processor_config.json',
              'tokenizer.json', 'tokenizer_config.json'
          ]
          base_allow = [
              'README.md', 'config.json', 'generation_config.json',
              'preprocessor_config.json', 'processor_config.json',
              'chat_template.json', 'added_tokens.json', 'merges.txt',
              'special_tokens_map.json', 'tokenizer.json',
              'tokenizer_config.json', 'vocab.json', 'model.safetensors'
          ]

          a_cache = snapshot_download(
              repo_id=adapter_repo, revision=adapter_revision,
              allow_patterns=adapter_allow,
              ignore_patterns=['*.bin','*.pt','*.pth','*.pkl','*.pickle','*.h5','*.msgpack','*.ckpt','*.py','*.ipynb'],
          )
          b_cache = snapshot_download(
              repo_id=base_repo, revision=base_revision,
              allow_patterns=base_allow,
              ignore_patterns=['*.bin','*.pt','*.pth','*.pkl','*.pickle','*.h5','*.msgpack','*.ckpt','*.py','*.ipynb','onnx/**'],
          )

          def copy_allow(src_root, dst_root, allow):
              src_root = Path(src_root)
              copied = []
              for rel in allow:
                  src = src_root / rel
                  if src.exists() and src.is_file():
                      dst = dst_root / rel
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(src, dst)
                      copied.append(rel)
              return copied

          copied_adapter = copy_allow(a_cache, ADAPTER, adapter_allow)
          copied_base = copy_allow(b_cache, BASE, base_allow)

          banned = {'.bin','.pt','.pth','.pkl','.pickle','.h5','.msgpack','.ckpt','.py','.ipynb'}
          bad = [str(p) for p in ROOT.rglob('*') if p.is_file() and p.suffix.lower() in banned]
          if bad:
              raise SystemExit(f'banned files captured: {bad}')

          def sha256(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for block in iter(lambda: f.read(1024*1024), b''):
                      h.update(block)
              return h.hexdigest()

          def tensor_summary(path):
              out = {'tensor_count': 0, 'total_elements': 0, 'dtypes': {}, 'keys_sha256': None}
              keys = []
              with safe_open(path, framework='pt', device='cpu') as f:
                  for key in f.keys():
                      t = f.get_slice(key)
                      shape = list(t.get_shape())
                      dtype = str(t.get_dtype())
                      n = 1
                      for dim in shape:
                          n *= int(dim)
                      out['tensor_count'] += 1
                      out['total_elements'] += n
                      out['dtypes'][dtype] = out['dtypes'].get(dtype, 0) + 1
                      keys.append({'key': key, 'shape': shape, 'dtype': dtype})
              out['keys_sha256'] = hashlib.sha256(json.dumps(keys, sort_keys=True).encode()).hexdigest()
              out['key_shapes'] = keys
              return out

          files = []
          for p in sorted(ROOT.rglob('*')):
              if p.is_file():
                  files.append({'path': p.relative_to(ROOT).as_posix(), 'size': p.stat().st_size, 'sha256': sha256(p)})

          adapter_weight = ADAPTER / 'adapter_model.safetensors'
          base_weight = BASE / 'model.safetensors'
          report = {
              'schema': 'R22525_EXACT_SOURCE_CAPTURE_V1',
              'adapter': {'repo': adapter_repo, 'revision': adapter_revision, 'copied': copied_adapter},
              'base': {'repo': base_repo, 'revision': base_revision, 'copied': copied_base, 'training_time_revision_proven': False},
              'files': files,
              'adapter_tensor_summary': tensor_summary(adapter_weight),
              'base_tensor_summary': tensor_summary(base_weight),
              'trust_remote_code': False,
              'pickle_loaded': False,
              'banned_file_count': 0,
          }
          (ROOT / 'CAPTURE_MANIFEST.json').write_text(json.dumps(report, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps({'adapter_bytes': adapter_weight.stat().st_size, 'adapter_sha256': sha256(adapter_weight), 'base_bytes': base_weight.stat().st_size, 'base_sha256': sha256(base_weight)}, indent=2))
          PY
          python /tmp/capture.py

      - name: Download Python 3.13 runtime wheels without torch
        run: |
          python -m pip download --dest bundle/wheels --only-binary=:all: --no-deps \
            'transformers==5.0.0' 'peft==0.18.1' 'accelerate==1.14.0' \
            'tokenizers==0.22.2' 'safetensors==0.7.0' \
            'huggingface_hub==1.4.1' 'pillow==11.3.0' 'numpy==2.3.5' \
            'sentencepiece==0.2.1' 'num2words==0.5.14' 'psutil==7.0.0'
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          rows=[]
          for p in sorted(Path('bundle/wheels').glob('*')):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              rows.append({'name':p.name,'size':p.stat().st_size,'sha256':h})
          Path('bundle/WHEEL_MANIFEST.json').write_text(json.dumps(rows, indent=2, sort_keys=True))
          PY

      - name: Split large base weight and seal parts
        run: |
          mkdir -p parts/meta parts/adapter parts/base
          cp -a bundle/CAPTURE_MANIFEST.json bundle/WHEEL_MANIFEST.json bundle/wheels parts/meta/
          find bundle/adapter -type f ! -name adapter_model.safetensors -exec cp --parents '{}' parts/meta/ \;
          find bundle/base -type f ! -name model.safetensors -exec cp --parents '{}' parts/meta/ \;
          cp bundle/adapter/adapter_model.safetensors parts/adapter/
          split -b 180M -d -a 2 bundle/base/model.safetensors parts/base/base.part.
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          rows=[]
          for p in sorted(Path('parts/base').glob('base.part.*')):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              rows.append({'name':p.name,'size':p.stat().st_size,'sha256':h})
          Path('parts/base/PARTS_MANIFEST.json').write_text(json.dumps(rows, indent=2, sort_keys=True))
          print(rows)
          PY
          ls -lh parts/base parts/adapter parts/meta

      - uses: actions/upload-artifact@v4
        with:
          name: R22525_META_AND_WHEELS
          path: parts/meta
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: R22525_ADAPTER_WEIGHT
          path: parts/adapter
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: R22525_BASE_PART_00
          path: parts/base/base.part.00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: R22525_BASE_PART_01
          path: parts/base/base.part.01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: R22525_BASE_PART_02
          path: parts/base/base.part.02
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: R22525_BASE_PART_03
          path: parts/base/base.part.03
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: R22525_BASE_PART_04
          path: parts/base/base.part.04
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: R22525_BASE_PART_05
          path: parts/base/base.part.05
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: R22525_BASE_PARTS_MANIFEST
          path: parts/base/PARTS_MANIFEST.json
          compression-level: 0
          retention-days: 1
