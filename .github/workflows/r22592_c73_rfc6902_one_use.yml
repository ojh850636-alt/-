name: R22592 C73 RFC6902 MLX adapter-only one-use
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  c73:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bind reviewed runner and preflight before source
        run: |
          set -euo pipefail
          test "$(git hash-object .github/r22592/c73_mlx_static_runner.py)" = "a0ab4ddee0c6fa85d076c83d01d061c4aa004d67"
          python -m py_compile .github/r22592/c73_mlx_static_runner.py
          python -m pip install --disable-pip-version-check 'numpy==2.3.5'
          PYTHONDONTWRITEBYTECODE=1 python -B .github/r22592/c73_mlx_static_runner.py --preflight
      - name: Canonical one-use final Adapter static archaeology
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -B .github/r22592/c73_mlx_static_runner.py
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
      - name: Upload raw-free evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r22592-c73-rfc6902-mlx-static-rawfree
          path: work/out/
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
      - name: Persist GitHub-internal source run receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          OUT_BRANCH: r22592-c73-source-receipt
        run: |
          python - <<'PY'
          import os,json,urllib.request,base64,time,datetime
          H={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22592-source-receipt','Content-Type':'application/json'}
          arts=[]
          for _ in range(10):
            req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}/artifacts?per_page=100",headers=H)
            with urllib.request.urlopen(req,timeout=30) as r:d=json.loads(r.read().decode())
            arts=d.get('artifacts',[])
            if arts:break
            time.sleep(2)
          out={'schema':'R22592_C73_GITHUB_SOURCE_RUN_RECEIPT_V1','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'run_id':int(os.environ['RUN_ID']),'head_sha':os.environ['HEAD_SHA'],'artifacts':[{'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'digest':a.get('digest'),'expired':a.get('expired')} for a in arts]}
          b=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode();payload=json.dumps({'message':'Persist R22592 C73 source receipt','content':base64.b64encode(b).decode(),'branch':os.environ['OUT_BRANCH']}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/recovery/R22592_C73_GITHUB_SOURCE_RUN_RECEIPT.json",data=payload,headers=H,method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r:r.read()
          PY
