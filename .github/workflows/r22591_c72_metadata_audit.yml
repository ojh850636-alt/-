name: R22591 C72 metadata-only candidate audit
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: API-only immutable candidate audit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT_BRANCH: r22591-c72-metadata-receipt
        run: |
          set -euo pipefail
          mkdir -p work/out
          python - <<'PY'
          import urllib.request,json,re,hashlib,datetime,os,base64
          from pathlib import Path
          UA={'User-Agent':'LUCIA-AA-R22591-C72-metadata-only'}
          CANDS=[
            {'id':'C72-A','repo':'marknchan/qwen3-4b-structured-output-lora','new':True,'question':'CROSS_FORMAT_TYPED_TREE_TRANSLATION_JSON_YAML_XML_TOML_CSV_WITH_CANONICAL_SEMANTIC_EQUIVALENCE_AND_NO_FIELD_LOSS','verifier':'independent_multi_format_parsers_to_canonical_typed_tree','cost':'MEDIUM_4B','extras':[]},
            {'id':'C72-B','repo':'Ethosoft/Qwen3-1.7B-ResearchReasoning-JSON-RL','new':True,'question':'BOUNDED_DOCUMENT_SET_TO_SOURCE_ID_CLAIM_GRAPH_WITH_NO_PHANTOM_CITATIONS_AND_EXPLICIT_CONFLICT_TRACKING','verifier':'strict_json_schema_plus_closed_source_id_and_fixture_claim_graph_oracle','cost':'LOW_1_7B','extras':['release_metadata.json','training_config.json','research_output_schema.json','benchmark_results.json']},
            {'id':'C72-C','repo':'savoji/qwen3.5-0.8b-tablevqa-lora','new':True,'question':'RASTERIZED_TABLE_IMAGE_TO_EXACT_ROW_COLUMN_CELL_LOOKUP_WITH_NO_TEXT_SOURCE','verifier':'procedurally_rendered_table_image_plus_hidden_cell_value_oracle','cost':'LOW_0_8B_VLM','extras':['train_meta.json','processor_config.json']},
            {'id':'C72-D','repo':'n0rths7ar/bioevidence-qwen3-4b-extraction-lora-v2','new':False,'question':'QUERY_DOCUMENT_TO_STRUCTURED_EVIDENCE_SPAN_EXTRACTION','verifier':'schema_plus_verbatim_span','cost':'MEDIUM_4B','extras':[],'dedup_reason':'prior structured extraction families; comparison only'},
            {'id':'C72-E','repo':'rflores3113/qwen2.5-1.5b-email-extraction-lora','new':False,'question':'SUPPORT_EMAIL_TO_SIX_FIELD_JSON_EXTRACTION','verifier':'typed_json_fields','cost':'LOW_1_5B','extras':['seed_meta.json'],'dedup_reason':'historical Source6 email extraction already exists; comparison only'},
          ]
          def get(url,limit=6_000_000):
            req=urllib.request.Request(url,headers=UA)
            with urllib.request.urlopen(req,timeout=60) as r:
              b=r.read(limit+1)
              if len(b)>limit: raise RuntimeError('META_TOO_LARGE:'+url)
              return b
          def getj(url): return json.loads(get(url).decode())
          def text(repo,sha,name): return get(f'https://huggingface.co/{repo}/raw/{sha}/{name}').decode('utf-8','replace')
          def sibling(info,name):
            for x in info.get('siblings') or []:
              if x.get('rfilename')==name:
                l=x.get('lfs') or {}
                return {'size':l.get('size') or x.get('size'),'sha256':l.get('sha256') or l.get('oid'),'blob_id':x.get('blobId')}
            return {}
          def all40(s): return sorted(set(x.lower() for x in re.findall(r'(?<![0-9a-f])[0-9a-f]{40}(?![0-9a-f])',s,re.I)))
          rows=[]
          for c in CANDS:
            info=getj('https://huggingface.co/api/models/'+c['repo']+'?blobs=true')
            sha=info.get('sha'); card=info.get('cardData') or {}; lic=card.get('license')
            if not re.fullmatch(r'[0-9a-f]{40}',str(sha)): raise RuntimeError('NO_IMMUTABLE_SHA:'+c['repo'])
            cfg_txt=text(c['repo'],sha,'adapter_config.json'); readme=text(c['repo'],sha,'README.md'); cfg=json.loads(cfg_txt)
            wm=sibling(info,'adapter_model.safetensors')
            if not wm.get('size') or not wm.get('sha256'): raise RuntimeError('NO_LFS_IDENTITY:'+c['repo'])
            siblings={x.get('rfilename') for x in info.get('siblings') or [] if isinstance(x,dict)}
            extra={}; corpus_parts=[readme,cfg_txt]; tokens=set(all40(readme)+all40(cfg_txt))
            for name in c.get('extras',[]):
              if name not in siblings: continue
              try:
                t=text(c['repo'],sha,name); corpus_parts.append(t);tokens.update(all40(t));extra[name]={'sha256':hashlib.sha256(t.encode()).hexdigest(),'text':t[:25000]}
              except Exception as e: extra[name]={'error':type(e).__name__+':'+str(e)[:300]}
            cfg_rev=cfg.get('revision'); exact=False; exact_rev=None; exact_reason='NONE'
            if isinstance(cfg_rev,str) and re.fullmatch(r'[0-9a-f]{40}',cfg_rev): exact=True;exact_rev=cfg_rev.lower();exact_reason='adapter_config_revision'
            corpus='\n'.join(corpus_parts)
            # Explicit immutable-card bindings for comparison candidates.
            if not exact and c['id']=='C72-D':
              m=re.search(r'(?:Pinned training snapshot|Base revision):\s*`?([0-9a-f]{40})',corpus,re.I)
              if m: exact=True;exact_rev=m.group(1).lower();exact_reason='immutable_card_pinned_training_snapshot'
            if not exact and c['id']=='C72-E':
              m=re.search(r'Base model:\s*`[^`]+`\s*@\s*`?([0-9a-f]{40})',corpus,re.I)
              if m: exact=True;exact_rev=m.group(1).lower();exact_reason='immutable_card_base_at_revision'
            # New candidates: accept only a 40-hex token explicitly tied to base revision/commit/snapshot language.
            if not exact:
              hits=[]
              for pat in [r'(?:base(?: model)?(?: revision| commit| snapshot)?|base_revision|base_commit)[^\n]{0,120}?([0-9a-f]{40})',r'([0-9a-f]{40})[^\n]{0,120}?(?:base(?: model)?(?: revision| commit| snapshot)?)']:
                hits += re.findall(pat,corpus,re.I)
              hits=[h.lower() for h in hits if h.lower()!=sha.lower()]
              if hits: exact=True;exact_rev=hits[0];exact_reason='immutable_text_base_revision_binding'
            base_api_ok=False
            if exact and cfg.get('base_model_name_or_path'):
              try:
                bi=getj(f"https://huggingface.co/api/models/{cfg.get('base_model_name_or_path')}/revision/{exact_rev}")
                base_api_ok=(bi.get('sha')==exact_rev)
              except Exception: base_api_ok=False
              exact=exact and base_api_ok
            license_clear=bool(lic and str(lic).lower() not in {'other','unknown'})
            aux=cfg.get('modules_to_save');hard=[]
            if not license_clear: hard.append('LICENSE_UNCLEAR')
            if cfg.get('peft_type')!='LORA': hard.append('NOT_LORA')
            if aux not in (None,[]): hard.append('AUX_MODULES_TO_SAVE')
            if not c['new']: hard.append('QUESTION_DUPLICATE_HISTORY')
            cp={'LOW_0_8B_VLM':18,'LOW_1_5B':20,'LOW_1_7B':18,'MEDIUM_4B':10}[c['cost']]
            score=(25 if license_clear else 0)+(30 if exact else 0)+(20 if c['new'] else 0)+cp+(7 if aux in (None,[]) else 0)
            rows.append({**c,'immutable_revision':sha,'license':lic,'license_clear':license_clear,'adapter_lfs':wm,'base_model_name_or_path':cfg.get('base_model_name_or_path'),'adapter_config_revision':cfg_rev,'r':cfg.get('r'),'lora_alpha':cfg.get('lora_alpha'),'lora_dropout':cfg.get('lora_dropout'),'target_modules':sorted(cfg.get('target_modules') or []),'modules_to_save':aux,'config_sha256':hashlib.sha256(cfg_txt.encode()).hexdigest(),'readme_sha256':hashlib.sha256(readme.encode()).hexdigest(),'immutable_40hex_tokens':sorted(tokens),'extra_text_metadata':extra,'exact_training_base_revision_proven':exact,'exact_training_base_revision':exact_rev if exact else None,'exact_training_base_reason':exact_reason if exact else 'UNPROVEN','base_revision_api_verified':base_api_ok,'hard_reject_reasons':hard,'admission_score':score,'weight_path_get_count':0,'model_weight_bytes':0})
          admiss=[r for r in rows if r['new'] and not r['hard_reject_reasons']]
          exacts=[r for r in admiss if r['exact_training_base_revision_proven']]
          pool=exacts or admiss
          selected=max(pool,key=lambda r:(r['admission_score'],-int(r['adapter_lfs'].get('size') or 10**12))) if pool else None
          selection={'selected':selected['id'] if selected else None,'repo':selected['repo'] if selected else None,'selection_pool':'NEW_EXACT_BASE' if exacts else 'NEW_ADAPTER_ONLY','reason':'Nonduplicate, clear-license, aux-free candidates only. Exact immutable training Base provenance dominates; then deterministic verifier and feasible source/runtime cost. Historical email/BioEvidence extraction cannot win regardless of score.'}
          out={'schema':'R22591_C72_METADATA_ONLY_CANDIDATE_AUDIT_V2','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'weight_path_get_count':0,'model_weight_bytes':0,'new_question_count':sum(1 for r in rows if r['new']),'candidates':rows,'selection':selection}
          p=Path('work/out/R22591_C72_METADATA_ONLY_CANDIDATE_AUDIT.json');p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          H={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22591-receipt','Content-Type':'application/json'}
          b=p.read_bytes(); payload=json.dumps({'message':'Persist R22591 C72 metadata audit','content':base64.b64encode(b).decode(),'branch':os.environ['OUT_BRANCH']}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/recovery/R22591_C72_METADATA_ONLY_CANDIDATE_AUDIT.json",data=payload,headers=H,method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r:r.read()
          print(json.dumps({'PASS':True,'new_question_count':out['new_question_count'],'selected':selection,'scores':{x['id']:x['admission_score'] for x in rows},'exact':{x['id']:x['exact_training_base_revision'] for x in rows},'weight_path_get_count':0,'model_weight_bytes':0},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22591-c72-metadata-only
          path: work/out/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Persist run identity after artifact finalization
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT_BRANCH: r22591-c72-metadata-receipt
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,base64,time,datetime
          H={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22591-run-receipt','Content-Type':'application/json'}
          arts=[]
          for _ in range(10):
            req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}/artifacts?per_page=100",headers=H)
            with urllib.request.urlopen(req,timeout=30) as r:d=json.loads(r.read().decode())
            arts=d.get('artifacts',[])
            if arts: break
            time.sleep(2)
          out={'schema':'R22591_C72_METADATA_RUN_RECEIPT_V2','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'run_id':int(os.environ['RUN_ID']),'head_sha':os.environ['HEAD_SHA'],'huggingface_weight_path_get_count':0,'model_weight_bytes':0,'artifacts':[{'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'digest':a.get('digest'),'expired':a.get('expired')} for a in arts]}
          b=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode(); payload=json.dumps({'message':'Persist R22591 C72 metadata run receipt','content':base64.b64encode(b).decode(),'branch':os.environ['OUT_BRANCH']}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/recovery/R22591_C72_METADATA_RUN_RECEIPT.json",data=payload,headers=H,method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r:r.read()
          PY