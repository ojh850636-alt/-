name: LAA R22535 C33 Reference Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compare canonical phonemizer and exact CLI variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out tmp
          python r22535/build_suite.py out/C33_INPUT_SUITE.jsonl
          git clone -q --filter=blob:none --no-checkout https://github.com/espeak-ng/espeak-ng.git tmp/espeak-ng
          git -C tmp/espeak-ng fetch -q --depth 1 origin 4870adfa25b1a32b4361592f1be8a40337c58d6c
          git -C tmp/espeak-ng checkout -q --detach 4870adfa25b1a32b4361592f1be8a40337c58d6c
          cmake -S tmp/espeak-ng -B tmp/espeak-ng/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/tmp/espeak-install" -DBUILD_SHARED_LIBS=ON -DUSE_MBROLA=OFF -DUSE_LIBSONIC=OFF -DUSE_LIBPCAUDIO=OFF -DUSE_SPEECHPLAYER=OFF -DUSE_ASYNC=OFF >/dev/null
          cmake --build tmp/espeak-ng/build -j2 >/dev/null
          cmake --install tmp/espeak-ng/build >/dev/null
          python -m pip install --disable-pip-version-check -q 'phonemizer==3.3.0'
          export PHONEMIZER_ESPEAK_LIBRARY="$(find "$PWD/tmp/espeak-install" -type f -name 'libespeak-ng.so*' | sort | head -1)"
          export ESPEAK_BIN="$PWD/tmp/espeak-install/bin/espeak-ng"
          python - <<'PY'
          import json,os,subprocess,unicodedata,hashlib
          from pathlib import Path
          from phonemizer.backend import EspeakBackend
          rows=[json.loads(x) for x in Path('out/C33_INPUT_SUITE.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()][:8]
          b=EspeakBackend('en-us',with_stress=False,language_switch='remove-flags')
          ph=[x.strip() for x in b.phonemize([r['input_text'] for r in rows],strip=True)]
          def run(args,text):
              return subprocess.run([os.environ['ESPEAK_BIN'],'-q',*args,'-v','en-us',text],capture_output=True,text=True,check=True).stdout.strip()
          def nfc(x):return unicodedata.normalize('NFC',x)
          def stripstress(x):return nfc(x).replace('ˈ','').replace('ˌ','')
          def nospace(x):return ''.join(c for c in stripstress(x) if not c.isspace())
          out=[]
          for r,p in zip(rows,ph):
              variants={
                'ipa_default':run(['--ipa'],r['input_text']),
                'ipa_1':run(['--ipa=1'],r['input_text']),
                'ipa_2':run(['--ipa=2'],r['input_text']),
                'ipa_3':run(['--ipa=3'],r['input_text']),
              }
              out.append({'case_id':r['case_id'],'input':r['input_text'],'phonemizer':p,'variants':variants,'equal_raw':{k:nfc(v)==nfc(p) for k,v in variants.items()},'equal_no_stress_space':{k:nospace(v)==nospace(p) for k,v in variants.items()}})
          Path('out/REFERENCE_RAW_DIAGNOSTIC.json').write_text(json.dumps({'schema':'LUCIA_AA_R22535_C33_REFERENCE_RAW_DIAGNOSTIC_V1','cases':out},ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(out[:2],ensure_ascii=False,indent=2))
          PY
          rm -rf tmp
      - uses: actions/upload-artifact@v4
        with:
          name: r22535-c33-reference-diagnostic
          path: out/REFERENCE_RAW_DIAGNOSTIC.json
          retention-days: 1
          compression-level: 6
