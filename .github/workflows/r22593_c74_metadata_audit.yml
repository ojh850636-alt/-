name: R22593 C74 metadata-only dedup-first audit
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: r22593-c74-metadata-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Immutable API/text-only metadata audit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT_BRANCH: r22593-c74-metadata-receipt
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p work/out
          python - <<'PY'
          import urllib.request,urllib.error,json,re,hashlib,datetime,os,base64
          from pathlib import Path
          UA={'User-Agent':'LUCIA-AA-R22593-C74-metadata-only'}
          CANDS=[
            {'id':'C74-A','repo':'codelion/Qwen3-0.6B-accuracy-recovery-lora','base':'Qwen/Qwen3-0.6B','question':'INT4_QUANTIZED_BASE_PLUS_LORA_TO_FP_REFERENCE_DISTRIBUTION_RECOVERY_ON_SOURCE_FREE_TOKEN_SEQUENCE_SUITE','verifier_quality':30,'novelty':30,'base_cost':20,'semantic_scope':'quantization-error compensation'},
            {'id':'C74-B','repo':'AsyncBuilds/qwen3-1.7b-promql','base':'Qwen/Qwen3-1.7B','question':'NL_MONITORING_INTENT_TO_PROMQL_AST_AND_SYNTHETIC_TIME_SERIES_DENOTATION','verifier_quality':30,'novelty':25,'base_cost':15,'semantic_scope':'PromQL AST/denotation'},
            {'id':'C74-C','repo':'hi-paris/ssml-text2breaks-fr-lora','base':'Qwen/Qwen2.5-7B','question':'FRENCH_PLAIN_TEXT_TO_SSML_BREAK_MARKERS_WITH_TEXT_PRESERVATION_WELL_FORMEDNESS_AND_PUNCTUATION_BOUNDARY_CONSTRAINTS','verifier_quality':10,'novelty':20,'base_cost':5,'semantic_scope':'SSML structural only; natural pause quality unobservable'},
          ]
          def get(url,limit=5_000_000):
            req=urllib.request.Request(url,headers=UA)
            with urllib.request.urlopen(req,timeout=60) as r:
              b=r.read(limit+1)
              if len(b)>limit: raise RuntimeError('META_TOO_LARGE:'+url)
              return b
          def getj(url): return json.loads(get(url).decode())
          def text(repo,sha,name): return get(f'https://huggingface.co/{repo}/raw/{sha}/{name}').decode('utf-8','replace')
          def sib(info,name):
            for x in info.get('siblings') or []:
              if x.get('rfilename')==name:
                l=x.get('lfs') or {}
                return {'name':name,'size':l.get('size') or x.get('size'),'sha256':str(l.get('sha256') or l.get('oid') or '').replace('sha256:',''),'blob_id':x.get('blobId')}
            return None
          def base_rev_contexts(repo,base,sha,info):
            texts=[]
            for x in info.get('siblings') or []:
              n=x.get('rfilename') or ''
              size=(x.get('lfs') or {}).get('size') or x.get('size') or 0
              if size and size>500000: continue
              if not re.search(r'\.(md|json|txt|ya?ml|toml)$',n,re.I): continue
              try: t=text(repo,sha,n)
              except Exception: continue
              texts.append((n,t))
            found=[]
            for n,t in texts:
              for m in re.finditer(r'(?<![0-9a-f])[0-9a-f]{40}(?![0-9a-f])',t,re.I):
                tok=m.group(0).lower(); ctx=t[max(0,m.start()-180):min(len(t),m.end()+180)]
                if base.lower() not in t.lower() and 'base' not in ctx.lower(): continue
                if not re.search(r'(base.{0,80}(revision|commit|snapshot)|(?:revision|commit|snapshot).{0,80}base)',ctx,re.I|re.S): continue
                try:
                  bi=getj(f'https://huggingface.co/api/models/{base}/revision/{tok}')
                  if bi.get('sha')==tok: found.append({'revision':tok,'file':n,'context_sha256':hashlib.sha256(ctx.encode()).hexdigest()})
                except Exception: pass
            return found
          rows=[]
          for c in CANDS:
            row={**c,'weight_path_get_count':0,'model_weight_bytes':0,'hard_reject_reasons':[]}
            try:
              info=getj('https://huggingface.co/api/models/'+c['repo']+'?blobs=true')
              sha=info.get('sha'); row['immutable_revision']=sha
              if not re.fullmatch(r'[0-9a-f]{40}',str(sha)): raise RuntimeError('NO_IMMUTABLE_SHA')
              card=info.get('cardData') or {}; lic=card.get('license'); row['license']=lic; row['license_clear']=bool(lic and str(lic).lower() not in {'other','unknown'})
              cfg_txt=text(c['repo'],sha,'adapter_config.json'); cfg=json.loads(cfg_txt); readme=text(c['repo'],sha,'README.md')
              w=sib(info,'adapter_model.safetensors'); row['adapter_lfs']=w
              if not w or not w.get('size') or not re.fullmatch(r'[0-9a-f]{64}',str(w.get('sha256') or '')): row['hard_reject_reasons'].append('NO_ADAPTER_LFS_IDENTITY')
              if not row['license_clear']: row['hard_reject_reasons'].append('LICENSE_UNCLEAR')
              if cfg.get('peft_type')!='LORA': row['hard_reject_reasons'].append('NOT_LORA')
              if cfg.get('modules_to_save') not in (None,[]): row['hard_reject_reasons'].append('AUX_MODULES_TO_SAVE')
              row.update({'base_model_name_or_path':cfg.get('base_model_name_or_path'),'adapter_config_revision':cfg.get('revision'),'r':cfg.get('r'),'lora_alpha':cfg.get('lora_alpha'),'lora_dropout':cfg.get('lora_dropout'),'target_modules':sorted(cfg.get('target_modules') or []),'modules_to_save':cfg.get('modules_to_save'),'adapter_config_sha256':hashlib.sha256(cfg_txt.encode()).hexdigest(),'readme_sha256':hashlib.sha256(readme.encode()).hexdigest()})
              proofs=[]
              cr=cfg.get('revision')
              if isinstance(cr,str) and re.fullmatch(r'[0-9a-f]{40}',cr):
                try:
                  bi=getj(f'https://huggingface.co/api/models/{c["base"]}/revision/{cr}')
                  if bi.get('sha')==cr: proofs=[{'revision':cr,'file':'adapter_config.json','reason':'config_revision'}]
                except Exception: pass
              if not proofs: proofs=base_rev_contexts(c['repo'],c['base'],sha,info)
              row['exact_training_base_revision_proofs']=proofs
              row['exact_training_base_revision_proven']=bool(proofs)
              row['exact_training_base_revision']=proofs[0]['revision'] if proofs else None
              size=int(w['size']) if w and w.get('size') else 10**12
              source_score=20 if size<100_000_000 else (15 if size<200_000_000 else 5)
              row['admission_score']=(40 if proofs else 0)+(20 if row['license_clear'] else 0)+c['verifier_quality']+c['novelty']+source_score+(c['base_cost'] if proofs else 0)-(50 if row['hard_reject_reasons'] else 0)
            except Exception as e:
              row['hard_reject_reasons'].append('META_AUDIT_ERROR:'+type(e).__name__+':'+str(e)[:160]); row['admission_score']=-999
            rows.append(row)
          admissible=[r for r in rows if not r['hard_reject_reasons']]
          if not admissible: raise SystemExit('NO_ADMISSIBLE_C74_CANDIDATE')
          selected=max(admissible,key=lambda r:(bool(r['exact_training_base_revision_proven']),r['admission_score']))
          lane='BEHAVIOR_AUTHORIZED_IF_EXACT_BASE' if selected['exact_training_base_revision_proven'] else 'ADAPTER_ONLY_E1_STATIC'
          out={'schema':'R22593_C74_METADATA_ONLY_CANDIDATE_AUDIT_V1','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'dedup_hard_gate_presealed':True,'weight_path_get_count':0,'model_weight_bytes':0,'candidates':rows,'selection':{'selected':selected['id'],'repo':selected['repo'],'lane':lane,'policy':'DEDUP > clear license > exact training Base > independent verifier > cost. If no exact Base is proven, choose best transferable E1 static specimen and forbid Base/behavior.'}}
          p=Path('work/out/R22593_C74_METADATA_ONLY_CANDIDATE_AUDIT.json');p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          # unique receipt path per run; branch was precreated
          H={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22593-metadata-receipt','Content-Type':'application/json'}
          b=p.read_bytes(); path=f"recovery/R22593_C74_METADATA_AUDIT_RUN_{os.environ['RUN_ID']}.json"
          payload=json.dumps({'message':'Persist R22593 C74 metadata audit','content':base64.b64encode(b).decode(),'branch':os.environ['OUT_BRANCH']}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}",data=payload,headers=H,method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r:r.read()
          print(json.dumps({'PASS':True,'selected':selected['id'],'lane':lane,'weight_path_get_count':0,'model_weight_bytes':0,'scores':{r['id']:r['admission_score'] for r in rows}},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r22593-c74-metadata-only
          path: work/out/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Persist unique run identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT_BRANCH: r22593-c74-metadata-receipt
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,base64,time,datetime
          H={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22593-metadata-run','Content-Type':'application/json'}
          arts=[]
          for _ in range(10):
            req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}/artifacts?per_page=100",headers=H)
            with urllib.request.urlopen(req,timeout=30) as r:d=json.loads(r.read().decode())
            arts=d.get('artifacts',[])
            if arts: break
            time.sleep(2)
          out={'schema':'R22593_C74_METADATA_RUN_RECEIPT_V1','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'run_id':int(os.environ['RUN_ID']),'head_sha':os.environ['HEAD_SHA'],'huggingface_weight_path_get_count':0,'model_weight_bytes':0,'artifacts':[{'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'digest':a.get('digest'),'expired':a.get('expired')} for a in arts]}
          b=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode(); path=f"recovery/R22593_C74_METADATA_RUN_{os.environ['RUN_ID']}.json"
          payload=json.dumps({'message':'Persist R22593 C74 metadata run identity','content':base64.b64encode(b).decode(),'branch':os.environ['OUT_BRANCH']}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}",data=payload,headers=H,method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r:r.read()
          PY