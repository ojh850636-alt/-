name: LAA R22542 C39 Lean kernel source-zero preseal
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  lean-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin OpenProof references and Lean runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report work
          OP=$(git ls-remote https://github.com/mxthematic/openproof.git refs/heads/master | awk '{print $1}')
          ML=$(git ls-remote https://github.com/mxthematic/openproof-ml.git refs/heads/master | awk '{print $1}')
          test -n "$OP" && test -n "$ML"
          git clone -q https://github.com/mxthematic/openproof.git work/openproof
          git -C work/openproof checkout -q "$OP"
          python - <<PY
          import hashlib,json
          from pathlib import Path
          ps=[Path('work/openproof/lean/lean-toolchain'),Path('work/openproof/lean/lakefile.toml')]
          rows=[{'path':str(p).split('work/openproof/',1)[1],'size_bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'text':p.read_text()} for p in ps]
          assert 'leanprover/lean4:v4.28.0' in rows[0]['text']
          assert 'rev = "v4.28.0"' in rows[1]['text']
          out={'schema':'LUCIA_AA_R22542_C39_OPENPROOF_RUNTIME_BINDING_V1','verdict':'PASS_CURRENT_REFERENCE_NOT_TRAINING_TIME_PROOF','openproof_revision':'$OP','openproof_ml_revision':'$ML','runtime_files':rows,'training_time_exact_code_revision_proven':False,'model_weight_bytes_downloaded':0,'model_outputs_observed':0}
          Path('report/R22542_C39_OPENPROOF_RUNTIME_BINDING.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Generate 336 precommitted canonical positive theorems
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def A(i):
            k=i%8;s=f'{i:03d}'
            if k==0:return f'theorem c39_a_{s} (α{s} : Type) (x{s} y{s} : α{s}) (h{s} : x{s} = y{s}) : y{s} = x{s} := by\n  exact h{s}.symm'
            if k==1:return f'theorem c39_a_{s} (P{s} Q{s} : Prop) (h{s} : P{s} ∧ Q{s}) : Q{s} ∧ P{s} := by\n  exact ⟨h{s}.2, h{s}.1⟩'
            if k==2:return f'theorem c39_a_{s} (α{s} : Type) (P{s} : α{s} → Prop) (a{s} : α{s}) (h{s} : ∀ x, P{s} x) : P{s} a{s} := by\n  exact h{s} a{s}'
            if k==3:return f'theorem c39_a_{s} (a{s} b{s} : Nat) : a{s} + b{s} = b{s} + a{s} := by\n  omega'
            if k==4:return f'theorem c39_a_{s} (a{s} b{s} : Nat) : a{s} ≤ a{s} + b{s} := by\n  omega'
            if k==5:return f'theorem c39_a_{s} (x{s} y{s} : Int) : (x{s} + y{s})^2 = x{s}^2 + 2*x{s}*y{s} + y{s}^2 := by\n  ring'
            if k==6:return f'theorem c39_a_{s} (α{s} : Type) (xs{s} ys{s} : List α{s}) : (xs{s} ++ ys{s}).length = xs{s}.length + ys{s}.length := by\n  simp'
            return f'theorem c39_a_{s} (P{s} Q{s} : Prop) (h{s} : P{s} → Q{s}) (hp{s} : P{s}) : Q{s} := by\n  exact h{s} hp{s}'
          def B(i):
            j=1000+i;s=f'{j:04d}';k=i%8
            if k==0:return f'theorem c39_b_{s} (P{s} Q{s} : Prop) (h{s} : P{s} ∨ Q{s}) : Q{s} ∨ P{s} := by\n  rcases h{s} with h | h <;> simp [h]'
            if k==1:return f'theorem c39_b_{s} (α{s} : Type) (P{s} : α{s} → Prop) (a{s} : α{s}) (h{s} : P{s} a{s}) : ∃ x, P{s} x := by\n  exact ⟨a{s}, h{s}⟩'
            if k==2:return f'theorem c39_b_{s} (P{s} Q{s} R{s} : Prop) (h{s} : (P{s} ∧ Q{s}) ∧ R{s}) : P{s} ∧ (Q{s} ∧ R{s}) := by\n  exact ⟨h{s}.1.1, h{s}.1.2, h{s}.2⟩'
            if k==3:return f'theorem c39_b_{s} (a{s} b{s} : Nat) : a{s} * b{s} = b{s} * a{s} := by\n  omega'
            if k==4:return f'theorem c39_b_{s} (x{s} y{s} : Int) (h{s} : x{s} = y{s} + 3) : x{s} - y{s} = 3 := by\n  omega'
            if k==5:return f'theorem c39_b_{s} (α{s} : Type) (xs{s} : List α{s}) : xs{s}.reverse.reverse = xs{s} := by\n  simp'
            if k==6:return f'theorem c39_b_{s} (α{s} β{s} : Type) (f{s} : α{s} → β{s}) (x{s} y{s} : α{s}) (h{s} : x{s} = y{s}) : f{s} x{s} = f{s} y{s} := by\n  simpa [h{s}]'
            return f'theorem c39_b_{s} (P{s} Q{s} R{s} : Prop) (h1{s} : P{s} → Q{s}) (h2{s} : Q{s} → R{s}) : P{s} → R{s} := by\n  intro hp; exact h2{s} (h1{s} hp)'
          rows=[]
          rows += [A(i) for i in range(0,128)]
          rows += [B(i) for i in range(0,112)]
          rows += [A(i) for i in range(128,176)]
          rows += [B(i) for i in range(112,160)]
          assert len(rows)==336
          text='import Mathlib\n\n'+'\n\n'.join(rows)+'\n'
          import hashlib
          sha=hashlib.sha256(text.encode()).hexdigest()
          assert sha=='966f240d6a07c6abc868dd5cd0341a55f20ab19c6b18ffdf4ce8ea882462d54b',sha
          Path('work/C39Canonical.lean').write_text(text,encoding='utf-8')
          PY
      - name: Compile all 336 fresh canonical proofs with Lean kernel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o work/elan-init.sh
          sh work/elan-init.sh -y --default-toolchain leanprover/lean4:v4.28.0
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee report/LEAN_VERSION.txt
          cd work/openproof/lean
          lake update
          lake exe cache get
          cp ../../C39Canonical.lean ./C39Canonical.lean
          lake env lean C39Canonical.lean
          cd ../../..
          python - <<'PY'
          import json
          from pathlib import Path
          out={'schema':'LUCIA_AA_R22542_C39_LEAN_KERNEL_PRESEAL_V1','verdict':'PASS_336_FRESH_CANONICAL_PROOFS','lean_version':Path('report/LEAN_VERSION.txt').read_text().strip(),'mathlib_runtime_pin':'v4.28.0','canonical_source_sha256':'966f240d6a07c6abc868dd5cd0341a55f20ab19c6b18ffdf4ce8ea882462d54b','fresh_suite_sha256':'ca0338cbb067c4f4b807bac0d389e8b946780906ed5562cd0949bd9541ba58a2','positive_cases_compiled':336,'training_dataset_rows_used':0,'model_weight_bytes_downloaded':0,'model_outputs_observed':0}
          Path('report/R22542_C39_LEAN_KERNEL_PRESEAL.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r22542-c39-lean-sourcezero
          path: report/
          retention-days: 1
