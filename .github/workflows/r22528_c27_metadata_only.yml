name: R22528 C27 metadata-only candidate search

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Query Hugging Face metadata only
        run: |
          python -m pip install 'requests==2.32.5'
          python - <<'PY'
          import json, requests
          from pathlib import Path
          S=requests.Session(); S.headers['User-Agent']='LUCIA-AA-R22528-C27-metadata/1.0'
          terms=['semantic segmentation lora','image segmentation peft lora','segformer lora segmentation','clipseg lora segmentation','terramind lora segmentation']
          seen={}; rows=[]
          for term in terms:
            r=S.get('https://huggingface.co/api/models',params={'search':term,'limit':100,'full':'true'},timeout=30); r.raise_for_status()
            for m in r.json():
              rid=m.get('id')
              if not rid or rid in seen: continue
              seen[rid]=1
              siblings={x.get('rfilename') for x in m.get('siblings',[]) if x.get('rfilename')}
              if 'adapter_config.json' not in siblings or 'adapter_model.safetensors' not in siblings: continue
              try:
                c=S.get(f'https://huggingface.co/{rid}/resolve/{m.get("sha")}/adapter_config.json',timeout=30); c.raise_for_status(); cfg=c.json()
              except Exception as e: cfg={'_error':repr(e)}
              lic=(m.get('cardData') or {}).get('license') or next((t.split(':',1)[1] for t in m.get('tags',[]) if t.startswith('license:')),None)
              weight=next((x for x in m.get('siblings',[]) if x.get('rfilename')=='adapter_model.safetensors'),{})
              readme=''
              try:
                rr=S.get(f'https://huggingface.co/{rid}/raw/{m.get("sha")}/README.md',timeout=30)
                if rr.ok: readme=rr.text[:12000]
              except Exception: pass
              text=readme.lower()
              rows.append({'repo':rid,'sha':m.get('sha'),'lastModified':m.get('lastModified'),'pipeline_tag':m.get('pipeline_tag'),'library_name':m.get('library_name'),'license':lic,'downloads':m.get('downloads'),'likes':m.get('likes'),'adapter_size':weight.get('size'),'adapter_lfs':weight.get('lfs'),'adapter_config':cfg,'readme_excerpt':readme[:5000],'task_markers':[x for x in ['segmentation','semantic segmentation','cloud','mask','ade20k','cityscapes','remote-sensing'] if x in text]})
          # Always include named primary if search indexing misses it.
          for rid in ['uga-gaim/CLIPSeg-CloudSEN12Plus-LoRA']:
            if rid in seen: continue
            m=S.get(f'https://huggingface.co/api/models/{rid}',timeout=30); m.raise_for_status(); m=m.json(); siblings={x.get('rfilename') for x in m.get('siblings',[]) if x.get('rfilename')};
            c=S.get(f'https://huggingface.co/{rid}/resolve/{m.get("sha")}/adapter_config.json',timeout=30); c.raise_for_status(); cfg=c.json();
            rr=S.get(f'https://huggingface.co/{rid}/raw/{m.get("sha")}/README.md',timeout=30); readme=rr.text if rr.ok else '';
            lic=(m.get('cardData') or {}).get('license') or next((t.split(':',1)[1] for t in m.get('tags',[]) if t.startswith('license:')),None); weight=next((x for x in m.get('siblings',[]) if x.get('rfilename')=='adapter_model.safetensors'),{});
            rows.append({'repo':rid,'sha':m.get('sha'),'lastModified':m.get('lastModified'),'pipeline_tag':m.get('pipeline_tag'),'library_name':m.get('library_name'),'license':lic,'downloads':m.get('downloads'),'likes':m.get('likes'),'adapter_size':weight.get('size'),'adapter_lfs':weight.get('lfs'),'adapter_config':cfg,'readme_excerpt':readme[:5000],'task_markers':['segmentation','cloud','mask','remote-sensing']})
          Path('r22528_c27_metadata.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          print('candidate_rows',len(rows))
          for x in rows:
            cfg=x.get('adapter_config') or {}; print(x['repo'],x.get('license'),x.get('adapter_size'),cfg.get('base_model_name_or_path'),cfg.get('r'),cfg.get('lora_alpha'),cfg.get('target_modules'),x.get('task_markers'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R22528_C27_METADATA_ONLY
          path: r22528_c27_metadata.json
          compression-level: 0
          retention-days: 1
      - name: Publish run receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          body={'body':f"R22528_C27_METADATA_RUN_ID={os.environ['RUN_ID']}"}
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments",data=json.dumps(body).encode(),headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          print(urllib.request.urlopen(req,timeout=30).read().decode())
          PY
