name: LUCIA AA C4 SQL source capture

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ADAPTER_REPO: vindows/qwen2.5-0.5b-text-to-sql
      BASE_REPO: Qwen/Qwen2.5-0.5B-Instruct
    steps:
      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/adapter source/base source/metadata

      - name: Resolve exact repository commits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          out = {}
          for role, repo in [('adapter', os.environ['ADAPTER_REPO']), ('base', os.environ['BASE_REPO'])]:
              with urllib.request.urlopen(f'https://huggingface.co/api/models/{repo}', timeout=60) as r:
                  meta = json.load(r)
              sha = meta.get('sha')
              if not isinstance(sha, str) or len(sha) != 40:
                  raise SystemExit(f'cannot resolve exact sha for {repo}: {sha!r}')
              out[role] = {
                  'repo_id': repo,
                  'revision': sha,
                  'private': bool(meta.get('private', False)),
                  'gated': bool(meta.get('gated', False)),
                  'library_name': meta.get('library_name'),
                  'pipeline_tag': meta.get('pipeline_tag'),
                  'tags': meta.get('tags', []),
              }
          Path('source/metadata/RESOLVED_REPOSITORIES.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f"ADAPTER_REV={out['adapter']['revision']}\n")
              f.write(f"BASE_REV={out['base']['revision']}\n")
          print(json.dumps(out, indent=2))
          PY

      - name: Download pinned source files
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            local repo="$1" rev="$2" file="$3" out="$4"
            local url="https://huggingface.co/${repo}/resolve/${rev}/${file}?download=true"
            echo "Downloading ${repo}@${rev}:${file}"
            curl --location --fail --show-error --silent \
              --retry 6 --retry-all-errors --connect-timeout 30 \
              --output "$out" "$url"
          }
          fetch_optional() {
            local repo="$1" rev="$2" file="$3" out="$4"
            local url="https://huggingface.co/${repo}/resolve/${rev}/${file}?download=true"
            if ! curl --location --fail --show-error --silent \
              --retry 3 --retry-all-errors --connect-timeout 30 \
              --output "$out" "$url"; then
              rm -f "$out"
              echo "Optional file absent: ${repo}@${rev}:${file}"
            fi
          }

          fetch "$ADAPTER_REPO" "$ADAPTER_REV" adapter_config.json source/adapter/adapter_config.json
          fetch "$ADAPTER_REPO" "$ADAPTER_REV" adapter_model.safetensors source/adapter/adapter_model.safetensors
          fetch_optional "$ADAPTER_REPO" "$ADAPTER_REV" README.md source/adapter/README.md
          fetch_optional "$ADAPTER_REPO" "$ADAPTER_REV" LICENSE source/adapter/LICENSE

          fetch "$BASE_REPO" "$BASE_REV" config.json source/base/config.json
          fetch "$BASE_REPO" "$BASE_REV" model.safetensors source/base/model.safetensors
          fetch "$BASE_REPO" "$BASE_REV" tokenizer.json source/base/tokenizer.json
          fetch "$BASE_REPO" "$BASE_REV" tokenizer_config.json source/base/tokenizer_config.json
          fetch "$BASE_REPO" "$BASE_REV" vocab.json source/base/vocab.json
          fetch "$BASE_REPO" "$BASE_REV" merges.txt source/base/merges.txt
          fetch_optional "$BASE_REPO" "$BASE_REV" special_tokens_map.json source/base/special_tokens_map.json
          fetch_optional "$BASE_REPO" "$BASE_REV" generation_config.json source/base/generation_config.json
          fetch_optional "$BASE_REPO" "$BASE_REV" chat_template.jinja source/base/chat_template.jinja
          fetch_optional "$BASE_REPO" "$BASE_REV" LICENSE source/base/LICENSE

      - name: Verify source and build receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, struct

          root = Path('source')
          resolved = json.loads((root/'metadata/RESOLVED_REPOSITORIES.json').read_text(encoding='utf-8'))

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def inspect_safetensors(path: Path):
              size = path.stat().st_size
              with path.open('rb') as f:
                  raw = f.read(8)
                  if len(raw) != 8:
                      raise SystemExit(f'invalid safetensors prefix: {path}')
                  header_len = struct.unpack('<Q', raw)[0]
                  if header_len <= 0 or header_len > size - 8:
                      raise SystemExit(f'invalid safetensors header length: {path}')
                  header = json.loads(f.read(header_len))
              tensors = [k for k in header if k != '__metadata__']
              return {'header_bytes': header_len, 'tensor_count': len(tensors)}

          required = [
              root/'adapter/adapter_config.json', root/'adapter/adapter_model.safetensors',
              root/'base/config.json', root/'base/model.safetensors',
              root/'base/tokenizer.json', root/'base/tokenizer_config.json',
              root/'base/vocab.json', root/'base/merges.txt',
          ]
          missing = [str(p.relative_to(root)) for p in required if not p.is_file()]
          if missing:
              raise SystemExit(f'missing required source files: {missing}')

          adapter_cfg = json.loads((root/'adapter/adapter_config.json').read_text(encoding='utf-8'))
          base_cfg = json.loads((root/'base/config.json').read_text(encoding='utf-8'))
          if adapter_cfg.get('peft_type') != 'LORA' or adapter_cfg.get('task_type') != 'CAUSAL_LM':
              raise SystemExit(f'unsupported adapter config: {adapter_cfg}')
          if adapter_cfg.get('base_model_name_or_path') != os.environ['BASE_REPO']:
              raise SystemExit('adapter base model id mismatch')
          if adapter_cfg.get('modules_to_save') not in (None, []):
              raise SystemExit(f'unexpected modules_to_save: {adapter_cfg.get("modules_to_save")}')
          if base_cfg.get('model_type') != 'qwen2':
              raise SystemExit(f'unexpected base model type: {base_cfg.get("model_type")}')

          files=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel=p.relative_to(root).as_posix()
              row={'path':rel,'size_bytes':p.stat().st_size,'sha256':sha256(p)}
              if p.suffix == '.safetensors':
                  row['safetensors']=inspect_safetensors(p)
              files.append(row)

          receipt={
              'schema':'LUCIA_AA_C4_GITHUB_ACTIONS_SOURCE_CAPTURE_V1',
              'candidate_id':'R225-C4-QWEN05-TEXT2SQL',
              'resolved_repositories':resolved,
              'adapter_config_summary':{
                  'peft_type':adapter_cfg.get('peft_type'),
                  'task_type':adapter_cfg.get('task_type'),
                  'base_model_name_or_path':adapter_cfg.get('base_model_name_or_path'),
                  'revision':adapter_cfg.get('revision'),
                  'r':adapter_cfg.get('r'),
                  'lora_alpha':adapter_cfg.get('lora_alpha'),
                  'target_modules':sorted(adapter_cfg.get('target_modules') or []),
                  'modules_to_save':adapter_cfg.get('modules_to_save'),
                  'use_dora':adapter_cfg.get('use_dora'),
                  'use_rslora':adapter_cfg.get('use_rslora'),
              },
              'base_config_summary':{
                  'model_type':base_cfg.get('model_type'),
                  'architectures':base_cfg.get('architectures'),
                  'hidden_size':base_cfg.get('hidden_size'),
                  'num_hidden_layers':base_cfg.get('num_hidden_layers'),
                  'vocab_size':base_cfg.get('vocab_size'),
              },
              'files':files,
              'claim_boundary':'PINNED_RUNTIME_REFERENCE_NOT_PROVEN_AS_TRAINING_TIME_BASE',
              'raw_weight_redistribution_scope':'TEMPORARY_ANALYSIS_TRANSFER_ONLY_PUBLIC_UPSTREAM_SOURCE',
              'verdict':'PASS_PINNED_SOURCE_CAPTURE',
          }
          (root/'SOURCE_CAPTURE_RECEIPT.json').write_text(
              json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          print(json.dumps({
              'adapter_revision': resolved['adapter']['revision'],
              'base_revision': resolved['base']['revision'],
              'adapter_config_summary': receipt['adapter_config_summary'],
              'file_count': len(files),
              'adapter_weight': next(r for r in files if r['path']=='adapter/adapter_model.safetensors'),
              'base_weight': next(r for r in files if r['path']=='base/model.safetensors'),
              'verdict': receipt['verdict'],
          },indent=2))
          PY

      - name: Split Base weight for connector-safe transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transport/base_weight_parts transport/meta
          split -b 350000000 -d -a 2 source/base/model.safetensors transport/base_weight_parts/model.safetensors.part-
          cp source/SOURCE_CAPTURE_RECEIPT.json transport/meta/
          cp source/metadata/RESOLVED_REPOSITORIES.json transport/meta/
          cp -r source/adapter transport/
          mkdir -p transport/base_meta
          find source/base -maxdepth 1 -type f ! -name model.safetensors -exec cp {} transport/base_meta/ \;
          python - <<'PY2'
          from pathlib import Path
          import hashlib, json
          root=Path('transport/base_weight_parts')
          rows=[]
          for p in sorted(root.iterdir()):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''):
                      h.update(chunk)
              rows.append({'name':p.name,'size_bytes':p.stat().st_size,'sha256':h.hexdigest()})
          original=Path('source/base/model.safetensors')
          h=hashlib.sha256()
          with original.open('rb') as f:
              for chunk in iter(lambda:f.read(1024*1024), b''):
                  h.update(chunk)
          manifest={'schema':'LUCIA_AA_C4_SPLIT_BASE_TRANSPORT_V1','original_size_bytes':original.stat().st_size,'original_sha256':h.hexdigest(),'parts':rows}
          Path('transport/meta/BASE_SPLIT_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps(manifest,indent=2))
          PY2

      - name: Upload C4 adapter and receipts
        uses: actions/upload-artifact@v4
        with:
          name: lucia-aa-c4-adapter-and-receipts
          path: |
            transport/adapter/
            transport/meta/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload C4 Base metadata and tokenizer
        uses: actions/upload-artifact@v4
        with:
          name: lucia-aa-c4-base-meta-tokenizer
          path: transport/base_meta/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload C4 Base weight part 00
        uses: actions/upload-artifact@v4
        with:
          name: lucia-aa-c4-base-weight-part-00
          path: transport/base_weight_parts/model.safetensors.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload C4 Base weight part 01
        uses: actions/upload-artifact@v4
        with:
          name: lucia-aa-c4-base-weight-part-01
          path: transport/base_weight_parts/model.safetensors.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload C4 Base weight part 02
        uses: actions/upload-artifact@v4
        with:
          name: lucia-aa-c4-base-weight-part-02
          path: transport/base_weight_parts/model.safetensors.part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
