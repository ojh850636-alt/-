name: R22591 C72 attempt2 source-free recovery
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover attempt2 run without model or Hugging Face network
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT_BRANCH: r22591-c72-source-receipt
          TARGET_SHA: b5a3be1e5a149854eca5b33b5737b816d0717331
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,urllib.request,base64,datetime
          H={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22591-C72-recovery','Content-Type':'application/json'}
          repo=os.environ['REPO'];sha=os.environ['TARGET_SHA']
          def api(path):
            req=urllib.request.Request('https://api.github.com'+path,headers=H)
            with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode())
          d=api(f'/repos/{repo}/actions/runs?head_sha={sha}&per_page=100')
          runs=[]
          for r in d.get('workflow_runs',[]):
            if r.get('path')!='.github/workflows/r22591_c72_email_one_use.yml': continue
            arts=api(f"/repos/{repo}/actions/runs/{r['id']}/artifacts?per_page=100").get('artifacts',[])
            jobs=api(f"/repos/{repo}/actions/runs/{r['id']}/jobs?per_page=100").get('jobs',[])
            runs.append({'id':r['id'],'name':r.get('name'),'path':r.get('path'),'event':r.get('event'),'status':r.get('status'),'conclusion':r.get('conclusion'),'head_sha':r.get('head_sha'),'created_at':r.get('created_at'),'updated_at':r.get('updated_at'),'artifacts':[{'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'digest':a.get('digest'),'expired':a.get('expired')} for a in arts],'jobs':[{'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion')} for j in jobs]})
          out={'schema':'R22591_C72_ATTEMPT2_SOURCE_FREE_RECOVERY_V1','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'huggingface_calls':0,'model_or_adapter_network_calls':0,'target_sha':sha,'run_count':len(runs),'runs':runs}
          b=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode();path='recovery/R22591_C72_ATTEMPT2_SOURCE_FREE_RECOVERY.json'
          payload=json.dumps({'message':'Persist source-free C72 attempt2 recovery','content':base64.b64encode(b).decode(),'branch':os.environ['OUT_BRANCH']}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=payload,headers=H,method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r:r.read()
          print(json.dumps({'PASS':True,'run_count':len(runs),'huggingface_calls':0,'model_calls':0},indent=2))
          PY
