name: Temporary LAA R22524 C24 multimodal VQA metadata audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Audit standard PEFT VQA and chart-reasoning candidates without weight bytes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/LAA_R22524_C24_VQA_METADATA"; mkdir -p "$ROOT/files"
          python - <<'PY'
          import json,os,pathlib,re,subprocess,time,urllib.error,urllib.parse,urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'LAA_R22524_C24_VQA_METADATA';headers={'User-Agent':'LUCIA-AA-R22524-VQA-Metadata/1.0'}
          terms=['SmolVLM LoRA','SmolVLM2 LoRA','visual question answering lora','VQA lora','chartqa lora','chart question answering lora','document vqa lora','docvqa lora','paliGemma vqa lora','Florence-2 vqa lora','vision language adapter peft']
          def req(url,method='GET',attempts=8):
            for i in range(attempts):
              try:
                q=urllib.request.Request(url,headers=headers,method=method)
                with urllib.request.urlopen(q,timeout=180) as r:return dict(r.headers) if method=='HEAD' else r.read()
              except urllib.error.HTTPError as e:
                if e.code in (403,404):return None
                if e.code in (429,500,502,503,504):time.sleep(min(40,2**i));continue
                raise
              except Exception:time.sleep(min(25,2**i))
            return None
          def getj(url):
            b=req(url);return json.loads(b) if b else {}
          def rev(repo):
            try:
              o=subprocess.check_output(['git','ls-remote','https://huggingface.co/'+repo,'refs/heads/main'],text=True,timeout=120).split();return o[0] if o and len(o[0])==40 else None
            except Exception:return None
          repos=[]
          for term in terms:
            rows=getj('https://huggingface.co/api/models?search='+urllib.parse.quote(term)+'&limit=50&sort=downloads&direction=-1')
            for x in rows if isinstance(rows,list) else []:
              rid=x.get('id') or x.get('modelId')
              if rid and rid not in repos:repos.append(rid)
            time.sleep(.8)
          out=[]
          for repo in repos[:220]:
            r=rev(repo)
            if not r:continue
            cfgb=req(f'https://huggingface.co/{repo}/resolve/{r}/adapter_config.json?download=true')
            if not cfgb:continue
            try:cfg=json.loads(cfgb)
            except Exception:continue
            ah=req(f'https://huggingface.co/{repo}/resolve/{r}/adapter_model.safetensors?download=true','HEAD')
            if not ah:continue
            api=getj('https://huggingface.co/api/models/'+urllib.parse.quote(repo,safe='/'));card=api.get('cardData') or {}
            rb=req(f'https://huggingface.co/{repo}/resolve/{r}/README.md?download=true') or b'';readme=rb.decode('utf-8','replace')
            lic=card.get('license') or api.get('license');m=re.search(r'(?im)^license:\s*([^\s#]+)',readme);lic=lic or (m.group(1) if m else None)
            base=cfg.get('base_model_name_or_path');br=rev(base) if isinstance(base,str) and '/' in base and not base.startswith('/') else None
            bapi=getj('https://huggingface.co/api/models/'+urllib.parse.quote(base,safe='/')) if br else {};bcard=bapi.get('cardData') or {};blic=bcard.get('license') or bapi.get('license')
            bcfgb=req(f'https://huggingface.co/{base}/resolve/{br}/config.json?download=true') if br else None;bcfg={}
            if bcfgb:
              try:bcfg=json.loads(bcfgb)
              except Exception:pass
            bhead=None;bpath=None
            if br:
              for p in ('model.safetensors','model.safetensors.index.json'):
                h=req(f'https://huggingface.co/{base}/resolve/{br}/{p}?download=true','HEAD')
                if h:bhead=h;bpath=p;break
            def size(h):
              if not h:return 0
              for k,v in h.items():
                if k.lower() in ('x-linked-size','content-length') and str(v).isdigit():return int(v)
              return 0
            text=' '.join([repo,base or '',str(api.get('pipeline_tag')),str(bapi.get('pipeline_tag')),readme[:18000],str(bcfg.get('architectures'))]).lower()
            if any(s in text for s in ['chartqa','chart question','chart reasoning']):g='CHART_QA'
            elif any(s in text for s in ['docvqa','document vqa','document question']):g='DOCUMENT_VQA'
            elif any(s in text for s in ['video','smolvlm2-video']):g='VIDEO_QA'
            elif any(s in text for s in ['vqa','visual question','vision-language','smolvlm','paligemma','florence']):g='PROCEDURAL_VQA'
            else:g='UNKNOWN'
            holds=[];score=0
            if lic:score+=18
            else:holds.append('ADAPTER_LICENSE_MISSING')
            if blic:score+=5
            else:holds.append('BASE_LICENSE_MISSING')
            if br:score+=12
            else:holds.append('BASE_REVISION_UNRESOLVED')
            if bpath:score+=8
            else:holds.append('BASE_SAFETENSORS_UNRESOLVED')
            if cfg.get('peft_type')=='LORA':score+=10
            else:holds.append('NONSTANDARD_PEFT')
            if cfg.get('target_modules'):score+=8
            else:holds.append('TARGETS_MISSING')
            if g!='UNKNOWN':score+=16
            else:holds.append('GEOMETRY_UNKNOWN')
            asz=size(ah);bsz=size(bhead)
            if 0<asz<=120_000_000:score+=8
            else:holds.append('ADAPTER_RESOURCE_HOLD')
            if bpath and bpath.endswith('.index.json'):score+=4;holds.append('SHARDED_BASE_REQUIRES_PREFLIGHT')
            elif 0<bsz<=2_000_000_000:score+=8
            else:holds.append('BASE_RESOURCE_HOLD')
            if cfg.get('modules_to_save'):holds.append('AUXILIARY_MODULES_PRESENT')
            else:score+=3
            if 'trust_remote_code=true' in readme.lower():holds.append('REMOTE_CODE_ADVERTISED')
            else:score+=4
            folder=root/'files'/repo.replace('/','__');folder.mkdir(parents=True,exist_ok=True);(folder/'adapter_config.json').write_bytes(cfgb)
            if rb:(folder/'README.md').write_bytes(rb)
            if bcfgb:(folder/'base_config.json').write_bytes(bcfgb)
            out.append({'repo':repo,'revision':r,'license':lic,'geometry':g,'score':score,'holds':holds,'adapter_size_bytes':asz,'peft_type':cfg.get('peft_type'),'task_type':cfg.get('task_type'),'rank':cfg.get('r'),'alpha':cfg.get('lora_alpha'),'target_modules':cfg.get('target_modules'),'modules_to_save':cfg.get('modules_to_save'),'base_repo':base,'base_revision':br,'base_license':blic,'base_weight_path':bpath,'base_weight_size_or_index_bytes':bsz,'base_model_type':bcfg.get('model_type'),'base_architectures':bcfg.get('architectures'),'raw_weight_bytes_downloaded':0,'model_outputs_observed':0})
            time.sleep(.5)
          out.sort(key=lambda x:(-x['score'],x['repo']))
          rec={'schema':'LUCIA_AA_R2_25_24_C24_MULTIMODAL_VQA_METADATA_AUDIT_V1','queries':terms,'searched_repos':len(repos),'audited':len(out),'raw_weight_bytes_downloaded':0,'model_outputs_observed':0,'candidates':out}
          (root/'C24_VQA_METADATA_AUDIT.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n');print(json.dumps({'searched':len(repos),'audited':len(out),'top':out[:20]},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LAA_R22524_C24_VQA_METADATA_AUDIT
          path: ${{ runner.temp }}/LAA_R22524_C24_VQA_METADATA
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
