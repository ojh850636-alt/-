name: Temporary LAA R22524 C24 Malayalam speech-translation metadata audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pin exact speech-translation Adapter, Base and processor without weight bytes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/LAA_R22524_C24_MAL_EN_METADATA";mkdir -p "$ROOT/adapter" "$ROOT/base"
          A_REPO='Be-win/whisper-small-mal-en-lora'
          B_REPO='openai/whisper-small'
          A_REV="$(git ls-remote "https://huggingface.co/${A_REPO}" refs/heads/main | awk '{print $1}')"
          B_REV="$(git ls-remote "https://huggingface.co/${B_REPO}" refs/heads/main | awk '{print $1}')"
          test "${#A_REV}" = 40; test "${#B_REV}" = 40
          fetch_optional() {
            local repo="$1" rev="$2" path="$3" out="$4"
            if curl -L --fail --retry 7 --retry-all-errors --connect-timeout 30 --max-time 420 \
              -A 'LUCIA-AA-R22524-MetadataOnly/4.0' \
              -o "$out" "https://huggingface.co/${repo}/resolve/${rev}/${path}?download=true"; then return 0; fi
            rm -f "$out"; return 1
          }
          for name in README.md adapter_config.json preprocessor_config.json generation_config.json tokenizer_config.json tokenizer.json special_tokens_map.json merges.txt vocab.json normalizer.json; do
            fetch_optional "$A_REPO" "$A_REV" "$name" "$ROOT/adapter/$name" || true
          done
          for name in README.md LICENSE config.json preprocessor_config.json generation_config.json tokenizer_config.json tokenizer.json special_tokens_map.json merges.txt vocab.json normalizer.json; do
            fetch_optional "$B_REPO" "$B_REV" "$name" "$ROOT/base/$name" || true
          done
          test -f "$ROOT/adapter/adapter_config.json"; test -f "$ROOT/base/config.json"; test -f "$ROOT/base/preprocessor_config.json"
          curl -sSIL --retry 6 --retry-all-errors \
            "https://huggingface.co/${A_REPO}/resolve/${A_REV}/adapter_model.safetensors?download=true" > "$ROOT/adapter/adapter_weight_headers.txt"
          curl -sSIL --retry 6 --retry-all-errors \
            "https://huggingface.co/${B_REPO}/resolve/${B_REV}/model.safetensors?download=true" > "$ROOT/base/base_weight_headers.txt"
          A_REPO="$A_REPO" A_REV="$A_REV" B_REPO="$B_REPO" B_REV="$B_REV" python - <<'PY'
          import hashlib,json,os,pathlib,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'LAA_R22524_C24_MAL_EN_METADATA'
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          def headers(path):
            text=pathlib.Path(path).read_text(errors='replace');blocks=[]
            for block in re.split(r'\r?\n\r?\n',text):
              item={}
              for line in block.splitlines():
                if ':' in line:
                  k,v=line.split(':',1);item[k.strip().lower()]=v.strip()
              if item:blocks.append(item)
            size=None;etag=None
            for x in blocks:
              size=size or x.get('x-linked-size') or x.get('content-length')
              etag=etag or x.get('x-linked-etag') or x.get('etag')
            return {'size_bytes':int(size) if size and str(size).isdigit() else size,'etag_or_oid':etag,'blocks':blocks}
          cfg=json.loads((root/'adapter/adapter_config.json').read_text())
          base_cfg=json.loads((root/'base/config.json').read_text())
          pp=json.loads((root/'base/preprocessor_config.json').read_text())
          readme=(root/'adapter/README.md').read_text(errors='replace') if (root/'adapter/README.md').exists() else ''
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and not x.name.endswith('_headers.txt')):
            rows.append({'path':p.relative_to(root).as_posix(),'size_bytes':p.stat().st_size,'sha256':sha(p)})
          low=readme.lower()
          task_evidence={
            'speech_translation_tag':('speech-translation' in low or 'translation' in low),
            'malayalam_evidence':('malayalam' in low or ' mal ' in low),
            'english_target_evidence':('english' in low or ' mal-en' in low),
          }
          receipt={
            'schema':'LUCIA_AA_R2_25_24_C24_MAL_EN_METADATA_V1',
            'candidate_id':'R22524-C24-WHISPER-SMALL-MALAYALAM-ENGLISH-TRANSLATION',
            'scientific_question':'Does the Malayalam-to-English Whisper LoRA add compositional speech translation beyond ASR, and which capability/failure mechanisms cause the change?',
            'adapter_repo':os.environ['A_REPO'],'adapter_revision':os.environ['A_REV'],'adapter_license':'apache-2.0',
            'base_repo':os.environ['B_REPO'],'base_revision':os.environ['B_REV'],'base_license':'apache-2.0',
            'adapter_config':cfg,'base_model_type':base_cfg.get('model_type'),'base_architectures':base_cfg.get('architectures'),
            'processor':pp,'task_evidence':task_evidence,
            'adapter_weight_object':headers(root/'adapter/adapter_weight_headers.txt'),
            'base_weight_object':headers(root/'base/base_weight_headers.txt'),
            'metadata_files':rows,
            'output_geometry':'Malayalam waveform -> autoregressive English semantic token sequence',
            'raw_weight_bytes_downloaded':0,'model_outputs_observed':0,
          }
          if cfg.get('peft_type')!='LORA' or not cfg.get('target_modules'):raise SystemExit('Not standard target-bearing LoRA')
          if not all(task_evidence.values()):raise SystemExit(str(task_evidence))
          (root/'C24_MAL_EN_METADATA_RECEIPT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'candidate_id':receipt['candidate_id'],'adapter_revision':receipt['adapter_revision'],'base_revision':receipt['base_revision'],'rank':cfg.get('r'),'alpha':cfg.get('lora_alpha'),'targets':cfg.get('target_modules'),'task_evidence':task_evidence,'adapter_weight':receipt['adapter_weight_object'],'base_weight':receipt['base_weight_object']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LAA_R22524_C24_MAL_EN_METADATA
          path: ${{ runner.temp }}/LAA_R22524_C24_MAL_EN_METADATA
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
