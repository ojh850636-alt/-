name: Temporary LAA R22524 C24 targeted SegFormer license audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Audit explicit candidate and Base licenses without weight bytes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/LAA_R22524_C24_LICENSE_AUDIT"
          mkdir -p "$ROOT"
          python - <<'PY'
          import json,subprocess,time,urllib.error,urllib.parse,urllib.request,os,pathlib,re,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'LAA_R22524_C24_LICENSE_AUDIT'
          headers={'User-Agent':'LUCIA-AA-R22524-License-Audit/3.0'}
          repos=['KYLE11111111/segformer-b0-scene-parse-150-lora','almosenja/segformer-b0-finetuned-ade-512-512-housekeeping-lora','APaul1/segformer-scene-parse-150-lora','LucidCAT/segformer-b4-finetuned-ade-512-512-scene-parse-150-lora','almosenja/segformer-b1-finetuned-ade-512-512-housekeeping-lora','almosenja/segformer-b3-finetuned-ade-512-512-housekeeping-lora','jiangdaniel/segformer-scene-parse-150-lora']
          def req(url,attempts=8):
            for i in range(attempts):
              try:
                q=urllib.request.Request(url,headers=headers)
                with urllib.request.urlopen(q,timeout=120) as r:return r.read()
              except urllib.error.HTTPError as e:
                if e.code in (403,404):return None
                if e.code in (429,500,502,503,504):time.sleep(min(30,2**i));continue
                raise
              except Exception:time.sleep(min(20,2**i))
            return None
          def getj(url):
            b=req(url);return json.loads(b) if b else {}
          def rev(repo):
            try:
              o=subprocess.check_output(['git','ls-remote','https://huggingface.co/'+repo,'refs/heads/main'],text=True,timeout=120).split()
              return o[0] if o and len(o[0])==40 else None
            except Exception:return None
          out=[]
          for repo in repos:
            r=rev(repo);api=getj('https://huggingface.co/api/models/'+urllib.parse.quote(repo,safe='/'))
            card=api.get('cardData') or {}; lic=card.get('license') or api.get('license');tags=api.get('tags') or []
            cfgb=req(f'https://huggingface.co/{repo}/resolve/{r}/adapter_config.json?download=true') if r else None
            cfg=json.loads(cfgb) if cfgb else {}
            rb=req(f'https://huggingface.co/{repo}/resolve/{r}/README.md?download=true') if r else b''
            readme=(rb or b'').decode('utf-8','replace')
            m=re.search(r'(?im)^license:\s*([^\s#]+)',readme); lic=lic or (m.group(1) if m else None)
            license_files=[]
            for name in ('LICENSE','LICENSE.md','LICENSE.txt','COPYING'):
              b=req(f'https://huggingface.co/{repo}/resolve/{r}/{name}?download=true') if r else None
              if b:license_files.append({'path':name,'size_bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'first_line':b.decode('utf-8','replace').splitlines()[0][:200]})
            base=cfg.get('base_model_name_or_path');br=rev(base) if isinstance(base,str) and '/' in base else None
            bapi=getj('https://huggingface.co/api/models/'+urllib.parse.quote(base,safe='/')) if br else {}
            bcard=bapi.get('cardData') or {};blic=bcard.get('license') or bapi.get('license')
            out.append({'repo':repo,'revision':r,'api_license':lic,'api_tags':tags,'license_files':license_files,'adapter_config':cfg,'base_repo':base,'base_revision':br,'base_license':blic,'explicit_adapter_license':bool(lic or license_files),'raw_weight_bytes_downloaded':0,'model_outputs_observed':0})
            time.sleep(1)
          rec={'schema':'LUCIA_AA_R2_25_24_C24_TARGETED_LICENSE_AUDIT_V1','rows':out,'raw_weight_bytes_downloaded':0,'model_outputs_observed':0}
          (root/'C24_TARGETED_LICENSE_AUDIT.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LAA_R22524_C24_TARGETED_LICENSE_AUDIT
          path: ${{ runner.temp }}/LAA_R22524_C24_LICENSE_AUDIT
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
