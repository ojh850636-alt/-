name: LAA R22565 C49 MiniLM AG News metadata-only audit
on:
  push:
    branches: [laa-r22565-c49-minilm-agnews]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Exact candidate base dataset metadata only
        shell: bash
        run: |
          set -euo pipefail
          export GIT_LFS_SKIP_SMUDGE=1
          git clone -q --depth 1 https://huggingface.co/TransferGraph/cross-encoder_ms-marco-MiniLM-L-4-v2-finetuned-lora-ag_news cand
          python - <<'PY'
          import pathlib,json,subprocess
          c=pathlib.Path('cand'); cfg=json.loads((c/'adapter_config.json').read_text())
          print('BASE_NAME='+str(cfg.get('base_model_name_or_path')))
          pathlib.Path('base_name.txt').write_text(str(cfg.get('base_model_name_or_path')))
          PY
          BASE=$(cat base_name.txt)
          git clone -q --depth 1 "https://huggingface.co/$BASE" base
          git clone -q --depth 1 https://huggingface.co/datasets/fancyzhx/ag_news data
          mkdir out
          python - <<'PY'
          import pathlib,json,subprocess,re,hashlib
          def rev(x): return subprocess.check_output(['git','-C',x,'rev-parse','HEAD'],text=True).strip()
          def ptr(p):
            if not p.exists(): return None
            d={}
            for l in p.read_text(errors='replace').splitlines():
              if l.startswith('oid sha256:'): d['sha256']=l.split(':',1)[1]
              if l.startswith('size '): d['size']=int(l.split()[1])
            return d
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          c=pathlib.Path('cand'); b=pathlib.Path('base'); d=pathlib.Path('data')
          cfg=json.loads((c/'adapter_config.json').read_text()); cr=(c/'README.md').read_text(errors='replace'); br=(b/'README.md').read_text(errors='replace'); dr=(d/'README.md').read_text(errors='replace') if (d/'README.md').exists() else ''
          data_files=sorted(str(p.relative_to(d)) for p in d.rglob('*') if p.is_file() and '.git/' not in str(p))
          obj={'schema':'LAA_R22565_C49_META_V1','candidate_revision':rev('cand'),'base_revision':rev('base'),'dataset_revision':rev('data'),
            'adapter_pointer':ptr(c/'adapter_model.safetensors'),'adapter_config':cfg,'candidate_license':re.findall(r'(?mi)^license\s*:\s*([^\r\n]+)',cr),
            'base_safetensor_pointer':ptr(b/'model.safetensors'),'base_bin_pointer':ptr(b/'pytorch_model.bin'),'base_license':re.findall(r'(?mi)^license\s*:\s*([^\r\n]+)',br),
            'candidate_files':sorted(p.name for p in c.iterdir() if p.name!='.git'),'base_files':sorted(p.name for p in b.iterdir() if p.name!='.git'),
            'dataset_license':re.findall(r'(?mi)^license\s*:\s*([^\r\n]+)',dr),'dataset_files':data_files[:100],
            'dataset_parquet_pointers':{str(p.relative_to(d)):ptr(p) for p in d.rglob('*.parquet')},
            'readme_ag_news':('ag_news' in cr),'readme_accuracy_mentions':re.findall(r'accuracy[^\n]{0,80}',cr,re.I)[:10]}
          pathlib.Path('out/C49_META.json').write_text(json.dumps(obj,indent=2,sort_keys=True)); print(json.dumps(obj,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: r22565-c49-meta, path: out/C49_META.json, retention-days: 1}
