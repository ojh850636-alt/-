name: R22569 C53 RAG Faithfulness Archaeology
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  archaeology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source-free preoutput seal
        shell: bash
        run: |
          set -euo pipefail
          python scripts/r22569_c53_rag_archaeology.py preseal --out preseal
          test -f preseal/R22569_C53_PREOUTPUT_SEAL.json
      - name: Install bounded analysis runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q 'transformers>=4.48,<5' 'peft>=0.14,<0.18' 'huggingface_hub>=0.27,<1' 'safetensors>=0.4.5' sentencepiece
      - name: One-use exact ingress, behavior controls, conditional causal screen, raw deletion
        shell: bash
        env:
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          python scripts/r22569_c53_rag_archaeology.py run --preseal preseal --out rawfree --raw raw_private
          test ! -e raw_private
          rm -f preseal/suite_private.json
          test ! -e preseal/suite_private.json
          grep -q 'weight_bytes_present_at_seal": 0' preseal/R22569_C53_PREOUTPUT_SEAL.json
          test -f rawfree/C53_TERMINAL_EVIDENCE.json
          test -f rawfree/C53_CLEANUP.json
      - name: Confirm exported artifact is raw-free
        shell: bash
        run: |
          set -euo pipefail
          ! find rawfree preseal -type f | grep -Ei '\.(safetensors|bin|pt|pth|pkl|pickle|ckpt)$'
          ! find rawfree preseal -type f | grep -Ei '(tokenizer\.json|spiece\.model|sentencepiece|raw.*output|activation|logit|hidden)'
          python - <<'PY'
          import json, pathlib
          t=json.loads(pathlib.Path('rawfree/C53_TERMINAL_EVIDENCE.json').read_text())
          c=json.loads(pathlib.Path('rawfree/C53_CLEANUP.json').read_text())
          assert c['raw_root_deleted'] and c['raw_weights_remaining']==0
          print(json.dumps(t,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22569-c53-rawfree-evidence
          path: |
            preseal/R22569_C53_PREOUTPUT_SEAL.json
            rawfree/
          retention-days: 1
          if-no-files-found: error
