name: R22574 C58 PorTAL adapter-first
on:
  push:
    branches: [r22574-c58-portal]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter_first:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      C58_OUT: c58_out
      C58_ESCROW: c58_escrow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis runtime from released package contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'portallib==0.2.0' 'safetensors>=0.4' 'numpy<3'
          python -m pip freeze | sort > C58_ANALYSIS_RUNTIME_FREEZE.txt
          python - <<'PY'
          import importlib.metadata as m, json, pathlib
          names=['portallib','torch','transformers','peft','huggingface-hub','safetensors','numpy','accelerate','tokenizers']
          out={n:m.version(n) for n in names}
          pathlib.Path('C58_ANALYSIS_RUNTIME.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Bind pre-output contract and amendment chain
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          files=[
            'r22574/C58_CANDIDATE_AUDIT.json',
            'r22574/C58_PREOUTPUT_SEAL.json',
            'r22574/C58_PREOUTPUT_AMENDMENTS.json',
            'r22574/build_c58_procedural_rte.py',
            'r22574/c58_portal_adapter_first.py',
          ]
          out={}
          for f in files:
            b=pathlib.Path(f).read_bytes(); out[f]=hashlib.sha256(b).hexdigest()
          pathlib.Path('C58_PREOUTPUT_BINDING.json').write_text(json.dumps({'model_outputs_observed':0,'raw_base_bytes':0,'files':out},indent=2)+'\n')
          PY
      - name: Reproduce sealed procedural suite
        run: |
          python -B r22574/build_c58_procedural_rte.py --out C58_PROCEDURAL_RTE_256.jsonl
          python - <<'PY'
          import hashlib, json, pathlib
          seal=json.loads(pathlib.Path('r22574/C58_PREOUTPUT_SEAL.json').read_text())
          got=hashlib.sha256(pathlib.Path('C58_PROCEDURAL_RTE_256.jsonl').read_bytes()).hexdigest()
          assert got==seal['behavior_suite']['procedural_sha256'], (got,seal['behavior_suite']['procedural_sha256'])
          print(got)
          PY
      - name: Adapter-first one-use archaeology
        run: python -B r22574/c58_portal_adapter_first.py
      - name: Verify raw-free evidence only
        run: |
          python - <<'PY'
          import json, pathlib
          out=pathlib.Path('c58_out')
          r=json.loads((out/'C58_PORTAL_ADAPTER_FIRST_RAWFREE.json').read_text())
          c=json.loads((out/'C58_ADAPTER_FIRST_CLEANUP.json').read_text())
          assert r['raw_export_contract']['native_weights_in_rawfree_artifact'] is False
          assert r['raw_export_contract']['exported_lora_weights_in_rawfree_artifact'] is False
          assert r['raw_export_contract']['A_B_values_exported_in_rawfree_artifact'] is False
          assert r['raw_export_contract']['reconstructable_deltaW_exported'] is False
          assert c['base_downloaded'] is False and c['native_source_removed'] and c['temporary_export_tree_removed']
          assert not list(out.rglob('*.safetensors'))
          print(r['verdict'])
          PY
      - name: Upload raw-free evidence
        uses: actions/upload-artifact@v4
        with:
          name: r22574-c58-adapter-first-rawfree
          path: |
            c58_out/*.json
            C58_PREOUTPUT_BINDING.json
            C58_ANALYSIS_RUNTIME.json
            C58_ANALYSIS_RUNTIME_FREEZE.txt
          if-no-files-found: error
          retention-days: 1
      - name: Upload derivative RTE/COPA source escrow
        uses: actions/upload-artifact@v4
        with:
          name: r22574-c58-rte-copa-derivative-escrow
          path: c58_escrow
          if-no-files-found: ignore
          retention-days: 1
