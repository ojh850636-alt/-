name: LUCIA AA C4 four way parallel Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  condition:
    strategy:
      fail-fast: false
      matrix:
        mode: [BASE_FULL, CONTROLS, DOSE, GENERATION]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout parallel runner
        uses: actions/checkout@v4
      - name: Checkout fixed C4 core
        uses: actions/checkout@v4
        with:
          ref: lucia-aa-c4-sql-source-capture
          path: c4core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install 'transformers==4.57.1' 'peft==0.17.1' 'safetensors==0.7.0' 'huggingface-hub==0.36.0' 'tokenizers==0.22.1' 'accelerate==1.14.0'
      - uses: actions/download-artifact@v4
        with:
          name: lucia-aa-c4-adapter-and-receipts
          path: transport/adapter_receipts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 29771037886
      - uses: actions/download-artifact@v4
        with:
          name: lucia-aa-c4-base-meta-tokenizer
          path: transport/base_meta
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 29771037886
      - uses: actions/download-artifact@v4
        with:
          name: lucia-aa-c4-base-weight-part-00
          path: transport/part00
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 29771037886
      - uses: actions/download-artifact@v4
        with:
          name: lucia-aa-c4-base-weight-part-01
          path: transport/part01
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 29771037886
      - uses: actions/download-artifact@v4
        with:
          name: lucia-aa-c4-base-weight-part-02
          path: transport/part02
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 29771037886
      - name: Reassemble and reverify source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw/base raw/adapter results/${{ matrix.mode }}
          cp -r transport/adapter_receipts/adapter/. raw/adapter/
          if [ -d transport/base_meta/base_meta ]; then cp -r transport/base_meta/base_meta/. raw/base/; else cp -r transport/base_meta/. raw/base/; fi
          p0=$(find transport/part00 -type f -name 'model.safetensors.part-00' | head -1)
          p1=$(find transport/part01 -type f -name 'model.safetensors.part-01' | head -1)
          p2=$(find transport/part02 -type f -name 'model.safetensors.part-02' | head -1)
          cat "$p0" "$p1" "$p2" > raw/base/model.safetensors
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
              return h.hexdigest()
          manifest=json.loads(next(Path('transport/adapter_receipts').rglob('BASE_SPLIT_MANIFEST.json')).read_text())
          receipt=json.loads(next(Path('transport/adapter_receipts').rglob('SOURCE_CAPTURE_RECEIPT.json')).read_text())
          expected={row['path']:(row['size_bytes'],row['sha256']) for row in receipt['files']}
          base=Path('raw/base/model.safetensors');adapter=Path('raw/adapter/adapter_model.safetensors')
          if base.stat().st_size!=manifest['original_size_bytes'] or sha(base)!=manifest['original_sha256']:raise SystemExit('Base mismatch')
          for key,path in {'base/model.safetensors':base,'adapter/adapter_model.safetensors':adapter}.items():
              size,digest=expected[key]
              if path.stat().st_size!=size or sha(path)!=digest:raise SystemExit(f'source mismatch {key}')
          Path('results/${{ matrix.mode }}/SOURCE_REASSEMBLY.json').write_text(json.dumps({'schema':'LUCIA_AA_C4_PARALLEL_SOURCE_REASSEMBLY_V1','mode':'${{ matrix.mode }}','base_size_bytes':base.stat().st_size,'base_sha256':sha(base),'adapter_size_bytes':adapter.stat().st_size,'adapter_sha256':sha(adapter),'verdict':'PASS_EXACT_SOURCE_REASSEMBLED'},indent=2)+'\n')
          PY
      - name: Run one parallel Gate mode
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/c4_parallel_mode.py \
            --mode '${{ matrix.mode }}' \
            --base-dir raw/base \
            --adapter-dir raw/adapter \
            --out-dir 'results/${{ matrix.mode }}' \
            --core-script c4core/tools/lucia_aa_c4_actual_analysis.py
      - name: Delete raw source and transport
        if: always()
        shell: bash
        run: |
          rm -rf raw transport c4core
          python - <<'PY'
          from pathlib import Path
          import json
          bad=[str(path) for path in (Path('raw'),Path('transport'),Path('c4core')) if path.exists()]
          out=Path('results/${{ matrix.mode }}');out.mkdir(parents=True,exist_ok=True)
          (out/'RAW_SOURCE_DELETION_RECEIPT.json').write_text(json.dumps({'schema':'LUCIA_AA_C4_PARALLEL_RAW_DELETION_V1','mode':'${{ matrix.mode }}','remaining_roots':bad,'verdict':'PASS_RAW_SOURCE_DELETED' if not bad else 'FAIL'},indent=2)+'\n')
          if bad:raise SystemExit(str(bad))
          PY
      - name: Raw-free mode audit
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          out=Path('results/${{ matrix.mode }}')
          bad=[path.as_posix() for path in out.rglob('*') if path.is_file() and (path.suffix.lower() in {'.safetensors','.bin','.pt','.pth','.pkl','.pickle','.gguf'} or 'tokenizer' in path.name.lower())]
          (out/'RAW_FREE_AUDIT.json').write_text(json.dumps({'schema':'LUCIA_AA_C4_PARALLEL_RAW_FREE_AUDIT_V1','mode':'${{ matrix.mode }}','forbidden_files':bad,'verdict':'PASS_RAW_FREE_RESULTS' if not bad else 'FAIL'},indent=2)+'\n')
          if bad:raise SystemExit(str(bad))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucia-aa-c4-parallel-${{ matrix.mode }}
          path: results/${{ matrix.mode }}/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1

  aggregate:
    needs: condition
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download all parallel mode evidence
        uses: actions/download-artifact@v4
        with:
          pattern: lucia-aa-c4-parallel-*
          path: evidence
          merge-multiple: false
      - name: Download independent early safety evidence
        uses: actions/download-artifact@v4
        with:
          name: lucia-aa-c4-early-safety-raw-free-evidence
          path: safety
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 29782177793
      - name: Aggregate exact Gate
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/c4_parallel_aggregate.py \
            --evidence-root evidence \
            --safety-root safety \
            --out-dir gate
      - name: Raw-free aggregate audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          bad=[p.as_posix() for p in Path('gate').rglob('*') if p.is_file() and (p.suffix.lower() in {'.safetensors','.bin','.pt','.pth','.pkl','.pickle','.gguf'} or 'tokenizer' in p.name.lower())]
          Path('gate/RAW_FREE_AUDIT.json').write_text(json.dumps({'schema':'LUCIA_AA_C4_PARALLEL_AGGREGATE_RAW_FREE_AUDIT_V1','forbidden_files':bad,'verdict':'PASS_RAW_FREE_RESULTS' if not bad else 'FAIL'},indent=2)+'\n')
          if bad:raise SystemExit(str(bad))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lucia-aa-c4-parallel-final-gate
          path: gate/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
