name: R22624 C84 exact source after source-zero selftest
on:
  push:
    branches: [r22624-c84-cypher2]
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Source-zero manifest/upload schema self-test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fixture && mkdir -p fixture/src/adapter fixture/src/base fixture/out
          printf dummy > fixture/src/adapter/adapter_model.safetensors
          printf '{}' > fixture/src/adapter/adapter_config.json
          printf dummy > fixture/src/base/model.safetensors
          python - <<'PY'
          import pathlib, json
          root=pathlib.Path('fixture/src'); rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file(): rows.append(p.relative_to(root).as_posix())
          assert 'adapter/adapter_model.safetensors' in rows
          assert 'adapter/adapter_config.json' in rows
          assert 'base/model.safetensors' in rows
          pathlib.Path('fixture/out/SELFTEST.json').write_text(json.dumps({'schema':'R22624_SOURCE_ZERO_SELFTEST_V1','pass':True,'paths':rows},indent=2)+'\n')
          PY
          test -s fixture/out/SELFTEST.json
          rm -rf fixture
      - name: Download exact selected source once and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/adapter src/base out
          ADAPTER_REPO='Harshini1008/smollm2-135m-text2cypher'
          ADAPTER_REV='2eb1f9ae97fc1fae30bf93e9783a8cce0021fe3d'
          SUB='default'
          BASE_REPO='HuggingFaceTB/SmolLM2-135M-Instruct'
          BASE_REV='12fd25f77366fa6b3b4b768ec3050bf629380bac'
          hfget(){ curl -L --retry 5 --retry-delay 2 --fail --silent --show-error "https://huggingface.co/$1/resolve/$2/$3?download=true" -o "$4"; }
          hfget "$ADAPTER_REPO" "$ADAPTER_REV" "$SUB/adapter_model.safetensors" src/adapter/adapter_model.safetensors
          hfget "$ADAPTER_REPO" "$ADAPTER_REV" "$SUB/adapter_config.json" src/adapter/adapter_config.json
          for f in tokenizer.json tokenizer_config.json special_tokens_map.json merges.txt vocab.json; do hfget "$ADAPTER_REPO" "$ADAPTER_REV" "$SUB/$f" "src/adapter/$f"; done
          hfget "$BASE_REPO" "$BASE_REV" model.safetensors src/base/model.safetensors
          for f in config.json generation_config.json tokenizer.json tokenizer_config.json special_tokens_map.json merges.txt vocab.json; do hfget "$BASE_REPO" "$BASE_REV" "$f" "src/base/$f"; done
          python - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('src'); rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file(): rows.append({'path':p.relative_to(root).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          cfg=json.load(open('src/adapter/adapter_config.json'))
          out={'schema':'R22624_C84_SOURCE_V1','adapter_repo':'Harshini1008/smollm2-135m-text2cypher','adapter_subfolder':'default','adapter_revision':'2eb1f9ae97fc1fae30bf93e9783a8cce0021fe3d','base_repo':'HuggingFaceTB/SmolLM2-135M-Instruct','base_revision':'12fd25f77366fa6b3b4b768ec3050bf629380bac','training_base_revision_proven':bool(cfg.get('revision')),'files':rows}
          assert any(x['path']=='adapter/adapter_model.safetensors' for x in rows)
          assert any(x['path']=='base/model.safetensors' for x in rows)
          pathlib.Path('out/SOURCE_MANIFEST.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22624-c84-source
          path: |
            out
            src
          retention-days: 1
          compression-level: 0
