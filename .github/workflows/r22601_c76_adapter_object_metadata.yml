name: R22601 C76 Hallmark Adapter immutable object metadata
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  object_metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve exact Adapter object without downloading it
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          repo='sebastianboehler/hallmark-mlx-qwen25-1.5b-lora'
          rev='4e24e866109fc0e2e7dfe2e0470529d68c45fbea'
          url=f'https://huggingface.co/api/models/{repo}/tree/{rev}?recursive=true&expand=true'
          req=urllib.request.Request(url,headers={'User-Agent':'LAA-R22601-object-metadata/1.0'})
          with urllib.request.urlopen(req,timeout=45) as r: tree=json.load(r)
          items=[x for x in tree if isinstance(x,dict) and x.get('path')=='adapters.safetensors']
          if len(items)!=1: raise SystemExit('FAIL_ADAPTER_OBJECT_COUNT '+str(len(items)))
          item=items[0]
          print('ADAPTER_TREE_OBJECT='+json.dumps(item,sort_keys=True,separators=(',',':')))
          print('NO_ADAPTER_GET=true')
          PY
