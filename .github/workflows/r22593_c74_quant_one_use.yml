name: R22593 C74 quantization-recovery adapter one-use static archaeology
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: r22593-c74-source-once
  cancel-in-progress: false
jobs:
  c74:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Durable consumed gate before any model source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GATE_BRANCH: r22593-c74-source-receipt
        run: |
          python - <<'PY'
          import os,urllib.request,urllib.error
          H={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22593-gate'}
          u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/recovery/R22593_C74_SOURCE_CONSUMED.json?ref={os.environ['GATE_BRANCH']}"
          try:
            with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=30) as r:
              raise SystemExit('C74_ALREADY_CONSUMED_NO_RERUN')
          except urllib.error.HTTPError as e:
            if e.code!=404: raise
          print('C74_NOT_CONSUMED_PRE_SOURCE_PASS')
          PY
      - name: Bind reviewed runner and source-free preflight
        run: |
          set -euo pipefail
          test "$(git hash-object .github/r22593/c74_quant_static_runner.py)" = "08352b9e8aa81db81d3281e0555fd092056a188b"
          python -m py_compile .github/r22593/c74_quant_static_runner.py
          PYTHONDONTWRITEBYTECODE=1 python -B .github/r22593/c74_quant_static_runner.py --preflight
          test "$(git hash-object .github/r22593/c74_quant_static_runner.py)" = "08352b9e8aa81db81d3281e0555fd092056a188b"
      - name: Canonical one-use Adapter-only static archaeology
        run: |
          set -euo pipefail
          test "$(git hash-object .github/r22593/c74_quant_static_runner.py)" = "08352b9e8aa81db81d3281e0555fd092056a188b"
          PYTHONDONTWRITEBYTECODE=1 python -B .github/r22593/c74_quant_static_runner.py
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
      - name: Persist durable consumed gate if network source was consumed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GATE_BRANCH: r22593-c74-source-receipt
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,json,base64,urllib.request,urllib.error,datetime
          from pathlib import Path
          p=Path('work/out/R22593_C74_SOURCE_INGRESS_RECEIPT.json')
          if not p.exists():
            print('NO_SOURCE_INGRESS_RECEIPT_SOURCE_NOT_CONSUMED'); raise SystemExit(0)
          ingress=json.loads(p.read_text())
          if not ingress.get('source_consumed'):
            print('SOURCE_NOT_CONSUMED'); raise SystemExit(0)
          out={'schema':'R22593_C74_DURABLE_SOURCE_CONSUMED_GATE_V1','consumed':True,'run_id':int(os.environ['RUN_ID']),'head_sha':os.environ['HEAD_SHA'],'adapter_repo':'codelion/Qwen3-0.6B-accuracy-recovery-lora','adapter_revision':'3d95d847c6fa0942db30ff5d005bfd3729220d3d','observed_sha256':ingress.get('observed_sha256'),'observed_size':ingress.get('observed_size'),'created_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          H={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22593-consumed-gate','Content-Type':'application/json'}
          path='recovery/R22593_C74_SOURCE_CONSUMED.json'; existing=None
          u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}?ref={os.environ['GATE_BRANCH']}"
          try:
            with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=30) as r: existing=json.loads(r.read().decode())
          except urllib.error.HTTPError as e:
            if e.code!=404: raise
          payload={'message':'Seal durable R22593 C74 source-consumed gate','content':base64.b64encode((json.dumps(out,indent=2,sort_keys=True)+'\n').encode()).decode(),'branch':os.environ['GATE_BRANCH']}
          if isinstance(existing,dict) and existing.get('sha'): payload['sha']=existing['sha']
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}",data=json.dumps(payload).encode(),headers=H,method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r:r.read()
          print('DURABLE_CONSUMED_GATE_WRITTEN')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r22593-c74-quant-recovery-adapter-only-rawfree
          path: work/out/
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
      - name: Persist unique source run receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT_BRANCH: r22593-c74-source-receipt
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,base64,time,datetime
          H={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22593-source-receipt','Content-Type':'application/json'}
          arts=[]
          for _ in range(10):
            req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}/artifacts?per_page=100",headers=H)
            with urllib.request.urlopen(req,timeout=30) as r:d=json.loads(r.read().decode())
            arts=d.get('artifacts',[])
            if arts: break
            time.sleep(2)
          out={'schema':'R22593_C74_SOURCE_RUN_RECEIPT_V1','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'run_id':int(os.environ['RUN_ID']),'head_sha':os.environ['HEAD_SHA'],'artifacts':[{'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'digest':a.get('digest'),'expired':a.get('expired')} for a in arts]}
          b=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode(); path=f"recovery/R22593_C74_SOURCE_RUN_{os.environ['RUN_ID']}.json"
          payload=json.dumps({'message':'Persist R22593 C74 source run receipt','content':base64.b64encode(b).decode(),'branch':os.environ['OUT_BRANCH']}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}",data=payload,headers=H,method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r:r.read()
          PY