name: LAA R22564 C44 metadata-only audit
on:
  push:
    branches: [laa-r22564-c44-agentguard]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Exact metadata only, no raw weight download
        shell: bash
        run: |
          set -euo pipefail
          export GIT_LFS_SKIP_SMUDGE=1
          git clone -q --depth 1 https://huggingface.co/dannyliv/agent-guard-modernbert-base cand
          git clone -q --depth 1 https://huggingface.co/answerdotai/ModernBERT-base base
          mkdir out
          python - <<'PY'
          import json,pathlib,hashlib
          def ptr(p):
              d={}
              for l in p.read_text(errors='replace').splitlines():
                  if l.startswith('oid sha256:'): d['sha256']=l.split(':',1)[1]
                  if l.startswith('size '): d['size']=int(l.split()[1])
              return d
          root=pathlib.Path('cand'); b=pathlib.Path('base')
          a=root/'adapter'/'adapter_model.safetensors'; c=root/'adapter'/'adapter_config.json'
          assert a.exists() and c.exists()
          cfg=json.loads(c.read_text())
          obj={'schema':'LAA_R22564_C44_META_V1','candidate_revision':__import__('subprocess').check_output(['git','-C','cand','rev-parse','HEAD'],text=True).strip(),'base_revision':__import__('subprocess').check_output(['git','-C','base','rev-parse','HEAD'],text=True).strip(),'adapter_pointer':ptr(a),'base_pointer':ptr(b/'model.safetensors'),'adapter_config':cfg,'candidate_top_files':sorted(p.name for p in root.iterdir() if p.name!='.git'),'adapter_files':sorted(p.name for p in (root/'adapter').iterdir()),'base_top_files':sorted(p.name for p in b.iterdir() if p.name!='.git')}
          pathlib.Path('out/C44_META.json').write_text(json.dumps(obj,indent=2,sort_keys=True))
          print(json.dumps(obj,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22564-c44-meta
          path: out/C44_META.json
          retention-days: 1
