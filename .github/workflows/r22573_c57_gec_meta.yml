name: R22573 C57 CoEdIT Wallclock Preflight
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - name: Install source-free runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q 'torch>=2.8,<3' 'transformers>=4.53,<6' 'peft>=0.18,<0.20'
      - name: Benchmark full random CoEdIT architecture before binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,time,resource,torch,pathlib
          from transformers import AutoConfig,AutoModelForSeq2SeqLM
          from peft import LoraConfig,get_peft_model
          BASE='grammarly/coedit-large'; REV='5637bcdf9d8d4419f97c8cfea36f7d35c79232b6'
          t0=time.perf_counter(); cfg=AutoConfig.from_pretrained(BASE,revision=REV,trust_remote_code=False); config_s=time.perf_counter()-t0
          t0=time.perf_counter(); base=AutoModelForSeq2SeqLM.from_config(cfg); init_s=time.perf_counter()-t0
          lc=LoraConfig(r=16,lora_alpha=32,lora_dropout=.05,target_modules=['k','q','wi_1','wo','wi_0','o','v'],task_type='SEQ_2_SEQ_LM')
          t0=time.perf_counter(); model=get_peft_model(base,lc); lora_s=time.perf_counter()-t0; model.eval()
          # Exact-runtime lifecycle identifiers used later.
          for name in ['control_random','control_shuffle','dose_0p25','dose_0p50','dose_1p50','minus_encoder_attn','minus_ffn']:
              model.add_adapter(name,lc); model.set_adapter(name); model.delete_adapter(name)
          model.set_adapter('default')
          vocab=int(cfg.vocab_size); pad=int(getattr(cfg,'pad_token_id',0) or 0); eos=int(getattr(cfg,'eos_token_id',1) or 1)
          def fwd(batch=4,src_len=32,tgt_len=24,reps=2):
              x=torch.randint(2,vocab,(batch,src_len)); am=torch.ones_like(x); lab=torch.randint(2,vocab,(batch,tgt_len)); ts=[]
              with torch.inference_mode():
                  for _ in range(reps):
                      s=time.perf_counter(); model(input_ids=x,attention_mask=am,labels=lab); ts.append(time.perf_counter()-s)
              return sum(ts)/len(ts)
          def gen(batch=2,src_len=32,new=16,reps=1):
              x=torch.randint(2,vocab,(batch,src_len));am=torch.ones_like(x);ts=[]
              with torch.inference_mode():
                  for _ in range(reps):
                      s=time.perf_counter(); model.generate(input_ids=x,attention_mask=am,max_new_tokens=new,num_beams=1,do_sample=False);ts.append(time.perf_counter()-s)
              return sum(ts)/len(ts)
          fwd_s=fwd(); gen16_s=gen()
          # Planned C57 workload: BASE/FULL all 192; 5 controls x96; optional 7 causal x64.
          fwd_cases_primary=192*2+96*5; fwd_cases_causal=64*7
          fwd_batches_primary=(fwd_cases_primary+3)//4; fwd_batches_causal=(fwd_cases_causal+3)//4
          # Generation BASE+FULL 64 cases each, batch2, conservatively 32 output tokens (~2x 16-token microbench).
          gen_batches=(64*2+1)//2
          est_primary=fwd_batches_primary*fwd_s + gen_batches*gen16_s*2
          est_with_causal=est_primary+fwd_batches_causal*fwd_s
          hard_timeout_s=50*60; green_limit=.70*hard_timeout_s
          rec={'schema':'R22573_C57_WALLCLOCK_PREFLIGHT_V1','weights_downloaded':0,'model_outputs_from_source':0,'base_repo':BASE,'base_revision':REV,'config_seconds':config_s,'random_model_init_seconds':init_s,'lora_inject_seconds':lora_s,'forward_batch4_src32_tgt24_seconds':fwd_s,'generate_batch2_16tokens_seconds':gen16_s,'planned_primary_seconds':est_primary,'planned_with_conditional_causal_seconds':est_with_causal,'hard_timeout_seconds':hard_timeout_s,'green_limit_seconds':green_limit,'primary_green':est_primary<=green_limit,'with_causal_green':est_with_causal<=green_limit,'max_rss_kb':resource.getrusage(resource.RUSAGE_SELF).ru_maxrss,'architecture':{'d_model':getattr(cfg,'d_model',None),'d_ff':getattr(cfg,'d_ff',None),'num_layers':getattr(cfg,'num_layers',None),'num_decoder_layers':getattr(cfg,'num_decoder_layers',None),'num_heads':getattr(cfg,'num_heads',None),'vocab_size':getattr(cfg,'vocab_size',None)}}
          pathlib.Path('out/C57_WALLCLOCK_PREFLIGHT.json').write_text(json.dumps(rec,indent=2));print(json.dumps(rec,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22573-c57-wallclock-preflight
          path: out/
          retention-days: 1
          if-no-files-found: error
