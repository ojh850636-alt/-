name: R22573 C57 GEC Subpath Audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - name: Audit morpheus candidate subpaths without weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,urllib.request,pathlib,hashlib
          repo='morpheuslord/rewrite'; sha='b0223f103634eb941e067996c07827c17a385a80'
          paths=['adapter_config.json','README.md','checkpoints/best_model/adapter_config.json','checkpoints/best_model/README.md','checkpoints/checkpoint-1515/adapter_config.json','checkpoints/checkpoint-1515/README.md']
          def tget(path,limit=120000):
            req=urllib.request.Request(f'https://huggingface.co/{repo}/resolve/{sha}/{path}',headers={'User-Agent':'LAA-R22573-subpath/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:return r.read(limit+1).decode('utf-8','replace')[:limit]
            except Exception as e:return None
          rec={}
          for p in paths:
            s=tget(p)
            if p.endswith('.json') and s:
              try:val=json.loads(s)
              except Exception:val={'_parse_error':True,'sha256':hashlib.sha256(s.encode()).hexdigest()}
            else:val=s
            rec[p]={'value':val,'sha256':hashlib.sha256((s or '').encode()).hexdigest() if s is not None else None}
          # Base metadata only: no weight download
          for base in ['grammarly/coedit-large','google/flan-t5-small']:
            req=urllib.request.Request('https://huggingface.co/api/models/'+base+'?blobs=true',headers={'User-Agent':'LAA-R22573-subpath/1.0'})
            with urllib.request.urlopen(req,timeout=30) as r:m=json.load(r)
            card=m.get('cardData') or {}; files=[]
            for x in m.get('siblings') or []:
              lfs=x.get('lfs') or {}
              if x.get('rfilename') in ['model.safetensors','config.json']:
                files.append({'name':x.get('rfilename'),'size':x.get('size') or lfs.get('size'),'sha256':lfs.get('sha256')})
            rec['BASE:'+base]={'revision':m.get('sha'),'license':card.get('license') or m.get('license'),'gated':m.get('gated'),'files':files}
          out={'schema':'R22573_C57_GEC_SUBPATH_AUDIT_V2','weight_bytes_downloaded':0,'model_outputs_observed':0,'repo':repo,'exact_revision':sha,'records':rec}
          p=pathlib.Path('out/R22573_C57_GEC_SUBPATH_AUDIT.json');p.write_text(json.dumps(out,ensure_ascii=False,indent=2))
          pathlib.Path('out/SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          print(json.dumps(out,indent=2)[:12000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22573-c57-gec-subpath-meta
          path: out/
          retention-days: 1
          if-no-files-found: error
