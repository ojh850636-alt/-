name: R22573 C57 Small-GEC Discovery Sweep
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - name: Search HF metadata for small public PEFT GEC candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,urllib.request,urllib.parse,pathlib,re
          terms=['grammar correction','grammatical error correction','text correction lora','proofreading lora']
          def jget(u):
            req=urllib.request.Request(u,headers={'User-Agent':'LAA-R22573-discovery/1.0'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          ids=[]
          for term in terms:
            url='https://huggingface.co/api/models?'+urllib.parse.urlencode({'search':term,'limit':100,'full':'true'})
            try: rows=jget(url)
            except Exception as e:
              print('SEARCH_FAIL',term,repr(e)); continue
            for x in rows:
              mid=x.get('modelId') or x.get('id')
              if mid and mid not in ids: ids.append(mid)
          recs=[]
          for mid in ids[:240]:
            try:
              m=jget('https://huggingface.co/api/models/'+urllib.parse.quote(mid,safe='/')+'?blobs=true')
              card=m.get('cardData') or {}; tags=m.get('tags') or []; sib=m.get('siblings') or []
              files=[]
              for x in sib:
                lfs=x.get('lfs') or {}; files.append({'name':x.get('rfilename'),'size':x.get('size') or lfs.get('size'),'sha256':lfs.get('sha256')})
              adapters=[f for f in files if (f['name'] or '').endswith('adapter_model.safetensors')]
              cfg_present=any((f['name'] or '')=='adapter_config.json' for f in files)
              if not adapters or not cfg_present: continue
              smallest=min([f['size'] for f in adapters if isinstance(f.get('size'),int)] or [10**18])
              if smallest>100_000_000: continue
              lic=card.get('license') or m.get('license'); base=card.get('base_model')
              recs.append({'repo':mid,'revision':m.get('sha'),'license':lic,'base_model_card':base,'gated':m.get('gated'),'library_name':m.get('library_name'),'tags':tags,'smallest_adapter_bytes':smallest,'adapters':adapters,'file_count':len(files)})
            except Exception: pass
          # Prefer explicit license/base and smaller adapters in output ordering.
          recs.sort(key=lambda r:(r['license'] is None,r['base_model_card'] is None,r['smallest_adapter_bytes']))
          out={'schema':'R22573_C57_SMALL_GEC_DISCOVERY_V1','weight_bytes_downloaded':0,'model_outputs_observed':0,'search_terms':terms,'results':recs[:80]}
          p=pathlib.Path('out/R22573_C57_SMALL_GEC_DISCOVERY.json');p.write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2)[:20000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22573-c57-small-gec-discovery
          path: out/
          retention-days: 1
          if-no-files-found: error
