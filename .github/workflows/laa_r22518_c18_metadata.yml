name: Temporary LAA R22518 C18 runtime wheel audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact no-dependency runtime wheels and audit metadata
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/LAA_R22518_C18_RUNTIME_WHEELS"
          mkdir -p "$ROOT/wheelhouse"
          python -m pip download --dest "$ROOT/wheelhouse" --only-binary=:all: --no-deps \
            'chronos-forecasting==2.3.1' \
            'transformers==4.57.1' \
            'peft==0.19.1' \
            'accelerate==1.14.0' \
            'huggingface-hub==0.36.0' \
            'tokenizers==0.22.1'
          python - <<'PY'
          import csv, hashlib, json, os, pathlib, zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'LAA_R22518_C18_RUNTIME_WHEELS'
          rows=[]
          for p in sorted((root/'wheelhouse').glob('*.whl')):
              metadata=[]
              with zipfile.ZipFile(p) as z:
                  names=[n for n in z.namelist() if n.endswith('.dist-info/METADATA')]
                  if len(names)!=1: raise SystemExit(f'METADATA cardinality invalid: {p.name}')
                  text=z.read(names[0]).decode('utf-8','replace')
                  metadata=[line for line in text.splitlines() if line.startswith(('Name:','Version:','Requires-Python:','Requires-Dist:'))]
              rows.append({'file':p.name,'size_bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'metadata_lines':metadata})
          receipt={'schema':'LUCIA_AA_R2_25_18_C18_RUNTIME_WHEEL_AUDIT_V1','raw_weight_bytes_downloaded':0,'model_outputs_observed':0,'files':rows}
          (root/'R22518_C18_RUNTIME_WHEEL_AUDIT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Upload one-day runtime wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAA_R22518_C18_RUNTIME_WHEELS
          path: ${{ runner.temp }}/LAA_R22518_C18_RUNTIME_WHEELS
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
