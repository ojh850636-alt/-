name: Temporary LAA R22518 C18 metadata candidate audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Audit exact candidate metadata without downloading weights
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/LAA_R22518_C18_METADATA_V2"
          mkdir -p "$ROOT/files"
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request

          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'LAA_R22518_C18_METADATA_V2'
          candidates = [
              'ODNus/timesfm-omnion-lora',
              'Verm1ion/turkforecast-fm-chronos2-lora-v1',
              'albertooooz/chronos-2-lora-pl-day-ahead',
              'karkar69/chronos-volatility',
              'msradam/TerraMind-NYC-Adapters',
              'sergiopaniego/gemma-3-4b-pt-object-detection-lora',
          ]
          headers={'User-Agent':'LUCIA-Adapter-Archaeology-R22518-MetadataOnly/2.0'}

          def get_bytes(url, timeout=120):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read()
          def get_json(url, timeout=120):
              return json.loads(get_bytes(url,timeout))
          def api_model(repo):
              return get_json('https://huggingface.co/api/models/'+urllib.parse.quote(repo,safe='/')+'?blobs=true')
          def safe_name(s):
              return ''.join(c if c.isalnum() or c in '._-' else '_' for c in s)
          def file_meta(s):
              l=s.get('lfs') if isinstance(s.get('lfs'),dict) else {}
              return {
                  'path':s.get('rfilename'),
                  'size_bytes':s.get('size') if isinstance(s.get('size'),int) else l.get('size'),
                  'sha256_or_oid':l.get('sha256') or l.get('oid') or s.get('blobId'),
              }

          rows=[]; errors=[]
          for repo in candidates:
              try:
                  api=api_model(repo)
              except Exception as e:
                  errors.append({'repo':repo,'stage':'api','error':type(e).__name__+': '+str(e)})
                  continue
              rev=api.get('sha')
              siblings=api.get('siblings') or []
              names=[x.get('rfilename') for x in siblings if x.get('rfilename')]
              configs=[n for n in names if n.endswith('adapter_config.json')]
              weights=[file_meta(x) for x in siblings if str(x.get('rfilename','')).endswith('adapter_model.safetensors')]
              readmes=[n for n in names if pathlib.PurePosixPath(n).name.lower()=='readme.md']
              config_rows=[]
              for path in configs:
                  try:
                      b=get_bytes(f'https://huggingface.co/{repo}/resolve/{rev}/{path}?download=true')
                      cfg=json.loads(b)
                      rel=root/'files'/safe_name(repo)/(safe_name(path)+'.json')
                      rel.parent.mkdir(parents=True,exist_ok=True)
                      rel.write_bytes(b)
                      config_rows.append({'path':path,'sha256':hashlib.sha256(b).hexdigest(),'config':cfg})
                  except Exception as e:
                      errors.append({'repo':repo,'stage':'config:'+path,'error':type(e).__name__+': '+str(e)})
              readme_rows=[]
              for path in readmes[:8]:
                  try:
                      b=get_bytes(f'https://huggingface.co/{repo}/resolve/{rev}/{path}?download=true')
                      rel=root/'files'/safe_name(repo)/(safe_name(path)+'.md')
                      rel.parent.mkdir(parents=True,exist_ok=True)
                      rel.write_bytes(b)
                      readme_rows.append({'path':path,'sha256':hashlib.sha256(b).hexdigest(),'size_bytes':len(b)})
                  except Exception as e:
                      errors.append({'repo':repo,'stage':'readme:'+path,'error':type(e).__name__+': '+str(e)})

              card=api.get('cardData') or {}
              cfg0=config_rows[0]['config'] if config_rows else {}
              base=cfg0.get('base_model_name_or_path') or card.get('base_model')
              if isinstance(base,list): base=base[0] if base else None
              base_info=None
              if isinstance(base,str) and '/' in base and not base.startswith('/'):
                  try:
                      ba=api_model(base)
                      bs=ba.get('siblings') or []
                      bfiles=[file_meta(x) for x in bs if str(x.get('rfilename','')).endswith('.safetensors')]
                      base_info={
                          'repo':base,
                          'revision':ba.get('sha'),
                          'license':(ba.get('cardData') or {}).get('license'),
                          'pipeline_tag':ba.get('pipeline_tag'),
                          'library_name':ba.get('library_name'),
                          'safetensors_files':bfiles,
                          'safetensors_total_known_bytes':sum(x['size_bytes'] for x in bfiles if isinstance(x.get('size_bytes'),int)) or None,
                          'custom_python_files':sorted(n for n in [x.get('rfilename') for x in bs] if isinstance(n,str) and n.endswith('.py')),
                          'config_files':sorted(n for n in [x.get('rfilename') for x in bs] if isinstance(n,str) and (n.endswith('config.json') or n.endswith('.yaml') or n.endswith('.yml'))),
                      }
                  except Exception as e:
                      base_info={'repo':base,'error':type(e).__name__+': '+str(e)}

              lower=' '.join([repo,str(api.get('pipeline_tag') or ''),str(api.get('library_name') or ''),' '.join(map(str,api.get('tags') or [])),json.dumps(card,sort_keys=True),json.dumps(cfg0,sort_keys=True)]).lower()
              if 'time-series-forecasting' in lower or 'timesfm' in lower or 'chronos' in lower:
                  lane='TIME_SERIES_FORECASTING'; geometry='fixed-horizon numeric/quantile sequence'
              elif 'semantic-segmentation' in lower or 'terr' in lower and 'segmentation' in lower:
                  lane='SEMANTIC_SEGMENTATION'; geometry='per-pixel class/mask field'
              elif 'object-detection' in lower or 'object detection' in lower:
                  lane='OBJECT_DETECTION'; geometry='set of boxes/classes'
              else:
                  lane='OTHER'; geometry='unknown'
              license_value=card.get('license') or api.get('license')
              custom_files=sorted(n for n in names if n.endswith('.py'))
              score=0; reasons=[]
              if lane!='OTHER': score+=25; reasons.append('new_output_geometry')
              if license_value in {'apache-2.0','mit','bsd','bsd-3-clause','cc-by-4.0'}: score+=15; reasons.append('explicit_permissive_license')
              elif license_value: score+=5; reasons.append('license_present_nonpreferred')
              else: reasons.append('license_missing')
              if config_rows: score+=10; reasons.append('adapter_config_present')
              if weights: score+=10; reasons.append('adapter_safetensors_present')
              if base_info and base_info.get('safetensors_files'): score+=10; reasons.append('base_safetensors_present')
              if not custom_files: score+=5; reasons.append('adapter_no_custom_python')
              else: reasons.append('adapter_custom_python_present')
              if base_info and not base_info.get('custom_python_files'): score+=5; reasons.append('base_no_custom_python')
              else: reasons.append('base_custom_python_or_unknown')
              adapter_bytes=sum(x['size_bytes'] for x in weights if isinstance(x.get('size_bytes'),int)) or None
              if adapter_bytes is not None and adapter_bytes<=100_000_000: score+=10; reasons.append('adapter_under_100MB')
              base_bytes=base_info.get('safetensors_total_known_bytes') if isinstance(base_info,dict) else None
              if isinstance(base_bytes,int) and base_bytes<=1_500_000_000: score+=10; reasons.append('base_under_1.5GB')
              elif isinstance(base_bytes,int) and base_bytes<=4_000_000_000: score+=4; reasons.append('base_under_4GB')

              rows.append({
                  'repo':repo,'revision':rev,'license':license_value,
                  'pipeline_tag':api.get('pipeline_tag'),'library_name':api.get('library_name'),
                  'tags':api.get('tags') or [],'datasets':card.get('datasets'),
                  'lane':lane,'output_geometry':geometry,
                  'adapter_configs':config_rows,'adapter_weights':weights,
                  'adapter_total_known_bytes':adapter_bytes,
                  'readmes':readme_rows,'custom_python_files':custom_files,
                  'all_siblings':sorted(names),'base':base_info,
                  'metadata_score':score,'score_reasons':reasons,
                  'raw_weight_bytes_downloaded':0,'model_outputs_observed':0,
              })
          rows.sort(key=lambda x:(-x['metadata_score'],x['repo']))
          receipt={
              'schema':'LUCIA_AA_R2_25_18_C18_METADATA_CANDIDATE_AUDIT_V2',
              'raw_weight_bytes_downloaded':0,'model_outputs_observed':0,
              'candidate_count':len(rows),'candidates':rows,'errors':errors,
          }
          (root/'C18_METADATA_CANDIDATE_AUDIT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'candidate_count':len(rows),'ranking':[{'score':r['metadata_score'],'repo':r['repo'],'lane':r['lane'],'license':r['license'],'adapter_bytes':r['adapter_total_known_bytes'],'base_bytes':(r['base'] or {}).get('safetensors_total_known_bytes') if isinstance(r['base'],dict) else None,'custom':bool(r['custom_python_files'] or ((r['base'] or {}).get('custom_python_files') if isinstance(r['base'],dict) else []))} for r in rows]},indent=2))
          PY
      - name: Upload one-day metadata-only audit
        uses: actions/upload-artifact@v4
        with:
          name: LAA_R22518_C18_METADATA_AUDIT_V2
          path: ${{ runner.temp }}/LAA_R22518_C18_METADATA_V2
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
