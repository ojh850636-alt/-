name: Temporary LAA R22518 C18 exact source courier

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  courier:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exactly pinned safe source and runtime wheels
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/LAA_R22518_C18_EXACT_COURIER"
          SRC="$ROOT/source"
          WHEELS="$ROOT/wheelhouse"
          mkdir -p "$SRC/adapter" "$SRC/base" "$WHEELS"
          download() {
            local repo="$1" rev="$2" path="$3" out="$4"
            curl -L --fail --retry 6 --retry-all-errors --connect-timeout 30 --max-time 2400 \
              -o "$out" "https://huggingface.co/${repo}/resolve/${rev}/${path}?download=true"
          }
          A_REPO='albertooooz/chronos-2-lora-pl-day-ahead'
          A_REV='567dae6065d787bc9fcb98c69a845ddfcba018ee'
          B_REPO='amazon/chronos-2'
          B_REV='29ec3766d36d6f73f0696f85560a422f50e8498c'
          download "$A_REPO" "$A_REV" README.md "$SRC/adapter/README.md"
          download "$A_REPO" "$A_REV" adapter_config.json "$SRC/adapter/adapter_config.json"
          download "$A_REPO" "$A_REV" adapter_model.safetensors "$SRC/adapter/adapter_model.safetensors"
          if curl -L --fail --retry 2 -o "$SRC/adapter/eval_results.json" "https://huggingface.co/${A_REPO}/resolve/${A_REV}/eval_results.json?download=true"; then :; else rm -f "$SRC/adapter/eval_results.json"; fi
          download "$B_REPO" "$B_REV" config.json "$SRC/base/config.json"
          download "$B_REPO" "$B_REV" model.safetensors "$SRC/base/model.safetensors"
          if curl -L --fail --retry 2 -o "$SRC/base/README.md" "https://huggingface.co/${B_REPO}/resolve/${B_REV}/README.md?download=true"; then :; else rm -f "$SRC/base/README.md"; fi
          test "$(stat -c%s "$SRC/adapter/adapter_model.safetensors")" = '4854584'
          test "$(sha256sum "$SRC/adapter/adapter_model.safetensors" | awk '{print $1}')" = 'c5515e778578d90d79ff162a9e8581042e3d3dafc29e89bc9e6c17bb1a327fa7'
          test "$(stat -c%s "$SRC/base/model.safetensors")" = '477930472'
          test "$(sha256sum "$SRC/base/model.safetensors" | awk '{print $1}')" = 'ddcda3c7508bf2528087723e98a20707cc04b7f370ae275a9fd88078ddba4f42'
          if find "$SRC" -type f \( -name '*.bin' -o -name '*.pt' -o -name '*.pth' -o -name '*.pkl' -o -name '*.pickle' -o -name '*.ckpt' -o -name '*.h5' -o -name '*.msgpack' -o -name '*.py' -o -name '*.ipynb' \) | grep -q .; then exit 1; fi
          python - <<'PY'
          import json,struct,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'LAA_R22518_C18_EXACT_COURIER'/'source'
          for rel in ('adapter/adapter_model.safetensors','base/model.safetensors'):
            with (root/rel).open('rb') as f:n=struct.unpack('<Q',f.read(8))[0];h=json.loads(f.read(n))
            if not [k for k in h if k!='__metadata__']:raise SystemExit('empty safetensors')
          PY
          python -m pip download --dest "$WHEELS" --only-binary=:all: --no-deps \
            'chronos-forecasting==2.3.1' 'transformers==4.57.1' 'peft==0.19.1' \
            'accelerate==1.14.0' 'huggingface-hub==0.36.0' 'tokenizers==0.22.1'
          (cd "$ROOT" && find source wheelhouse -type f -print0 | sort -z | xargs -0 sha256sum > SHA256_MANIFEST.txt)
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'LAA_R22518_C18_EXACT_COURIER';rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
            h=hashlib.sha256();
            with p.open('rb') as f:
              for block in iter(lambda:f.read(1024*1024),b''):h.update(block)
            rows.append({'path':p.relative_to(root).as_posix(),'size_bytes':p.stat().st_size,'sha256':h.hexdigest()})
          (root/'COURIER_RECEIPT.json').write_text(json.dumps({'schema':'LUCIA_AA_R2_25_18_C18_EXACT_COURIER_V1','candidate_id':'R22518-C18-CHRONOS2-PL-DAY-AHEAD','raw_weights_committed_to_git':False,'artifact_retention_days':1,'files':rows},indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LAA_R22518_C18_EXACT_SOURCE
          path: ${{ runner.temp }}/LAA_R22518_C18_EXACT_COURIER
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
