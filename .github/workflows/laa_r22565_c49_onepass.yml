name: LAA R22565 C49 guarded one-use archaeology
on:
  push:
    branches: [laa-r22565-c49-minilm-agnews]
    paths: [r22565/c49/START_ONCE.txt]
permissions:
  contents: read
  actions: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Frozen output-zero contract and runtime self-test
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum r22565/c49/c49_forge.py | awk '{print $1}')" = d7de2022160fd627cde1fdacf5749690feea626e9cfb7c3294b72c50830e8bb8
          test "$(sha256sum r22565/c49/c49_science.py | awk '{print $1}')" = 9f0a973b46322f811410dff0fa908512f1ba008f16579c2f469f7eeb1fc4cf49
          test "$(sha256sum r22565/c49/C49_PREOUTPUT_CONTRACT.json | awk '{print $1}')" = eefb9f4f90cf29607454262003c48221a45edb7e33e6be864a852433492a8f40
          mkdir -p datasets/r22565_c49
          python r22565/c49/c49_forge.py
          test "$(sha256sum datasets/r22565_c49/C49_FRESH_NEWS_TOPIC_SUITE.jsonl | awk '{print $1}')" = 51b08687533ca87f53b65cf5313851c2405a58d096da811677c8caf6a11f02ba
          export GIT_LFS_SKIP_SMUDGE=1
          git clone -q --depth 1 https://huggingface.co/TransferGraph/cross-encoder_ms-marco-MiniLM-L-4-v2-finetuned-lora-ag_news cand
          git clone -q --depth 1 https://huggingface.co/cross-encoder/ms-marco-MiniLM-L-4-v2 baseptr
          test "$(git -C cand rev-parse HEAD)" = bf5da2bdedc49a88a39ee7357f55b6bf75e108c1
          test "$(git -C baseptr rev-parse HEAD)" = 777b2f369bc1c2f850df8bd367ed1654bda4497b
          grep -q 'oid sha256:e50ef9a7b3ab9ce41feb3b0003b777e087d04257c56311cce6c003fab225a7d1' cand/adapter_model.safetensors
          grep -q 'size 33128' cand/adapter_model.safetensors
          grep -q 'oid sha256:3db1c98132b54901976d6da56fa711756c7780a6263d5db8f336232584f5fe58' baseptr/model.safetensors
          grep -q 'size 76671186' baseptr/model.safetensors
          python -m pip install -q numpy==1.26.4 torch==2.2.0 transformers==4.37.2 peft==0.8.2 accelerate==0.26.1 safetensors==0.4.2
          PYTHONDONTWRITEBYTECODE=1 python r22565/c49/c49_science.py --self-test
  capture_adapter:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Exact adapter then immediate escrow
        shell: bash
        run: |
          set -euo pipefail
          mkdir escrow_adapter
          A=https://huggingface.co/TransferGraph/cross-encoder_ms-marco-MiniLM-L-4-v2-finetuned-lora-ag_news/resolve/bf5da2bdedc49a88a39ee7357f55b6bf75e108c1
          curl -L --fail --retry 3 -o escrow_adapter/adapter_config.json "$A/adapter_config.json"
          curl -L --fail --retry 3 -o escrow_adapter/adapter_model.safetensors "$A/adapter_model.safetensors"
          test "$(stat -c%s escrow_adapter/adapter_model.safetensors)" = 33128
          test "$(sha256sum escrow_adapter/adapter_model.safetensors | awk '{print $1}')" = e50ef9a7b3ab9ce41feb3b0003b777e087d04257c56311cce6c003fab225a7d1
      - uses: actions/upload-artifact@v4
        with: {name: r22565-c49-raw-adapter, path: escrow_adapter, retention-days: 1, compression-level: 0}
  capture_base:
    needs: capture_adapter
    runs-on: ubuntu-latest
    steps:
      - name: Exact base then immediate escrow
        shell: bash
        run: |
          set -euo pipefail
          mkdir escrow_base
          B=https://huggingface.co/cross-encoder/ms-marco-MiniLM-L-4-v2/resolve/777b2f369bc1c2f850df8bd367ed1654bda4497b
          for f in config.json tokenizer.json tokenizer_config.json special_tokens_map.json vocab.txt; do curl -L --fail --retry 3 -o escrow_base/$f "$B/$f"; done
          curl -L --fail --retry 3 -o escrow_base/model.safetensors "$B/model.safetensors"
          test "$(stat -c%s escrow_base/model.safetensors)" = 76671186
          test "$(sha256sum escrow_base/model.safetensors | awk '{print $1}')" = 3db1c98132b54901976d6da56fa711756c7780a6263d5db8f336232584f5fe58
      - uses: actions/upload-artifact@v4
        with: {name: r22565-c49-raw-base, path: escrow_base, retention-days: 1, compression-level: 0}
  science:
    needs: capture_base
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with: {name: r22565-c49-raw-adapter, path: raw_adapter}
      - uses: actions/download-artifact@v4
        with: {name: r22565-c49-raw-base, path: raw_base}
      - name: Frozen behavior and conditional causal archaeology
        shell: bash
        env: {OMP_NUM_THREADS: '4', MKL_NUM_THREADS: '4', TOKENIZERS_PARALLELISM: 'false', PYTHONDONTWRITEBYTECODE: '1'}
        run: |
          set -euo pipefail
          mkdir -p datasets/r22565_c49 work/adapter work/base evidence
          test "$(sha256sum r22565/c49/c49_forge.py | awk '{print $1}')" = d7de2022160fd627cde1fdacf5749690feea626e9cfb7c3294b72c50830e8bb8
          test "$(sha256sum r22565/c49/c49_science.py | awk '{print $1}')" = 9f0a973b46322f811410dff0fa908512f1ba008f16579c2f469f7eeb1fc4cf49
          python r22565/c49/c49_forge.py
          test "$(sha256sum datasets/r22565_c49/C49_FRESH_NEWS_TOPIC_SUITE.jsonl | awk '{print $1}')" = 51b08687533ca87f53b65cf5313851c2405a58d096da811677c8caf6a11f02ba
          cp -a raw_adapter/escrow_adapter/. work/adapter/
          cp -a raw_base/escrow_base/. work/base/
          test "$(sha256sum work/adapter/adapter_model.safetensors | awk '{print $1}')" = e50ef9a7b3ab9ce41feb3b0003b777e087d04257c56311cce6c003fab225a7d1
          test "$(sha256sum work/base/model.safetensors | awk '{print $1}')" = 3db1c98132b54901976d6da56fa711756c7780a6263d5db8f336232584f5fe58
          python -m pip install -q numpy==1.26.4 torch==2.2.0 transformers==4.37.2 peft==0.8.2 accelerate==0.26.1 safetensors==0.4.2
          python r22565/c49/c49_science.py --self-test > evidence/C49_RUNTIME_SELFTEST.json
          python r22565/c49/c49_science.py --run --work work --suite datasets/r22565_c49/C49_FRESH_NEWS_TOPIC_SUITE.jsonl --out evidence --batch 32 | tee evidence/C49_STDOUT_SUMMARY.txt
          cp r22565/c49/C49_PREOUTPUT_CONTRACT.json evidence/C49_PREOUTPUT_CONTRACT.json
          cp datasets/r22565_c49/C49_FRESH_NEWS_TOPIC_SUITE.jsonl evidence/C49_FRESH_NEWS_TOPIC_SUITE.jsonl
          rm -rf work raw_adapter raw_base
          if find evidence -type f \( -name '*.safetensors' -o -name '*.bin' -o -name '*.pt' -o -name '*.pkl' \) | grep -q .; then exit 91; fi
          python - <<'PY'
          import hashlib,json,pathlib
          r=pathlib.Path('evidence'); fs=[]
          for p in sorted(r.iterdir()):
            if p.is_file(): fs.append({'name':p.name,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (r/'C49_RAW_FREE_MANIFEST.json').write_text(json.dumps({'schema':'LAA_R22565_C49_RAW_FREE_V1','files':fs,'raw_source_present':False},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: r22565-c49-rawfree-evidence, path: evidence, retention-days: 1}
  cleanup:
    if: ${{ always() && needs.science.result == 'success' }}
    needs: science
    runs-on: ubuntu-latest
    steps:
      - name: Delete authoritative C49 raw escrows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir cleanup
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > a.json
          python - <<'PY' > cleanup/targets.tsv
          import json
          for a in json.load(open('a.json'))['artifacts']:
            if a['name'] in {'r22565-c49-raw-adapter','r22565-c49-raw-base'}: print(a['id'],a['name'],sep='\t')
          PY
          test "$(wc -l < cleanup/targets.tsv)" = 2
          while IFS=$'\t' read -r id name; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; echo "$id $name DELETED"; done < cleanup/targets.tsv > cleanup/deleted.txt
          python - <<'PY'
          import json,pathlib
          l=pathlib.Path('cleanup/deleted.txt').read_text().splitlines(); pathlib.Path('cleanup/C49_RAW_DELETION.json').write_text(json.dumps({'schema':'LAA_R22565_C49_RAW_DELETION_V1','deleted':l,'count':len(l),'source_reacquisition_allowed':False},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: r22565-c49-cleanup, path: cleanup/C49_RAW_DELETION.json, retention-days: 1}
