name: R22528 C27 metadata-only comparison

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Compare public metadata only
        run: |
          python -m pip install 'requests==2.32.5'
          python - <<'PY'
          import json,requests,os
          from pathlib import Path
          S=requests.Session(); S.headers['User-Agent']='LUCIA-AA-R22528-C27-metadata-only/1.0'
          candidates=[
            {'repo':'uga-gaim/CLIPSeg-CloudSEN12Plus-LoRA','config_paths':['adapter_config.json']},
            {'repo':'msradam/TerraMind-NYC-Adapters','config_paths':['lulc_nyc/adapter_config.json','tim_nyc/adapter_config.json','buildings_nyc/adapter_config.json']},
            {'repo':'guimCC/segformer-v0-gta-cityscapes','config_paths':['adapter_config.json']},
          ]
          rows=[]
          for c in candidates:
            rid=c['repo']; m=S.get('https://huggingface.co/api/models/'+rid,params={'full':'true'},timeout=30); m.raise_for_status(); data=m.json()
            sib={x.get('rfilename'):x for x in data.get('siblings',[]) if x.get('rfilename')}
            cfgs={}
            for rel in c['config_paths']:
              r=S.get(f'https://huggingface.co/{rid}/resolve/{data["sha"]}/{rel}',timeout=30)
              if r.ok:
                try: cfgs[rel]=r.json()
                except Exception: cfgs[rel]={'_text':r.text[:4000]}
            rr=S.get(f'https://huggingface.co/{rid}/raw/{data["sha"]}/README.md',timeout=30)
            readme=rr.text[:16000] if rr.ok else ''
            files=[]
            for rel,x in sorted(sib.items()):
              if rel.endswith(('.safetensors','.bin','.pt','.pth','.pkl','.pickle')) or rel.endswith('adapter_config.json'):
                files.append({'path':rel,'size':x.get('size'),'lfs':x.get('lfs')})
            license_=(data.get('cardData') or {}).get('license') or next((t.split(':',1)[1] for t in data.get('tags',[]) if t.startswith('license:')),None)
            rows.append({'repo':rid,'sha':data.get('sha'),'lastModified':data.get('lastModified'),'pipeline_tag':data.get('pipeline_tag'),'library_name':data.get('library_name'),'license':license_,'tags':data.get('tags',[]),'configs':cfgs,'relevant_files':files,'readme_excerpt':readme})
          Path('r22528_c27_metadata.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          for x in rows:
            print('\n###',x['repo'],x['sha'],x['license'])
            print('configs',json.dumps(x['configs'],ensure_ascii=False,sort_keys=True)[:3000])
            print('files',json.dumps(x['relevant_files'],sort_keys=True)[:3000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R22528_C27_METADATA_ONLY
          path: r22528_c27_metadata.json
          compression-level: 0
          retention-days: 1
      - name: Publish run receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          body={'body':f"R22528_C27_METADATA_RUN_ID={os.environ['RUN_ID']}"}
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments",data=json.dumps(body).encode(),headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          print(urllib.request.urlopen(req,timeout=30).read().decode())
          PY
