name: R22568 C52 Premodel Seal
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  preseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency closure without model weights
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'torch==2.8.0' 'transformers==4.56.2' 'peft==0.17.1' 'safetensors==0.6.2'
          python - <<'PY'
          import json, datetime, re, torch, transformers, peft, safetensors
          print({"torch":torch.__version__,"transformers":transformers.__version__,"peft":peft.__version__,"safetensors":safetensors.__version__})
          PY
      - name: Build and independently verify output-free calendar suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r22568_preseal
          python - <<'PY'
          import json, hashlib, pathlib, sys
          sys.path.insert(0,'.')
          from r22568.c52_contract import generate_suite, verifier_a, verifier_b, suite_digest, contract_digest, THRESHOLDS
          cases=generate_suite()
          # verifier self-tests use target-rendered JSON only; no model output exists.
          for c in cases:
              txt=json.dumps(c['target'],ensure_ascii=False)
              a=verifier_a(txt,c['target']); b=verifier_b(txt,c['target'])
              assert a['json_valid'] and a['exact'] and a['field_exact']==1.0
              assert b['schema'] and b['typed_semantic']==1.0 and b['negative_clean']
          out=pathlib.Path('r22568_preseal')
          with (out/'R22568_C52_SUITE.jsonl').open('w') as f:
              for c in cases: f.write(json.dumps(c,ensure_ascii=False,sort_keys=True)+'\n')
          script=pathlib.Path('r22568/c52_contract.py')
          receipt={
            'schema':'R22568_C52_PREOUTPUT_SEAL_V1',
            'candidate':'waliaMuskaan011/calendar-event-extractor-smollm',
            'adapter_revision':'08d0bd53801b5bf035b44ff4ae084c94a51126ee',
            'runtime_reference_base':'HuggingFaceTB/SmolLM-360M',
            'runtime_reference_base_revision':'59f7ef243ee09a72cbc14cb054393a3e3b771d41',
            'training_time_base_revision_proven':False,
            'model_weight_bytes_present':0,
            'model_outputs_observed':0,
            'suite_n':len(cases),
            'suite_sha256':suite_digest(cases),
            'contract_sha256':contract_digest(),
            'contract_script_sha256':hashlib.sha256(script.read_bytes()).hexdigest(),
            'thresholds':THRESHOLDS,
            'splits':{s:sum(c['split']==s for c in cases) for s in sorted({c['split'] for c in cases})},
            'verifier_a_selftest':'PASS_384_OF_384',
            'verifier_b_selftest':'PASS_384_OF_384',
            'positive_and_failure_lanes_precommitted':True,
            'planned_conditions':['BASE','FULL','RANDOM_SIGN','LAYER_SHUFFLE','DOSE_0.25','DOSE_0.5','DOSE_1.5'],
            'planned_generation_conditions':['BASE','FULL','RANDOM_SIGN','LAYER_SHUFFLE'],
            'planned_causal_if_admitted':['q_proj','k_proj','v_proj','o_proj','gate_proj','up_proj','down_proj','early_band','middle_band','late_band','matched_random'],
            'claim_ceiling_without_independent_worker':'E3_BROAD_LOCALIZATION_ONLY',
          }
          (out/'R22568_C52_PREOUTPUT_SEAL.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt,indent=2))
          PY
      - name: Assert no model-weight source consumed
        shell: bash
        run: |
          set -euo pipefail
          test ! -e adapter_model.safetensors
          test ! -e model.safetensors
          find . -maxdepth 3 -type f \( -name '*.safetensors' -o -name '*.bin' -o -name '*.pt' -o -name '*.pth' \) -print -quit | grep -q . && exit 1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: r22568-c52-preseal
          path: r22568_preseal/
          retention-days: 1
          if-no-files-found: error
