name: R22528 C27 metadata-only probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Query Hugging Face metadata only
        run: |
          python -m pip install 'requests==2.32.5'
          cat > /tmp/probe.py <<'PY'
          import json, requests, hashlib
          from pathlib import Path
          S=requests.Session(); S.headers['User-Agent']='LUCIA-AA-R22528-C27-metadata/1.0'
          candidates=[
            ('clipseg','uga-gaim/CLIPSeg-CloudSEN12Plus-LoRA','adapter_config.json'),
            ('terramind','msradam/TerraMind-NYC-Adapters','lulc_nyc/adapter_config.json'),
            ('segformer_gta','guimCC/segformer-v0-gta-cityscapes','adapter_config.json'),
            ('segformer_ade','KYLE11111111/segformer-b0-scene-parse-150-lora','adapter_config.json'),
          ]
          def get_json(url):
            r=S.get(url,timeout=30); r.raise_for_status(); return r.json()
          def get_text(url):
            r=S.get(url,timeout=30); r.raise_for_status(); return r.text
          out=[]
          for key,repo,cfgpath in candidates:
            row={'key':key,'repo':repo}
            try:
              info=get_json('https://huggingface.co/api/models/'+repo)
              row['sha']=info.get('sha'); row['lastModified']=info.get('lastModified'); row['pipeline_tag']=info.get('pipeline_tag'); row['library_name']=info.get('library_name')
              tags=info.get('tags') or []; card=info.get('cardData') or {}
              row['license']=card.get('license') or next((x.split(':',1)[1] for x in tags if x.startswith('license:')),None)
              sib=[]
              for x in info.get('siblings') or []:
                ent={'name':x.get('rfilename')}
                if x.get('size') is not None: ent['size']=x.get('size')
                if x.get('lfs'): ent['lfs']=x.get('lfs')
                sib.append(ent)
              row['siblings']=sib
              sha=row['sha'] or 'main'
              try: row['adapter_config']=get_json(f'https://huggingface.co/{repo}/resolve/{sha}/{cfgpath}')
              except Exception as e: row['adapter_config_error']=repr(e)
              try:
                readme=get_text(f'https://huggingface.co/{repo}/raw/{sha}/README.md')
                row['readme_sha256']=hashlib.sha256(readme.encode()).hexdigest(); row['readme_excerpt']=readme[:8000]
              except Exception as e: row['readme_error']=repr(e)
            except Exception as e: row['error']=repr(e)
            out.append(row)
          # Resolve candidate bases from configs and known TerraMind base.
          bases=set(['CIDAS/clipseg-rd64-refined','ibm-esa-geospatial/TerraMind-1.0-base'])
          for row in out:
            cfg=row.get('adapter_config') or {}
            b=cfg.get('base_model_name_or_path')
            if isinstance(b,str) and '/' in b: bases.add(b)
          base_rows=[]
          for repo in sorted(bases):
            try:
              info=get_json('https://huggingface.co/api/models/'+repo)
              card=info.get('cardData') or {}; tags=info.get('tags') or []
              base_rows.append({'repo':repo,'sha':info.get('sha'),'license':card.get('license') or next((x.split(':',1)[1] for x in tags if x.startswith('license:')),None),'siblings':[{'name':x.get('rfilename'),'size':x.get('size'),'lfs':x.get('lfs')} for x in (info.get('siblings') or [])]})
            except Exception as e: base_rows.append({'repo':repo,'error':repr(e)})
          result={'schema':'R22528_C27_METADATA_PROBE_V1','raw_weight_bytes_downloaded':0,'model_outputs_observed':0,'candidates':out,'bases':base_rows}
          Path('r22528_c27_metadata_probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps({'candidate_count':len(out),'base_count':len(base_rows),'sha256':hashlib.sha256(Path('r22528_c27_metadata_probe.json').read_bytes()).hexdigest()},indent=2))
          PY
          python /tmp/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: R22528_C27_METADATA_PROBE
          path: r22528_c27_metadata_probe.json
          compression-level: 0
          retention-days: 1
      - name: Publish run receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          body={'body':f"R22528_C27_METADATA_RUN_ID={os.environ['RUN_ID']}"}
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments",data=json.dumps(body).encode(),headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          print(urllib.request.urlopen(req,timeout=30).read().decode())
          PY
