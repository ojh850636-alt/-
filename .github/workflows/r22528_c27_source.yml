name: R22528 C27 exact-source courier

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Capture pinned safetensors source
        env: {HF_HUB_DISABLE_TELEMETRY: '1'}
        run: |
          python -m pip install 'huggingface_hub==1.4.1' 'safetensors==0.7.0' 'numpy==2.3.5'
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          from huggingface_hub import snapshot_download,HfApi
          from safetensors import safe_open
          root=Path('bundle'); a=root/'adapter'; b=root/'base'; a.mkdir(parents=True); b.mkdir(parents=True)
          ar='uga-gaim/CLIPSeg-CloudSEN12Plus-LoRA'; av='1001cdf50bf934d8d605c08cf91d28899087fa69'
          br='CIDAS/clipseg-rd64-refined'; bv=HfApi().model_info(br).sha
          aa=['README.md','adapter_config.json','adapter_model.safetensors','preprocessor_config.json','processor_config.json','tokenizer.json','tokenizer_config.json','special_tokens_map.json','merges.txt','vocab.json']
          ba=['README.md','config.json','model.safetensors','preprocessor_config.json','processor_config.json','tokenizer.json','tokenizer_config.json','special_tokens_map.json','merges.txt','vocab.json']
          banned=['*.bin','*.pt','*.pth','*.pkl','*.pickle','*.h5','*.msgpack','*.ckpt','*.py','*.ipynb','onnx/**']
          ac=snapshot_download(repo_id=ar,revision=av,allow_patterns=aa,ignore_patterns=banned)
          bc=snapshot_download(repo_id=br,revision=bv,allow_patterns=ba,ignore_patterns=banned)
          def cp(src,dst,names):
            out=[]
            for rel in names:
              p=Path(src)/rel
              if p.is_file():
                q=dst/rel; q.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,q); out.append(rel)
            return out
          ca=cp(ac,a,aa); cb=cp(bc,b,ba)
          bads={'.bin','.pt','.pth','.pkl','.pickle','.h5','.msgpack','.ckpt','.py','.ipynb'}
          bad=[str(p) for p in root.rglob('*') if p.is_file() and p.suffix.lower() in bads]
          if bad: raise SystemExit(f'banned files captured: {bad}')
          def sha(p):
            h=hashlib.sha256()
            with open(p,'rb') as f:
              for x in iter(lambda:f.read(1048576),b''): h.update(x)
            return h.hexdigest()
          def tensors(p):
            rows=[]
            with safe_open(p,framework='numpy') as f:
              for k in f.keys():
                s=f.get_slice(k); rows.append({'key':k,'shape':[int(x) for x in s.get_shape()],'dtype':str(s.get_dtype())})
            return {'tensor_count':len(rows),'key_shapes':rows,'keys_sha256':hashlib.sha256(json.dumps(rows,sort_keys=True).encode()).hexdigest()}
          aw=a/'adapter_model.safetensors'; bw=b/'model.safetensors'
          if not aw.is_file() or not bw.is_file(): raise SystemExit('required safetensors missing')
          files=[]
          for p in sorted(root.rglob('*')):
            if p.is_file(): files.append({'path':p.relative_to(root).as_posix(),'size':p.stat().st_size,'sha256':sha(p)})
          cfg=json.loads((a/'adapter_config.json').read_text())
          if cfg.get('base_model_name_or_path')!=br or cfg.get('peft_type')!='LORA' or cfg.get('r')!=32 or cfg.get('lora_alpha')!=64 or cfg.get('modules_to_save') not in (None,[]): raise SystemExit(f'adapter config mismatch {cfg}')
          report={'schema':'R22528_C27_EXACT_SOURCE_CAPTURE_V1','adapter':{'repo':ar,'revision':av,'size':aw.stat().st_size,'sha256':sha(aw),'copied':ca,'tensor_summary':tensors(aw)},'base':{'repo':br,'revision':bv,'size':bw.stat().st_size,'sha256':sha(bw),'copied':cb,'training_time_revision_proven':False},'adapter_config':cfg,'files':files,'trust_remote_code':False,'pickle_loaded':False,'banned_file_count':0}
          (root/'CAPTURE_MANIFEST.json').write_text(json.dumps(report,indent=2,sort_keys=True))
          print(json.dumps({'adapter_bytes':aw.stat().st_size,'adapter_sha256':sha(aw),'base_revision':bv,'base_bytes':bw.stat().st_size,'base_sha256':sha(bw)},indent=2))
          PY
          mkdir -p parts/meta parts/adapter parts/base
          cp bundle/CAPTURE_MANIFEST.json parts/meta/
          find bundle/adapter -type f ! -name adapter_model.safetensors -exec cp --parents '{}' parts/meta/ \;
          find bundle/base -type f ! -name model.safetensors -exec cp --parents '{}' parts/meta/ \;
          cp bundle/adapter/adapter_model.safetensors parts/adapter/
          split -b 180M -d -a 2 bundle/base/model.safetensors parts/base/base.part.
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          rows=[]
          for p in sorted(Path('parts/base').glob('base.part.*')): rows.append({'name':p.name,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          Path('parts/base/PARTS_MANIFEST.json').write_text(json.dumps(rows,indent=2,sort_keys=True))
          print(rows)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: R22528_C27_META, path: parts/meta, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22528_C27_ADAPTER, path: parts/adapter, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22528_C27_BASE_00, path: parts/base/base.part.00, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22528_C27_BASE_01, path: parts/base/base.part.01, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22528_C27_BASE_02, path: parts/base/base.part.02, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22528_C27_BASE_03, path: parts/base/base.part.03, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22528_C27_BASE_MANIFEST, path: parts/base/PARTS_MANIFEST.json, compression-level: 0, retention-days: 1}
      - name: Publish run receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          body={'body':f"R22528_C27_SOURCE_RUN_ID={os.environ['RUN_ID']}"}
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments",data=json.dumps(body).encode(),headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          print(urllib.request.urlopen(req,timeout=30).read().decode())
          PY

  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Download runtime overlay without torch
        run: |
          mkdir -p wheels
          python -m pip download --dest wheels --only-binary=:all: --no-deps \
            'transformers==5.0.0' 'peft==0.18.1' 'accelerate==1.14.0' \
            'tokenizers==0.22.2' 'safetensors==0.7.0' 'huggingface_hub==1.4.1' \
            'pillow==12.1.0' 'numpy==2.3.5' 'packaging==26.3' 'pyyaml==6.0.3' \
            'regex==2026.7.19' 'requests==2.32.5' 'tqdm==4.70.0' 'filelock==3.32.2' \
            'fsspec==2026.7.0' 'typing_extensions==4.16.0' 'jinja2==3.1.6' \
            'protobuf==6.33.5' 'charset_normalizer==3.4.4' 'idna==3.18' \
            'urllib3==2.6.3' 'certifi==2026.7.22' 'markupsafe==3.0.3' 'psutil==7.0.0'
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          rows=[{'name':p.name,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(Path('wheels').glob('*'))]
          Path('wheels/WHEEL_MANIFEST.json').write_text(json.dumps(rows,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: R22528_C27_WHEELS, path: wheels, compression-level: 0, retention-days: 1}
