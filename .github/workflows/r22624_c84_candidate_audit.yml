name: R22624 C84 focused metadata-only candidate audit
on:
  push:
    branches: [r22624-c84-cpu]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit four new CPU fingerprints without learned-weight GET
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p meta
          python - <<'PY'
          import json, urllib.request, pathlib, hashlib, re
          candidates=[
            {
              'repo':'Zayed024/nanozero-countdown-lora',
              'fingerprint':'COUNTDOWN_EXACT_USE_ARITHMETIC_EXPRESSION_SYNTHESIS_AND_EXECUTION',
              'role':'SELECTED_IF_METADATA_GREEN'
            },
            {
              'repo':'sammoftah/underdog-lab-smollm2-360m-lora',
              'fingerprint':'EVIDENCE_SPAN_GROUNDED_STRUCTURED_FACTOR_EXTRACTION_WITH_ABSTENTION_AND_CALIBRATION',
              'role':'ALTERNATE'
            },
            {
              'repo':'AmirMohseni/qwen2.5-0.5b-gsm8k-cipher-lora-sft-v1',
              'fingerprint':'CIPHERED_ARITHMETIC_REASONING_COMPOSITION',
              'role':'ALTERNATE'
            },
            {
              'repo':'eternis/SmolLM2-135M-lora-anonymizer',
              'fingerprint':'SELECTIVE_INFORMATION_REDACTION_WITH_MINIMAL_NONPII_EDIT',
              'role':'ALTERNATE_DEDUP_RISK'
            },
          ]
          UA={'User-Agent':'LAA-R22624-metadata-only'}
          def get_json(url, timeout=45):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r: return json.load(r)
          def get_small(url, timeout=45, limit=65536):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r: return r.read(limit).decode('utf-8','replace')
          def head(url, timeout=45):
              req=urllib.request.Request(url,headers=UA,method='HEAD')
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return {k.lower():v for k,v in r.headers.items()}
          rows=[]
          for spec in candidates:
              repo=spec['repo']
              api=get_json('https://huggingface.co/api/models/'+repo+'?full=true&config=true')
              rev=api.get('sha')
              sib=[s.get('rfilename') for s in api.get('siblings',[]) if s.get('rfilename')]
              cfg=json.loads(get_small(f'https://huggingface.co/{repo}/resolve/{rev}/adapter_config.json?download=true')) if 'adapter_config.json' in sib else None
              try: readme=get_small(f'https://huggingface.co/{repo}/resolve/{rev}/README.md?download=true',limit=32768)
              except Exception: readme=''
              tags=api.get('tags') or []
              lic_tags=[t.split(':',1)[1] for t in tags if t.startswith('license:')]
              front='\n'.join(readme.splitlines()[:40]).lower()
              lic_readme=[]
              for m in re.finditer(r'(?im)^license:\s*([^\n]+)',readme): lic_readme.append(m.group(1).strip())
              adapter_head={}
              if 'adapter_model.safetensors' in sib:
                  try: adapter_head=head(f'https://huggingface.co/{repo}/resolve/{rev}/adapter_model.safetensors?download=true')
                  except Exception as e: adapter_head={'error':repr(e)}
              row={**spec,
                'revision':rev,'private':api.get('private'),'gated':api.get('gated'),'disabled':api.get('disabled'),
                'library_name':api.get('library_name'),'pipeline_tag':api.get('pipeline_tag'),'tags':tags,
                'siblings':sib,'adapter_config':cfg,'license_tags':lic_tags,'license_readme':lic_readme,
                'readme_prefix':readme,'adapter_weight_head':{
                  k:adapter_head.get(k) for k in ['content-length','etag','x-repo-commit','x-linked-etag','x-linked-size','location'] if adapter_head.get(k)
                },
                'weight_body_bytes_requested':0,
              }
              row['has_peft_safetensors']=('adapter_model.safetensors' in sib and 'adapter_config.json' in sib and bool(cfg))
              row['training_base_revision_proven']=bool((cfg or {}).get('revision'))
              rows.append(row)
          # Selection is frozen from pre-output criteria, not model outputs.
          selected='Zayed024/nanozero-countdown-lora'
          sel=next(x for x in rows if x['repo']==selected)
          base_repo=(sel.get('adapter_config') or {}).get('base_model_name_or_path')
          base_api=get_json('https://huggingface.co/api/models/'+base_repo+'?full=true&config=true') if base_repo else None
          payload={
            'schema':'R22624_C84_FOCUSED_CANDIDATE_AUDIT_V1',
            'learned_weight_body_bytes_requested':0,
            'candidate_count':len(rows),
            'candidates':rows,
            'selected':selected,
            'selected_fingerprint':sel['fingerprint'],
            'selection_reason':'Novel exact-use arithmetic program synthesis with deterministic parser/evaluator; Apache-2.0 public card; PEFT safetensors; 0.5B CPU feasible; executable verifier stronger than likelihood-only.',
            'selected_base_api':{'repo':base_repo,'sha':(base_api or {}).get('sha'),'tags':(base_api or {}).get('tags',[]),'siblings':[s.get('rfilename') for s in (base_api or {}).get('siblings',[]) if s.get('rfilename')]},
            'hard_holds':['TRAINING_BASE_REVISION_UNPROVEN_IF_ADAPTER_CONFIG_REVISION_NULL','NO_CAUSAL_WITHOUT_EXECUTABLE_CONTROL_SEPARATION','PUBLIC_MODEL_CARD_SCORE_ZERO_SCIENCE_CREDIT'],
          }
          p=pathlib.Path('meta/C84_CANDIDATE_AUDIT.json')
          p.write_text(json.dumps(payload,indent=2,sort_keys=True,ensure_ascii=False)+'\n',encoding='utf-8')
          pathlib.Path('meta/C84_CANDIDATE_AUDIT.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  C84_CANDIDATE_AUDIT.json\n')
          print('SELECTED',selected,'REV',sel['revision'],'BASE',base_repo,(base_api or {}).get('sha'))
          print('BODY_WEIGHT_BYTES_REQUESTED 0')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22624-c84-focused-metadata
          path: meta
          retention-days: 1
          compression-level: 0
