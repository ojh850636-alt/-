name: R22572 C56 Transaction Parser Metadata Audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - name: Audit txn-parser candidates without model weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, urllib.request, urllib.parse, pathlib, hashlib, re
          repo='kartikey31/txn-parser'
          variants=[
            {'name':'gemma3_270m','sub':'gemma-3-270m/adapters'},
            {'name':'smollm2_360m','sub':'smollm2-360m/adapters'},
            {'name':'qwen3_0p6b','sub':'qwen3-0.6b/adapters'},
          ]
          comparator='gagan1985/qwen3-0.6b-indian-address-parser'
          def jget(url):
              req=urllib.request.Request(url,headers={'User-Agent':'LAA-R22572-txn-meta/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          def tget(repo,sha,path,limit=80000):
              req=urllib.request.Request(f'https://huggingface.co/{repo}/resolve/{sha}/{path}',headers={'User-Agent':'LAA-R22572-txn-meta/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:return r.read(limit+1).decode('utf-8','replace')[:limit]
              except Exception:return None
          def audit_base(base):
              try:
                  m=jget('https://huggingface.co/api/models/'+urllib.parse.quote(base,safe='/')+'?blobs=true')
                  card=m.get('cardData') or {}; files=[]
                  for x in m.get('siblings') or []:
                      l=x.get('lfs') or {}; files.append({'name':x.get('rfilename'),'size':x.get('size') or l.get('size'),'lfs_sha256':l.get('sha256')})
                  return {'repo':base,'exact_revision':m.get('sha'),'license':card.get('license') or m.get('license'),'safe_weight_files':[f for f in files if (f.get('name') or '').endswith('.safetensors')],'pickle_risk_files':[f for f in files if re.search(r'\.(bin|pt|pth|pkl|pickle)$',f.get('name') or '',re.I)],'files':files}
              except Exception as e:return {'repo':base,'error':repr(e)}
          m=jget('https://huggingface.co/api/models/'+urllib.parse.quote(repo,safe='/')+'?blobs=true')
          sha=m.get('sha'); card=m.get('cardData') or {}; siblings=m.get('siblings') or []
          fmap={x.get('rfilename'):x for x in siblings}
          records=[]
          for v in variants:
              cfgpath=v['sub']+'/adapter_config.json'; wpath=v['sub']+'/adapter_model.safetensors'
              cfgtext=tget(repo,sha,cfgpath,50000)
              try:cfg=json.loads(cfgtext) if cfgtext else None
              except Exception:cfg={'_parse_error':True,'sha256':hashlib.sha256((cfgtext or '').encode()).hexdigest()}
              x=fmap.get(wpath) or {}; lfs=x.get('lfs') or {}
              base=(cfg or {}).get('base_model_name_or_path') if isinstance(cfg,dict) else None
              records.append({'name':v['name'],'repo':repo,'subfolder':v['sub'],'repo_revision':sha,'repo_license':card.get('license') or m.get('license'),'adapter_config':cfg,'adapter_weight':{'path':wpath,'size':x.get('size') or lfs.get('size'),'lfs_sha256':lfs.get('sha256')},'base':audit_base(base) if base else None})
          # comparator metadata only
          try:
              cm=jget('https://huggingface.co/api/models/'+urllib.parse.quote(comparator,safe='/')+'?blobs=true'); csha=cm.get('sha'); ccard=cm.get('cardData') or {}; cs=cm.get('siblings') or []
              cfiles=[]
              for x in cs:
                  l=x.get('lfs') or {};cfiles.append({'name':x.get('rfilename'),'size':x.get('size') or l.get('size'),'lfs_sha256':l.get('sha256')})
              ctext=tget(comparator,csha,'adapter_config.json',50000)
              try:ccfg=json.loads(ctext) if ctext else None
              except Exception:ccfg=None
              comparator_rec={'repo':comparator,'exact_revision':csha,'license':ccard.get('license') or cm.get('license'),'adapter_config':ccfg,'files':cfiles}
          except Exception as e: comparator_rec={'repo':comparator,'error':repr(e)}
          readme=tget(repo,sha,'README.md',100000)
          out={'schema':'R22572_C56_TXN_METADATA_AUDIT_V2','weight_bytes_downloaded':0,'model_outputs_observed':0,'repo':repo,'repo_revision':sha,'repo_license':card.get('license') or m.get('license'),'readme_sha256':hashlib.sha256((readme or '').encode()).hexdigest() if readme is not None else None,'readme':readme,'variants':records,'comparator':comparator_rec}
          p=pathlib.Path('out/R22572_C56_TXN_METADATA_AUDIT_V2.json');p.write_text(json.dumps(out,ensure_ascii=False,indent=2))
          pathlib.Path('out/SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          print(json.dumps([{'name':r['name'],'base':(r['adapter_config'] or {}).get('base_model_name_or_path'),'base_rev':(r['base'] or {}).get('exact_revision'),'base_license':(r['base'] or {}).get('license'),'adapter_size':r['adapter_weight']['size']} for r in records],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22572-c56-txn-meta-v2
          path: out/
          retention-days: 1
          if-no-files-found: error
