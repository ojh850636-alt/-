name: R22572 C56 Query Rewrite Metadata Audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - name: Audit four C56 candidates without model weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,re,urllib.request,urllib.parse,pathlib,hashlib
          repos=[
            'PeytonT/query-rewriter',
            'ibm-granite/granite-3.2-8b-lora-rag-query-rewrite',
            'caraman/Qwen2.5-7B-query-rewriter-lora',
            'Quazim0t0/Escarda-Rewrite',
          ]
          def jget(u):
            req=urllib.request.Request(u,headers={'User-Agent':'LAA-R22572-meta/1.0'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          def tget(repo,sha,path,limit=100000):
            req=urllib.request.Request(f'https://huggingface.co/{repo}/resolve/{sha}/{path}',headers={'User-Agent':'LAA-R22572-meta/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:return r.read(limit+1).decode('utf-8','replace')[:limit]
            except Exception:return None
          recs=[]
          for repo in repos:
            try:
              m=jget('https://huggingface.co/api/models/'+urllib.parse.quote(repo,safe='/')+'?blobs=true')
              sha=m.get('sha');card=m.get('cardData') or {}; sib=m.get('siblings') or []
              files=[]
              for x in sib:
                lfs=x.get('lfs') or {}; files.append({'name':x.get('rfilename'),'size':x.get('size') or lfs.get('size'),'lfs_sha256':lfs.get('sha256')})
              names={f['name'] for f in files}; cfg=None
              if 'adapter_config.json' in names:
                s=tget(repo,sha,'adapter_config.json',50000)
                try:cfg=json.loads(s) if s else None
                except Exception:cfg={'_parse_error':True,'sha256':hashlib.sha256((s or '').encode()).hexdigest()}
              readme=tget(repo,sha,'README.md') if 'README.md' in names else None
              license_docs={}
              for p in ['LICENSE','LICENSE.txt','LICENSE.md','COPYING']:
                if p in names:
                  s=tget(repo,sha,p,50000);license_docs[p]={'sha256':hashlib.sha256((s or '').encode()).hexdigest(),'text':s}
              recs.append({'repo':repo,'exact_revision':sha,'card_license':card.get('license') or m.get('license'),'base_model_card':card.get('base_model'),'pipeline_tag':m.get('pipeline_tag'),'library_name':m.get('library_name'),'adapter_config':cfg,'files':files,'license_docs':license_docs,'readme':readme,'readme_sha256':hashlib.sha256((readme or '').encode()).hexdigest() if readme is not None else None,'safe_weight_files':[f for f in files if (f['name'] or '').endswith('.safetensors')],'pickle_risk_files':[f for f in files if re.search(r'\.(bin|pt|pth|pkl|pickle)$',f['name'] or '',re.I)]})
            except Exception as e: recs.append({'repo':repo,'error':repr(e)})
          out={'schema':'R22572_C56_QUERY_REWRITE_METADATA_AUDIT_V1','weight_bytes_downloaded':0,'model_outputs_observed':0,'candidates':recs}
          p=pathlib.Path('out/R22572_C56_QUERY_REWRITE_METADATA_AUDIT.json');p.write_text(json.dumps(out,ensure_ascii=False,indent=2))
          pathlib.Path('out/SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          print(json.dumps([{k:r.get(k) for k in ['repo','exact_revision','card_license','base_model_card']} for r in recs],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22572-c56-query-rewrite-meta
          path: out/
          retention-days: 1
          if-no-files-found: error
