name: R22588 C69 Nix version-family one-shot
on:
  pull_request:
    types: [opened]
    branches: [main]
permissions:
  contents: read
jobs:
  archaeology:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact Git blob and dependency before source
        run: |
          set -euo pipefail
          test "$(git hash-object .github/r22588/c69_nix_family_runner.py)" = "b0c21ce1756eba129a8c3c16d3eaf2a43cba325c"
          python -m py_compile .github/r22588/c69_nix_family_runner.py
          python -m pip install --disable-pip-version-check 'numpy==2.3.5'
          python - <<'PY'
          import numpy as np
          a=np.array([[1.,2.],[3.,4.]])
          assert np.linalg.matrix_rank(a)==2 and np.isfinite(a).all()
          print('PRE_SOURCE_DEPENDENCY_PASS')
          PY
      - name: One-use family archaeology
        run: |
          set -euo pipefail
          python .github/r22588/c69_nix_family_runner.py
      - name: Upload raw-free evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r22588-c69-nix-version-family-rawfree
          path: work/out/
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
