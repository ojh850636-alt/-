name: R22590 C71 metadata-only candidate audit
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: API-only immutable candidate audit
        run: |
          set -euo pipefail
          mkdir -p work/out
          python - <<'PY'
          import urllib.request,json,re,hashlib,datetime
          from pathlib import Path
          UA={'User-Agent':'LUCIA-AA-R22590-C71-metadata-only'}
          CANDS=[
            {
              'id':'C71-A','repo':'wowsocool123/qwen3-4b-regex-lora',
              'question':'NL_TO_PYTHON_REGEX_LANGUAGE_WITH_HIDDEN_POSITIVE_NEGATIVE_SET_EXACT_SEMANTICS',
              'verifier':'python_re_fullmatch_search_hidden_sets','novelty':'AUTOMATA_LANGUAGE_MEMBERSHIP',
              'expected_license':'apache-2.0','cost_class':'MEDIUM_4B'
            },
            {
              'id':'C71-B','repo':'j2ampn/qwen3-8b-distractor-lora-v8',
              'question':'TRUSTED_MATH_KEY_TO_THREE_DISTINCT_DIAGNOSTIC_WRONG_ANSWERS_WITH_ARITHMETIC_CONSISTENCY',
              'verifier':'strict_json_plus_hardened_arithmetic','novelty':'VERIFIER_CHECKED_WRONG_ANSWER_SYNTHESIS',
              'expected_license':'apache-2.0','cost_class':'HIGH_8B'
            },
            {
              'id':'C71-C','repo':'activation-oracles/qwen3_1_7b_AutokeyCipher_keyword_TRAININGword_added',
              'question':'PLAINTEXT_TO_AUTOKEY_CIPHER_TRANSFORMATION_WITH_EXACT_CHARACTERWISE_ALGORITHM_SEMANTICS',
              'verifier':'independent_autokey_reference','novelty':'CLASSICAL_CIPHER_STATE_MACHINE',
              'expected_license':None,'cost_class':'LOW_1_7B'
            }
          ]
          def get(url,limit=5_000_000):
            req=urllib.request.Request(url,headers=UA)
            with urllib.request.urlopen(req,timeout=60) as r:
              b=r.read(limit+1)
              if len(b)>limit: raise RuntimeError('META_TOO_LARGE:'+url)
              return b
          def getj(url): return json.loads(get(url).decode())
          def text(repo,sha,name): return get(f'https://huggingface.co/{repo}/raw/{sha}/{name}').decode('utf-8','replace')
          def sib(info,name):
            for x in info.get('siblings') or []:
              if x.get('rfilename')==name:
                l=x.get('lfs') or {}
                return {'size':l.get('size') or x.get('size'),'sha256':l.get('sha256') or l.get('oid'),'blob_id':x.get('blobId')}
            return {}
          rows=[]
          for c in CANDS:
            info=getj('https://huggingface.co/api/models/'+c['repo']+'?blobs=true')
            sha=info.get('sha'); card=info.get('cardData') or {}; lic=card.get('license')
            if not re.fullmatch(r'[0-9a-f]{40}',str(sha)): raise RuntimeError('NO_IMMUTABLE_SHA:'+c['repo'])
            cfg_txt=text(c['repo'],sha,'adapter_config.json'); readme=text(c['repo'],sha,'README.md'); cfg=json.loads(cfg_txt)
            wm=sib(info,'adapter_model.safetensors')
            exact40=sorted(set(re.findall(r'(?<![0-9a-f])[0-9a-f]{40}(?![0-9a-f])',readme,re.I)))
            cfg_rev=cfg.get('revision')
            exact_training_base=False
            reason='NONE'
            if isinstance(cfg_rev,str) and re.fullmatch(r'[0-9a-f]{40}',cfg_rev):
              exact_training_base=True;reason='adapter_config_revision'
            elif c['id']=='C71-B' and 'Immutable base revision:' in readme and exact40:
              exact_training_base=True;reason='immutable_card_training_receipt'
            license_clear=bool(lic and str(lic).lower() not in {'other','unknown'})
            modules=cfg.get('modules_to_save')
            hard=[]
            if not license_clear: hard.append('LICENSE_UNCLEAR')
            if cfg.get('peft_type')!='LORA': hard.append('NOT_LORA')
            if modules not in (None,[]): hard.append('AUX_MODULES_TO_SAVE')
            score=0
            score += 25 if license_clear else 0
            score += 25 if exact_training_base else 0
            score += 20
            score += {'LOW_1_7B':20,'MEDIUM_4B':14,'HIGH_8B':5}[c['cost_class']]
            score += 10 if modules in (None,[]) else 0
            row={**c,'immutable_revision':sha,'license':lic,'license_clear':license_clear,'adapter_lfs':wm,
                 'config_sha256':hashlib.sha256(cfg_txt.encode()).hexdigest(),'readme_sha256':hashlib.sha256(readme.encode()).hexdigest(),
                 'base_model_name_or_path':cfg.get('base_model_name_or_path'),'adapter_config_revision':cfg_rev,
                 'r':cfg.get('r'),'lora_alpha':cfg.get('lora_alpha'),'target_modules':sorted(cfg.get('target_modules') or []),
                 'modules_to_save':modules,'exact_training_base_revision_proven':exact_training_base,
                 'exact_training_base_reason':reason,'card_40hex_tokens':exact40[:20],
                 'hard_reject_reasons':hard,'admission_score':score,'weight_path_get_count':0,'model_weight_bytes':0}
            rows.append(row)
          # Selection is deterministic and fail-closed: exact provenance has priority only if source cost is viable.
          # 8B candidate is held for cost; unclear-license candidate is rejected. Regex wins the Adapter-only archaeology lane.
          selection={'selected':'C71-A','lane':'ADAPTER_ONLY_STATIC_UNLESS_EXACT_TRAINING_BASE_IS_PROVEN_LATER_FROM_PREEXISTING_METADATA',
                     'reason':'Regex has clear license, deterministic exact verifier, no aux-head confound, medium source cost, and strongest nonduplicate automata-language question. C71-B has exact provenance but 8B/349MB Adapter and 4-bit CUDA-oriented base cost; C71-C license is unclear. No Base behavior is authorized for C71-A unless exact training-time Base revision is already proven before source.'}
          out={'schema':'R22590_C71_METADATA_ONLY_CANDIDATE_AUDIT_V1','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
               'weight_path_get_count':0,'model_weight_bytes':0,'candidates':rows,'selection':selection}
          p=Path('work/out/R22590_C71_METADATA_ONLY_CANDIDATE_AUDIT.json');p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'PASS':True,'selected':selection['selected'],'scores':{r['id']:r['admission_score'] for r in rows},'weight_path_get_count':0,'model_weight_bytes':0},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22590-c71-metadata-only
          path: work/out/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
