name: R22624 C84 metadata-only CPU candidate audit
on:
  push:
    branches: [r22624-c84-cpu-audit]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Task-first HF search then Base-filter
        shell: bash
        run: |
          set -euo pipefail
          rm -rf meta && mkdir -p meta
          python - <<'PY'
          import json, urllib.parse, urllib.request, pathlib, hashlib, time
          queries=['translation lora','grammar lora','date lora','unit conversion lora','entity extraction lora','intent lora','sentiment lora','summarization lora','question answering lora','regex lora','normalization lora','classification lora','code lora','structured extraction lora']
          seen={}
          def getjson(url,timeout=20):
              with urllib.request.urlopen(url,timeout=timeout) as r:return json.load(r)
          def getbytes(repo,rev,name,limit=180000):
              u=f'https://huggingface.co/{repo}/resolve/{rev}/{name}?download=true'
              with urllib.request.urlopen(u,timeout=25) as r:return r.read(limit)
          for q in queries:
              try: rows=getjson('https://huggingface.co/api/models?search='+urllib.parse.quote(q)+'&limit=100&full=true',40)
              except Exception: continue
              for d in rows:
                  rid=d.get('id') or d.get('modelId'); rev=d.get('sha')
                  if not rid or not rev: continue
                  sib=[s.get('rfilename') for s in d.get('siblings',[]) if s.get('rfilename')]
                  if 'adapter_model.safetensors' not in sib: continue
                  if rid in seen:
                      seen[rid]['matched_queries'].append(q); continue
                  try: cfg=json.loads(getbytes(rid,rev,'adapter_config.json').decode('utf-8','replace'))
                  except Exception: continue
                  base=str(cfg.get('base_model_name_or_path') or '')
                  if 'smollm2' not in base.lower(): continue
                  row={'repo':rid,'sha':rev,'pipeline_tag':d.get('pipeline_tag'),'library_name':d.get('library_name'),'tags':d.get('tags',[]) or [],'siblings':sib,'matched_queries':[q],'adapter_config':cfg}
                  try: row['readme']=getbytes(rid,rev,'README.md').decode('utf-8','replace')[:14000]
                  except Exception: row['readme']=None
                  seen[rid]=row
              time.sleep(0.1)
          rows=sorted(seen.values(),key=lambda x:(-len(x['matched_queries']),x['repo']))
          payload={'schema':'R22624_C84_TASKFIRST_BASEFILTER_V3','weight_bytes_requested':0,'query_count':len(queries),'candidate_count':len(rows),'candidates':rows}
          p=pathlib.Path('meta/CANDIDATE_SEARCH.json'); p.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          pathlib.Path('meta/CANDIDATE_SEARCH.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  CANDIDATE_SEARCH.json\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22624-c84-metadata-v3
          path: meta
          retention-days: 1
          compression-level: 0
