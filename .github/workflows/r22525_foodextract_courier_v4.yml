name: R22525 FoodExtract exact-source courier v4

on:
  push:
    branches: [agent/r22525-foodextract-courier]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Capture exact safetensors source
        env: {HF_HUB_DISABLE_TELEMETRY: '1', HF_HUB_ENABLE_HF_TRANSFER: '0'}
        run: |
          python -m pip install 'huggingface_hub==1.4.1' 'safetensors==0.7.0' 'numpy==2.3.5'
          cat > /tmp/capture.py <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          from huggingface_hub import snapshot_download
          from safetensors import safe_open
          root=Path('bundle');a=root/'adapter';b=root/'base'
          a.mkdir(parents=True);b.mkdir(parents=True)
          ar='berkeruveyik/smolvlm2-256m-FoodExtract-Vision-v1';av='9a1c701146c491b3379f00420123cb4c73899c96'
          br='HuggingFaceTB/SmolVLM2-256M-Video-Instruct';bv='067788b187b95ebe7b2e040b3e4299e342e5b8fd'
          aa=['README.md','adapter_config.json','adapter_model.safetensors','chat_template.jinja','processor_config.json','tokenizer.json','tokenizer_config.json']
          ba=['README.md','config.json','generation_config.json','preprocessor_config.json','processor_config.json','chat_template.json','added_tokens.json','merges.txt','special_tokens_map.json','tokenizer.json','tokenizer_config.json','vocab.json','model.safetensors']
          ignore=['*.bin','*.pt','*.pth','*.pkl','*.pickle','*.h5','*.msgpack','*.ckpt','*.py','*.ipynb','onnx/**']
          ac=snapshot_download(repo_id=ar,revision=av,allow_patterns=aa,ignore_patterns=ignore)
          bc=snapshot_download(repo_id=br,revision=bv,allow_patterns=ba,ignore_patterns=ignore)
          def copy(src,dst,names):
            out=[]
            for rel in names:
              s=Path(src)/rel
              if s.is_file():
                d=dst/rel;d.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(s,d);out.append(rel)
            return out
          ca=copy(ac,a,aa);cb=copy(bc,b,ba)
          def sha(p):
            h=hashlib.sha256()
            with open(p,'rb') as f:
              for x in iter(lambda:f.read(1024*1024),b''):h.update(x)
            return h.hexdigest()
          def summary(p):
            rows=[]
            with safe_open(p,framework='numpy') as f:
              for k in f.keys():
                s=f.get_slice(k);rows.append({'key':k,'shape':[int(x) for x in s.get_shape()],'dtype':str(s.get_dtype())})
            return {'tensor_count':len(rows),'keys_sha256':hashlib.sha256(json.dumps(rows,sort_keys=True).encode()).hexdigest(),'key_shapes':rows}
          aw=a/'adapter_model.safetensors';bw=b/'model.safetensors'
          if (aw.stat().st_size,sha(aw))!=(144601352,'7b2021910204f3b339a4876a22385d125bb1b7db1614a8888b43f006044ed3a6'):raise SystemExit('adapter mismatch')
          if (bw.stat().st_size,sha(bw))!=(1025998224,'dcc8f4c00d30d70bb3028a1bfc373e1b1972e25919f8788183cae4ae72431ce2'):raise SystemExit('base mismatch')
          banned={'.bin','.pt','.pth','.pkl','.pickle','.h5','.msgpack','.ckpt','.py','.ipynb'}
          if [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in banned]:raise SystemExit('banned file')
          files=[{'path':p.relative_to(root).as_posix(),'size':p.stat().st_size,'sha256':sha(p)} for p in sorted(root.rglob('*')) if p.is_file()]
          obj={'schema':'R22525_EXACT_SOURCE_CAPTURE_V4','adapter':{'repo':ar,'revision':av,'copied':ca},'base':{'repo':br,'revision':bv,'copied':cb,'training_time_revision_proven':False},'files':files,'adapter_tensor_summary':summary(aw),'base_tensor_summary':summary(bw),'trust_remote_code':False,'pickle_loaded':False,'banned_file_count':0}
          (root/'CAPTURE_MANIFEST.json').write_text(json.dumps(obj,indent=2,sort_keys=True))
          PY
          python /tmp/capture.py
          mkdir -p parts/meta parts/adapter parts/base
          cp bundle/CAPTURE_MANIFEST.json parts/meta/
          find bundle/adapter -type f ! -name adapter_model.safetensors -exec cp --parents '{}' parts/meta/ \;
          find bundle/base -type f ! -name model.safetensors -exec cp --parents '{}' parts/meta/ \;
          cp bundle/adapter/adapter_model.safetensors parts/adapter/
          split -b 180M -d -a 2 bundle/base/model.safetensors parts/base/base.part.
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          rows=[{'name':p.name,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(Path('parts/base').glob('base.part.*'))]
          assert len(rows)==6,rows
          Path('parts/base/PARTS_MANIFEST.json').write_text(json.dumps(rows,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: R22525_V4_META, path: parts/meta, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22525_V4_ADAPTER, path: parts/adapter, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22525_V4_BASE_00, path: parts/base/base.part.00, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22525_V4_BASE_01, path: parts/base/base.part.01, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22525_V4_BASE_02, path: parts/base/base.part.02, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22525_V4_BASE_03, path: parts/base/base.part.03, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22525_V4_BASE_04, path: parts/base/base.part.04, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22525_V4_BASE_05, path: parts/base/base.part.05, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22525_V4_BASE_MANIFEST, path: parts/base/PARTS_MANIFEST.json, compression-level: 0, retention-days: 1}

  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Download exact runtime overlay without torch
        run: |
          mkdir wheels
          python -m pip download --dest wheels --only-binary=:all: --no-deps \
            'transformers==5.0.0' 'peft==0.18.1' 'accelerate==1.14.0' \
            'tokenizers==0.22.2' 'safetensors==0.7.0' 'huggingface_hub==1.4.1' \
            'pillow==11.3.0' 'numpy==2.3.5' 'sentencepiece==0.2.1' \
            'psutil==7.0.0' 'packaging==26.3' 'pyyaml==6.0.3' \
            'regex==2026.7.19' 'requests==2.32.5' 'tqdm==4.70.0' \
            'filelock==3.32.2' 'fsspec==2026.7.0' 'typing_extensions==4.16.0' \
            'jinja2==3.1.6' 'protobuf==6.33.5' 'charset_normalizer==3.4.4' \
            'idna==3.18' 'urllib3==2.6.3' 'certifi==2026.7.22' 'markupsafe==3.0.3'
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          rows=[{'name':p.name,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(Path('wheels').glob('*'))]
          Path('WHEEL_MANIFEST.json').write_text(json.dumps(rows,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: R22525_V4_WHEELS, path: '.', compression-level: 0, retention-days: 1}
