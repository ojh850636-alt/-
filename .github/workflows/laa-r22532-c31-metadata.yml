name: LAA R22532 C31 Runtime ABI Courier

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Capture Python 3.13 abi3 tokenizers wheel only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: \
            --python-version 313 --implementation cp --abi abi3 --platform manylinux_2_17_x86_64 \
            -d out 'tokenizers==0.20.3'
          sha256sum out/* > out/SHA256.txt
          ls -lh out
      - name: Upload runtime ABI wheel
        uses: actions/upload-artifact@v4
        with:
          name: r22532-c31-tokenizers-cp313
          path: out
          retention-days: 1
          compression-level: 0
