name: R22576 C58 canonical-run observer only
on:
  push:
    branches: [r22574-c58-behavior]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  observe_only:
    runs-on: ubuntu-latest
    steps:
      - name: Assert this workflow cannot consume scientific source
        run: |
          echo 'OBSERVER_ONLY: no Hugging Face download, no model import, no scientific execution.'
          echo 'Canonical science commit: 875d5a512fd61916d83a63bb42ac9675664a466f'
      - name: Query canonical run state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHORIZED_SHA: 875d5a512fd61916d83a63bb42ac9675664a466f
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$AUTHORIZED_SHA&per_page=20" > runs.json
          python - <<'PY'
          import json,os
          d=json.load(open('runs.json'))
          rows=[]
          for x in d.get('workflow_runs',[]):
              rows.append({k:x.get(k) for k in ['id','name','status','conclusion','event','head_sha','created_at','updated_at','html_url']})
          out={'schema':'R22576_C58_CANONICAL_RUN_OBSERVER_V1','authorized_sha':os.environ['AUTHORIZED_SHA'],'observer_run_id':os.environ.get('GITHUB_RUN_ID'),'scientific_credit':0,'model_downloads':0,'runs':rows}
          json.dump(out,open('C58_CANONICAL_RUN_STATE.json','w'),indent=2,sort_keys=True)
          print(json.dumps(out,indent=2,sort_keys=True))
          assert rows, 'canonical run not found'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22576-c58-canonical-run-state
          path: C58_CANONICAL_RUN_STATE.json
          retention-days: 1
          if-no-files-found: error
