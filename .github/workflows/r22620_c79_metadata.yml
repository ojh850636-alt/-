name: R22620 C79 CPU candidate metadata audit
on:
  push:
    branches: [r22620-c79-meta]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Metadata-only exact audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p meta
          python - <<'PY'
          import json, urllib.request, pathlib
          repos=[
            'jekunz/smollm-135m-lora-fineweb-faroese',
            'jekunz/smollm-135m-lora-all-fineweb-icelandic',
            'hfm8tr/smollm2-135m-smoltalk-lora',
          ]
          rows=[]
          for repo in repos:
              with urllib.request.urlopen('https://huggingface.co/api/models/'+repo, timeout=30) as r: d=json.load(r)
              row={'repo':repo,'sha':d.get('sha'),'tags':d.get('tags',[]),'siblings':[s.get('rfilename') for s in d.get('siblings',[])]}
              for fn in ['adapter_config.json','README.md']:
                  try:
                      with urllib.request.urlopen(f'https://huggingface.co/{repo}/resolve/{d.get("sha")}/{fn}?download=true', timeout=30) as r:
                          b=r.read()
                      pathlib.Path('meta/'+repo.split('/')[1]+'_'+fn.replace('/','_')).write_bytes(b)
                  except Exception as e:
                      row[fn+'_error']=repr(e)
              rows.append(row)
          pathlib.Path('meta/CANDIDATES.json').write_text(json.dumps({'schema':'R22620_C79_META_V1','weight_bytes_requested':0,'rows':rows},indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22620-c79-metadata
          path: meta
          retention-days: 1
          compression-level: 0
