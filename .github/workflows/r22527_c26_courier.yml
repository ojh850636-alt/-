name: R22527 C26 exact-source courier

on:
  push:
    branches: [agent/r22527-c26-courier]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Capture exact safetensors source
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python -m pip install 'huggingface_hub==1.4.1' 'safetensors==0.7.0' 'numpy==2.3.5'
          cat > /tmp/capture.py <<'PY'
          from pathlib import Path
          import hashlib, json, shutil
          from huggingface_hub import snapshot_download
          from safetensors import safe_open

          root=Path('bundle'); adapter=root/'adapter'; base=root/'base'
          adapter.mkdir(parents=True,exist_ok=True); base.mkdir(parents=True,exist_ok=True)
          ar='Be-win/whisper-small-mal-en-lora'; av='326fa07ed37811577e2b8aa8b3061dfa15743bdd'
          br='openai/whisper-small'; bv='3b23e4eeeced745eaf0123aa52f1dd4dd27dff54'
          aa=['README.md','adapter_config.json','adapter_model.safetensors','added_tokens.json','merges.txt','normalizer.json','preprocessor_config.json','special_tokens_map.json','tokenizer.json','tokenizer_config.json','vocab.json']
          ba=['README.md','config.json','generation_config.json','model.safetensors','added_tokens.json','merges.txt','normalizer.json','preprocessor_config.json','special_tokens_map.json','tokenizer.json','tokenizer_config.json','vocab.json']
          banned=['*.bin','*.pt','*.pth','*.pkl','*.pickle','*.h5','*.msgpack','*.ckpt','*.py','*.ipynb','onnx/**']
          ac=snapshot_download(repo_id=ar,revision=av,allow_patterns=aa,ignore_patterns=banned)
          bc=snapshot_download(repo_id=br,revision=bv,allow_patterns=ba,ignore_patterns=banned)
          def cp(src,dst,names):
            out=[]
            for rel in names:
              p=Path(src)/rel
              if p.is_file():
                q=dst/rel; q.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,q); out.append(rel)
            return out
          ca=cp(ac,adapter,aa); cb=cp(bc,base,ba)
          badsuf={'.bin','.pt','.pth','.pkl','.pickle','.h5','.msgpack','.ckpt','.py','.ipynb'}
          bad=[str(p) for p in root.rglob('*') if p.is_file() and p.suffix.lower() in badsuf]
          if bad: raise SystemExit(f'banned files captured: {bad}')
          def sha(p):
            h=hashlib.sha256()
            with open(p,'rb') as f:
              for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
            return h.hexdigest()
          def tensor_summary(p):
            rows=[]
            with safe_open(p,framework='numpy') as f:
              for k in f.keys():
                s=f.get_slice(k); rows.append({'key':k,'shape':[int(x) for x in s.get_shape()],'dtype':str(s.get_dtype())})
            return {'tensor_count':len(rows),'keys_sha256':hashlib.sha256(json.dumps(rows,sort_keys=True).encode()).hexdigest(),'key_shapes':rows}
          aw=adapter/'adapter_model.safetensors'; bw=base/'model.safetensors'
          if sha(aw)!='e6ccbca5a7e47cdb90a4867c46f6fda26ca35e599cc38ec984d447193c88ca8c': raise SystemExit('adapter SHA mismatch')
          if bw.stat().st_size!=966995080 or sha(bw)!='1d7734884874f1a1513ed9aa760a4f8e97aaa02fd6d93a3a85d27b2ae9ca596b': raise SystemExit('base identity mismatch')
          files=[]
          for p in sorted(root.rglob('*')):
            if p.is_file(): files.append({'path':p.relative_to(root).as_posix(),'size':p.stat().st_size,'sha256':sha(p)})
          report={'schema':'R22527_C26_EXACT_SOURCE_CAPTURE_V1','adapter':{'repo':ar,'revision':av,'copied':ca,'weight_size':aw.stat().st_size,'weight_sha256':sha(aw)},'base':{'repo':br,'revision':bv,'copied':cb,'weight_size':bw.stat().st_size,'weight_sha256':sha(bw),'training_time_revision_proven':False},'files':files,'adapter_tensor_summary':tensor_summary(aw),'base_tensor_summary':tensor_summary(bw),'trust_remote_code':False,'pickle_loaded':False,'banned_file_count':0}
          (root/'CAPTURE_MANIFEST.json').write_text(json.dumps(report,indent=2,sort_keys=True))
          print(json.dumps({'adapter_bytes':aw.stat().st_size,'adapter_sha256':sha(aw),'base_bytes':bw.stat().st_size,'base_sha256':sha(bw)},indent=2))
          PY
          python /tmp/capture.py
          mkdir -p parts/meta parts/adapter parts/base
          cp bundle/CAPTURE_MANIFEST.json parts/meta/
          find bundle/adapter -type f ! -name adapter_model.safetensors -exec cp --parents '{}' parts/meta/ \;
          find bundle/base -type f ! -name model.safetensors -exec cp --parents '{}' parts/meta/ \;
          cp bundle/adapter/adapter_model.safetensors parts/adapter/
          split -b 180M -d -a 2 bundle/base/model.safetensors parts/base/base.part.
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          rows=[]
          for p in sorted(Path('parts/base').glob('base.part.*')):
            h=hashlib.sha256(p.read_bytes()).hexdigest(); rows.append({'name':p.name,'size':p.stat().st_size,'sha256':h})
          Path('parts/base/PARTS_MANIFEST.json').write_text(json.dumps(rows,indent=2,sort_keys=True))
          print(rows)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R22527_C26_META
          path: parts/meta
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: R22527_C26_ADAPTER
          path: parts/adapter
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: R22527_C26_BASE_00
          path: parts/base/base.part.00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: R22527_C26_BASE_01
          path: parts/base/base.part.01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: R22527_C26_BASE_02
          path: parts/base/base.part.02
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: R22527_C26_BASE_03
          path: parts/base/base.part.03
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: R22527_C26_BASE_04
          path: parts/base/base.part.04
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: R22527_C26_BASE_05
          path: parts/base/base.part.05
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: R22527_C26_BASE_MANIFEST
          path: parts/base/PARTS_MANIFEST.json
          compression-level: 0
          retention-days: 1

  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download runtime overlay without torch
        run: |
          mkdir -p wheels
          python -m pip download --dest wheels --only-binary=:all: --no-deps \
            'transformers==5.0.0' 'peft==0.18.1' 'accelerate==1.14.0' \
            'tokenizers==0.22.2' 'safetensors==0.7.0' 'huggingface_hub==1.4.1' \
            'sentencepiece==0.2.1' 'numpy==2.3.5' 'packaging==26.3' \
            'pyyaml==6.0.3' 'regex==2026.7.19' 'requests==2.32.5' 'tqdm==4.70.0' \
            'filelock==3.32.2' 'fsspec==2026.7.0' 'typing_extensions==4.16.0' \
            'jinja2==3.1.6' 'protobuf==6.33.5' 'charset_normalizer==3.4.4' \
            'idna==3.18' 'urllib3==2.6.3' 'certifi==2026.7.22' 'markupsafe==3.0.3'
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          rows=[]
          for p in sorted(Path('wheels').glob('*')): rows.append({'name':p.name,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          Path('wheels/WHEEL_MANIFEST.json').write_text(json.dumps(rows,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R22527_C26_WHEELS
          path: wheels
          compression-level: 0
          retention-days: 1
