name: Temporary LAA R22546 PondLLM V4.1 historical source-only dataset reproduction

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Replay historical deterministic generator chain without model weights
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/LAA_R22546_V41_P3"
          SRC="$ROOT/PondLLM"
          OUT="$ROOT/out"
          mkdir -p "$OUT"
          git clone --filter=blob:none --no-checkout https://github.com/Xnizzorg/PondLLM.git "$SRC"
          cd "$SRC"

          checkout_clean() {
            local REV="$1"
            git checkout --force "$REV"
            test "$(git rev-parse HEAD)" = "$REV"
            test -z "$(git status --porcelain)"
            export PYTHONPATH="$SRC/src"
          }

          # V1/V2 were already documented in the initial public commit.
          checkout_clean 03ec066eb54287c4dda674e6fb001dcf5dd2b7f8
          python -m pondllm dataset --episodes 16 --steps 60 --seed 1000 --output "$OUT/sft.jsonl"
          python -m pondllm dataset-balanced --base "$OUT/sft.jsonl" --episodes 128 --seed 2000 --minimum-per-action 1000 --output "$OUT/sft-v2-balanced.jsonl"

          # V4 must use the exact V4 source generation rather than the later V4.1 implementation.
          checkout_clean 353a4a2166842c7566ddeaf5212b4d43af7c697c
          python -m pondllm dataset-v4 --base "$OUT/sft-v2-balanced.jsonl" --scenes 1000 --survival-scenes 1000 --seed 52000 --output "$OUT/sft-v4-simulator-native.jsonl"

          # V4.1 training manifest records this exact clean commit.
          checkout_clean 340131a4f130218fff3d90a87bd1b9577a9e17d0
          python -m pondllm dataset-v41 --base "$OUT/sft-v4-simulator-native.jsonl" --rich-scenes 1000 --reachability-scenes 1000 --seed 61000 --output "$OUT/sft-v4.1-rich-reachability.jsonl"

          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'LAA_R22546_V41_P3'
          out=root/'out'
          published={
            'v41':'84f5bae00fcd2a1a98737e9a98371dd534961dd01e0f704e6a4356dfea585815',
            'v41_records':43322,
          }
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()
          specs=[
            ('V1','03ec066eb54287c4dda674e6fb001dcf5dd2b7f8','sft.jsonl'),
            ('V2','03ec066eb54287c4dda674e6fb001dcf5dd2b7f8','sft-v2-balanced.jsonl'),
            ('V4','353a4a2166842c7566ddeaf5212b4d43af7c697c','sft-v4-simulator-native.jsonl'),
            ('V4.1','340131a4f130218fff3d90a87bd1b9577a9e17d0','sft-v4.1-rich-reachability.jsonl'),
          ]
          rows=[]
          for stage,commit,name in specs:
              p=out/name
              rows.append({'stage':stage,'source_git_commit':commit,'path':name,'sha256':sha(p),'size_bytes':p.stat().st_size,'records':sum(1 for _ in p.open('rb'))})
          final=rows[-1]
          rec={
            'schema':'LUCIA_AA_R22546_PONDLLM_V41_HISTORICAL_CHAIN_REPRO_V2',
            'source_git_commits':{r['stage']:r['source_git_commit'] for r in rows},
            'source_git_dirty':False,
            'commands':'historical README-documented V1/V2 -> exact V4 source commit -> exact clean V4.1 training commit',
            'artifacts':rows,
            'published_v41_dataset_sha256':published['v41'],
            'reproduced_v41_dataset_sha256':final['sha256'],
            'published_v41_records':published['v41_records'],
            'reproduced_v41_records':final['records'],
            'sha_match':final['sha256']==published['v41'],
            'record_count_match':final['records']==published['v41_records'],
            'model_weight_bytes_downloaded':0,
            'model_outputs_observed':0,
            'dataset_bytes_retained_in_artifact':0,
          }
          (root/'REPRO_RECEIPT.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(rec,indent=2,sort_keys=True))
          PY
          rm -rf "$OUT" "$SRC"
      - uses: actions/upload-artifact@v4
        with:
          name: LAA_R22546_V41_P3_REPRO_RECEIPT_ONLY
          path: ${{ runner.temp }}/LAA_R22546_V41_P3/REPRO_RECEIPT.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
