name: LAA R22563 C43 same-escrow recovery
on:
  push:
    branches: [laa-r22563-c43-onepass]
permissions:
  contents: read
  actions: write
jobs:
  science_recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: r22563-c43-raw-adapter
          path: raw_adapter_artifact
          repository: ojh850636-alt/-
          run-id: 31811808717
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: r22563-c43-raw-base
          path: raw_base_artifact
          repository: ojh850636-alt/-
          run-id: 31811808717
          github-token: ${{ github.token }}
      - name: Verify authoritative escrows and output-zero amendment chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload/research/r22563_c43 payload/configs payload/datasets/r22563_c43 work evidence
          cp r22563/c43_src/c43_forge.py payload/research/r22563_c43/c43_forge.py
          cp r22563/c43_src/c43_verifier.py payload/research/r22563_c43/c43_verifier.py
          cat r22563/c43_src/science_parts/part00.pyfrag r22563/c43_src/science_parts/part01.pyfrag r22563/c43_src/science_parts/part02.pyfrag r22563/c43_src/science_parts/part03.pyfrag r22563/c43_src/science_parts/part04.pyfrag > payload/research/r22563_c43/c43_science.py
          cp r22563/c43_src/R22563_C43_PREOUTPUT_CONTRACT.json payload/configs/R22563_C43_PREOUTPUT_CONTRACT.json
          cp r22563/c43_src/C43_COMPATIBILITY_AMENDMENT_01.json evidence/C43_COMPATIBILITY_AMENDMENT_01.json
          test "$(sha256sum payload/research/r22563_c43/c43_forge.py | awk '{print $1}')" = 2271dbaeb3b3e4ee85c13adc213d48dde700650af6d75844019298c5a2ecf91a
          test "$(sha256sum payload/research/r22563_c43/c43_verifier.py | awk '{print $1}')" = ff853a4abc3ecb58a51963bd9d6de24a57b007cb977bed80b2aa06996356efce
          test "$(sha256sum payload/research/r22563_c43/c43_science.py | awk '{print $1}')" = e163f3ab4784aca74186efe32f2493818ca6fb84979755a6151bb2ba7dd0568d
          python - <<'PY'
          import json,pathlib
          c=json.loads(pathlib.Path('payload/configs/R22563_C43_PREOUTPUT_CONTRACT.json').read_text())
          a=json.loads(pathlib.Path('evidence/C43_COMPATIBILITY_AMENDMENT_01.json').read_text())
          assert c['model_outputs_observed_before_seal']==0
          assert c['raw_weight_bytes_local_before_seal']==0
          assert a['model_outputs_observed_before_amendment']==0
          assert a['preseal_science_sha256']==c['preoutput_bindings']['research/r22563_c43/c43_science.py']['sha256']
          assert a['amended_science_sha256']=='e163f3ab4784aca74186efe32f2493818ca6fb84979755a6151bb2ba7dd0568d'
          assert not a['suite_changed'] and not a['thresholds_changed'] and not a['source_identity_changed']
          PY
          python payload/research/r22563_c43/c43_forge.py
          test "$(sha256sum payload/datasets/r22563_c43/C43_ZSH_COMPLETION_SUITE.jsonl | awk '{print $1}')" = 9504316bc8510898ecf6df944ef9713af64bfa714e352dc75e5f13312611818e
          cp -a raw_adapter_artifact/escrow_adapter work/adapter
          cp -a raw_base_artifact/escrow_base work/base
          test "$(stat -c%s work/adapter/adapter_model.safetensors)" = 1106719360
          test "$(sha256sum work/adapter/adapter_model.safetensors | awk '{print $1}')" = 2afafe383fd3070d656b773302c6b4e0623cce20bdbbb5e205a5a01c6c8cf36a
          test "$(stat -c%s work/base/model.safetensors)" = 988097824
          test "$(sha256sum work/base/model.safetensors | awk '{print $1}')" = 9cd8fc8c85a197b8c551d6b931b5709fe2611889d6b44945876472fecdf77cad
      - name: Run amended science from same authoritative escrows
        shell: bash
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          TOKENIZERS_PARALLELISM: 'false'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m pip install -q torch==2.10.0 transformers==4.57.1 peft==0.18.1 accelerate==1.14.0 safetensors==0.7.0
          python payload/research/r22563_c43/c43_science.py --self-test | tee evidence/C43_RUNTIME_SELFTEST.json
          python payload/research/r22563_c43/c43_science.py --run --work work --suite payload/datasets/r22563_c43/C43_ZSH_COMPLETION_SUITE.jsonl --out evidence --batch 2 | tee evidence/C43_STDOUT_SUMMARY.txt
          if find evidence -type f \( -name '*.safetensors' -o -name '*.bin' -o -name '*.pt' -o -name '*.pkl' \) | grep -q .; then exit 91; fi
          rm -rf work raw_adapter_artifact raw_base_artifact payload
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('evidence'); files=[]
          for p in sorted(root.iterdir()):
              if p.is_file(): files.append({'name':p.name,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'C43_RAW_FREE_MANIFEST.json').write_text(json.dumps({'schema':'LAA_R22563_C43_RAW_FREE_MANIFEST_V1','authoritative_source_run':31811808717,'raw_source_present':False,'files':files},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22563-c43-rawfree-evidence-recovery
          path: evidence
          retention-days: 1
  cleanup:
    if: ${{ always() && needs.science_recovery.result == 'success' }}
    needs: science_recovery
    runs-on: ubuntu-latest
    steps:
      - name: Delete authoritative and accidental duplicate raw escrows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir cleanup
          : > cleanup/targets.tsv
          for run in 31811808717 31812355012; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" > "artifacts_$run.json"
            RUN_ID="$run" python - <<'PY' >> cleanup/targets.tsv
          import json,os
          run=os.environ['RUN_ID']
          for a in json.load(open(f'artifacts_{run}.json'))['artifacts']:
              if a['name'] in {'r22563-c43-raw-adapter','r22563-c43-raw-base'}:
                  print(run,a['id'],a['name'],sep='\t')
          PY
          done
          test "$(grep -c $'^31811808717\t' cleanup/targets.tsv)" = 2
          sort -u cleanup/targets.tsv -o cleanup/targets.tsv
          while IFS=$'\t' read -r run id name; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            echo "$run $id $name DELETED"
          done < cleanup/targets.tsv > cleanup/deleted.txt
          python - <<'PY'
          import json,pathlib
          lines=pathlib.Path('cleanup/deleted.txt').read_text().splitlines()
          pathlib.Path('cleanup/R22563_C43_REMOTE_RAW_DELETION.json').write_text(json.dumps({'schema':'LAA_R22563_C43_REMOTE_RAW_DELETION_V2','deleted':lines,'count':len(lines),'authoritative_source_run':31811808717,'accidental_duplicate_run':31812355012,'source_reacquisition_allowed':False},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22563-c43-cleanup-receipt-recovery
          path: cleanup/R22563_C43_REMOTE_RAW_DELETION.json
          retention-days: 1
