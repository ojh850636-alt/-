name: R22571 C55 PII Metadata Audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - name: Audit four PII-redaction candidates without model weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,re,urllib.request,urllib.parse,pathlib,hashlib
          repos=[
            'KashefTech/qwen-anonymizer-lora',
            'OpenPipe/sample-lora-pii-redaction',
            'ab-ai/PII-Guardian-Phi3-Mini-LORA',
            'distil-labs/Distil-PII-SmolLM2-135M-Instruct',
          ]
          def jget(u):
            req=urllib.request.Request(u,headers={'User-Agent':'LAA-R22571-meta/1.0'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          def tget(u,limit=120000):
            req=urllib.request.Request(u,headers={'User-Agent':'LAA-R22571-meta/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:return r.read(limit+1).decode('utf-8','replace')[:limit]
            except Exception:return None
          recs=[]
          for repo in repos:
            try:
              m=jget('https://huggingface.co/api/models/'+urllib.parse.quote(repo,safe='/')+'?blobs=true')
              sha=m.get('sha'); card=m.get('cardData') or {}; sib=m.get('siblings') or []
              files=[]
              for x in sib:
                lfs=x.get('lfs') or {}
                files.append({'name':x.get('rfilename'),'size':x.get('size') or lfs.get('size'),'lfs_sha256':lfs.get('sha256')})
              readme=tget(f'https://huggingface.co/{repo}/resolve/{sha}/README.md') if sha else None
              configs={}
              for p in ['adapter_config.json','adapter/adapter_config.json','adapters/adapter_config.json']:
                s=tget(f'https://huggingface.co/{repo}/resolve/{sha}/{p}',40000) if sha else None
                if s:
                  try: configs[p]=json.loads(s)
                  except Exception: configs[p]={'_parse_error':True,'sha256':hashlib.sha256(s.encode()).hexdigest()}
              license_docs={}
              names={f.get('name') for f in files}
              for p in ['LICENSE','LICENSE.txt','LICENSE.md','COPYING']:
                if p in names and sha:
                  s=tget(f'https://huggingface.co/{repo}/resolve/{sha}/{p}',40000)
                  license_docs[p]={'sha256':hashlib.sha256((s or '').encode()).hexdigest(),'text':s}
              recs.append({
                'repo':repo,'exists':True,'exact_revision':sha,
                'card_license':card.get('license') or m.get('license'),
                'base_model_card':card.get('base_model'),'datasets':card.get('datasets'),
                'pipeline_tag':m.get('pipeline_tag'),'library_name':m.get('library_name'),'tags':m.get('tags') or [],
                'configs':configs,'files':files,'license_docs':license_docs,
                'readme':readme,'readme_sha256':hashlib.sha256((readme or '').encode()).hexdigest() if readme is not None else None,
                'safe_weight_files':[f for f in files if (f.get('name') or '').endswith('.safetensors')],
                'pickle_risk_files':[f for f in files if re.search(r'\.(bin|pt|pth|pkl|pickle)$',f.get('name') or '',re.I)],
              })
            except Exception as e: recs.append({'repo':repo,'exists':False,'error':repr(e)})
          out={'schema':'R22571_C55_PII_METADATA_AUDIT_V1','weight_bytes_downloaded':0,'model_outputs_observed':0,'candidates':recs}
          p=pathlib.Path('out/R22571_C55_PII_METADATA_AUDIT.json'); p.write_text(json.dumps(out,ensure_ascii=False,indent=2))
          pathlib.Path('out/SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  R22571_C55_PII_METADATA_AUDIT.json\n')
          print(json.dumps([{k:r.get(k) for k in ['repo','exists','exact_revision','card_license','base_model_card']} for r in recs],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22571-c55-pii-meta
          path: out/
          retention-days: 1
          if-no-files-found: error
