name: R22587 C68 canonical one-use source
on:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
jobs:
  c68:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runtime dependency preflight before any model source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.12.0'
          python -m pip install --disable-pip-version-check 'transformers==5.0.0' 'peft==0.18.1' 'accelerate==1.14.0' 'safetensors==0.7.0' 'huggingface_hub==1.4.1' 'numpy==2.3.5' 'psutil==7.0.0'
          python - <<'PY'
          import torch,psutil,shutil
          from transformers import Qwen2Config,Qwen2ForCausalLM
          from peft import LoraConfig,get_peft_model
          free=shutil.disk_usage('.').free; mem=psutil.virtual_memory().available
          assert free > 7_000_000_000, free
          assert mem > 4_500_000_000, mem
          cfg=Qwen2Config(vocab_size=128,hidden_size=32,intermediate_size=64,num_hidden_layers=1,num_attention_heads=4,num_key_value_heads=2,max_position_embeddings=128)
          m=Qwen2ForCausalLM(cfg).to(dtype=torch.bfloat16)
          l=LoraConfig(r=4,lora_alpha=8,target_modules=['q_proj','k_proj','v_proj','o_proj','gate_proj','up_proj','down_proj'])
          m=get_peft_model(m,l).eval()
          with torch.inference_mode(): y=m(input_ids=torch.randint(0,128,(1,8))).logits
          assert y.shape==(1,8,128) and torch.isfinite(y.float()).all()
          print({'DEPENDENCY_PREFLIGHT_PASS':True,'torch':torch.__version__,'free_disk':free,'available_mem':mem})
          PY
      - name: Decode audited canonical runner
        run: |
          set -euo pipefail
          cat > /tmp/r22587_c68.py.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/r22587_c68.py.gz.b64 | gzip -d > /tmp/r22587_c68.py
          python -m py_compile /tmp/r22587_c68.py
          rm -f /tmp/r22587_c68.py.gz.b64
      - name: Canonical source run
        id: source
        run: |
          set -euo pipefail
          python /tmp/r22587_c68.py
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
      - name: Upload raw-free evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r22587-c68-canonical-rawfree
          path: work/out/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Publish run id
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          body={'body':f"R22587_C68_CANONICAL_RUN_ID={os.environ['RUN_ID']} SHA={os.environ['SHA']}"}
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues/100/comments",data=json.dumps(body).encode(),headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          try: print(urllib.request.urlopen(req,timeout=30).read().decode())
          except Exception as e: print('comment failed',e)
          PY
