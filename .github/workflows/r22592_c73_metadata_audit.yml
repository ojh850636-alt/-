name: R22592 C73 metadata-only dedup-first candidate audit
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: API and immutable-text only audit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT_BRANCH: r22592-c73-metadata-receipt
        run: |
          set -euo pipefail
          mkdir -p work/out
          python - <<'PY'
          import urllib.request,json,re,hashlib,datetime,os,base64
          from pathlib import Path

          UA={'User-Agent':'LUCIA-AA-R22592-C73-metadata-only'}
          CANDS=[
            {
              'id':'C73-A',
              'repo':'esc511/trip-optimizer-mutator',
              'base':'Qwen/Qwen3-4B-Instruct-2507',
              'question':'PLAN_STATE_TO_RFC6902_SINGLE_MUTATION_WITH_CONSTRAINT_PRESERVATION_AND_DETERMINISTIC_PATCH_APPLY',
              'verifier':'independent_rfc6902_patch_apply_plus_plan_constraint_oracle',
              'novelty':'OPERATION_LEVEL_STATE_MUTATION',
              'expected_format':'MLX_OR_PEFT_LORA',
              'cost_class':'MEDIUM_4B',
              'dedup_pass':True,
            },
            {
              'id':'C73-B',
              'repo':'micymike/codemate-qwen3.5-2b-production-debugger',
              'base':'Qwen/Qwen3.5-2B',
              'question':'BUGGY_REPOSITORY_TO_MINIMAL_UNIFIED_DIFF_WITH_PATCH_APPLY_AND_REGRESSION_TEST_SEMANTICS',
              'verifier':'unified_diff_apply_plus_ast_compile_plus_isolated_regression_tests',
              'novelty':'PATCH_AS_EXECUTABLE_PROGRAM_TRANSFORM',
              'expected_format':'PEFT_LORA',
              'cost_class':'LOW_2B',
              'dedup_pass':True,
            },
            {
              'id':'C73-C',
              'repo':'zaid646/multimodal-vision-agent-lora',
              'base':'Qwen/Qwen2.5-7B-Instruct',
              'question':'DOM_INSTRUCTION_TO_EXECUTABLE_SELECTOR_ACTION_WITH_XPATH_CSS_RESOLUTION_AND_NO_WRONG_ELEMENT',
              'verifier':'synthetic_dom_xpath_css_resolution_plus_action_schema',
              'novelty':'DOM_SELECTOR_DENOTATION',
              'expected_format':'PEFT_LORA',
              'cost_class':'HIGH_7B',
              'dedup_pass':True,
            },
          ]

          def get(url,limit=6_000_000):
            req=urllib.request.Request(url,headers=UA)
            with urllib.request.urlopen(req,timeout=60) as r:
              b=r.read(limit+1)
              if len(b)>limit: raise RuntimeError('META_TOO_LARGE:'+url)
              return b
          def getj(url): return json.loads(get(url).decode())
          def text(repo,sha,name):
            try:return get(f'https://huggingface.co/{repo}/raw/{sha}/{name}',2_000_000).decode('utf-8','replace')
            except Exception:return None
          def lfs_entry(x):
            l=x.get('lfs') or {}
            return {'path':x.get('rfilename'),'size':l.get('size') or x.get('size'),'sha256':l.get('sha256') or l.get('oid'),'blob_id':x.get('blobId')}
          def exact_base_from_text(base, texts):
            pats=[
              r'(?i)(?:immutable\s+)?base(?:\s+model)?\s+(?:revision|commit|snapshot)\s*[:=` ]+\s*([0-9a-f]{40})',
              r'(?i)training(?:-time)?\s+base(?:\s+model)?\s+(?:revision|commit|snapshot)\s*[:=` ]+\s*([0-9a-f]{40})',
              r'(?i)base[_ -]?revision\s*[:=`"]+\s*([0-9a-f]{40})',
              r'(?i)base[_ -]?commit\s*[:=`"]+\s*([0-9a-f]{40})',
            ]
            hits=[]
            for name,s in texts.items():
              if not s: continue
              for pat in pats:
                for m in re.finditer(pat,s):
                  hits.append({'file':name,'revision':m.group(1).lower(),'context':s[max(0,m.start()-100):min(len(s),m.end()+100)]})
            uniq=[]
            seen=set()
            for h in hits:
              if h['revision'] not in seen:
                seen.add(h['revision']);uniq.append(h)
            verified=[]
            for h in uniq:
              try:
                bi=getj(f'https://huggingface.co/api/models/{base}/revision/{h["revision"]}')
                if bi.get('sha')==h['revision']: verified.append(h)
              except Exception: pass
            return verified

          rows=[]
          for c in CANDS:
            info=getj('https://huggingface.co/api/models/'+c['repo']+'?blobs=true')
            sha=info.get('sha'); card=info.get('cardData') or {}; lic=card.get('license')
            if not re.fullmatch(r'[0-9a-f]{40}',str(sha)): raise RuntimeError('NO_IMMUTABLE_SHA:'+c['repo'])
            siblings=info.get('siblings') or []
            files=[x.get('rfilename') for x in siblings if x.get('rfilename')]
            texts={}
            for name in files:
              low=name.lower()
              if low=='readme.md' or (any(k in low for k in ('adapter_config','training_config','train_meta','manifest','metadata','config.json')) and not low.endswith(('.safetensors','.bin','.pt','.pth','.gguf'))):
                if (next((x.get('size') for x in siblings if x.get('rfilename')==name),0) or 0) < 2_000_000:
                  texts[name]=text(c['repo'],sha,name)
            cfg=None;cfg_name=None
            for n in ('adapter_config.json','adapters_config.json','adapter_config.yaml','adapter_config.yml'):
              if texts.get(n):
                cfg_name=n
                if n.endswith('.json'):
                  try: cfg=json.loads(texts[n])
                  except Exception: cfg=None
                break
            weight_files=[]
            for x in siblings:
              n=(x.get('rfilename') or '')
              ln=n.lower()
              if ln.endswith(('.safetensors','.gguf','.bin','.pt','.pth')) and any(k in ln for k in ('adapter','lora')):
                weight_files.append(lfs_entry(x))
            if not weight_files:
              st=[lfs_entry(x) for x in siblings if (x.get('rfilename') or '').lower().endswith('.safetensors')]
              if len(st)<=3: weight_files=st
            exact=exact_base_from_text(c['base'],texts)
            cfg_rev=(cfg or {}).get('revision') if isinstance(cfg,dict) else None
            if isinstance(cfg_rev,str) and re.fullmatch(r'[0-9a-f]{40}',cfg_rev):
              try:
                bi=getj(f'https://huggingface.co/api/models/{c["base"]}/revision/{cfg_rev}')
                if bi.get('sha')==cfg_rev and not any(x['revision']==cfg_rev for x in exact):
                  exact.append({'file':cfg_name or 'adapter_config','revision':cfg_rev,'context':'adapter_config revision'})
              except Exception: pass
            format_='UNKNOWN'
            if isinstance(cfg,dict) and cfg.get('peft_type'): format_='PEFT_'+str(cfg.get('peft_type'))
            elif any((x['path'] or '').lower()=='adapters.safetensors' for x in weight_files): format_='MLX_LORA'
            elif any('lora' in (x['path'] or '').lower() for x in weight_files): format_='LORA_NONPEFT'
            modules=(cfg or {}).get('modules_to_save') if isinstance(cfg,dict) else None
            license_clear=bool(lic and str(lic).lower() not in {'other','unknown'})
            hard=[]
            if not c['dedup_pass']: hard.append('QUESTION_DUPLICATE')
            if not license_clear: hard.append('LICENSE_UNCLEAR')
            if not weight_files: hard.append('NO_ADAPTER_WEIGHT_IDENTITY')
            if modules not in (None,[]): hard.append('AUX_MODULES_TO_SAVE')
            total_bytes=sum(int(x.get('size') or 0) for x in weight_files)
            cost_score={'LOW_2B':18,'MEDIUM_4B':13,'HIGH_7B':5}[c['cost_class']]
            score=(30 if exact else 0)+(20 if license_clear else 0)+(20 if weight_files else 0)+cost_score+(10 if modules in (None,[]) else 0)
            row={**c,
                 'immutable_revision':sha,
                 'license':lic,'license_clear':license_clear,
                 'files':files,
                 'adapter_weight_files':weight_files,'adapter_weight_total_bytes':total_bytes,
                 'format_observed':format_,
                 'adapter_config_file':cfg_name,
                 'base_model_name_or_path':(cfg or {}).get('base_model_name_or_path') if isinstance(cfg,dict) else None,
                 'adapter_config_revision':cfg_rev,
                 'r':(cfg or {}).get('r') if isinstance(cfg,dict) else None,
                 'lora_alpha':(cfg or {}).get('lora_alpha') if isinstance(cfg,dict) else None,
                 'target_modules':sorted((cfg or {}).get('target_modules') or []) if isinstance(cfg,dict) and isinstance((cfg or {}).get('target_modules'),list) else (cfg or {}).get('target_modules') if isinstance(cfg,dict) else None,
                 'modules_to_save':modules,
                 'exact_training_base_revision_proven':bool(exact),
                 'exact_training_base_evidence':exact,
                 'text_metadata_sha256':{k:hashlib.sha256(v.encode()).hexdigest() for k,v in texts.items() if v is not None},
                 'hard_reject_reasons':hard,'admission_score':score,
                 'weight_path_get_count':0,'model_weight_bytes':0}
            rows.append(row)

          eligible=[r for r in rows if not r['hard_reject_reasons']]
          exact=[r for r in eligible if r['exact_training_base_revision_proven']]
          priority={'C73-A':0,'C73-B':1,'C73-C':2}
          pool=exact if exact else eligible
          selected=sorted(pool,key=lambda r:(-r['admission_score'],priority[r['id']]))[0]['id'] if pool else None
          if not exact and any(r['id']=='C73-A' for r in eligible):
            selected='C73-A'
          selection={
            'selected':selected,
            'policy':'DEDUP_FIRST_THEN_EXACT_BASE_THEN_VERIFIER_GEOMETRY_AND_SOURCE_COST',
            'exact_base_candidate_count':len(exact),
            'reason':'If any eligible candidate has exact training-Base provenance, it dominates. Otherwise C73-A RFC6902 is preferred because patch application and constraint preservation give the cleanest source-free semantic oracle; Base behavior remains unauthorized without exact provenance.'
          }
          out={'schema':'R22592_C73_METADATA_ONLY_CANDIDATE_AUDIT_V1',
               'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
               'weight_path_get_count':0,'model_weight_bytes':0,
               'dedup_hard_gate_before_scoring':True,
               'candidates':rows,'selection':selection}
          p=Path('work/out/R22592_C73_METADATA_ONLY_CANDIDATE_AUDIT.json')
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')

          H={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22592-receipt','Content-Type':'application/json'}
          b=p.read_bytes()
          payload=json.dumps({'message':'Persist R22592 C73 metadata audit','content':base64.b64encode(b).decode(),'branch':os.environ['OUT_BRANCH']}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/recovery/R22592_C73_METADATA_ONLY_CANDIDATE_AUDIT.json",data=payload,headers=H,method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r:r.read()
          print(json.dumps({'PASS':True,'selected':selected,'scores':{x['id']:x['admission_score'] for x in rows},'exact_base':{x['id']:x['exact_training_base_revision_proven'] for x in rows},'weight_path_get_count':0,'model_weight_bytes':0},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22592-c73-metadata-only
          path: work/out/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Persist run identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT_BRANCH: r22592-c73-metadata-receipt
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,base64,time,datetime
          H={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22592-run-receipt','Content-Type':'application/json'}
          arts=[]
          for _ in range(10):
            req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}/artifacts?per_page=100",headers=H)
            with urllib.request.urlopen(req,timeout=30) as r:d=json.loads(r.read().decode())
            arts=d.get('artifacts',[])
            if arts:break
            time.sleep(2)
          out={'schema':'R22592_C73_METADATA_RUN_RECEIPT_V1','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'run_id':int(os.environ['RUN_ID']),'head_sha':os.environ['HEAD_SHA'],'huggingface_weight_path_get_count':0,'model_weight_bytes':0,'artifacts':[{'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'digest':a.get('digest'),'expired':a.get('expired')} for a in arts]}
          b=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode()
          payload=json.dumps({'message':'Persist R22592 C73 metadata run receipt','content':base64.b64encode(b).decode(),'branch':os.environ['OUT_BRANCH']}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/recovery/R22592_C73_METADATA_RUN_RECEIPT.json",data=payload,headers=H,method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r:r.read()
          PY
