name: LAA R22535 C33 Reference Materialization

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Materialize pinned reference law and metadata only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/ref out/meta tmp
          python r22535/build_suite.py out/ref/C33_INPUT_SUITE.jsonl

          git clone -q --filter=blob:none --no-checkout https://github.com/Abhijit89Kumar/fast-indic-tts.git tmp/fast-indic-tts
          git -C tmp/fast-indic-tts fetch -q --depth 1 origin 42339058cd2048d3ff907fd811e9ba6bcc4dff88
          git -C tmp/fast-indic-tts checkout -q --detach 42339058cd2048d3ff907fd811e9ba6bcc4dff88
          test "$(git -C tmp/fast-indic-tts rev-parse HEAD)" = '42339058cd2048d3ff907fd811e9ba6bcc4dff88'

          git clone -q --filter=blob:none --no-checkout https://github.com/espeak-ng/espeak-ng.git tmp/espeak-ng
          git -C tmp/espeak-ng fetch -q --depth 1 origin 4870adfa25b1a32b4361592f1be8a40337c58d6c
          git -C tmp/espeak-ng checkout -q --detach 4870adfa25b1a32b4361592f1be8a40337c58d6c
          test "$(git -C tmp/espeak-ng rev-parse HEAD)" = '4870adfa25b1a32b4361592f1be8a40337c58d6c'

          cmake -S tmp/espeak-ng -B tmp/espeak-ng/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/tmp/espeak-install" \
            -DBUILD_SHARED_LIBS=ON \
            -DUSE_MBROLA=OFF -DUSE_LIBSONIC=OFF -DUSE_LIBPCAUDIO=OFF \
            -DUSE_SPEECHPLAYER=OFF -DUSE_ASYNC=OFF >/dev/null
          cmake --build tmp/espeak-ng/build -j2 >/dev/null
          cmake --install tmp/espeak-ng/build >/dev/null

          ESPEAK_BIN="$PWD/tmp/espeak-install/bin/espeak-ng"
          ESPEAK_LIB="$(find "$PWD/tmp/espeak-install" -type f -name 'libespeak-ng.so*' | sort | head -1)"
          test -x "$ESPEAK_BIN"
          test -n "$ESPEAK_LIB"
          "$ESPEAK_BIN" --version | tee out/meta/ESPEAK_VERSION.txt

          python -m pip install --disable-pip-version-check -q 'phonemizer==3.3.0' 'huggingface_hub[hf_xet]==0.36.0'
          export PHONEMIZER_ESPEAK_LIBRARY="$ESPEAK_LIB"
          export ESPEAK_BIN

          python - <<'PY'
          from huggingface_hub import HfApi
          from pathlib import Path
          import json, hashlib, os, subprocess, sys, importlib.metadata, unicodedata

          out=Path('out'); ref=out/'ref'; meta=out/'meta'
          base_repo='sarvamai/sarvam-1'
          base_rev='e9607337286ddf496d4a2562b194e489dcf3feea'
          adapter_repo='AK04-IXR/sarvam1-hinglish-g2p-lora'
          adapter_rev='70ed6e5a25607604568a6f7e9fe37857c85e891f'
          adapter_expected_bytes=95931368
          adapter_expected_sha='5ae743214f5233091e8332011b877b9945bec95d3d741348840ab60ac3121601'
          upstream_repo='Abhijit89Kumar/fast-indic-tts'
          upstream_rev='42339058cd2048d3ff907fd811e9ba6bcc4dff88'
          espeak_rev='4870adfa25b1a32b4361592f1be8a40337c58d6c'
          phonemizer_rev='3ed323f0c77797b829092b07a8a4b08ee6f71187'

          api=HfApi()
          def sibling_dict(s):
              d={'rfilename':s.rfilename,'size':getattr(s,'size',None),'blob_id':getattr(s,'blob_id',None)}
              lfs=getattr(s,'lfs',None)
              if lfs:
                  if hasattr(lfs,'sha256'): d['lfs_sha256']=lfs.sha256
                  elif isinstance(lfs,dict): d['lfs_sha256']=lfs.get('sha256') or lfs.get('oid')
              return d
          bi=api.model_info(base_repo,revision=base_rev,files_metadata=True)
          ai=api.model_info(adapter_repo,revision=adapter_rev,files_metadata=True)
          assert bi.sha==base_rev,(bi.sha,base_rev)
          assert ai.sha==adapter_rev,(ai.sha,adapter_rev)
          safe_ext={'.json','.model','.safetensors','.md','.txt'}
          base_files=[sibling_dict(s) for s in bi.siblings if Path(s.rfilename).suffix.lower() in safe_ext]
          adapter_files=[sibling_dict(s) for s in ai.siblings if Path(s.rfilename).suffix.lower() in safe_ext]
          aw=[x for x in adapter_files if x['rfilename']=='adapter_model.safetensors']
          assert len(aw)==1
          assert aw[0]['size']==adapter_expected_bytes,(aw[0]['size'],adapter_expected_bytes)
          if aw[0].get('lfs_sha256'):
              assert aw[0]['lfs_sha256']==adapter_expected_sha,(aw[0]['lfs_sha256'],adapter_expected_sha)
          base_weights=[x for x in base_files if x['rfilename'].endswith('.safetensors')]
          assert len(base_weights)==2,base_weights
          blocked=[x.rfilename for x in bi.siblings if Path(x.rfilename).suffix.lower() in {'.bin','.pt','.pth','.pkl','.pickle','.ckpt','.h5','.msgpack'}]
          base_identity_payload=json.dumps(base_weights,sort_keys=True,separators=(',',':')).encode()
          base_identity_digest=hashlib.sha256(base_identity_payload).hexdigest()
          (meta/'BASE_METADATA.json').write_text(json.dumps({'schema':'LUCIA_AA_R22535_C33_BASE_METADATA_V1','repo_id':base_repo,'revision':base_rev,'safe_files':base_files,'weight_files':base_weights,'weight_identity_digest':base_identity_digest,'remote_blocked_files':blocked,'raw_weight_bytes_downloaded':0,'training_time_base_revision_proven':False},indent=2,ensure_ascii=False,sort_keys=True)+'\n',encoding='utf-8')
          (meta/'ADAPTER_METADATA.json').write_text(json.dumps({'schema':'LUCIA_AA_R22535_C33_ADAPTER_METADATA_V1','repo_id':adapter_repo,'revision':adapter_rev,'safe_files':adapter_files,'expected_adapter_bytes':adapter_expected_bytes,'expected_adapter_sha256':adapter_expected_sha,'raw_weight_bytes_downloaded':0},indent=2,ensure_ascii=False,sort_keys=True)+'\n',encoding='utf-8')

          up=Path('tmp/fast-indic-tts/indic_prosody_frontend')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          source_files={'g2p.py':sha(up/'g2p.py'),'make_g2p_data.py':sha(up/'make_g2p_data.py'),'metrics.py':sha(up/'metrics.py')}
          provider_identity={'upstream_repo':upstream_repo,'upstream_revision':upstream_rev,'source_sha256':source_files,'espeak_ng_version':'1.52.0','espeak_ng_revision':espeak_rev,'phonemizer_version':importlib.metadata.version('phonemizer'),'phonemizer_release_revision':phonemizer_rev,'voice':'en-us','with_stress':False,'language_switch':'remove-flags','strip':True,'training_time_engine_version_proven':False,'training_time_phonemizer_version_proven':False,'reference_version_policy':'PINNED_REPRODUCIBLE_PRE_UPSTREAM_RELEASE_NOT_TRAINING_TIME_PROOF'}
          provider_digest=hashlib.sha256(json.dumps(provider_identity,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (meta/'REFERENCE_PROVIDER_IDENTITY.json').write_text(json.dumps({**provider_identity,'reference_provider_digest':provider_digest},indent=2,ensure_ascii=False,sort_keys=True)+'\n',encoding='utf-8')

          sys.path.insert(0,str(up.resolve()))
          import g2p
          rows=[json.loads(x) for x in (ref/'C33_INPUT_SUITE.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          texts=[r['input_text'] for r in rows]
          outputs=[]
          for i in range(0,len(texts),64): outputs.extend(g2p.espeak_g2p(texts[i:i+64]))
          assert len(outputs)==512
          label_rows=[]
          for r,ipa in zip(rows,outputs):
              ipa=unicodedata.normalize('NFC',str(ipa).strip()); assert ipa,r['case_id']
              label_rows.append({'case_id':r['case_id'],'input':r['input_text'],'reference_ipa':ipa,'reference_provider_digest':provider_digest})
          labels=ref/'C33_REFERENCE_LABELS.jsonl'
          labels.write_text(''.join(json.dumps(x,ensure_ascii=False,sort_keys=True)+'\n' for x in label_rows),encoding='utf-8')
          labels_sha=sha(labels)

          espeak_bin=os.environ['ESPEAK_BIN']
          def canon(s):
              s=unicodedata.normalize('NFC',s).replace('ˈ','').replace('ˌ','')
              return ''.join(ch for ch in s if not ch.isspace())
          cli=[];matches=0
          for r,ipa in zip(rows[:32],outputs[:32]):
              # Correct direct diagnostic: default --ipa matches the upstream phonemizer IPA mode.
              q=subprocess.run([espeak_bin,'-q','--ipa','-v','en-us',r['input_text']],capture_output=True,text=True,check=True).stdout.strip()
              eq=canon(q)==canon(ipa); matches+=int(eq)
              cli.append({'case_id':r['case_id'],'canonical_equal_after_stress_space_projection':eq,'phonemizer_sha256':hashlib.sha256(ipa.encode()).hexdigest(),'cli_sha256':hashlib.sha256(q.encode()).hexdigest()})
          assert matches==32,(matches,32)
          (meta/'REFERENCE_CLI_CROSSCHECK.json').write_text(json.dumps({'schema':'LUCIA_AA_R22535_C33_REFERENCE_CLI_CROSSCHECK_V2','subset_cases':32,'matches':matches,'mismatches':32-matches,'canonical_provider':'fast-indic-tts g2p.py + phonemizer','direct_cli_mode':'--ipa','projection':'NFC + remove primary/secondary stress + remove whitespace','diagnostic_only':True,'rows':cli},indent=2,sort_keys=True)+'\n')
          (meta/'REFERENCE_CROSSCHECK_AMENDMENT_001.json').write_text(json.dumps({'schema':'LUCIA_AA_R22535_C33_REFERENCE_CROSSCHECK_AMENDMENT_001','timing':'BEFORE_ANY_MODEL_WEIGHT_OR_MODEL_OUTPUT','original_reference_labels_changed':False,'input_suite_changed':False,'thresholds_changed':False,'cause':'Initial independent CLI diagnostic used --ipa=3, which inserts ZWJ tie markers and is not the upstream phonemizer default IPA surface. Raw diagnostic showed default --ipa is phonemically identical after the predeclared stress/space projection.','resolution':'Use default --ipa only for independent diagnostic crosscheck; keep exact upstream phonemizer provider canonical.','resolved_subset_matches':32,'resolved_subset_mismatches':0,'raw_weight_bytes_downloaded':0,'model_outputs_observed':0},indent=2,sort_keys=True)+'\n')

          binding={'schema':'LUCIA_AA_R22535_C33_RESOLVED_SOURCE_BINDING_V1','adapter_repo_id':adapter_repo,'adapter_revision':adapter_rev,'adapter_weight_sha256':adapter_expected_sha,'adapter_weight_bytes':adapter_expected_bytes,'base_repo_id':base_repo,'base_revision':base_rev,'base_weight_identity_digest':base_identity_digest,'base_weight_files':base_weights,'training_time_base_revision_proven':False,'reference_provider_repo':upstream_repo,'reference_provider_revision':upstream_rev,'reference_provider_digest':provider_digest,'reference_engine':'espeak-ng','reference_engine_revision':espeak_rev,'reference_engine_version':'1.52.0','reference_engine_version_status':'PINNED_REPRODUCIBLE_PRE_UPSTREAM_RELEASE_TRAINING_TIME_UNPROVEN','phonemizer_version':'3.3.0','phonemizer_revision':phonemizer_rev,'phonemizer_training_time_version_proven':False,'reference_labels_sha256':labels_sha,'reference_rows':512,'reference_crosscheck':'32/32_PASS_AFTER_DOCUMENTED_PREMODEL_AMENDMENT','raw_weight_bytes_downloaded':0,'model_outputs_observed':0}
          (meta/'R22535_C33_RESOLVED_SOURCE_BINDING.json').write_text(json.dumps(binding,indent=2,ensure_ascii=False,sort_keys=True)+'\n',encoding='utf-8')
          (meta/'R22535_C33_REFERENCE_MATERIALIZATION_RECEIPT.json').write_text(json.dumps({'schema':'LUCIA_AA_R22535_C33_REFERENCE_MATERIALIZATION_RECEIPT_V1','verdict':'PASS_REFERENCE_LABELS_MATERIALIZED_AND_CROSSCHECKED_PRE_MODEL','input_suite_sha256':sha(ref/'C33_INPUT_SUITE.jsonl'),'reference_labels_sha256':labels_sha,'reference_rows':512,'reference_provider_digest':provider_digest,'independent_cli_crosscheck':'32/32','raw_weight_bytes_downloaded':0,'model_loads':0,'model_outputs_observed':0},indent=2,sort_keys=True)+'\n')
          PY
          rm -rf tmp

      - name: Upload reference seal evidence
        uses: actions/upload-artifact@v4
        with:
          name: r22535-c33-reference-seal
          path: out
          retention-days: 1
          compression-level: 6
