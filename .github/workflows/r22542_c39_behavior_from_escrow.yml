name: LAA R22542 C39 behavior from authoritative escrow
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  actions: read
jobs:
  behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover authoritative escrow only, zero HF model requests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source/base work/source/candidate escrow runtime_art
          gh run download 31484392389 -R 'ojh850636-alt/-' -n r22542-c39-escrow-adapter -D escrow/adapter
          gh run download 31484392389 -R 'ojh850636-alt/-' -n r22542-c39-escrow-meta -D escrow/meta
          for i in $(seq -w 0 15); do gh run download 31484392389 -R 'ojh850636-alt/-' -n r22542-c39-base-$i -D escrow/base-$i; done
          cat $(for i in $(seq -w 0 15); do printf 'escrow/base-%s/base.part.%s ' "$i" "$i"; done) > work/source/base/model.safetensors-00001-of-00001.safetensors
          cp escrow/meta/config.json escrow/meta/model.safetensors.index.json escrow/meta/tokenizer.json escrow/meta/tokenizer_config.json work/source/base/
          cp escrow/adapter/adapter_model.safetensors work/source/candidate/
          cp escrow/meta/adapter_config.json work/source/candidate/
          echo 'aa33250c4fc64891ddfaba3a314fd9542ea371843c387178b425fbcc5ed680b1  work/source/base/model.safetensors-00001-of-00001.safetensors' | sha256sum -c -
          echo '4c4126ec284b9bcd64f2e38a26f242b02dace75b31547a65a9863e7bc10e4312  work/source/candidate/adapter_model.safetensors' | sha256sum -c -
          echo '5f9e4d4901a92b997e463c1f46055088b6cca5ca61a6522d1b9f64c4bb81cb42  work/source/base/tokenizer.json' | sha256sum -c -
          gh run download 31491939184 -R 'ojh850636-alt/-' -n r22542-c39-runtime-wheelhouse -D runtime_art
      - name: Install exact audited runtime, including exact torch wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p torch_wheel
          python -m pip download --no-deps --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0+cpu' -d torch_wheel
          TW=$(find torch_wheel -name 'torch-2.10.0+cpu-*.whl' -o -name 'torch-2.10.0%2Bcpu-*.whl' | head -1)
          test -n "$TW"
          echo 'ee40b8a4b4b2cf0670c6fd4f35a7ef23871af956fecb238fbf5da15a72650b1d  '"$TW" | sha256sum -c -
          python -m pip install --quiet "$TW"
          python -m pip install --quiet runtime_art/wheelhouse/*.whl
          python - <<'PY'
          import torch,transformers,peft,safetensors,tokenizers,accelerate,huggingface_hub
          from transformers import Qwen3_5ForCausalLM
          print({'torch':torch.__version__,'transformers':transformers.__version__,'peft':peft.__version__,'safetensors':safetensors.__version__,'tokenizers':tokenizers.__version__,'accelerate':accelerate.__version__,'hub':huggingface_hub.__version__,'model_class':Qwen3_5ForCausalLM.__name__})
          assert torch.__version__=='2.10.0+cpu'
          assert peft.__version__=='0.19.1'
          assert safetensors.__version__=='0.8.0'
          assert tokenizers.__version__=='0.22.2'
          assert accelerate.__version__=='1.14.0'
          assert huggingface_hub.__version__=='1.16.1'
          PY
      - name: Rebuild exact sealed suite and run behavior
        shell: bash
        run: |
          set -euo pipefail
          python r22542_c39/lean_tactic_forge.py work/C39_FRESH_LEAN_TACTIC_SUITE.jsonl > work/SUITE_RECEIPT.json
          grep -q 'a081ee299a7035337bb6fa6f6c380fb6d8cbd328534b049cd45a5fbe032338f2' work/SUITE_RECEIPT.json
          PYTHONPATH="$PWD/r22542_c39" WORK_ROOT="$PWD/work" python -B r22542_c39/c39_behavior_worker.py 2>&1 | tee work/behavior.log
      - name: Remove raw source before artifact publication
        if: always()
        shell: bash
        run: |
          rm -rf work/source escrow torch_wheel runtime_art
      - name: Upload raw-free behavior results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r22542-c39-behavior-results
          path: |
            work/result/
            work/SUITE_RECEIPT.json
            work/behavior.log
          retention-days: 1
