name: R22587 C68 readable canonical one-use
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  c68:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reassemble and verify reviewable runner before any model source
        run: |
          set -euo pipefail
          cat tools/r22587_c68_source_runner.part1.py tools/r22587_c68_source_runner.part2.py tools/r22587_c68_source_runner.part3.py tools/r22587_c68_source_runner.part4.py > /tmp/r22587_c68_source_runner.py
          test "$(sha256sum /tmp/r22587_c68_source_runner.py | awk '{print $1}')" = "7102884fb2f1d43faf659f70e26a1e83c8848b45495ebf6202c39b7ff348e202"
          python -m py_compile /tmp/r22587_c68_source_runner.py
      - name: Runtime dependency preflight before any model source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.12.0'
          python -m pip install --disable-pip-version-check 'transformers==5.0.0' 'peft==0.18.1' 'accelerate==1.14.0' 'safetensors==0.7.0' 'huggingface_hub==1.4.1' 'numpy==2.3.5' 'psutil==7.0.0'
          python - <<'PY'
          import torch,psutil,shutil
          from transformers import Qwen2Config,Qwen2ForCausalLM
          from peft import LoraConfig,get_peft_model
          free=shutil.disk_usage('.').free; mem=psutil.virtual_memory().available
          assert free > 7_000_000_000, free
          assert mem > 4_500_000_000, mem
          cfg=Qwen2Config(vocab_size=128,hidden_size=32,intermediate_size=64,num_hidden_layers=1,num_attention_heads=4,num_key_value_heads=2,max_position_embeddings=128)
          model=Qwen2ForCausalLM(cfg).to(dtype=torch.bfloat16)
          model=get_peft_model(model,LoraConfig(r=4,lora_alpha=8,target_modules=['q_proj','k_proj','v_proj','o_proj','gate_proj','up_proj','down_proj'])).eval()
          with torch.inference_mode(): logits=model(input_ids=torch.randint(0,128,(1,8))).logits
          assert logits.shape==(1,8,128) and torch.isfinite(logits.float()).all()
          print({'DEPENDENCY_PREFLIGHT_PASS':True,'torch':torch.__version__,'free_disk':free,'available_mem':mem})
          PY
      - name: Canonical one-use source and behavior run
        run: |
          set -euo pipefail
          python /tmp/r22587_c68_source_runner.py
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
      - name: Upload raw-free evidence even if source runner fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r22587-c68-readable-canonical-rawfree
          path: work/out/
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
      - name: Publish observable run receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          body={'body':f"R22587_C68_READABLE_RUN_ID={os.environ['RUN_ID']} SHA={os.environ['SHA']}"}
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues/100/comments",data=json.dumps(body).encode(),headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          try: print(urllib.request.urlopen(req,timeout=30).read().decode())
          except Exception as e: print('run receipt comment failed',e)
          PY
