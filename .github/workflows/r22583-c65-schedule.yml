name: R22583 C65 Schedule Constraint One-Use Archaeology
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r22583-c65-schedule
      - name: Compile sealed courier before network
        run: python -m py_compile tmp_r22583/c65_schedule_generator.py tmp_r22583/c65_schedule_runner.py
      - name: Install metadata capture dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir huggingface_hub==0.36.0 requests==2.32.5
      - name: Metadata, Base coherence, exact Adapter one-use capture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/capture source/adapter
          python -B tmp_r22583/c65_schedule_runner.py capture --out evidence/capture --escrow source/adapter --seal tmp_r22583/c65_schedule_seal.json
      - name: Upload raw-free capture evidence
        uses: actions/upload-artifact@v4
        with:
          name: r22583-c65-rawfree-capture
          path: evidence/capture/**
          retention-days: 1
          if-no-files-found: error
      - name: Publish exact run-scoped Adapter escrow before deep static
        uses: actions/upload-artifact@v4
        with:
          name: r22583-c65-adapter-escrow
          path: source/adapter/**
          retention-days: 1
          if-no-files-found: error
      - name: Remove local raw after escrow publication
        if: always()
        run: rm -rf source ~/.cache/huggingface

  static:
    needs: capture
    if: ${{ needs.capture.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r22583-c65-schedule
      - name: Compile sealed courier before escrow read
        run: python -m py_compile tmp_r22583/c65_schedule_generator.py tmp_r22583/c65_schedule_runner.py
      - uses: actions/download-artifact@v4
        with:
          name: r22583-c65-adapter-escrow
          path: source/adapter
      - name: Install dtype-capable static backend
        run: python -m pip install --disable-pip-version-check --no-cache-dir torch==2.10.0 safetensors==0.7.0
      - name: Deep static from escrow bytes only
        run: |
          mkdir -p evidence/static
          python -B tmp_r22583/c65_schedule_runner.py static --out evidence/static --adapter source/adapter
      - name: Upload raw-free static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r22583-c65-rawfree-static
          path: evidence/static/**
          retention-days: 1
          if-no-files-found: error
      - name: Remove local raw static copy
        if: always()
        run: rm -rf source ~/.cache/huggingface

  behavior:
    needs: [capture, static]
    if: ${{ needs.capture.result == 'success' && needs.static.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r22583-c65-schedule
      - name: Compile sealed courier before Base ingress
        run: python -m py_compile tmp_r22583/c65_schedule_generator.py tmp_r22583/c65_schedule_runner.py
      - uses: actions/download-artifact@v4
        with:
          name: r22583-c65-adapter-escrow
          path: source/adapter
      - uses: actions/download-artifact@v4
        with:
          name: r22583-c65-rawfree-capture
          path: prior/capture
      - name: Install ML runtime
        run: python -m pip install --disable-pip-version-check --no-cache-dir torch==2.10.0 transformers==4.57.1 peft==0.18.1 safetensors==0.7.0 huggingface_hub==0.36.0 accelerate==1.14.0 tokenizers==0.22.1
      - name: Acquire exact resolved runtime Base and hash object
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/base evidence/behavior
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from huggingface_hub import snapshot_download
          cap=json.loads(Path('prior/capture/C65_CAPTURE.json').read_text())
          repo=cap['base_runtime_repo']; rev=cap['base_runtime_revision']
          snapshot_download(repo_id=repo, revision=rev, local_dir='source/base', allow_patterns=['*.safetensors','*.json','*.jinja','tokenizer.model','*.tiktoken'], ignore_patterns=['*.bin','*.pt','*.pth','*.pkl','*.pickle','*.h5','*.msgpack','*.py','*.md'])
          files=[]
          for p in sorted(Path('source/base').rglob('*')):
              if not p.is_file() or '/.cache/' in p.as_posix(): continue
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''):h.update(b)
              files.append({'path':p.relative_to('source/base').as_posix(),'size':p.stat().st_size,'sha256':h.hexdigest()})
          weights=[x for x in files if x['path'].endswith('.safetensors')]
          if not weights: raise SystemExit('no safetensors Base weights')
          out={'schema':'R22583_C65_BASE_RUNTIME_OBJECT_V1','repo':repo,'runtime_revision':rev,'role':'runtime_reference_base_not_proven_training_revision','new_source_credit':0,'training_time_revision_from_adapter_config':cap.get('training_base_revision'),'files':files,'weight_file_count':len(weights),'weight_bytes':sum(x['size'] for x in weights),'total_bytes':sum(x['size'] for x in files)}
          Path('evidence/behavior/C65_BASE_RUNTIME_OBJECT.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Canonical behavior controls and gated causal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/variants
          python -B tmp_r22583/c65_schedule_runner.py behavior --out evidence/behavior --adapter source/adapter --base source/base --tmp source/variants --seal tmp_r22583/c65_schedule_seal.json --capture-json prior/capture/C65_CAPTURE.json
      - name: Raw-free local cleanup and evidence index
        if: always()
        shell: bash
        run: |
          rm -rf source ~/.cache/huggingface
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          rows=[]
          for p in sorted(Path('evidence').rglob('*')):
              if p.is_file():
                  b=p.read_bytes(); rows.append({'path':p.as_posix(),'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          Path('R22583_C65_EVIDENCE_INDEX.json').write_text(json.dumps({'schema':'R22583_C65_EVIDENCE_INDEX_V1','files':rows},indent=2,sort_keys=True))
          Path('R22583_C65_LOCAL_RAW_DELETE.json').write_text(json.dumps({'local_raw_remaining':0,'adapter_hf_redownload':0,'base_role':'runtime_reference_base_not_proven_training_revision','raw_committed_to_git':False},indent=2,sort_keys=True))
          PY
      - name: Upload raw-free behavior evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r22583-c65-rawfree-behavior
          path: |
            evidence/**
            R22583_C65_EVIDENCE_INDEX.json
            R22583_C65_LOCAL_RAW_DELETE.json
          retention-days: 1
          if-no-files-found: error

  cleanup:
    needs: [capture, static, behavior]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete exact current-run Adapter escrow and prove absence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p cleanup
          meta="$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)"
          ART_ID="$(printf '%s' "$meta" | python -c 'import json,sys; a=[x for x in json.load(sys.stdin)["artifacts"] if x["name"]=="r22583-c65-adapter-escrow"]; print(a[0]["id"] if len(a)==1 else "")')"
          if [ -z "$ART_ID" ]; then
            echo '{"schema":"R22583_C65_EXACT_ESCROW_DELETE_V1","artifact_id":null,"reason":"no unique current-run escrow; capture failed before publication"}' > cleanup/R22583_C65_REMOTE_ESCROW_DELETE.json
            exit 0
          fi
          ameta="$(gh api repos/${{ github.repository }}/actions/artifacts/$ART_ID)"
          name="$(printf '%s' "$ameta" | python -c 'import json,sys;print(json.load(sys.stdin)["name"])')"
          run_id="$(printf '%s' "$ameta" | python -c 'import json,sys;print(json.load(sys.stdin)["workflow_run"]["id"])')"
          head_sha="$(printf '%s' "$ameta" | python -c 'import json,sys;print(json.load(sys.stdin)["workflow_run"]["head_sha"])')"
          test "$name" = r22583-c65-adapter-escrow
          test "$run_id" = "${{ github.run_id }}"
          test "$head_sha" = "${{ github.event.pull_request.head.sha }}"
          code="$(curl -sS -o /tmp/del.out -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ART_ID")"
          lookup="$(curl -sS -o /tmp/lookup.out -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ART_ID")"
          printf '{"schema":"R22583_C65_EXACT_ESCROW_DELETE_V1","artifact_id":%s,"run_id":%s,"head_sha":"%s","identity_predelete_verified":true,"delete_http":%s,"lookup_after_delete_http":%s}\n' "$ART_ID" "$run_id" "$head_sha" "$code" "$lookup" > cleanup/R22583_C65_REMOTE_ESCROW_DELETE.json
          test "$code" = 204
          test "$lookup" = 404
      - uses: actions/upload-artifact@v4
        with:
          name: r22583-c65-rawfree-cleanup
          path: cleanup/**
          retention-days: 1
          if-no-files-found: error
