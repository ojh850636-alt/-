name: R22592 C73 source-free lineage recovery
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover metadata audit and attempt1 without model network
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT_BRANCH: r22592-c73-evidence-recovery-receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,urllib.request,urllib.error,base64,datetime
          token=os.environ['GH_TOKEN'];repo=os.environ['REPO'];branch=os.environ['OUT_BRANCH']
          targets=[
            {'role':'metadata_audit','sha':'f68cede9132c450bd30dc72bf6c52cc6255778b4','path':'.github/workflows/r22592_c73_metadata_audit.yml'},
            {'role':'source_attempt1','sha':'59295dfb3e6e21e209bf7373e4457cb59ffa617c','path':'.github/workflows/r22592_c73_rfc6902_one_use.yml'},
          ]
          H={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22592-C73-lineage-recovery'}
          def api(path):
              req=urllib.request.Request('https://api.github.com'+path,headers=H)
              with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode())
          recovered=[]
          for t in targets:
              d=api(f"/repos/{repo}/actions/runs?head_sha={t['sha']}&per_page=100")
              hits=[]
              for r in d.get('workflow_runs',[]):
                  if r.get('path')!=t['path']: continue
                  jobs=api(f"/repos/{repo}/actions/runs/{r['id']}/jobs?per_page=100").get('jobs',[])
                  arts=api(f"/repos/{repo}/actions/runs/{r['id']}/artifacts?per_page=100").get('artifacts',[])
                  hits.append({'id':r['id'],'name':r.get('name'),'path':r.get('path'),'event':r.get('event'),'status':r.get('status'),'conclusion':r.get('conclusion'),'head_sha':r.get('head_sha'),'created_at':r.get('created_at'),'updated_at':r.get('updated_at'),'run_number':r.get('run_number'),'jobs':[{'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion')} for j in jobs],'artifacts':[{'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'digest':a.get('digest'),'expired':a.get('expired')} for a in arts]})
              if not hits: raise SystemExit('NO_MATCHING_RUN:'+t['role'])
              recovered.append({'role':t['role'],'target_sha':t['sha'],'target_path':t['path'],'runs':hits})
          out={'schema':'R22592_C73_SOURCE_FREE_LINEAGE_RECOVERY_V1','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'huggingface_calls':0,'model_or_adapter_network_calls':0,'targets':recovered}
          b=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode();path='recovery/R22592_C73_LINEAGE_RECOVERY_V1.json'
          existing=None
          try: existing=api(f'/repos/{repo}/contents/{path}?ref={branch}')
          except urllib.error.HTTPError as e:
              if e.code!=404: raise
          payload={'message':'Persist source-free R22592 C73 lineage recovery','content':base64.b64encode(b).decode(),'branch':branch}
          if isinstance(existing,dict) and existing.get('sha'): payload['sha']=existing['sha']
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=json.dumps(payload).encode(),headers={**H,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r:res=json.loads(r.read().decode())
          print(json.dumps({'PASS':True,'target_count':len(recovered),'receipt_path':path,'content_sha':res.get('content',{}).get('sha'),'huggingface_calls':0},indent=2))
          PY
