name: R22594 C75 metadata-only hard-new-family audit
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: r22594-c75-metadata-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Immutable API and text only audit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT_BRANCH: r22594-c75-metadata-receipt
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p work/out
          python - <<'PY'
          import urllib.request,urllib.error,json,re,hashlib,datetime,os,base64
          from pathlib import Path
          UA={'User-Agent':'LUCIA-AA-R22594-C75-metadata-only'}
          DEDUP_SHA='ffb7a0c01cd5a7da44953ac6dbf854ddebf831fa5d5f47b4cec65b02f4bfa44b'
          CANDS=[
            {'id':'C75-A','repo':'leom21/cron-lora','family':'DECLARATIVE_CRON_RECURRENCE_SET_DENOTATION','anchor_groups':[['cron']],'verifier_quality':30,'novelty':28,'cost':28},
            {'id':'C75-B','repo':'Petanque/flow-forge-mermaid-th','family':'NATURAL_LANGUAGE_TO_MERMAID_GRAPH_AST_AND_DENOTATION','anchor_groups':[['mermaid'],['diagram']],'verifier_quality':30,'novelty':27,'cost':26},
            {'id':'C75-C','repo':'Melikshah/dc_ops_grpo_lora','family':'DATACENTER_THERMAL_POWER_STATE_TO_PHYSICS_GROUNDED_OPERATOR_ACTION','anchor_groups':[['datacenter','data center','dc-ops'],['thermal','power','cooling']],'verifier_quality':35,'novelty':30,'cost':8},
            {'id':'C75-D','repo':'pushpam14/api-contract-validator-grpo-7b','family':'OPENAPI_BREAKING_CHANGE_TO_DOWNSTREAM_BLAST_RADIUS_AND_BACKWARD_COMPAT_FIX','anchor_groups':[['openapi'],['blast radius'],['consumer','downstream']],'verifier_quality':35,'novelty':30,'cost':8},
            {'id':'C75-E','repo':'smjain/graphql','family':'NATURAL_LANGUAGE_TO_GRAPHQL_AST_AND_SCHEMA_EXECUTION_DENOTATION','anchor_groups':[['graphql']],'verifier_quality':30,'novelty':29,'cost':5},
          ]
          def get(url,limit=6_000_000):
            req=urllib.request.Request(url,headers=UA)
            with urllib.request.urlopen(req,timeout=60) as r:
              b=r.read(limit+1)
              if len(b)>limit: raise RuntimeError('META_TOO_LARGE:'+url)
              return b
          def getj(url): return json.loads(get(url).decode())
          def raw(repo,sha,name): return get(f'https://huggingface.co/{repo}/raw/{sha}/{name}').decode('utf-8','replace')
          def sibling(info,name):
            for x in info.get('siblings') or []:
              if x.get('rfilename')==name:
                l=x.get('lfs') or {}
                return {'name':name,'size':l.get('size') or x.get('size'),'sha256':str(l.get('sha256') or l.get('oid') or '').replace('sha256:',''),'blob_id':x.get('blobId')}
            return None
          def small_texts(repo,sha,info):
            out=[]
            for x in info.get('siblings') or []:
              n=x.get('rfilename') or ''
              z=(x.get('lfs') or {}).get('size') or x.get('size') or 0
              if z and z>1_000_000: continue
              if not re.search(r'(^README\.md$|\.(md|json|txt|ya?ml|toml)$)',n,re.I): continue
              try: out.append((n,raw(repo,sha,n)))
              except Exception: pass
            return out
          def exact_base_proofs(base,cfg,texts):
            proofs=[]
            cr=cfg.get('revision') if isinstance(cfg,dict) else None
            if isinstance(cr,str) and re.fullmatch(r'[0-9a-f]{40}',cr):
              try:
                bi=getj(f'https://huggingface.co/api/models/{base}/revision/{cr}')
                if bi.get('sha')==cr: proofs.append({'revision':cr,'file':'adapter_config.json','reason':'config_revision_api_verified'})
              except Exception: pass
            if proofs:return proofs
            for n,t in texts:
              for m in re.finditer(r'(?<![0-9a-f])[0-9a-f]{40}(?![0-9a-f])',t,re.I):
                tok=m.group(0).lower();ctx=t[max(0,m.start()-220):min(len(t),m.end()+220)]
                if not re.search(r'(base|training).{0,120}(revision|commit|snapshot)|(?:revision|commit|snapshot).{0,120}(base|training)',ctx,re.I|re.S): continue
                if base.lower() not in t.lower() and base.split('/')[-1].lower() not in ctx.lower(): continue
                try:
                  bi=getj(f'https://huggingface.co/api/models/{base}/revision/{tok}')
                  if bi.get('sha')==tok: proofs.append({'revision':tok,'file':n,'context_sha256':hashlib.sha256(ctx.encode()).hexdigest()})
                except Exception: pass
            return proofs[:4]
          rows=[]
          for c in CANDS:
            row={**c,'dedup_preseal_sha256':DEDUP_SHA,'weight_path_get_count':0,'model_weight_bytes':0,'hard_reject_reasons':[],'semantic_anchor_matches':{}}
            try:
              info=getj('https://huggingface.co/api/models/'+c['repo']+'?blobs=true')
              sha=info.get('sha');row['immutable_revision']=sha
              if not re.fullmatch(r'[0-9a-f]{40}',str(sha)): row['hard_reject_reasons'].append('NO_IMMUTABLE_SHA')
              card=info.get('cardData') or {};lic=card.get('license');row['license']=lic;row['license_clear']=bool(lic and str(lic).lower() not in {'other','unknown'})
              if not row['license_clear']: row['hard_reject_reasons'].append('LICENSE_UNCLEAR')
              texts=small_texts(c['repo'],sha,info); corpus='\n'.join(t for _,t in texts).lower()
              for j,g in enumerate(c['anchor_groups']): row['semantic_anchor_matches'][str(j)]=[a for a in g if a.lower() in corpus]
              row['semantic_task_clear']=all(bool(row['semantic_anchor_matches'][str(j)]) for j in range(len(c['anchor_groups'])))
              if not row['semantic_task_clear']: row['hard_reject_reasons'].append('SEMANTIC_TASK_UNCLEAR_FROM_IMMUTABLE_TEXT')
              cfg=None
              try: cfg=json.loads(raw(c['repo'],sha,'adapter_config.json'))
              except Exception: pass
              row['adapter_config_present']=isinstance(cfg,dict)
              if not isinstance(cfg,dict): row['hard_reject_reasons'].append('NO_ADAPTER_CONFIG')
              if isinstance(cfg,dict):
                row.update({'peft_type':cfg.get('peft_type'),'base_model_name_or_path':cfg.get('base_model_name_or_path'),'r':cfg.get('r'),'lora_alpha':cfg.get('lora_alpha'),'lora_dropout':cfg.get('lora_dropout'),'target_modules':sorted(cfg.get('target_modules') or []),'modules_to_save':cfg.get('modules_to_save'),'adapter_config_revision':cfg.get('revision')})
                if cfg.get('peft_type')!='LORA': row['hard_reject_reasons'].append('NOT_LORA')
                if cfg.get('modules_to_save') not in (None,[]): row['hard_reject_reasons'].append('AUX_MODULES_TO_SAVE')
              w=sibling(info,'adapter_model.safetensors') or sibling(info,'adapters.safetensors')
              row['adapter_lfs']=w
              if not w or not w.get('size') or not re.fullmatch(r'[0-9a-f]{64}',str(w.get('sha256') or '')): row['hard_reject_reasons'].append('NO_ADAPTER_LFS_IDENTITY')
              base=(cfg or {}).get('base_model_name_or_path')
              row['declared_base']=base
              proofs=exact_base_proofs(base,cfg,texts) if base else []
              row['exact_training_base_revision_proofs']=proofs
              row['exact_training_base_revision_proven']=bool(proofs)
              row['exact_training_base_revision']=proofs[0]['revision'] if proofs else None
              size=int(w['size']) if w and w.get('size') else 10**12
              source_cost=25 if size<100_000_000 else (18 if size<200_000_000 else 5)
              row['admission_score']=(50 if proofs else 0)+(20 if row['license_clear'] else 0)+c['verifier_quality']+c['novelty']+source_cost+c['cost']-(100 if row['hard_reject_reasons'] else 0)
              row['hard_new_admissible']=not row['hard_reject_reasons']
            except Exception as e:
              row['hard_reject_reasons'].append('META_AUDIT_ERROR:'+type(e).__name__+':'+str(e)[:180]);row['hard_new_admissible']=False;row['admission_score']=-999
            rows.append(row)
          hard=[r for r in rows if r.get('hard_new_admissible')]
          source_authorized=len(hard)>=3
          selected=None;lane='NO_SOURCE_MINIMUM_3_HARD_NEW_NOT_MET'
          if source_authorized:
            selected=max(hard,key=lambda r:(bool(r.get('exact_training_base_revision_proven')),r.get('admission_score',-999)))
            lane='BEHAVIOR_AUTHORIZED_IF_EXACT_BASE' if selected.get('exact_training_base_revision_proven') else 'ADAPTER_ONLY_E1_STATIC'
          out={'schema':'R22594_C75_METADATA_ONLY_HARD_NEW_AUDIT_V1','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'dedup_preseal_sha256':DEDUP_SHA,'weight_path_get_count':0,'model_weight_bytes':0,'minimum_hard_new_required':3,'hard_new_admissible_count':len(hard),'source_authorized':source_authorized,'candidates':rows,'selection':{'selected':selected['id'] if selected else None,'repo':selected['repo'] if selected else None,'lane':lane,'policy':'DEDUP and immutable semantic task proof first. Require >=3 hard-new admissible families before any source. Then exact training Base > verifier > novelty > source/runtime cost.'}}
          p=Path('work/out/R22594_C75_METADATA_ONLY_HARD_NEW_AUDIT.json');p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          H={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22594-C75-receipt','Content-Type':'application/json'}
          b=p.read_bytes();path=f"recovery/R22594_C75_METADATA_AUDIT_RUN_{os.environ['RUN_ID']}.json";payload=json.dumps({'message':'Persist R22594 C75 metadata audit','content':base64.b64encode(b).decode(),'branch':os.environ['OUT_BRANCH']}).encode();req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}",data=payload,headers=H,method='PUT');urllib.request.urlopen(req,timeout=30).read()
          print(json.dumps({'PASS':True,'hard_new_admissible_count':len(hard),'source_authorized':source_authorized,'selected':selected['id'] if selected else None,'lane':lane,'weight_path_get_count':0},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r22594-c75-metadata-only
          path: work/out/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Persist unique run identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT_BRANCH: r22594-c75-metadata-receipt
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,base64,time,datetime
          H={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22594-C75-run','Content-Type':'application/json'}
          arts=[]
          for _ in range(10):
            req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}/artifacts?per_page=100",headers=H)
            with urllib.request.urlopen(req,timeout=30) as r:d=json.loads(r.read().decode())
            arts=d.get('artifacts',[])
            if arts: break
            time.sleep(2)
          out={'schema':'R22594_C75_METADATA_RUN_RECEIPT_V1','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'run_id':int(os.environ['RUN_ID']),'head_sha':os.environ['HEAD_SHA'],'huggingface_weight_path_get_count':0,'model_weight_bytes':0,'artifacts':[{'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'digest':a.get('digest'),'expired':a.get('expired')} for a in arts]}
          b=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode();path=f"recovery/R22594_C75_METADATA_RUN_{os.environ['RUN_ID']}.json";payload=json.dumps({'message':'Persist R22594 C75 metadata run identity','content':base64.b64encode(b).decode(),'branch':os.environ['OUT_BRANCH']}).encode();req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}",data=payload,headers=H,method='PUT');urllib.request.urlopen(req,timeout=30).read()
          PY