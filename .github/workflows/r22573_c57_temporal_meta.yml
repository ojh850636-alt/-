name: R22573 C57 Calendar Temporal Archaeology
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  archaeology:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact presealed runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/scripts/r22573_c57_runner.py)" = 'edf828d8d8194d2cf6004a47f253545c32fe4f13'
          PYTHONDONTWRITEBYTECODE=1 python -B -m py_compile .github/scripts/r22573_c57_runner.py
          find . -name '__pycache__' -type d -prune -exec rm -rf {} +
      - name: Source-free preoutput seal and verifier mutations
        shell: bash
        run: |
          set -euo pipefail
          rm -rf rawfree c57-work
          PYTHONDONTWRITEBYTECODE=1 python -B .github/scripts/r22573_c57_runner.py preseal --out rawfree
          python - <<'PY'
          import json
          s=json.load(open('rawfree/C57_PREOUTPUT_SEAL.json'))
          assert s['weights_present']==0 and s['model_outputs_observed']==0 and s['training_rows_used']==0
          assert s['suite_n']==64 and s['suite_sha256']=='40ea86d5f2a594c553b8a27aae22af9424263797cb7cb9d85cfaa2ff53f71cc5'
          assert s['verifier_smoke']['perfect']['semantic']==1.0
          assert s['verifier_smoke']['date_mutation_semantic']<0.9
          print('PRESEAL_PASS',s['suite_sha256'])
          PY
      - name: Install bounded runtime before binary
        shell: bash
        run: |
          set -euo pipefail
          export HF_HOME="$RUNNER_TEMP/hf-home-c57"
          python -m pip install -q --upgrade pip
          python -m pip install -q 'torch>=2.8,<3' 'transformers>=4.48,<5' 'peft>=0.17,<0.19' 'safetensors>=0.6,<1' 'huggingface_hub>=0.33,<2' 'accelerate>=1,<2'
      - name: Exact architecture wallclock and padding preflight
        shell: bash
        run: |
          set -euo pipefail
          export HF_HOME="$RUNNER_TEMP/hf-home-c57"
          PYTHONDONTWRITEBYTECODE=1 python -B .github/scripts/r22573_c57_runner.py runtime-smoke --out rawfree
          test ! -e c57-work
          python - <<'PY'
          import json
          r=json.load(open('rawfree/C57_RUNTIME_PREFLIGHT.json'))
          assert r['pass'] and r['selected_tier'] in {'LARGE','MEDIUM','SMALL'}
          assert all(r['left_padding_batch_single_equivalence'])
          print('RUNTIME_PREFLIGHT_PASS',r['selected_tier'],r['tier_estimates_seconds'])
          PY
      - name: One-use exact ingress behavior controls and conditional causal screen
        id: execute
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export HF_HOME="$RUNNER_TEMP/hf-home-c57"
          PYTHONDONTWRITEBYTECODE=1 python -B .github/scripts/r22573_c57_runner.py execute --out rawfree --work c57-work
      - name: Always destructive cleanup and raw-free export
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export HF_HOME="$RUNNER_TEMP/hf-home-c57"
          rm -rf c57-work "$HF_HOME"
          EXEC='${{ steps.execute.outcome }}'
          python - "$EXEC" <<'PY'
          import json,pathlib,re,hashlib,sys
          root=pathlib.Path('rawfree');root.mkdir(exist_ok=True);outcome=sys.argv[1]
          cp=root/'C57_CLEANUP.json'
          if not cp.exists():cp.write_text(json.dumps({'schema':'R22573_C57_CLEANUP_V1','controlled_cleanup_by_workflow':True,'execute_outcome':outcome,'raw_root_deleted':True,'hf_cache_deleted':True,'raw_weights_remaining':0,'raw_tokenizer_remaining':0},indent=2))
          else:
            x=json.load(open(cp));x.update({'controlled_cleanup_by_workflow':True,'execute_outcome':outcome,'hf_cache_deleted':True,'raw_weights_remaining':0,'raw_tokenizer_remaining':0});cp.write_text(json.dumps(x,indent=2))
          if outcome!='success' and not (root/'C57_ABORT.json').exists():(root/'C57_ABORT.json').write_text(json.dumps({'schema':'R22573_C57_ABORT_V1','execute_outcome':outcome,'scientific_increment':0,'claim':'NO_BEHAVIOR_OR_CAUSAL_CREDIT_FROM_ABORTED_RUN'},indent=2))
          bad=[]
          for p in root.rglob('*'):
            if not p.is_file():continue
            n=p.name.lower()
            if re.search(r'\.(safetensors|bin|pt|pth|pkl|pickle|model|npy|npz)$',n):bad.append(str(p))
            if n.startswith('tokenizer') or n in {'vocab.json','merges.txt','special_tokens_map.json'}:bad.append(str(p))
          assert not bad,bad
          lines=[]
          for p in sorted(root.rglob('*')):
            if p.is_file() and p.name!='SHA256SUMS.txt':lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}")
          (root/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          print('RAW_FREE_PASS',len(lines),'execute',outcome)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r22573-c57-rawfree-evidence
          path: rawfree/
          retention-days: 1
          if-no-files-found: error
      - name: Preserve scientific failure status after evidence escrow
        if: always()
        shell: bash
        run: test '${{ steps.execute.outcome }}' = 'success'
