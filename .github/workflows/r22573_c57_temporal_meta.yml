name: R22573 C57 135M Temporal Adapter Discovery
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Query 135M adapter trees without weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,urllib.request,urllib.parse,pathlib,hashlib
          bases=['HuggingFaceTB/SmolLM-135M','HuggingFaceTB/SmolLM2-135M','HuggingFaceTB/SmolLM2-135M-Instruct']
          terms=['calendar','event','date','schedule','temporal','extraction','json']
          def jget(u):
            req=urllib.request.Request(u,headers={'User-Agent':'LAA-R22573-135m/1.0'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          rec=[];seen=set()
          for base in bases:
            urls=[
              'https://huggingface.co/api/models?filter='+urllib.parse.quote('base_model:adapter:'+base,safe=':/')+'&limit=200&full=true',
              'https://huggingface.co/api/models?search='+urllib.parse.quote(base.split('/')[-1])+'&limit=200&full=true']
            for u in urls:
              try:rows=jget(u)
              except Exception:continue
              for m in rows:
                rid=m.get('id') or m.get('modelId');
                if not rid or rid in seen:continue
                seen.add(rid);txt=(rid+' '+str(m.get('tags'))+' '+str(m.get('cardData'))).lower()
                if not any(t in txt for t in terms):continue
                try:
                  d=jget('https://huggingface.co/api/models/'+urllib.parse.quote(rid,safe='/')+'?blobs=true');sha=d.get('sha');card=d.get('cardData') or {};sib=d.get('siblings') or [];names={x.get('rfilename') for x in sib}
                  if 'adapter_config.json' not in names:continue
                  req=urllib.request.Request(f'https://huggingface.co/{rid}/resolve/{sha}/adapter_config.json',headers={'User-Agent':'LAA-R22573-135m/1.0'});cfg=json.loads(urllib.request.urlopen(req,timeout=20).read())
                  saf=[]
                  for x in sib:
                    if x.get('rfilename')=='adapter_model.safetensors':
                      l=x.get('lfs') or {};saf.append({'size':x.get('size') or l.get('size'),'sha256':l.get('sha256')})
                  rec.append({'repo':rid,'revision':sha,'license':card.get('license') or d.get('license'),'base':cfg.get('base_model_name_or_path'),'r':cfg.get('r'),'targets':cfg.get('target_modules'),'safetensors':saf,'tags':d.get('tags')})
                except Exception:continue
          out={'schema':'R22573_C57_135M_DISCOVERY_V1','weight_bytes_downloaded':0,'model_outputs_observed':0,'candidates':rec};p=pathlib.Path('out/R22573_C57_135M_DISCOVERY.json');p.write_text(json.dumps(out,ensure_ascii=False,indent=2));pathlib.Path('out/SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n');print(json.dumps(rec,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22573-c57-135m-discovery
          path: out/
          retention-days: 1
          if-no-files-found: error
