name: R22573 C57 TinyBERT Adapter Discovery
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Discover adapter-only LoRAs on safe tiny BERT bases without weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,urllib.request,urllib.parse,pathlib,hashlib,re
          bases=['google/bert_uncased_L-2_H-128_A-2','google/bert_uncased_L-4_H-256_A-4','google/bert_uncased_L-6_H-256_A-4','google/bert_uncased_L-4_H-512_A-8']
          def jget(u):
            req=urllib.request.Request(u,headers={'User-Agent':'LAA-R22573-tinybert/1.0'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          def tget(repo,sha,path,limit=50000):
            req=urllib.request.Request(f'https://huggingface.co/{repo}/resolve/{sha}/{path}',headers={'User-Agent':'LAA-R22573-tinybert/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=20) as r:return r.read(limit+1).decode('utf-8','replace')[:limit]
            except Exception:return None
          candidates=[];seen=set();base_records=[]
          for base in bases:
            try:
              bm=jget('https://huggingface.co/api/models/'+urllib.parse.quote(base,safe='/')+'?blobs=true');bcard=bm.get('cardData') or {};bf=[]
              for x in bm.get('siblings') or []:
                if x.get('rfilename') in {'model.safetensors','config.json'}:
                  l=x.get('lfs') or {};bf.append({'name':x.get('rfilename'),'size':x.get('size') or l.get('size'),'sha256':l.get('sha256')})
              base_records.append({'repo':base,'revision':bm.get('sha'),'license':bcard.get('license') or bm.get('license'),'files':bf})
            except Exception as e:base_records.append({'repo':base,'error':repr(e)})
            urls=[
              'https://huggingface.co/api/models?filter='+urllib.parse.quote('base_model:adapter:'+base,safe=':/')+'&limit=200&full=true',
              'https://huggingface.co/api/models?search='+urllib.parse.quote(base.split('/')[-1])+'&limit=200&full=true']
            for u in urls:
              try:rows=jget(u)
              except Exception:continue
              for m in rows:
                rid=m.get('id') or m.get('modelId')
                if not rid or rid in seen:continue
                seen.add(rid)
                try:
                  d=jget('https://huggingface.co/api/models/'+urllib.parse.quote(rid,safe='/')+'?blobs=true');sha=d.get('sha');card=d.get('cardData') or {};sib=d.get('siblings') or [];names={x.get('rfilename') for x in sib}
                  if 'adapter_config.json' not in names or 'adapter_model.safetensors' not in names:continue
                  s=tget(rid,sha,'adapter_config.json');cfg=json.loads(s) if s else None
                  if not cfg or cfg.get('base_model_name_or_path') not in bases:continue
                  readme=tget(rid,sha,'README.md',60000) if 'README.md' in names else ''
                  sf=next((x for x in sib if x.get('rfilename')=='adapter_model.safetensors'),None);l=(sf or {}).get('lfs') or {}
                  candidates.append({'repo':rid,'revision':sha,'license':card.get('license') or d.get('license'),'base':cfg.get('base_model_name_or_path'),'task_type':cfg.get('task_type'),'r':cfg.get('r'),'alpha':cfg.get('lora_alpha'),'targets':cfg.get('target_modules'),'modules_to_save':cfg.get('modules_to_save'),'adapter_size':(sf or {}).get('size') or l.get('size'),'adapter_sha256':l.get('sha256'),'datasets':card.get('datasets'),'pipeline_tag':d.get('pipeline_tag'),'readme_excerpt':(readme or '')[:8000]})
                except Exception:continue
          out={'schema':'R22573_C57_TINYBERT_ADAPTER_DISCOVERY_V1','weight_bytes_downloaded':0,'model_outputs_observed':0,'bases':base_records,'candidate_count':len(candidates),'candidates':candidates};p=pathlib.Path('out/R22573_C57_TINYBERT_ADAPTER_DISCOVERY.json');p.write_text(json.dumps(out,ensure_ascii=False,indent=2));pathlib.Path('out/SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n');print(json.dumps([{k:c.get(k) for k in ['repo','license','base','task_type','datasets']} for c in candidates],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22573-c57-tinybert-discovery
          path: out/
          retention-days: 1
          if-no-files-found: error
