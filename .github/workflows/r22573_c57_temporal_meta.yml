name: R22573 C57 EOT Base Binding Audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - name: Bind Vurtnec adapter and exact SmolLM2-135M base without weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,urllib.request,urllib.parse,pathlib,hashlib
          repos=['Vurtnec/eot-detector-smollm2','HuggingFaceTB/SmolLM2-135M']
          def jget(u):
            req=urllib.request.Request(u,headers={'User-Agent':'LAA-R22573-eot-bind/1.0'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          rec={}
          for repo in repos:
            m=jget('https://huggingface.co/api/models/'+urllib.parse.quote(repo,safe='/')+'?blobs=true');sha=m.get('sha');card=m.get('cardData') or {};files=[]
            for x in m.get('siblings') or []:
              l=x.get('lfs') or {};n=x.get('rfilename')
              if n in {'model.safetensors','adapter_model.safetensors','adapter_config.json','config.json','tokenizer.json','tokenizer_config.json','special_tokens_map.json'}:files.append({'name':n,'size':x.get('size') or l.get('size'),'lfs_sha256':l.get('sha256')})
            rec[repo]={'revision':sha,'license':card.get('license') or m.get('license'),'files':files,'tags':m.get('tags') or []}
          out={'schema':'R22573_C57_EOT_BASE_BINDING_V1','weight_bytes_downloaded':0,'model_outputs_observed':0,'records':rec};p=pathlib.Path('out/R22573_C57_EOT_BASE_BINDING.json');p.write_text(json.dumps(out,ensure_ascii=False,indent=2));pathlib.Path('out/SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n');print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22573-c57-eot-base-binding
          path: out/
          retention-days: 1
          if-no-files-found: error
