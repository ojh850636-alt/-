name: LAA R22542 C39 source-zero Lean runtime preseal
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  preseal:
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_REPO: markm39/openproof-tactic-2b
      CANDIDATE_REV: 26b4c66606de4e73139a377f8026df93907c12b9
      BASE_REPO: Qwen/Qwen3.5-2B
      SUITE_SHA: ca0338cbb067c4f4b807bac0d389e8b946780906ed5562cd0949bd9541ba58a2
      CANONICAL_SHA: 966f240d6a07c6abc868dd5cd0341a55f20ab19c6b18ffdf4ce8ea882462d54b
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-zero Python dependency closure and Base metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report work/wheels
          python -m pip download --quiet --dest work/wheels --only-binary=:all: 'transformers==5.0.0' 'peft==0.18.1' 'safetensors==0.7.0' 'accelerate==1.14.0' 'huggingface-hub==0.36.0'
          python -m pip download --quiet --dest work/wheels --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install --quiet --no-index --find-links work/wheels 'torch==2.10.0' 'transformers==5.0.0' 'peft==0.18.1' 'safetensors==0.7.0' 'accelerate==1.14.0' 'huggingface-hub==0.36.0'
          python - <<'PY'
          import hashlib,json,platform,sys
          from pathlib import Path
          import torch,transformers,peft,safetensors,accelerate,huggingface_hub
          from huggingface_hub import HfApi,hf_hub_download
          from transformers import AutoConfig,AutoModelForCausalLM
          api=HfApi(); brepo='Qwen/Qwen3.5-2B'; crepo='markm39/openproof-tactic-2b'; crev='26b4c66606de4e73139a377f8026df93907c12b9'
          b=api.model_info(brepo,files_metadata=True); c=api.model_info(crepo,revision=crev,files_metadata=True)
          cfgp=Path(hf_hub_download(brepo,filename='config.json',revision=b.sha)); cfg_bytes=cfgp.read_bytes()
          cfg=AutoConfig.from_pretrained(brepo,revision=b.sha,trust_remote_code=False)
          model_cls=AutoModelForCausalLM._model_mapping[type(cfg)]
          def sibs(info):
            out=[]
            for s in info.siblings:
              if s.rfilename.endswith('.safetensors') or s.rfilename in {'config.json','generation_config.json','tokenizer_config.json','tokenizer.json','adapter_config.json'}:
                l=getattr(s,'lfs',None)
                out.append({'path':s.rfilename,'size':getattr(s,'size',None),'lfs_sha256':getattr(l,'sha256',None) if l else None})
            return out
          wheels=[]
          for p in sorted(Path('work/wheels').glob('*.whl')):
            wheels.append({'file':p.name,'size_bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          out={'schema':'LUCIA_AA_R22542_C39_SOURCE_ZERO_PYTHON_BASE_BINDING_V1','verdict':'PASS','candidate_repo':crepo,'candidate_revision':crev,'candidate_files':sibs(c),'base_repo':brepo,'base_revision':b.sha,'base_files':sibs(b),'base_config_sha256':hashlib.sha256(cfg_bytes).hexdigest(),'base_config_size':len(cfg_bytes),'config_class':type(cfg).__name__,'model_class':model_cls.__name__,'trust_remote_code':False,'python':sys.version,'platform':platform.platform(),'imports':{'torch':torch.__version__,'transformers':transformers.__version__,'peft':peft.__version__,'safetensors':safetensors.__version__,'accelerate':accelerate.__version__,'huggingface_hub':huggingface_hub.__version__},'primary_wheels':wheels,'candidate_model_weight_bytes_downloaded':0,'base_model_weight_bytes_downloaded':0,'model_outputs_observed':0,'training_time_exact_base_revision_proven':False}
          Path('report/R22542_C39_PYTHON_BASE_BINDING.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Pin OpenProof and OpenProof-ML reference commits
        shell: bash
        run: |
          set -euo pipefail
          OP=$(git ls-remote https://github.com/mxthematic/openproof.git refs/heads/master | awk '{print $1}')
          ML=$(git ls-remote https://github.com/mxthematic/openproof-ml.git refs/heads/master | awk '{print $1}')
          test -n "$OP" && test -n "$ML"
          git clone -q https://github.com/mxthematic/openproof.git work/openproof
          git -C work/openproof checkout -q "$OP"
          git clone -q https://github.com/mxthematic/openproof-ml.git work/openproof-ml
          git -C work/openproof-ml checkout -q "$ML"
          python - <<PY
          import hashlib,json
          from pathlib import Path
          op='$OP'; ml='$ML'
          paths=[Path('work/openproof/lean/lean-toolchain'),Path('work/openproof/lean/lakefile.toml')]
          rows=[{'path':str(p).split('work/openproof/',1)[1],'size_bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'text':p.read_text()} for p in paths]
          out={'schema':'LUCIA_AA_R22542_C39_UPSTREAM_REFERENCE_BINDING_V1','verdict':'PASS_REFERENCE_CURRENT_NOT_TRAINING_TIME_PROOF','openproof_repo':'mxthematic/openproof','openproof_revision':op,'openproof_ml_repo':'mxthematic/openproof-ml','openproof_ml_revision':ml,'runtime_files':rows,'training_time_exact_code_revision_proven':False,'model_outputs_observed':0}
          Path('report/R22542_C39_UPSTREAM_REFERENCE_BINDING.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Generate exact fresh suite from precommitted generator and validate hash
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > work/forge.py
          python work/forge.py work/suite.jsonl > work/suite_receipt.json
          test "$(sha256sum work/suite.jsonl | awk '{print $1}')" = "$SUITE_SHA"
          python - <<'PY'
          import importlib.util,hashlib
          spec=importlib.util.spec_from_file_location('f','work/forge.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          rows=m.build(); pos=[r for r in rows if r['positive']]
          text='import Mathlib\n\n'+'\n\n'.join(r['standalone_source'] for r in pos)+'\n'
          open('work/C39_CANONICAL_POSITIVE.lean','w',encoding='utf-8').write(text)
          assert len(pos)==336
          assert hashlib.sha256(text.encode()).hexdigest()=='966f240d6a07c6abc868dd5cd0341a55f20ab19c6b18ffdf4ce8ea882462d54b'
          PY
      - name: Lean 4.28.0 and Mathlib v4.28.0 canonical kernel validation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o work/elan-init.sh
          sh work/elan-init.sh -y --default-toolchain leanprover/lean4:v4.28.0
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee report/LEAN_VERSION.txt
          cd work/openproof/lean
          lake update
          lake exe cache get
          cp ../../C39_CANONICAL_POSITIVE.lean ./C39Canonical.lean
          lake env lean C39Canonical.lean
          cd ../../..
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          out={'schema':'LUCIA_AA_R22542_C39_LEAN_CANONICAL_VALIDATION_V1','verdict':'PASS_336_CANONICAL_PROOFS_LEAN_KERNEL','lean_version':Path('report/LEAN_VERSION.txt').read_text().strip(),'mathlib_pin':'v4.28.0','suite_sha256':'ca0338cbb067c4f4b807bac0d389e8b946780906ed5562cd0949bd9541ba58a2','canonical_source_sha256':'966f240d6a07c6abc868dd5cd0341a55f20ab19c6b18ffdf4ce8ea882462d54b','positive_cases_compiled':336,'training_dataset_rows_used':0,'model_outputs_observed':0,'model_weight_bytes_downloaded':0}
          Path('report/R22542_C39_LEAN_CANONICAL_VALIDATION.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r22542-c39-sourcezero-preseal
          path: report/
          retention-days: 1
