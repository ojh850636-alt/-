name: LAA R22533 C32 Exact Courier

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Exact safe Base and dense-finetune capture
        shell: bash
        run: |
          set -euo pipefail
          FT_REPO='compnet-renard/t5-small-literary-relation-extraction'
          FT_REV='c2d3f4120f3c9fc1a751bd245679fa34f7dcee1c'
          BASE_REPO='google-t5/t5-small'
          BASE_REV='df1b051c49625cf57a3d0d8d3863ed4d13564fe4'
          test "$(git ls-remote https://huggingface.co/${FT_REPO} refs/heads/main | awk '{print $1}')" = "$FT_REV"
          test "$(git ls-remote https://huggingface.co/${BASE_REPO} refs/heads/main | awk '{print $1}')" = "$BASE_REV"
          python -m pip install --disable-pip-version-check -q 'huggingface_hub[hf_xet]==0.36.0'
          mkdir -p out/{ft,base,meta,parts_ft,parts_base,wheels}
          python - <<'PY'
          from huggingface_hub import snapshot_download
          from pathlib import Path
          import hashlib,json,shutil,struct
          fr='compnet-renard/t5-small-literary-relation-extraction'; fv='c2d3f4120f3c9fc1a751bd245679fa34f7dcee1c'
          br='google-t5/t5-small'; bv='df1b051c49625cf57a3d0d8d3863ed4d13564fe4'
          out=Path('out'); f=out/'ft'; b=out/'base'; m=out/'meta'
          allow=['model.safetensors','config.json','generation_config.json','tokenizer_config.json','special_tokens_map.json','spiece.model','tokenizer.json']
          snapshot_download(repo_id=fr,revision=fv,allow_patterns=allow,local_dir=f)
          snapshot_download(repo_id=br,revision=bv,allow_patterns=allow,local_dir=b)
          for x in (f,b):
              c=x/'.cache'
              if c.exists(): shutil.rmtree(c)
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as z:
                  for q in iter(lambda:z.read(1024*1024),b''):h.update(q)
              return h.hexdigest()
          def header(p):
              with open(p,'rb') as z:
                  n=struct.unpack('<Q',z.read(8))[0]; meta=json.loads(z.read(n))
              ks=[k for k in meta if k!='__metadata__']
              return {'tensor_count':len(ks),'sample':[{'key':k,'shape':meta[k].get('shape'),'dtype':meta[k].get('dtype')} for k in ks[:80]]}
          fw=f/'model.safetensors'; bw=b/'model.safetensors'
          expected={'finetuned':{'bytes':242041896,'sha256':'87a29370b8cd91041eb1f94d76a44f6a8c988c1e46430ec06e1c9968ca498aea'},'base':{'bytes':242043056,'sha256':'bd944e5f1b3ad9b70dd9d00010a517059e19265671076b8b0a4a58d9491842bc'}}
          observed={'finetuned':{'bytes':fw.stat().st_size,'sha256':sha(fw),'header':header(fw)},'base':{'bytes':bw.stat().st_size,'sha256':sha(bw),'header':header(bw)}}
          for role in expected:
              assert observed[role]['bytes']==expected[role]['bytes'],(role,observed[role]['bytes'])
              assert observed[role]['sha256']==expected[role]['sha256'],(role,observed[role]['sha256'])
          blocked=[]
          for root in (f,b):
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix.lower() in {'.bin','.pt','.pth','.pkl','.pickle','.ckpt','.h5','.msgpack'}: blocked.append(str(p))
          assert not blocked,blocked
          small=[]
          for role,root,weight in [('finetuned',f,'model.safetensors'),('base',b,'model.safetensors')]:
              for p in root.rglob('*'):
                  if p.is_file() and p.name!=weight:
                      rel=f'{role}/{p.relative_to(root).as_posix()}'; dest=m/rel;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,dest)
                      small.append({'path':rel,'bytes':p.stat().st_size,'sha256':sha(p)})
          manifest={'schema':'LUCIA_AA_R22533_C32_COURIER_V1','finetuned_repo':fr,'finetuned_revision':fv,'base_repo':br,'base_revision':bv,'expected':expected,'observed':observed,'small_files':small,'blocked_files_present':blocked,'raw_committed_to_git':False,'suite_sha256':'2b3d3a442d745918b73967c039521705200b2b7b03c2200a057e783e0152f208','preseal_question_fingerprint':'f59195aa45f098c193e389fa308054e1a93432145136f2e69f2ef219f2fbe3ff'}
          (m/'SOURCE_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
          split -b 90M out/ft/model.safetensors out/parts_ft/ft_
          split -b 90M out/base/model.safetensors out/parts_base/base_
          rm out/ft/model.safetensors out/base/model.safetensors
          python -m pip download --disable-pip-version-check --no-deps -q -d out/wheels 'transformers==4.46.2' 'huggingface_hub==0.26.2'
          sha256sum out/wheels/* > out/meta/WHEEL_SHA256.txt
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with: {name: r22533-c32-meta, path: out/meta, retention-days: 1, compression-level: 6}
      - name: Upload FT 00
        uses: actions/upload-artifact@v4
        with: {name: r22533-c32-ft-00, path: out/parts_ft/ft_aa, retention-days: 1, compression-level: 0}
      - name: Upload FT 01
        uses: actions/upload-artifact@v4
        with: {name: r22533-c32-ft-01, path: out/parts_ft/ft_ab, retention-days: 1, compression-level: 0}
      - name: Upload FT 02
        uses: actions/upload-artifact@v4
        with: {name: r22533-c32-ft-02, path: out/parts_ft/ft_ac, retention-days: 1, compression-level: 0}
      - name: Upload Base 00
        uses: actions/upload-artifact@v4
        with: {name: r22533-c32-base-00, path: out/parts_base/base_aa, retention-days: 1, compression-level: 0}
      - name: Upload Base 01
        uses: actions/upload-artifact@v4
        with: {name: r22533-c32-base-01, path: out/parts_base/base_ab, retention-days: 1, compression-level: 0}
      - name: Upload Base 02
        uses: actions/upload-artifact@v4
        with: {name: r22533-c32-base-02, path: out/parts_base/base_ac, retention-days: 1, compression-level: 0}
      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with: {name: r22533-c32-runtime, path: out/wheels, retention-days: 1, compression-level: 0}
