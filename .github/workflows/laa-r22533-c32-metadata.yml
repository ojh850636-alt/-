name: LAA R22533 C32 Metadata Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Compare new scientific questions metadata only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, subprocess, urllib.request, pathlib
          candidates=[
            {
              'id':'DENSE_T5_RELATION_GRAPH',
              'repo':'compnet-renard/t5-small-literary-relation-extraction',
              'kind':'FULL_DENSE_FINETUNE',
              'expected_base':'google-t5/t5-small',
              'question':'narrative sentence -> variable-cardinality directed relation-triple graph'
            },
            {
              'id':'SD_SUPERRES_LORA',
              'repo':'bradhinkel/sd-image-upscaler-sd15-lora',
              'kind':'PEFT_LORA',
              'expected_base':None,
              'question':'low-resolution RGB image -> super-resolved RGB image field'
            },
            {
              'id':'F5_TTS_VOICE_LORA',
              'repo':'instavar/f5-tts-v1-lora-female01',
              'kind':'PEFT_LORA_CUSTOM_RUNTIME',
              'expected_base':'SWivid/F5-TTS',
              'question':'text plus reference speech -> synthesized target-speaker waveform'
            }
          ]
          def req(url): return urllib.request.Request(url,headers={'User-Agent':'LUCIA-AA-R22533-metadata'})
          def get_json(url):
              with urllib.request.urlopen(req(url),timeout=30) as r: return json.loads(r.read().decode())
          def get_text(url):
              try:
                  with urllib.request.urlopen(req(url),timeout=30) as r: return r.read().decode('utf-8',errors='replace')
              except Exception: return None
          def resolve(repo):
              p=subprocess.run(['git','ls-remote',f'https://huggingface.co/{repo}','refs/heads/main'],capture_output=True,text=True,check=True)
              return p.stdout.split()[0]
          def sib(api):
              out=[]
              for s in api.get('siblings',[]):
                  r={'rfilename':s.get('rfilename'),'size':s.get('size')}
                  if s.get('lfs'): r['lfs']=s.get('lfs')
                  if s.get('xetHash'): r['xetHash']=s.get('xetHash')
                  out.append(r)
              return out
          rows=[]
          for c in candidates:
              rev=resolve(c['repo']); api=get_json(f"https://huggingface.co/api/models/{c['repo']}?blobs=true")
              cfg_txt=get_text(f"https://huggingface.co/{c['repo']}/raw/{rev}/adapter_config.json")
              cfg=None
              if cfg_txt:
                  try: cfg=json.loads(cfg_txt)
                  except Exception: cfg={'_parse_error':True,'_raw_prefix':cfg_txt[:2000]}
              card=(get_text(f"https://huggingface.co/{c['repo']}/raw/{rev}/README.md") or '')[:16000]
              base=c['expected_base'] or ((cfg or {}).get('base_model_name_or_path') if isinstance(cfg,dict) else None)
              base_meta=None
              if isinstance(base,str) and '/' in base:
                  try:
                      brev=resolve(base); bapi=get_json(f'https://huggingface.co/api/models/{base}?blobs=true')
                      base_meta={'repo':base,'revision':brev,'license':(bapi.get('cardData') or {}).get('license'),'pipeline_tag':bapi.get('pipeline_tag'),'siblings':sib(bapi)}
                  except Exception as e: base_meta={'repo':base,'error':repr(e)}
              rows.append({**c,'revision':rev,'license':(api.get('cardData') or {}).get('license'),'pipeline_tag':api.get('pipeline_tag'),'tags':api.get('tags',[]),'siblings':sib(api),'adapter_config':cfg,'readme_prefix':card,'base_meta':base_meta})
          out={'schema':'LUCIA_AA_R22533_C32_METADATA_AUDIT_V1','raw_weight_bytes_downloaded':0,'model_outputs_observed':0,'candidates':rows}
          pathlib.Path('out/C32_METADATA_AUDIT.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'candidate_count':len(rows),'raw_weight_bytes_downloaded':0,'model_outputs_observed':0},indent=2))
          PY
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: r22533-c32-metadata
          path: out/C32_METADATA_AUDIT.json
          retention-days: 1
          compression-level: 6
