name: R22601 C76 Hallmark DATA independent byte replay
on:
  push:
    branches: [r22601-c76-hallmark-data-witness]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Rebuild prepared DATA from exact pre-run repository state
        shell: bash
        run: |
          set -euo pipefail
          PRE_RUN='fd6c7bac9ffb54e45ebdafb00c76455ea5b8322a'
          RUN_RECORD_COMMIT='fb2492313daaad9159cc7f38bddfc9f4e11686ec'
          git clone --quiet https://github.com/SebastianBoehler/hallmark-mlx.git upstream
          cd upstream
          git checkout --quiet "$RUN_RECORD_COMMIT"
          git diff --quiet "$PRE_RUN" "$RUN_RECORD_COMMIT" -- \
            data/processed \
            src/hallmark_mlx/training/dataset_loader.py \
            src/hallmark_mlx/training/trace_formatter.py \
            src/hallmark_mlx/inference/finalizer.py \
            src/hallmark_mlx/data/schemas.py \
            src/hallmark_mlx/types.py \
            src/hallmark_mlx/utils/jsonl.py \
            src/hallmark_mlx/training/prompts.py \
            src/hallmark_mlx/protocol.py
          echo 'DATA_COMPILER_SLICE_UNCHANGED_PRE_RUN_TO_RECORD_COMMIT=true'
          git checkout --quiet "$PRE_RUN"
          printf 'PRE_RUN_HEAD=%s\n' "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$PRE_RUN"
          test -z "$(git status --porcelain)"

          if command -v uv >/dev/null 2>&1; then
            uv --version
          else
            python -m pip install --disable-pip-version-check 'uv>=0.6,<1'
          fi
          uv sync --locked --no-dev
          PYTHONPATH=src uv run --no-sync python - <<'PY'
          import hashlib
          import tempfile
          from pathlib import Path
          from hallmark_mlx.training.dataset_loader import prepare_training_dataset
          from hallmark_mlx.types import TrainingExampleFormat

          expected = {
              'train': {
                  'sha256': 'cc97b4be14e81cfee5d3baa0fbbc4521efb20d236647f2544d5102ae782d7d61',
                  'size': 492316,
                  'rows': 75,
              },
              'valid': {
                  'sha256': '7c483d347185aecdaa5dcb9b712e0b78ceb76fb3f932cd3c600f504673e963b3',
                  'size': 35481,
                  'rows': 6,
              },
          }

          with tempfile.TemporaryDirectory() as tmp:
              outputs = prepare_training_dataset(
                  Path('data/processed'),
                  Path(tmp),
                  example_format=TrainingExampleFormat.TOOL_TRANSCRIPT_STEPS,
              )
              for split in ('train', 'valid'):
                  raw = Path(outputs[split]).read_bytes()
                  got = {
                      'sha256': hashlib.sha256(raw).hexdigest(),
                      'size': len(raw),
                      'rows': sum(1 for line in raw.splitlines() if line.strip()),
                  }
                  print(
                      f"PRE_RUN_REPLAY {split} size={got['size']} rows={got['rows']} "
                      f"sha256={got['sha256']}"
                  )
                  if got != expected[split]:
                      raise SystemExit(f'FAIL_PRE_RUN_REPLAY_MISMATCH {split} got={got} expected={expected[split]}')

          print('DONE_R22601_PRE_RUN_DATA_REPLAY_EXACT_MATCH_NO_MODEL_WEIGHT_ACCESS')
          PY
          cd ..
          rm -rf upstream
          echo 'TEMP_EXTERNAL_BYTES_DELETED=true'
          echo 'ADAPTER_WEIGHT_BYTES=0'
          echo 'BASE_WEIGHT_BYTES=0'
