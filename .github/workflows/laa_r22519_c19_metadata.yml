name: Temporary LAA R22519 C19 split existing artifact

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reuse and split the already verified exact-source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/LAA_R22519_C19_SPLIT"
          mkdir -p "$ROOT/parts"
          curl -L --fail --retry 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o "$ROOT/original.zip" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/8888979227/zip"
          test "$(stat -c%s "$ROOT/original.zip")" = '1398936780'
          test "$(sha256sum "$ROOT/original.zip" | awk '{print $1}')" = '9c3414ea48db85ba72904fdc2f9901884dcdbb504209142ea39aa80f07d72b22'
          split -b 350000000 -d -a 2 "$ROOT/original.zip" "$ROOT/parts/LAA_R22519_C19_EXACT_SOURCE.zip.part-"
          rm "$ROOT/original.zip"
          (cd "$ROOT/parts" && sha256sum * > PARTS_SHA256.txt && stat -c '%n %s' LAA_R22519_C19_EXACT_SOURCE.zip.part-* > PARTS_SIZE.txt)
          test "$(find "$ROOT/parts" -name 'LAA_R22519_C19_EXACT_SOURCE.zip.part-*' -type f | wc -l | tr -d ' ')" = '4'
      - uses: actions/upload-artifact@v4
        with:
          name: LAA_R22519_C19_SOURCE_PART_00
          path: ${{ runner.temp }}/LAA_R22519_C19_SPLIT/parts/LAA_R22519_C19_EXACT_SOURCE.zip.part-00
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LAA_R22519_C19_SOURCE_PART_01
          path: ${{ runner.temp }}/LAA_R22519_C19_SPLIT/parts/LAA_R22519_C19_EXACT_SOURCE.zip.part-01
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LAA_R22519_C19_SOURCE_PART_02
          path: ${{ runner.temp }}/LAA_R22519_C19_SPLIT/parts/LAA_R22519_C19_EXACT_SOURCE.zip.part-02
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LAA_R22519_C19_SOURCE_PART_03
          path: ${{ runner.temp }}/LAA_R22519_C19_SPLIT/parts/LAA_R22519_C19_EXACT_SOURCE.zip.part-03
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LAA_R22519_C19_SOURCE_PART_MANIFEST
          path: |
            ${{ runner.temp }}/LAA_R22519_C19_SPLIT/parts/PARTS_SHA256.txt
            ${{ runner.temp }}/LAA_R22519_C19_SPLIT/parts/PARTS_SIZE.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
