name: Temporary LAA R22519 C19 exact metadata audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Audit two OCR adapters and exact Base without weight download
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/LAA_R22519_C19_EXACT_METADATA"
          mkdir -p "$ROOT/adapter_v1" "$ROOT/adapter_v102" "$ROOT/base"
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.parse,urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'LAA_R22519_C19_EXACT_METADATA'
          headers={'User-Agent':'LUCIA-Adapter-Archaeology-R22519-ExactMetadata/1.0'}
          repos={
            'adapter_v1':'Nzyoka19/nyansapo-ocr-trocr-lora_v1',
            'adapter_v102':'Nzyoka19/nyansapo-ocr-trocr-lora_v1-0-2',
            'base':'microsoft/trocr-base-handwritten',
          }
          def req(url,timeout=180):
            r=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(r,timeout=timeout) as h:return h.read(),dict(h.headers)
          def get_json(url):return json.loads(req(url)[0])
          apis={role:get_json('https://huggingface.co/api/models/'+urllib.parse.quote(repo,safe='/')+'?blobs=true') for role,repo in repos.items()}
          small_allow={
            'adapter_v1':['README.md','adapter_config.json','preprocessor_config.json','tokenizer_config.json','special_tokens_map.json','tokenizer.json','vocab.json','merges.txt'],
            'adapter_v102':['README.md','adapter_config.json','preprocessor_config.json','tokenizer_config.json','special_tokens_map.json','tokenizer.json','vocab.json','merges.txt'],
            'base':['README.md','config.json','generation_config.json','preprocessor_config.json','tokenizer_config.json','special_tokens_map.json','tokenizer.json','vocab.json','merges.txt'],
          }
          rows=[]; object_rows=[]; errors=[]
          for role,repo in repos.items():
            api=apis[role]; sha=api['sha']; sibs=api.get('siblings') or []; byname={x.get('rfilename'):x for x in sibs}
            for name in small_allow[role]:
              if name not in byname:continue
              try:
                b,_=req(f'https://huggingface.co/{repo}/resolve/{sha}/{name}?download=true')
              except Exception as e:
                errors.append({'role':role,'path':name,'error':type(e).__name__+': '+str(e)});continue
              out=root/role/name;out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(b)
              rows.append({'role':role,'repo':repo,'revision':sha,'path':name,'size_bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
            for name in ['adapter_model.safetensors','model.safetensors']:
              if name not in byname:continue
              x=byname[name]; lfs=x.get('lfs') or {}; size=x.get('size') or (lfs.get('size') if isinstance(lfs,dict) else None)
              digest=(lfs.get('sha256') or lfs.get('oid')) if isinstance(lfs,dict) else None
              object_rows.append({'role':role,'repo':repo,'revision':sha,'path':name,'size_bytes':size,'sha256':digest,'blob_id':x.get('blobId'),'xet_hash':x.get('xetHash')})
          def load(role,name):
            p=root/role/name
            return json.loads(p.read_text()) if p.is_file() else None
          cfg1=load('adapter_v1','adapter_config.json');cfg2=load('adapter_v102','adapter_config.json');basecfg=load('base','config.json')
          semantic_files=['preprocessor_config.json','tokenizer_config.json','special_tokens_map.json','tokenizer.json','vocab.json','merges.txt']
          semantic={}
          for name in semantic_files:
            vals={}
            for role in repos:
              p=root/role/name
              if p.is_file():vals[role]={'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size_bytes':p.stat().st_size}
            semantic[name]=vals
          forbidden=[]
          for role,api in apis.items():
            for x in api.get('siblings') or []:
              n=str(x.get('rfilename',''))
              if n.endswith(('.bin','.pt','.pth','.pkl','.pickle','.ckpt','.h5','.msgpack','.py','.ipynb')):forbidden.append({'role':role,'path':n})
          receipt={
            'schema':'LUCIA_AA_R2_25_19_C19_EXACT_METADATA_AUDIT_V1',
            'raw_weight_bytes_downloaded':0,'model_outputs_observed':0,'repos':repos,
            'revisions':{r:apis[r]['sha'] for r in repos},'licenses':{r:(apis[r].get('cardData') or {}).get('license') for r in repos},
            'pipelines':{r:apis[r].get('pipeline_tag') for r in repos},'metadata_files':rows,'weight_objects':object_rows,'semantic_file_comparison':semantic,
            'adapter_config_v1':cfg1,'adapter_config_v102':cfg2,'base_config_summary':{
              'model_type':basecfg.get('model_type') if basecfg else None,'architectures':basecfg.get('architectures') if basecfg else None,
              'encoder_model_type':((basecfg or {}).get('encoder') or {}).get('model_type'),'decoder_model_type':((basecfg or {}).get('decoder') or {}).get('model_type'),
              'decoder_layers':((basecfg or {}).get('decoder') or {}).get('decoder_layers'),
            },
            'forbidden_siblings_not_downloaded':forbidden,'errors':errors,
            'selection_boundary':'PAIRED_LONGITUDINAL_OCR_STUDY; EXACTLY THESE TWO ADAPTERS SHARE ONE BASE; WEIGHTS REMAIN ZERO UNTIL OUTPUT-INDEPENDENT PRESEAL',
          }
          (root/'C19_EXACT_METADATA_AUDIT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'revisions':receipt['revisions'],'licenses':receipt['licenses'],'weight_objects':object_rows,'adapter_configs':{'v1':cfg1,'v102':cfg2},'errors':errors},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LAA_R22519_C19_EXACT_METADATA
          path: ${{ runner.temp }}/LAA_R22519_C19_EXACT_METADATA
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
