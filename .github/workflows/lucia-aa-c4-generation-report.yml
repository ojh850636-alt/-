name: LUCIA AA C4 generation report

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Download raw-free generation evidence
        uses: actions/download-artifact@v4
        with:
          name: lucia-aa-c4-parallel-GENERATION
          path: evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 29783237376
      - name: Print concise exact generation summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          def one(name):
              files=list(Path('evidence').rglob(name))
              if len(files)!=1: raise SystemExit(f'expected one {name}: {files}')
              return json.loads(files[0].read_text())
          base=one('C4_FREE_GENERATION_BASE.json')
          full=one('C4_FREE_GENERATION_FULL.json')
          deletion=one('RAW_SOURCE_DELETION_RECEIPT.json')
          audit=one('RAW_FREE_AUDIT.json')
          summary={
              'schema':'LUCIA_AA_C4_GENERATION_CONCISE_REPORT_V1',
              'base_execution_accuracy':base['execution_accuracy'],
              'full_execution_accuracy':full['execution_accuracy'],
              'execution_delta':full['execution_accuracy']-base['execution_accuracy'],
              'base_negative_sql_activation':base['negative_sql_activation'],
              'full_negative_sql_activation':full['negative_sql_activation'],
              'negative_activation_delta':full['negative_sql_activation']-base['negative_sql_activation'],
              'base_positive':[{k:r.get(k) for k in ('case_id','execution_exact','extracted_sql','failure_reason')} for r in base['positive']],
              'full_positive':[{k:r.get(k) for k in ('case_id','execution_exact','extracted_sql','failure_reason')} for r in full['positive']],
              'base_negative':[{k:r.get(k) for k in ('case_id','sql_activated')} for r in base['negative']],
              'full_negative':[{k:r.get(k) for k in ('case_id','sql_activated')} for r in full['negative']],
              'deletion_verdict':deletion['verdict'],
              'raw_free_verdict':audit['verdict'],
          }
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
