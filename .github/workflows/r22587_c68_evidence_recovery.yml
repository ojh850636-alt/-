name: R22587 C68 evidence recovery only
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover old run and artifact metadata without model network
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUTPUT_BRANCH: r22587-c68-evidence-recovery
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,urllib.request,base64,datetime
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']; branch=os.environ['OUTPUT_BRANCH']
          targets={
            'metadata_merge':'5a91288ba902a6cd45dfcc895fc58bad3ac62abe',
            'metadata_trigger':'8dd5ed004df199f40ac6a4f94012bed4d7d76817',
            'invalid_source_merge':'1cbf780ec93b1c4f2219ed5e8bbc9ca2056132d7',
            'readable_source_merge':'bb1c61be6d4cc4b9f945b858cd9cd9ef449adde0',
          }
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22587-evidence-recovery'}
          def api(path):
            req=urllib.request.Request('https://api.github.com'+path,headers=headers)
            with urllib.request.urlopen(req,timeout=30) as r: return json.loads(r.read().decode())
          rows=[]
          for label,sha in targets.items():
            data=api(f'/repos/{repo}/actions/runs?head_sha={sha}&per_page=100')
            runs=[]
            for r in data.get('workflow_runs',[]):
              arts=api(f"/repos/{repo}/actions/runs/{r['id']}/artifacts?per_page=100").get('artifacts',[])
              runs.append({
                'id':r['id'],'name':r.get('name'),'path':r.get('path'),'event':r.get('event'),'status':r.get('status'),'conclusion':r.get('conclusion'),
                'run_number':r.get('run_number'),'run_attempt':r.get('run_attempt'),'head_sha':r.get('head_sha'),'created_at':r.get('created_at'),'updated_at':r.get('updated_at'),'html_url':r.get('html_url'),
                'artifacts':[{'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'expired':a.get('expired'),'digest':a.get('digest'),'created_at':a.get('created_at'),'expires_at':a.get('expires_at')} for a in arts]
              })
            rows.append({'label':label,'head_sha':sha,'total_count':data.get('total_count',0),'runs':runs})
          out={
            'schema':'R22587_C68_GITHUB_ACTIONS_RECOVERY_INDEX_V1',
            'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'model_or_adapter_network_calls':0,
            'huggingface_calls':0,
            'targets':rows,
            'selection_rule':'source authority may only come from readable_source_merge head SHA; invalid_source_merge is pre-source and receives zero source/science credit; metadata runs are model-weight-byte zero control-plane evidence.'
          }
          content=(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n').encode()
          path='recovery/R22587_C68_GITHUB_ACTIONS_RECOVERY_INDEX.json'
          payload=json.dumps({'message':'Persist R22587 C68 recovery index (no model source)','content':base64.b64encode(content).decode(),'branch':branch}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=payload,headers={**headers,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r: res=json.loads(r.read().decode())
          print(json.dumps({'PASS':True,'output_path':path,'output_branch':branch,'content_sha':res.get('content',{}).get('sha'),'targets':[(x['label'],x['total_count']) for x in rows]},indent=2))
          PY
