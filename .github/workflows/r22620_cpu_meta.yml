name: R22620 CPU LoRA provenance pool audit
on:
  push:
    branches: [r22620-cpu-meta]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Scan small public PEFT LoRAs without model weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p meta
          python - <<'PY'
          import json, urllib.parse, urllib.request, pathlib, re, hashlib, time
          UA={'User-Agent':'LUCIA-R22620-metadata-audit/1.0'}
          searches=[
            'smollm2 135m lora','smollm2 360m lora','qwen2.5 0.5b lora','qwen3 0.6b lora',
            'SmolLM2-135M-Instruct PEFT','SmolLM2-360M-Instruct PEFT','Qwen2.5-0.5B-Instruct PEFT','Qwen3-0.6B PEFT'
          ]
          closed={
            'piyushgupta53/smollm2-135m-english-to-latex-notation-lora',
            'HanfuZhao781/recallclear-smollm2-135m-lora'
          }
          def getjson(url):
            req=urllib.request.Request(url,headers=UA)
            with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          def gettext(repo,rev,name,max_bytes=500000):
            # strictly small text/config filenames only; never weight paths
            url='https://huggingface.co/'+repo+'/resolve/'+rev+'/'+urllib.parse.quote(name,safe='/')+'?download=true'
            req=urllib.request.Request(url,headers=UA)
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                data=r.read(max_bytes+1)
              if len(data)>max_bytes: return None
              return data.decode('utf-8','replace')
            except Exception: return None
          found={}
          for q in searches:
            url='https://huggingface.co/api/models?search='+urllib.parse.quote(q)+'&limit=80&full=true'
            try: rows=getjson(url)
            except Exception: continue
            for d in rows:
              repo=d.get('id') or d.get('modelId')
              if not repo or repo in closed: continue
              found.setdefault(repo,d)
          candidates=[]
          text_names_exact={'README.md','adapter_config.json','training_history.json','training_manifest.json','train_metrics.json','manifest.json','trainer_state.json'}
          text_name_tokens=('receipt','manifest','provenance','training','train_metric','run_info','metadata')
          sha_re=re.compile(r'(?<![0-9a-f])([0-9a-f]{40})(?![0-9a-f])',re.I)
          for repo in sorted(found):
            try: d=getjson('https://huggingface.co/api/models/'+repo+'?blobs=true')
            except Exception: continue
            sha=d.get('sha')
            sib=d.get('siblings') or []
            names=[x.get('rfilename') for x in sib if x.get('rfilename')]
            if 'adapter_config.json' not in names: continue
            weight_names=[n for n in names if n and n.endswith('.safetensors') and ('adapter' in n.lower() or 'lora' in n.lower())]
            if not weight_names: continue
            tags=d.get('tags') or []
            lib=d.get('library_name')
            # metadata-only weight identity from API, never request weight bytes
            weight_meta=[]
            for x in sib:
              n=x.get('rfilename')
              if n in weight_names:
                lfs=x.get('lfs') or {}
                weight_meta.append({'name':n,'size':x.get('size') or lfs.get('size'),'blobId':x.get('blobId'),'lfs_sha256':lfs.get('sha256')})
            cfg_text=gettext(repo,sha,'adapter_config.json') if sha else None
            try: cfg=json.loads(cfg_text) if cfg_text else {}
            except Exception: cfg={}
            base_name=cfg.get('base_model_name_or_path')
            cfg_rev=cfg.get('revision')
            texts={}
            for n in names:
              low=n.lower()
              if n in text_names_exact or (len(n)<140 and n.rsplit('/',1)[-1].lower().endswith(('.md','.json','.txt')) and any(t in low for t in text_name_tokens)):
                if any(n.lower().endswith(ext) for ext in ('.bin','.pt','.pth','.ckpt','.safetensors')): continue
                t=gettext(repo,sha,n) if sha else None
                if t is not None: texts[n]=t
            evidence=[]
            for n,t in texts.items():
              for m in sha_re.finditer(t):
                pos=m.start(); ctx=t[max(0,pos-180):min(len(t),pos+220)].replace('\n',' ')
                if re.search(r'base|revision|commit|snapshot|model',ctx,re.I):
                  evidence.append({'file':n,'sha40':m.group(1).lower(),'context':ctx[:420]})
            # resolve explicit config revision against declared base when possible
            base_revision_resolves=False
            base_api_sha=None
            if base_name:
              try:
                bd=getjson('https://huggingface.co/api/models/'+base_name)
                base_api_sha=bd.get('sha')
                if cfg_rev:
                  urllib.request.urlopen(urllib.request.Request('https://huggingface.co/api/models/'+base_name+'/revision/'+str(cfg_rev),headers=UA),timeout=20).read(1)
                  base_revision_resolves=True
              except Exception: pass
            candidates.append({
              'repo':repo,'adapter_repo_sha':sha,'library_name':lib,'pipeline_tag':d.get('pipeline_tag'),'tags':tags,
              'base_model_name_or_path':base_name,'adapter_config_revision':cfg_rev,'base_api_current_sha':base_api_sha,
              'config_revision_resolves_on_base':base_revision_resolves,'r':cfg.get('r'),'lora_alpha':cfg.get('lora_alpha'),
              'target_modules':cfg.get('target_modules'),'task_type':cfg.get('task_type'),'weight_meta':weight_meta,
              'explicit_sha40_evidence':evidence[:20],
              'text_files_scanned':sorted(texts),
              'readme_excerpt':(texts.get('README.md') or '')[:4000]
            })
            time.sleep(0.03)
          payload={'schema':'R22620_CPU_LORA_POOL_V1','weight_bytes_requested':0,'searches':searches,'closed_no_redownload':sorted(closed),'candidate_count':len(candidates),'candidates':candidates}
          p=pathlib.Path('meta/R22620_CPU_POOL.json'); p.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          pathlib.Path('meta/R22620_CPU_POOL.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  R22620_CPU_POOL.json\n')
          print('candidate_count',len(candidates))
          print('explicit_sha_evidence',sum(bool(x['explicit_sha40_evidence']) for x in candidates))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22620-cpu-meta
          path: meta
          retention-days: 1
          compression-level: 0
