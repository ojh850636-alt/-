name: R22620 C79 capital exact adapter courier
on:
  push:
    branches: [r22620-cpu-meta]
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact selected Adapter only after preseal
        shell: bash
        run: |
          set -euo pipefail
          PRESEAL_SHA='bee50b4d7f38b1d899fdecab01ab37a8f9d22da68454741ad2300e5784d542f1'
          test -n "$PRESEAL_SHA"
          mkdir -p src/adapter
          REPO='spellicer/SmolLM2-135M-Instruct-capital'
          REV='ef68368d888343f1d57830abc501d7288bc9d6cd'
          curl -L --retry 5 --retry-delay 2 --fail --silent --show-error \
            "https://huggingface.co/${REPO}/resolve/${REV}/adapter_model.safetensors?download=true" \
            -o src/adapter/adapter_model.safetensors
          curl -L --retry 5 --retry-delay 2 --fail --silent --show-error \
            "https://huggingface.co/${REPO}/resolve/${REV}/adapter_config.json?download=true" \
            -o src/adapter/adapter_config.json
          test "$(stat -c%s src/adapter/adapter_model.safetensors)" = '3717656'
          echo '4699dca74c305c5f3cb884c6afd29e2f3945a6b0243158e7afd4e3f082835743  src/adapter/adapter_model.safetensors' | sha256sum -c -
          python - <<'PY'
          import json,hashlib,pathlib
          rows=[]
          for p in sorted(pathlib.Path('src').rglob('*')):
            if p.is_file(): rows.append({'path':p.as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          payload={'schema':'R22620_C79_CAPITAL_ADAPTER_SOURCE_V1','source_consumed':True,'adapter_repo':'spellicer/SmolLM2-135M-Instruct-capital','adapter_revision':'ef68368d888343f1d57830abc501d7288bc9d6cd','preseal_sha256':'bee50b4d7f38b1d899fdecab01ab37a8f9d22da68454741ad2300e5784d542f1','training_time_base_revision_proven':False,'files':rows}
          pathlib.Path('src/SOURCE_RECEIPT.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22620-c79-capital-adapter
          path: src
          retention-days: 1
          compression-level: 0
