name: R22620 CPU LoRA focused 3-way metadata audit
on:
  push:
    branches: [r22620-cpu-meta]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare three non-duplicate CPU candidates metadata-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p meta
          python - <<'PY'
          import json, urllib.request, urllib.parse, pathlib, hashlib
          repos=[
            'spellicer/SmolLM2-135M-Instruct-capital',
            'hfm8tr/smollm2-135m-smoltalk-lora',
            'utkarshalpuria/SmollM2-360M-Domain-Adaptation-Lora-Book-Gardening-Lite-v2',
          ]
          UA={'User-Agent':'LUCIA-R22620-focused-meta/1.0'}
          def req(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=30) as r: return r.read()
          out=[]
          for repo in repos:
            d=json.loads(req('https://huggingface.co/api/models/'+repo+'?blobs=true'))
            rev=d['sha']; siblings=d.get('siblings') or []
            names=[s.get('rfilename') for s in siblings if s.get('rfilename')]
            small={}
            for name in ['adapter_config.json','README.md','trainer_state.json','training_args.json','training_history.json']:
              if name in names:
                try:
                  raw=req('https://huggingface.co/'+repo+'/resolve/'+rev+'/'+name+'?download=true')
                  if len(raw)<=750000: small[name]=raw.decode('utf-8','replace')
                except Exception: pass
            try: cfg=json.loads(small.get('adapter_config.json','{}'))
            except Exception: cfg={}
            w=[]
            for s in siblings:
              n=s.get('rfilename',''); lfs=s.get('lfs') or {}
              if n.endswith('.safetensors') and ('adapter' in n.lower() or 'lora' in n.lower()):
                w.append({'name':n,'size':s.get('size') or lfs.get('size'),'lfs_sha256':lfs.get('sha256'),'blobId':s.get('blobId')})
            base=cfg.get('base_model_name_or_path'); base_current=None
            if base:
              try: base_current=json.loads(req('https://huggingface.co/api/models/'+base)).get('sha')
              except Exception: pass
            out.append({'repo':repo,'adapter_revision':rev,'private':d.get('private'),'gated':d.get('gated'),'disabled':d.get('disabled'),'license_tags':[x for x in (d.get('tags') or []) if x.startswith('license:')],'pipeline_tag':d.get('pipeline_tag'),'base_model_name_or_path':base,'adapter_config_revision':cfg.get('revision'),'base_current_sha':base_current,'r':cfg.get('r'),'alpha':cfg.get('lora_alpha'),'targets':cfg.get('target_modules'),'task_type':cfg.get('task_type'),'weights':w,'README':small.get('README.md','')[:12000]})
          payload={'schema':'R22620_CPU_3WAY_METADATA_V1','weight_bytes_requested':0,'candidates':out}
          p=pathlib.Path('meta/CANDIDATES_3WAY.json');p.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          pathlib.Path('meta/CANDIDATES_3WAY.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  CANDIDATES_3WAY.json\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22620-cpu-3way
          path: meta
          retention-days: 1
          compression-level: 0
