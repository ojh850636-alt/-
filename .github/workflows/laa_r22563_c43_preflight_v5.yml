name: LAA R22563 C43 source-zero preflight v5
on:
  push:
    branches: [laa-r22563-c43-onepass]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen contract and exact source tree
        shell: bash
        run: |
          set -euo pipefail
          base64 -d r22563/c43_bundle.b64 > bundle.tgz
          test "$(stat -c%s bundle.tgz)" = 11492
          test "$(sha256sum bundle.tgz | awk '{print $1}')" = 24d49f1b0e5f586b45a139e5b0e68905b41ea7783d811bdc8026d75b6a8ded07
          mkdir payload
          tar -tzf bundle.tgz
          tar -xzf bundle.tgz -C payload
          python payload/research/r22563_c43/c43_forge.py
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('payload')
          c=json.loads((root/'configs/R22563_C43_PREOUTPUT_CONTRACT.json').read_text())
          assert c['model_outputs_observed_before_seal']==0
          assert c['raw_weight_bytes_local_before_seal']==0
          assert c['suite']['sha256']=='9504316bc8510898ecf6df944ef9713af64bfa714e352dc75e5f13312611818e'
          for rel,m in c['preoutput_bindings'].items():
              p=root/rel
              assert p.exists(),rel
              assert p.stat().st_size==m['size'],rel
              assert hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256'],rel
          assert len((root/'datasets/r22563_c43/C43_ZSH_COMPLETION_SUITE.jsonl').read_text().splitlines())==576
          print('FROZEN_CONTRACT_PASS')
          PY
          export GIT_LFS_SKIP_SMUDGE=1
          git clone -q --depth 1 https://huggingface.co/duoyuncloud/zsh-cli-lora a
          git clone -q --depth 1 https://huggingface.co/Qwen/Qwen2-0.5B b
          test "$(git -C a rev-parse HEAD)" = 884613f1800062085dbdf8fa5790fab0b70388dd
          test "$(git -C b rev-parse HEAD)" = 91d2aff3f957f99e4c74c962f2f408dcc88a18d8
          python - <<'PY'
          import pathlib
          af={p.name for p in pathlib.Path('a').iterdir() if p.name!='.git'}
          bf={p.name for p in pathlib.Path('b').iterdir() if p.name!='.git'}
          reqa={'README.md','adapter_config.json','adapter_model.safetensors','added_tokens.json','chat_template.jinja','config.json','merges.txt','special_tokens_map.json','tokenizer.json','tokenizer_config.json','vocab.json'}
          reqb={'LICENSE','config.json','generation_config.json','merges.txt','model.safetensors','tokenizer.json','tokenizer_config.json','vocab.json'}
          assert not(reqa-af),reqa-af
          assert not(reqb-bf),reqb-bf
          assert not({'pytorch_model.bin','training_args.bin'}&af)
          assert 'pytorch_model.bin' not in bf
          def ptr(p):
              d={}
              for l in p.read_text(errors='replace').splitlines():
                  if l.startswith('oid sha256:'): d['sha']=l.split(':',1)[1]
                  elif l.startswith('size '): d['size']=int(l.split()[1])
              return d
          assert ptr(pathlib.Path('a/adapter_model.safetensors'))=={'sha':'2afafe383fd3070d656b773302c6b4e0623cce20bdbbb5e205a5a01c6c8cf36a','size':1106719360}
          assert ptr(pathlib.Path('b/model.safetensors'))=={'sha':'9cd8fc8c85a197b8c551d6b931b5709fe2611889d6b44945876472fecdf77cad','size':988097824}
          print('EXACT_TREE_PASS')
          PY
      - name: Runtime dependency closure and controller self-test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q torch==2.10.0 transformers==4.57.1 peft==0.18.1 accelerate==1.14.0 safetensors==0.7.0
          PYTHONDONTWRITEBYTECODE=1 python payload/research/r22563_c43/c43_science.py --self-test | tee selftest.json
      - uses: actions/upload-artifact@v4
        with:
          name: r22563-c43-preflight-v5
          path: selftest.json
          retention-days: 1
