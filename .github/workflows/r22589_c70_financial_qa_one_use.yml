name: R22589 C70 financial QA one-use
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
jobs:
  c70:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed runner and runtime before any model source
        run: |
          set -euo pipefail
          test "$(git hash-object .github/r22589/c70_financial_qa_runner.py)" = "4b83ceb57a4aa30461a3bbb591bd82c3449ef12f"
          python -m py_compile .github/r22589/c70_financial_qa_runner.py
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.12.0'
          python -m pip install --disable-pip-version-check 'transformers==4.57.6' 'peft==0.20.0' 'accelerate==1.14.0' 'safetensors==0.7.0' 'huggingface_hub==1.4.1' 'numpy==2.3.5' 'psutil==7.0.0'
          python - <<'PY'
          import shutil,psutil,torch
          from transformers import Qwen3Config,Qwen3ForCausalLM
          from peft import LoraConfig,get_peft_model
          free=shutil.disk_usage('.').free; mem=psutil.virtual_memory().available
          assert free > 8_000_000_000, free
          assert mem > 8_000_000_000, mem
          cfg=Qwen3Config(vocab_size=256,hidden_size=64,intermediate_size=128,num_hidden_layers=1,num_attention_heads=4,num_key_value_heads=2,head_dim=16,max_position_embeddings=128)
          m=Qwen3ForCausalLM(cfg).to(dtype=torch.bfloat16)
          m=get_peft_model(m,LoraConfig(r=4,lora_alpha=8,target_modules=['q_proj','k_proj','v_proj','o_proj','gate_proj','up_proj','down_proj'])).eval()
          with torch.inference_mode(): y=m(input_ids=torch.randint(0,256,(1,8))).logits
          assert y.shape==(1,8,256) and torch.isfinite(y.float()).all()
          print({'PRE_SOURCE_RUNTIME_PASS':True,'torch':torch.__version__,'free_disk':free,'available_mem':mem})
          PY
      - name: Canonical one-use source and fresh behavior
        run: |
          set -euo pipefail
          python .github/r22589/c70_financial_qa_runner.py
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
      - name: Upload raw-free evidence even on scientific failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r22589-c70-financial-qa-rawfree
          path: work/out/
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
