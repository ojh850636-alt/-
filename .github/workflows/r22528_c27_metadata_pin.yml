name: R22528 C27 metadata-only source pin v2

on:
  push:
    branches: [agent/r22528-c27-segmentation-courier]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Pin public metadata and LFS identities only
        run: |
          python -m pip install 'requests==2.32.5'
          python - <<'PY'
          import hashlib,json,requests
          from pathlib import Path
          S=requests.Session(); S.headers['User-Agent']='LUCIA-AA-R22528-C27-metadata-only/2.0'
          repos=['uga-gaim/CLIPSeg-CloudSEN12Plus-LoRA','CIDAS/clipseg-rd64-refined']
          out={'schema':'R22528_C27_METADATA_PIN_V2','raw_model_weight_bytes_downloaded':0,'repos':{}}
          for repo in repos:
            r=S.get('https://huggingface.co/api/models/'+repo,params={'full':'true'},timeout=30); r.raise_for_status(); meta=r.json(); sha=meta['sha']
            tree=S.get(f'https://huggingface.co/api/models/{repo}/tree/{sha}',params={'recursive':'true','expand':'true'},timeout=30); tree.raise_for_status(); entries=tree.json()
            files={x.get('path'):x for x in entries if x.get('type')=='file'}
            card=meta.get('cardData') or {}
            row={'repo':repo,'sha':sha,'license':card.get('license') or next((t.split(':',1)[1] for t in meta.get('tags',[]) if t.startswith('license:')),None),'pipeline_tag':meta.get('pipeline_tag'),'library_name':meta.get('library_name'),'files':files}
            for rel in ['adapter_config.json','config.json','README.md']:
              q=S.get(f'https://huggingface.co/{repo}/resolve/{sha}/{rel}',timeout=30)
              if q.ok: row[rel]={'bytes':len(q.content),'sha256':hashlib.sha256(q.content).hexdigest(),'text':q.text[:20000]}
            out['repos'][repo]=row
          Path('r22528_c27_metadata_pin_v2.json').write_text(json.dumps(out,indent=2,sort_keys=True),encoding='utf-8')
          for repo,row in out['repos'].items():
            print('\n',repo,row['sha'],row['license'])
            for fn in ('adapter_model.safetensors','model.safetensors'):
              if fn in row['files']:
                x=row['files'][fn]; print(fn,'size',x.get('size'),'lfs',x.get('lfs'),'oid',x.get('oid'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R22528_C27_METADATA_PIN_V2
          path: r22528_c27_metadata_pin_v2.json
          compression-level: 0
          retention-days: 1
      - name: Publish run receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          body={'body':f"R22528_C27_METADATA_V2_RUN_ID={os.environ['RUN_ID']}"}
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues/26/comments",data=json.dumps(body).encode(),headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          print(urllib.request.urlopen(req,timeout=30).read().decode())
          PY
