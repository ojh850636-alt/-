name: R22528 C27 metadata-only source pin

on:
  push:
    branches: [agent/r22528-c27-segmentation-courier]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Pin public metadata only
        run: |
          python -m pip install 'requests==2.32.5'
          python - <<'PY'
          import hashlib,json,os,requests
          from pathlib import Path
          S=requests.Session(); S.headers['User-Agent']='LUCIA-AA-R22528-C27-metadata-only/1.0'
          repos=['uga-gaim/CLIPSeg-CloudSEN12Plus-LoRA','CIDAS/clipseg-rd64-refined']
          out={'schema':'R22528_C27_METADATA_PIN_V1','raw_model_weight_bytes_downloaded':0,'repos':{}}
          for repo in repos:
            m=S.get('https://huggingface.co/api/models/'+repo,timeout=30); m.raise_for_status(); meta=m.json()
            sha=meta.get('sha')
            siblings=[]
            for x in meta.get('siblings',[]):
              row={'rfilename':x.get('rfilename'),'size':x.get('size')}
              if x.get('lfs'): row['lfs']=x.get('lfs')
              siblings.append(row)
            card=meta.get('cardData') or {}
            row={'repo':repo,'sha':sha,'license':card.get('license') or next((t.split(':',1)[1] for t in meta.get('tags',[]) if t.startswith('license:')),None),'pipeline_tag':meta.get('pipeline_tag'),'library_name':meta.get('library_name'),'siblings':siblings,'tags':meta.get('tags',[])}
            for rel in ['adapter_config.json','config.json','README.md']:
              u=f'https://huggingface.co/{repo}/resolve/{sha}/{rel}'
              r=S.get(u,timeout=30)
              if r.ok:
                row[rel]={'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'text':r.text[:20000]}
            out['repos'][repo]=row
          Path('r22528_c27_metadata_pin.json').write_text(json.dumps(out,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps({r:{'sha':v['sha'],'license':v['license']} for r,v in out['repos'].items()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R22528_C27_METADATA_PIN
          path: r22528_c27_metadata_pin.json
          compression-level: 0
          retention-days: 1
      - name: Publish run receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          body={'body':f"R22528_C27_METADATA_RUN_ID={os.environ['RUN_ID']}"}
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues/26/comments",data=json.dumps(body).encode(),headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          print(urllib.request.urlopen(req,timeout=30).read().decode())
          PY
