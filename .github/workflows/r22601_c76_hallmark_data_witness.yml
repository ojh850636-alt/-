name: R22601 C76 Hallmark DATA witness probe
on:
  push:
    branches: [r22601-c76-hallmark-data-witness]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover immutable public DATA object identity only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, urllib.request

          repo='sebastianboehler/hallmark-mlx-reviewed-policy-traces'
          api='https://huggingface.co/api/datasets/'+repo

          def get_json(url):
              req=urllib.request.Request(url, headers={'User-Agent':'LAA-R22601-data-witness/1.0'})
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.load(r)

          def get_bytes(url):
              req=urllib.request.Request(url, headers={'User-Agent':'LAA-R22601-data-witness/1.0'})
              with urllib.request.urlopen(req, timeout=45) as r:
                  return r.read()

          meta=get_json(api)
          rev=str(meta.get('sha') or '')
          if len(rev)!=40:
              raise SystemExit('FAIL_NO_IMMUTABLE_DATASET_SHA '+repr(rev))
          print('DATASET_REPO='+repo)
          print('DATASET_COMMIT_SHA='+rev)
          print('DATASET_PRIVATE='+str(meta.get('private')))
          print('DATASET_GATED='+str(meta.get('gated')))

          commits=get_json(f'{api}/commits/main')
          ids=[str(c.get('id') or '') for c in commits if isinstance(c,dict)]
          print('DATASET_COMMIT_HISTORY_IDS='+','.join(ids))
          if rev not in ids:
              raise SystemExit('FAIL_CURRENT_SHA_NOT_IN_COMMIT_HISTORY')

          tree=get_json(f'{api}/tree/{rev}?recursive=true&expand=true')
          by={x.get('path'):x for x in tree if isinstance(x,dict)}
          print('TREE_ENTRY_COUNT='+str(len(by)))

          for name, expected_rows in [('train.jsonl',75),('valid.jsonl',6),('metadata.json',None),('reviewed_seed_traces_combined.jsonl',45)]:
              item=by.get(name)
              if not item:
                  raise SystemExit('FAIL_MISSING_TREE_OBJECT '+name)
              compact={k:item.get(k) for k in ('path','type','size','oid','lfs','xetHash') if k in item}
              print('TREE_OBJECT '+name+' '+json.dumps(compact,sort_keys=True,separators=(',',':')))
              raw=get_bytes(f'https://huggingface.co/datasets/{repo}/resolve/{rev}/{name}')
              sha=hashlib.sha256(raw).hexdigest()
              print(f'FILE_SHA256 {name} size={len(raw)} sha256={sha}')
              if name.endswith('.jsonl'):
                  rows=sum(1 for line in raw.splitlines() if line.strip())
                  print(f'FILE_ROWS {name} rows={rows}')
                  if expected_rows is not None and rows != expected_rows:
                      raise SystemExit(f'FAIL_ROW_COUNT {name} {rows}!={expected_rows}')

          model_repo='sebastianboehler/hallmark-mlx-qwen25-1.5b-lora'
          model_rev='4e24e866109fc0e2e7dfe2e0470529d68c45fbea'
          manifest=get_bytes(f'https://huggingface.co/{model_repo}/resolve/{model_rev}/training_manifest.json')
          print('MODEL_TRAINING_MANIFEST_SHA256='+hashlib.sha256(manifest).hexdigest())
          mj=json.loads(manifest)
          print('MODEL_MANIFEST_DATASET_DIR='+str(mj.get('dataset_dir')))
          print('MODEL_MANIFEST_RUN_ID_PRESENT='+str('61460529b25c' in json.dumps(mj,sort_keys=True)))
          if '61460529b25c/train/prepared_dataset' not in str(mj.get('dataset_dir')):
              raise SystemExit('FAIL_MODEL_MANIFEST_RUN_DATA_PATH')

          print('DONE_R22601_PUBLIC_DATA_OBJECT_WITNESS_NO_ADAPTER_BASE_WEIGHT_DOWNLOAD')
          PY

      - name: Regenerate exact run DATA from immutable Hallmark Git snapshot and compare bytes
        shell: bash
        run: |
          set -euo pipefail
          HALLMARK_COMMIT='fb2492313daaad9159cc7f38bddfc9f4e11686ec'
          DATASET_COMMIT='d8b8359473e28278b1dc558b63ebc406974785f3'
          EXPECT_TRAIN='cc97b4be14e81cfee5d3baa0fbbc4521efb20d236647f2544d5102ae782d7d61'
          EXPECT_VALID='7c483d347185aecdaa5dcb9b712e0b78ceb76fb3f932cd3c600f504673e963b3'

          git clone --quiet https://github.com/SebastianBoehler/hallmark-mlx.git /tmp/hallmark-mlx
          cd /tmp/hallmark-mlx
          git checkout --quiet "$HALLMARK_COMMIT"
          test "$(git rev-parse HEAD)" = "$HALLMARK_COMMIT"
          test -z "$(git status --porcelain)"

          python -m pip install --disable-pip-version-check -q uv
          uv sync --frozen --no-dev

          rm -rf /tmp/r22601-prepared
          mkdir -p /tmp/r22601-prepared
          uv run python - <<'PY'
          from pathlib import Path
          from hallmark_mlx.training.dataset_loader import prepare_training_dataset
          from hallmark_mlx.types import TrainingExampleFormat
          prepare_training_dataset(
              Path('data/processed'),
              Path('/tmp/r22601-prepared'),
              example_format=TrainingExampleFormat.TOOL_TRANSCRIPT_STEPS,
          )
          PY

          python - <<'PY'
          import hashlib, urllib.request
          from pathlib import Path

          dataset_repo='sebastianboehler/hallmark-mlx-reviewed-policy-traces'
          dataset_commit='d8b8359473e28278b1dc558b63ebc406974785f3'
          expected={
              'train.jsonl':'cc97b4be14e81cfee5d3baa0fbbc4521efb20d236647f2544d5102ae782d7d61',
              'valid.jsonl':'7c483d347185aecdaa5dcb9b712e0b78ceb76fb3f932cd3c600f504673e963b3',
          }
          for name in ('train.jsonl','valid.jsonl'):
              regen=Path('/tmp/r22601-prepared')/name
              rb=regen.read_bytes()
              rsha=hashlib.sha256(rb).hexdigest()
              req=urllib.request.Request(
                  f'https://huggingface.co/datasets/{dataset_repo}/resolve/{dataset_commit}/{name}',
                  headers={'User-Agent':'LAA-R22601-data-regen/1.0'},
              )
              with urllib.request.urlopen(req,timeout=45) as r:
                  public=r.read()
              psha=hashlib.sha256(public).hexdigest()
              print(f'REGEN_FILE {name} size={len(rb)} sha256={rsha}')
              print(f'PUBLIC_FILE {name} size={len(public)} sha256={psha}')
              print(f'BYTE_IDENTICAL {name}={rb == public}')
              if rsha != expected[name] or psha != expected[name] or rb != public:
                  raise SystemExit('FAIL_REGEN_PUBLIC_MISMATCH '+name)
          print('DONE_R22601_EXACT_GIT_REGEN_EQUALS_PUBLIC_RUN_DATA_BYTES')
          PY

          # Science-source ingress stays zero: remove all temporary external bytes.
          rm -rf /tmp/hallmark-mlx /tmp/r22601-prepared
          echo 'TEMP_EXTERNAL_BYTES_DELETED=true'
          echo 'ADAPTER_WEIGHT_BYTES=0'
          echo 'BASE_WEIGHT_BYTES=0'
