name: LAA R131 TREC CPU Raw-Free Experimental Audit
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/laa131.yml', 'laa131/**']
permissions:
  contents: read
jobs:
  trec:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CUDA_VISIBLE_DEVICES: ''
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified CPU runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.3.5' 'safetensors==0.7.0' 'huggingface-hub==0.36.0' 'transformers==4.57.1' 'peft==0.17.1' 'accelerate==1.14.0' 'tokenizers==0.22.1' 'hf-xet>=1.1,<2'
          python - <<'PY'
          import torch,transformers,peft
          assert not torch.cuda.is_available()
          print('CPU_RUNTIME',torch.__version__,transformers.__version__,peft.__version__)
          PY
      - name: Exact one-use TREC source and locked experiment; destroy raw before delivery
        shell: bash
        run: |
          set -euo pipefail
          export HF_HOME="${RUNNER_TEMP}/laa131-cache-${GITHUB_RUN_ID}"
          export HUGGINGFACE_HUB_CACHE="${HF_HOME}/hub"
          trap 'rm -rf "${HF_HOME}"' EXIT
          python -B laa131/remote131.py
          rm -rf "${HF_HOME}"
          python - <<'PY'
          import json,os
          from pathlib import Path
          v=json.loads(Path('result131.json').read_text(encoding='utf8'))
          assert v['raw_isolation_exit_absence'] and not Path(os.environ['HF_HOME']).exists()
          assert v['neural_forward_executed']
          assert not any(v[x] for x in ('raw_logits_exported','raw_activations_exported','model_weights_exported','causal_supported_E4','causal_supported_E5','external_algorithm','student','promotion'))
          assert len(v['predictions'])>=2*480*11
          print('RAW_FREE_RESULT_OK',len(v['predictions']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: laa131-rawfree
          path: result131.json
          retention-days: 1
          if-no-files-found: error
