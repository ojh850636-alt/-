name: Temporary LAA R22546 PondLLM V4.1 metadata courier

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact Adapter and Base metadata without model weights
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/LAA_R22546_V41_METADATA"
          mkdir -p "$ROOT/base_meta"
          REPO='Xnizzorg/pondllm-qwen3.5-0.8b-base-v4-1-rich-reachability'
          BASE_REPO='Qwen/Qwen3.5-0.8B-Base'
          EXPECTED_ADAPTER_SHA='40353df97bd33fccd894f18ee32da6973dcd14c7d357577da13ebb0d56666a05'
          EXPECTED_BASE_REV='dc7cdfe2ee4154fa7e30f5b51ca41bfa40174e68'
          EXPECTED_TRAIN_COMMIT='340131a4f130218fff3d90a87bd1b9577a9e17d0'
          EXPECTED_DATASET_SHA='84f5bae00fcd2a1a98737e9a98371dd534961dd01e0f704e6a4356dfea585815'

          curl -L --fail --retry 5 --retry-all-errors "https://huggingface.co/api/models/${REPO}?blobs=true" -o "$ROOT/model_api.json"
          HF_REV="$(python - <<'PY'
          import json,os
          p=os.path.join(os.environ['RUNNER_TEMP'],'LAA_R22546_V41_METADATA','model_api.json')
          print(json.load(open(p,encoding='utf-8'))['sha'])
          PY
          )"
          for FILE in adapter_config.json README.md run_manifest.json; do
            curl -L --fail --retry 5 --retry-all-errors "https://huggingface.co/${REPO}/resolve/${HF_REV}/${FILE}?download=true" -o "$ROOT/${FILE}"
          done

          curl -L --fail --retry 5 --retry-all-errors "https://huggingface.co/api/models/${BASE_REPO}/revision/${EXPECTED_BASE_REV}?blobs=true" -o "$ROOT/base_meta/model_api.json"
          for FILE in config.json tokenizer_config.json tokenizer.json chat_template.jinja; do
            CODE="$(curl -L -sS --retry 5 --retry-all-errors -w '%{http_code}' -o "$ROOT/base_meta/${FILE}" "https://huggingface.co/${BASE_REPO}/resolve/${EXPECTED_BASE_REV}/${FILE}?download=true")"
            if [ "$CODE" != "200" ]; then rm -f "$ROOT/base_meta/${FILE}"; fi
          done

          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'LAA_R22546_V41_METADATA'
          api=json.loads((root/'model_api.json').read_text(encoding='utf-8'))
          cfg=json.loads((root/'adapter_config.json').read_text(encoding='utf-8'))
          run=json.loads((root/'run_manifest.json').read_text(encoding='utf-8'))
          base_api=json.loads((root/'base_meta/model_api.json').read_text(encoding='utf-8'))
          expected_adapter='40353df97bd33fccd894f18ee32da6973dcd14c7d357577da13ebb0d56666a05'
          expected_base='dc7cdfe2ee4154fa7e30f5b51ca41bfa40174e68'
          expected_commit='340131a4f130218fff3d90a87bd1b9577a9e17d0'
          expected_dataset='84f5bae00fcd2a1a98737e9a98371dd534961dd01e0f704e6a4356dfea585815'
          siblings={x.get('rfilename'):x for x in api.get('siblings',[])}
          weight=siblings.get('adapter_model.safetensors',{})
          lfs=weight.get('lfs') or {}
          blob_sha=(lfs.get('sha256') or '').lower()
          size=lfs.get('size') or weight.get('size')
          base_safe=[]
          for x in base_api.get('siblings',[]):
              name=x.get('rfilename') or ''
              if name.endswith('.safetensors'):
                  lx=x.get('lfs') or {}
                  base_safe.append({'path':name,'sha256':(lx.get('sha256') or '').lower() or None,'size_bytes':lx.get('size') or x.get('size')})
          base_safe=sorted(base_safe,key=lambda x:x['path'])
          small={}
          for name in ('config.json','tokenizer_config.json','tokenizer.json','chat_template.jinja'):
              p=root/'base_meta'/name
              if p.exists(): small[name]={'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size_bytes':p.stat().st_size}
          checks={
            'adapter_lfs_sha_matches': blob_sha == expected_adapter,
            'base_model_matches': cfg.get('base_model_name_or_path') == 'Qwen/Qwen3.5-0.8B-Base',
            'rank_matches': cfg.get('r') == 8,
            'alpha_matches': cfg.get('lora_alpha') == 16,
            'modules_to_save_none': cfg.get('modules_to_save') is None,
            'run_git_dirty_false': run.get('git_dirty') is False,
            'run_git_commit_matches': str(run.get('git_commit','')).lower() == expected_commit,
            'run_base_revision_matches': str(run.get('model_revision','')).lower() == expected_base,
            'run_dataset_sha_matches': str(run.get('dataset_sha256','')).lower() == expected_dataset,
            'run_adapter_sha_matches': str(run.get('adapter_sha256','')).lower() == expected_adapter,
            'base_api_revision_matches': str(base_api.get('sha','')).lower() == expected_base,
            'base_safetensors_metadata_present': bool(base_safe) and all(x['sha256'] and x['size_bytes'] for x in base_safe),
          }
          if not all(checks.values()): raise SystemExit('metadata provenance mismatch: '+json.dumps(checks,sort_keys=True))
          out={
            'schema':'LUCIA_AA_R22546_PONDLLM_V41_EXACT_SOURCE_METADATA_V4',
            'repo_id':api.get('modelId') or api.get('id'),'hf_revision':api.get('sha'),'license':(api.get('cardData') or {}).get('license'),'pipeline_tag':api.get('pipeline_tag'),
            'adapter_config':cfg,'run_manifest':run,'provenance_checks':checks,
            'adapter_expected_sha256':expected_adapter,'adapter_api_sha256':blob_sha,'adapter_size_bytes':size,
            'base_repo_id':base_api.get('modelId') or base_api.get('id'),'base_revision':base_api.get('sha'),'base_license':(base_api.get('cardData') or {}).get('license'),
            'base_safetensors':base_safe,'base_small_file_digests':small,
            'adapter_siblings':[x.get('rfilename') for x in api.get('siblings',[])],
            'raw_weight_bytes_downloaded':0,'model_outputs_observed':0,'metadata_only':True,
          }
          (root/'METADATA_RECEIPT.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LAA_R22546_V41_METADATA_ONLY
          path: ${{ runner.temp }}/LAA_R22546_V41_METADATA
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
