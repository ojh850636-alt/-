name: R22590 C71 Regex adapter-only one-use
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  c71:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact reviewed runner and known-failure backend before source
        run: |
          set -euo pipefail
          test "$(git hash-object .github/r22590/c71_regex_static_runner.py)" = "fc689e462f9e7762d18df7a028aed88d7ebfb559"
          python -m py_compile .github/r22590/c71_regex_static_runner.py
          python -m pip install --disable-pip-version-check 'numpy==2.3.5'
          python .github/r22590/c71_regex_static_runner.py --preflight
      - name: Canonical one-use Regex Adapter archaeology
        run: |
          set -euo pipefail
          python .github/r22590/c71_regex_static_runner.py
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
      - name: Upload raw-free evidence even on scientific failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r22590-c71-regex-adapter-only-rawfree
          path: work/out/
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
      - name: Publish GitHub-internal run and artifact receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          OUT_BRANCH: r22590-c71-source-receipt
        run: |
          python - <<'PY'
          import os,json,urllib.request,base64,time,datetime
          H={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22590-source-receipt'}
          repo=os.environ['REPO'];run=int(os.environ['RUN_ID'])
          arts=[]
          for _ in range(8):
            req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{run}/artifacts?per_page=100',headers=H)
            with urllib.request.urlopen(req,timeout=30) as r:d=json.loads(r.read().decode())
            arts=d.get('artifacts',[])
            if arts: break
            time.sleep(2)
          out={'schema':'R22590_C71_GITHUB_SOURCE_RUN_RECEIPT_V1','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'run_id':run,'head_sha':os.environ['SHA'],'artifacts':[{'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'digest':a.get('digest'),'expired':a.get('expired')} for a in arts]}
          b=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode();path='recovery/R22590_C71_GITHUB_SOURCE_RUN_RECEIPT.json'
          payload=json.dumps({'message':'Persist R22590 C71 source run receipt','content':base64.b64encode(b).decode(),'branch':os.environ['OUT_BRANCH']}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=payload,headers={**H,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r:print(r.read().decode())
          PY
