name: LAA R22528 C27 Exact Courier

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Exact metadata pin and safe-source capture
        shell: bash
        run: |
          set -euo pipefail
          ADAPTER_REPO='uga-gaim/CLIPSeg-CloudSEN12Plus-LoRA'
          ADAPTER_REV='3fddbf18830d7d5ae563d73060a57cb59c2c0d4c'
          ADAPTER_AMEND='10682e040b3ed26e83daf92f7aa4b676887e720b'
          BASE_REPO='CIDAS/clipseg-rd64-refined'
          EXPECT_BASE_REV='999e0328d9e10b484360c477313983f9afdd7050'
          RESOLVED_BASE_REV="$(git ls-remote "https://huggingface.co/${BASE_REPO}" refs/heads/main | awk '{print $1}')"
          printf '%s\n' "resolved_base_revision=${RESOLVED_BASE_REV}"
          test "${RESOLVED_BASE_REV}" = "${EXPECT_BASE_REV}"

          python -m pip install --disable-pip-version-check -q 'huggingface_hub[hf_xet]==0.36.0' 'safetensors==0.7.0'
          mkdir -p courier_out/{adapter,base,meta,wheels,parts}

          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import snapshot_download, hf_hub_download
          import hashlib, json, shutil
          from safetensors import safe_open

          adapter_repo='uga-gaim/CLIPSeg-CloudSEN12Plus-LoRA'
          adapter_rev='3fddbf18830d7d5ae563d73060a57cb59c2c0d4c'
          adapter_amend='10682e040b3ed26e83daf92f7aa4b676887e720b'
          base_repo='CIDAS/clipseg-rd64-refined'
          base_rev='999e0328d9e10b484360c477313983f9afdd7050'
          out=Path('courier_out'); a=out/'adapter'; b=out/'base'; m=out/'meta'
          a_allow=['adapter_config.json','adapter_model.safetensors','preprocessor_config.json','tokenizer_config.json','special_tokens_map.json','vocab.json','merges.txt']
          b_allow=['config.json','model.safetensors','preprocessor_config.json','tokenizer_config.json','special_tokens_map.json','vocab.json','merges.txt']
          snapshot_download(repo_id=adapter_repo, revision=adapter_rev, allow_patterns=a_allow, local_dir=a)
          snapshot_download(repo_id=base_repo, revision=base_rev, allow_patterns=b_allow, local_dir=b)
          amend=hf_hub_download(repo_id=adapter_repo, revision=adapter_amend, filename='adapter_config.json')
          shutil.copy2(amend, m/'adapter_config_metadata_amendment.json')
          for root in (a,b):
              cache=root/'.cache'
              if cache.exists(): shutil.rmtree(cache)

          def sha(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          def st_header(path):
              with safe_open(str(path),framework='pt',device='cpu') as f:
                  keys=list(f.keys()); sample=[]
                  for k in keys[:64]: sample.append({'key':k,'shape':list(f.get_slice(k).get_shape())})
              return {'tensor_count':len(keys),'sample':sample}

          aw=a/'adapter_model.safetensors'; bw=b/'model.safetensors'
          expected={
              'adapter':{'bytes':15957528,'sha256':'18b405c1b2770981afb5f58e69f59fed2fe160455ecdc1c02c5576eec3742f80'},
              'base':{'bytes':603049496,'sha256':'d00ca85d6b859f9d07b7cfb8ef26fe9771cb275b34c9368f2ecf603139307f55'},
          }
          observed={
              'adapter':{'bytes':aw.stat().st_size,'sha256':sha(aw),'header':st_header(aw)},
              'base':{'bytes':bw.stat().st_size,'sha256':sha(bw),'header':st_header(bw)},
          }
          for role in ('adapter','base'):
              assert observed[role]['bytes']==expected[role]['bytes'], (role,observed[role]['bytes'])
              assert observed[role]['sha256']==expected[role]['sha256'], (role,observed[role]['sha256'])
          blocked=[]
          for root in (a,b):
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix.lower() in {'.bin','.pt','.pth','.pkl','.pickle','.h5','.msgpack'}: blocked.append(str(p))
          assert not blocked, blocked
          small=[]
          for role,root in [('adapter',a),('base',b)]:
              for p in root.rglob('*'):
                  if p.is_file() and p.name not in {'adapter_model.safetensors','model.safetensors'}:
                      rel=f'{role}/{p.relative_to(root).as_posix()}'
                      dest=m/rel; dest.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,dest)
                      small.append({'path':rel,'bytes':p.stat().st_size,'sha256':sha(p)})
          manifest={'schema':'LUCIA_AA_R22528_C27_COURIER_V1','adapter_repo':adapter_repo,'adapter_revision':adapter_rev,'adapter_metadata_amendment_revision':adapter_amend,'base_repo':base_repo,'base_revision':base_rev,'expected':expected,'observed':observed,'small_files':small,'blocked_files_present':blocked,'raw_committed_to_git':False}
          (m/'SOURCE_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY

          split -b 150M courier_out/base/model.safetensors courier_out/parts/base_
          rm courier_out/base/model.safetensors
          python -m pip download --disable-pip-version-check --no-deps -q -d courier_out/wheels \
            'transformers==5.0.0' 'peft==0.18.1' 'tokenizers==0.22.2' 'accelerate==1.14.0'
          sha256sum courier_out/wheels/* > courier_out/meta/WHEEL_SHA256.txt
          ls -lh courier_out/parts courier_out/adapter courier_out/meta courier_out/wheels

      - name: Upload C27 metadata
        uses: actions/upload-artifact@v4
        with:
          name: r22528-c27-meta
          path: courier_out/meta
          retention-days: 1
          compression-level: 6
      - name: Upload C27 adapter
        uses: actions/upload-artifact@v4
        with:
          name: r22528-c27-adapter
          path: courier_out/adapter/adapter_model.safetensors
          retention-days: 1
          compression-level: 0
      - name: Upload C27 base part 00
        uses: actions/upload-artifact@v4
        with:
          name: r22528-c27-base-00
          path: courier_out/parts/base_aa
          retention-days: 1
          compression-level: 0
      - name: Upload C27 base part 01
        uses: actions/upload-artifact@v4
        with:
          name: r22528-c27-base-01
          path: courier_out/parts/base_ab
          retention-days: 1
          compression-level: 0
      - name: Upload C27 base part 02
        uses: actions/upload-artifact@v4
        with:
          name: r22528-c27-base-02
          path: courier_out/parts/base_ac
          retention-days: 1
          compression-level: 0
      - name: Upload C27 base part 03
        uses: actions/upload-artifact@v4
        with:
          name: r22528-c27-base-03
          path: courier_out/parts/base_ad
          retention-days: 1
          compression-level: 0
      - name: Upload C27 runtime wheels
        uses: actions/upload-artifact@v4
        with:
          name: r22528-c27-wheels
          path: courier_out/wheels
          retention-days: 1
          compression-level: 0
