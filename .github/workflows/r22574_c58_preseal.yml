name: r22574-c58-preseal
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install source-zero dependencies
        run: python -m pip install --quiet 'huggingface_hub>=0.36,<2' requests
      - name: Build RxNorm-locked source-zero preseal
        env:
          C58_OUT: out
        run: python tools/r22574_c58_preseal.py
      - name: Assert no model weights entered preseal
        shell: bash
        run: |
          if find out -type f \( -name '*.safetensors' -o -name '*.bin' -o -name '*.pt' -o -name '*.pth' -o -name '*.pkl' \) | grep -q .; then
            echo 'raw model file present in preseal artifact' >&2; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: r22574-c58-preseal
          path: out
          retention-days: 1
          if-no-files-found: error
