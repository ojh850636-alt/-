name: R22619 C78 CPU runtime delta wheel
on:
  push:
    branches: [r22619-c78-jobs]
jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download only bitsandbytes runtime delta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheels
          python -m pip download --only-binary=:all: --no-deps --dest wheels 'bitsandbytes==0.48.1'
          python - <<'PY'
          import pathlib,hashlib,json
          rows=[]
          for p in pathlib.Path('wheels').glob('*.whl'):
              rows.append({'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          pathlib.Path('wheels/WHEEL_MANIFEST.json').write_text(json.dumps({'schema':'R22619_C78_RUNTIME_DELTA_V1','rows':rows},indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22619-c78-runtime-delta
          path: wheels
          retention-days: 1
          compression-level: 0
# trigger after workflow creation
