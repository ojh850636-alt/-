name: R22594 C75 metadata-only hard-new extension
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: r22594-c75-metadata-extension
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Audit only new extension candidates; model weights stay zero
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT_BRANCH: r22594-c75-metadata-receipt
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p work/out
          python - <<'PY'
          import urllib.request,urllib.error,json,re,hashlib,datetime,os,base64
          from pathlib import Path
          UA={'User-Agent':'LUCIA-AA-R22594-C75-extension'}
          DEDUP_SHA='ffb7a0c01cd5a7da44953ac6dbf854ddebf831fa5d5f47b4cec65b02f4bfa44b'
          RUN1_ADMITTED=[
            {'id':'C75-B','repo':'Petanque/flow-forge-mermaid-th','family':'NATURAL_LANGUAGE_TO_MERMAID_GRAPH_AST_AND_DENOTATION','score':128,'exact_base':False,'adapter_size':73911112},
            {'id':'C75-D','repo':'pushpam14/api-contract-validator-grpo-7b','family':'OPENAPI_BREAKING_CHANGE_TO_DOWNSTREAM_BLAST_RADIUS_AND_BACKWARD_COMPAT_FIX','score':111,'exact_base':False,'adapter_size':161533192},
          ]
          CANDS=[
            {'id':'C75-F','repo':'oleh13/retro-reactants-qwen25-7b-lora','family':'TARGET_PRODUCT_SMILES_TO_PRECURSOR_MULTISET_WITH_FORWARD_REACTION_VALIDITY','anchor_groups':[['retrosynthesis','reactant prediction','predict_reactants'],['product smiles','reactants_smiles']],'verifier_quality':35,'novelty':31,'cost':7},
            {'id':'C75-G','repo':'xingjianll/aria-accompaniment','family':'SYMBOLIC_MELODY_TO_MIDI_ACCOMPANIMENT_EVENT_STRUCTURE','anchor_groups':[['accompaniment'],['midi']],'verifier_quality':18,'novelty':27,'cost':12},
            {'id':'C75-H','repo':'mclemcrew/Qwen2-Audio-MixAssist-LoRA','family':'MULTITRACK_AUDIO_STATE_TO_MIX_CONTROL_ACTIONS','anchor_groups':[['mixassist','mixing'],['audio']],'verifier_quality':16,'novelty':28,'cost':6},
          ]
          def get(url,limit=6_000_000):
            req=urllib.request.Request(url,headers=UA)
            with urllib.request.urlopen(req,timeout=60) as r:
              b=r.read(limit+1)
              if len(b)>limit: raise RuntimeError('META_TOO_LARGE:'+url)
              return b
          def getj(url): return json.loads(get(url).decode())
          def raw(repo,sha,name): return get(f'https://huggingface.co/{repo}/raw/{sha}/{name}').decode('utf-8','replace')
          def sib(info,name):
            for x in info.get('siblings') or []:
              if x.get('rfilename')==name:
                l=x.get('lfs') or {};return {'name':name,'size':l.get('size') or x.get('size'),'sha256':str(l.get('sha256') or l.get('oid') or '').replace('sha256:',''),'blob_id':x.get('blobId')}
            return None
          def texts(repo,sha,info):
            out=[]
            for x in info.get('siblings') or []:
              n=x.get('rfilename') or '';z=(x.get('lfs') or {}).get('size') or x.get('size') or 0
              if z and z>1_000_000: continue
              if not re.search(r'(^README\.md$|\.(md|json|txt|ya?ml|toml)$)',n,re.I): continue
              try: out.append((n,raw(repo,sha,n)))
              except Exception: pass
            return out
          def exact_base(base,cfg,ts):
            proofs=[];cr=cfg.get('revision') if isinstance(cfg,dict) else None
            candidates=[]
            if isinstance(cr,str) and re.fullmatch(r'[0-9a-f]{40}',cr): candidates.append((cr,'adapter_config.json','config_revision'))
            for n,t in ts:
              for m in re.finditer(r'(?<![0-9a-f])[0-9a-f]{40}(?![0-9a-f])',t,re.I):
                ctx=t[max(0,m.start()-220):min(len(t),m.end()+220)]
                if re.search(r'(base|training).{0,120}(revision|commit|snapshot)|(?:revision|commit|snapshot).{0,120}(base|training)',ctx,re.I|re.S): candidates.append((m.group(0).lower(),n,'context'))
            for tok,n,why in candidates:
              try:
                bi=getj(f'https://huggingface.co/api/models/{base}/revision/{tok}')
                if bi.get('sha')==tok: proofs.append({'revision':tok,'file':n,'reason':why})
              except Exception: pass
            uniq=[]
            for p in proofs:
              if p not in uniq:uniq.append(p)
            return uniq[:4]
          rows=[]
          for c in CANDS:
            r={**c,'dedup_preseal_sha256':DEDUP_SHA,'weight_path_get_count':0,'model_weight_bytes':0,'hard_reject_reasons':[],'semantic_anchor_matches':{}}
            try:
              info=getj('https://huggingface.co/api/models/'+c['repo']+'?blobs=true');sha=info.get('sha');r['immutable_revision']=sha
              if not re.fullmatch(r'[0-9a-f]{40}',str(sha)):r['hard_reject_reasons'].append('NO_IMMUTABLE_SHA')
              lic=(info.get('cardData') or {}).get('license');r['license']=lic;r['license_clear']=bool(lic and str(lic).lower() not in {'other','unknown'})
              if not r['license_clear']:r['hard_reject_reasons'].append('LICENSE_UNCLEAR')
              ts=texts(c['repo'],sha,info);corpus='\n'.join(t for _,t in ts).lower()
              for j,g in enumerate(c['anchor_groups']):r['semantic_anchor_matches'][str(j)]=[a for a in g if a.lower() in corpus]
              r['semantic_task_clear']=all(r['semantic_anchor_matches'][str(j)] for j in range(len(c['anchor_groups'])))
              if not r['semantic_task_clear']:r['hard_reject_reasons'].append('SEMANTIC_TASK_UNCLEAR_FROM_IMMUTABLE_TEXT')
              try:cfg=json.loads(raw(c['repo'],sha,'adapter_config.json'))
              except Exception:cfg=None
              r['adapter_config_present']=isinstance(cfg,dict)
              if not isinstance(cfg,dict):r['hard_reject_reasons'].append('NO_ADAPTER_CONFIG')
              if isinstance(cfg,dict):
                r.update({'peft_type':cfg.get('peft_type'),'declared_base':cfg.get('base_model_name_or_path'),'r':cfg.get('r'),'lora_alpha':cfg.get('lora_alpha'),'lora_dropout':cfg.get('lora_dropout'),'modules_to_save':cfg.get('modules_to_save'),'target_modules':sorted(cfg.get('target_modules') or [])})
                if cfg.get('peft_type')!='LORA':r['hard_reject_reasons'].append('NOT_LORA')
                if cfg.get('modules_to_save') not in (None,[]):r['hard_reject_reasons'].append('AUX_MODULES_TO_SAVE')
              w=sib(info,'adapter_model.safetensors') or sib(info,'adapters.safetensors');r['adapter_lfs']=w
              if not w or not w.get('size') or not re.fullmatch(r'[0-9a-f]{64}',str(w.get('sha256') or '')):r['hard_reject_reasons'].append('NO_ADAPTER_LFS_IDENTITY')
              base=(cfg or {}).get('base_model_name_or_path');proofs=exact_base(base,cfg,ts) if base else []
              r['exact_training_base_revision_proofs']=proofs;r['exact_training_base_revision_proven']=bool(proofs);r['exact_training_base_revision']=proofs[0]['revision'] if proofs else None
              size=int(w['size']) if w and w.get('size') else 10**12;source_cost=25 if size<100_000_000 else (18 if size<200_000_000 else 5)
              r['admission_score']=(50 if proofs else 0)+(20 if r['license_clear'] else 0)+c['verifier_quality']+c['novelty']+source_cost+c['cost']-(100 if r['hard_reject_reasons'] else 0)
              r['hard_new_admissible']=not r['hard_reject_reasons']
            except Exception as e:r['hard_reject_reasons'].append('META_AUDIT_ERROR:'+type(e).__name__+':'+str(e)[:180]);r['hard_new_admissible']=False;r['admission_score']=-999
            rows.append(r)
          ext=[r for r in rows if r.get('hard_new_admissible')]
          combined=RUN1_ADMITTED+[{'id':r['id'],'repo':r['repo'],'family':r['family'],'score':r['admission_score'],'exact_base':r['exact_training_base_revision_proven'],'adapter_size':(r.get('adapter_lfs') or {}).get('size'),'revision':r.get('exact_training_base_revision')} for r in ext]
          source_authorized=len(combined)>=3
          selected=None;lane='NO_SOURCE_MINIMUM_3_HARD_NEW_NOT_MET'
          if source_authorized:
            selected=max(combined,key=lambda x:(bool(x.get('exact_base')),x.get('score',-999),-(x.get('adapter_size') or 10**12)))
            lane='BEHAVIOR_AUTHORIZED_IF_EXACT_BASE' if selected.get('exact_base') else 'ADAPTER_ONLY_E1_STATIC'
          out={'schema':'R22594_C75_METADATA_EXTENSION_V1','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'dedup_preseal_sha256':DEDUP_SHA,'run1_admitted':RUN1_ADMITTED,'extension_candidates':rows,'extension_admitted_count':len(ext),'combined_hard_new_count':len(combined),'minimum_required':3,'source_authorized':source_authorized,'weight_path_get_count':0,'model_weight_bytes':0,'selection':{'selected':selected,'lane':lane,'policy':'combine frozen run1 admitted families with extension only; exact Base > score > lower adapter bytes'}}
          p=Path('work/out/R22594_C75_METADATA_EXTENSION.json');p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          H={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22594-extension-receipt','Content-Type':'application/json'}
          b=p.read_bytes();path=f"recovery/R22594_C75_METADATA_EXTENSION_RUN_{os.environ['RUN_ID']}.json";payload=json.dumps({'message':'Persist R22594 C75 metadata extension','content':base64.b64encode(b).decode(),'branch':os.environ['OUT_BRANCH']}).encode();req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}",data=payload,headers=H,method='PUT');urllib.request.urlopen(req,timeout=30).read()
          print(json.dumps({'PASS':True,'extension_admitted_count':len(ext),'combined_hard_new_count':len(combined),'source_authorized':source_authorized,'selected':selected,'lane':lane},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: r22594-c75-metadata-extension, path: work/out/, compression-level: 0, retention-days: 1, if-no-files-found: error}
      - name: Persist run identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT_BRANCH: r22594-c75-metadata-receipt
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,base64,time,datetime
          H={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22594-extension-run','Content-Type':'application/json'};arts=[]
          for _ in range(10):
            req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}/artifacts?per_page=100",headers=H)
            with urllib.request.urlopen(req,timeout=30) as r:d=json.loads(r.read().decode())
            arts=d.get('artifacts',[])
            if arts:break
            time.sleep(2)
          out={'schema':'R22594_C75_METADATA_EXTENSION_RUN_RECEIPT_V1','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'run_id':int(os.environ['RUN_ID']),'head_sha':os.environ['HEAD_SHA'],'huggingface_weight_path_get_count':0,'model_weight_bytes':0,'artifacts':[{'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'digest':a.get('digest'),'expired':a.get('expired')} for a in arts]}
          b=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode();path=f"recovery/R22594_C75_METADATA_EXTENSION_RUN_RECEIPT_{os.environ['RUN_ID']}.json";payload=json.dumps({'message':'Persist R22594 C75 extension run identity','content':base64.b64encode(b).decode(),'branch':os.environ['OUT_BRANCH']}).encode();req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}",data=payload,headers=H,method='PUT');urllib.request.urlopen(req,timeout=30).read()
          PY