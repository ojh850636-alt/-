name: R22591 C72 email exact-base one-use retry
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  c72:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile runner projection binding and preflight before source
        run: |
          set -euo pipefail
          test "$(git hash-object .github/r22591/c72_email_runner.py)" = "132ef07cdabccee8d5c2f636c5d48f9a82a44f81"
          python -m py_compile .github/r22591/c72_retry_projection_patch.py
          python .github/r22591/c72_retry_projection_patch.py
          test "$(sha256sum .github/r22591/c72_email_runner_retry.py | awk '{print $1}')" = "4000643196ce3b5f77fef6a10f353ed85c052b7ad1ed49726eb6926f3fd75cfb"
          python -m py_compile .github/r22591/c72_email_runner_retry.py
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.12.0'
          python -m pip install --disable-pip-version-check 'transformers==4.57.6' 'peft==0.20.0' 'accelerate==1.14.0' 'safetensors==0.7.0' 'huggingface_hub==0.36.0' 'numpy==2.3.5' 'psutil==7.0.0'
          PYTHONDONTWRITEBYTECODE=1 python -B .github/r22591/c72_email_runner_retry.py --preflight
      - name: Retry one-use Adapter plus exact Base and fresh behavior
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -B .github/r22591/c72_email_runner_retry.py
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
      - name: Upload raw-free C72 attempt2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r22591-c72-email-exact-base-attempt2-rawfree
          path: work/out/
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
      - name: Persist GitHub-internal attempt2 run and artifact receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          OUT_BRANCH: r22591-c72-source-receipt
        run: |
          python - <<'PY'
          import os,json,urllib.request,base64,time,datetime
          H={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22591-C72-source-receipt2','Content-Type':'application/json'}
          arts=[]
          for _ in range(10):
            req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}/artifacts?per_page=100",headers=H)
            with urllib.request.urlopen(req,timeout=30) as r:d=json.loads(r.read().decode())
            arts=d.get('artifacts',[])
            if arts: break
            time.sleep(2)
          out={'schema':'R22591_C72_GITHUB_SOURCE_RUN_RECEIPT_ATTEMPT2_V1','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'run_id':int(os.environ['RUN_ID']),'head_sha':os.environ['HEAD_SHA'],'attempt':2,'prior_attempt_source_consumed':False,'scientific_logic_changes_from_attempt1':0,'projection_hash_changes':3,'artifacts':[{'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'digest':a.get('digest'),'expired':a.get('expired')} for a in arts]}
          b=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode();payload=json.dumps({'message':'Persist R22591 C72 source run receipt attempt2','content':base64.b64encode(b).decode(),'branch':os.environ['OUT_BRANCH']}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/recovery/R22591_C72_GITHUB_SOURCE_RUN_RECEIPT_ATTEMPT2.json",data=payload,headers=H,method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r:r.read()
          PY
