name: R22527 C26 receipted courier

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Capture exact source
        env: {HF_HUB_DISABLE_TELEMETRY: '1'}
        run: |
          python -m pip install 'huggingface_hub==1.4.1' 'safetensors==0.7.0' 'numpy==2.3.5'
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          from huggingface_hub import snapshot_download
          from safetensors import safe_open
          root=Path('bundle'); a=root/'adapter'; b=root/'base'; a.mkdir(parents=True); b.mkdir(parents=True)
          ar='Be-win/whisper-small-mal-en-lora'; av='326fa07ed37811577e2b8aa8b3061dfa15743bdd'
          br='openai/whisper-small'; bv='3b23e4eeeced745eaf0123aa52f1dd4dd27dff54'
          aa=['README.md','adapter_config.json','adapter_model.safetensors','added_tokens.json','merges.txt','normalizer.json','preprocessor_config.json','special_tokens_map.json','tokenizer.json','tokenizer_config.json','vocab.json']
          ba=['README.md','config.json','generation_config.json','model.safetensors','added_tokens.json','merges.txt','normalizer.json','preprocessor_config.json','special_tokens_map.json','tokenizer.json','tokenizer_config.json','vocab.json']
          banned=['*.bin','*.pt','*.pth','*.pkl','*.pickle','*.h5','*.msgpack','*.ckpt','*.py','*.ipynb','onnx/**']
          ac=snapshot_download(repo_id=ar,revision=av,allow_patterns=aa,ignore_patterns=banned); bc=snapshot_download(repo_id=br,revision=bv,allow_patterns=ba,ignore_patterns=banned)
          def cp(src,dst,names):
            out=[]
            for rel in names:
              p=Path(src)/rel
              if p.is_file(): q=dst/rel; q.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,q); out.append(rel)
            return out
          ca=cp(ac,a,aa); cb=cp(bc,b,ba)
          def sha(p):
            h=hashlib.sha256()
            with open(p,'rb') as f:
              for x in iter(lambda:f.read(1048576),b''): h.update(x)
            return h.hexdigest()
          def tshape(p):
            rows=[]
            with safe_open(p,framework='numpy') as f:
              for k in f.keys(): s=f.get_slice(k); rows.append({'key':k,'shape':[int(x) for x in s.get_shape()],'dtype':str(s.get_dtype())})
            return rows
          aw=a/'adapter_model.safetensors'; bw=b/'model.safetensors'
          if sha(aw)!='e6ccbca5a7e47cdb90a4867c46f6fda26ca35e599cc38ec984d447193c88ca8c': raise SystemExit('adapter mismatch')
          if bw.stat().st_size!=966995080 or sha(bw)!='1d7734884874f1a1513ed9aa760a4f8e97aaa02fd6d93a3a85d27b2ae9ca596b': raise SystemExit('base mismatch')
          rep={'schema':'R22527_C26_CAPTURE_V2','adapter':{'repo':ar,'revision':av,'size':aw.stat().st_size,'sha256':sha(aw),'copied':ca,'tensors':tshape(aw)},'base':{'repo':br,'revision':bv,'size':bw.stat().st_size,'sha256':sha(bw),'copied':cb,'training_time_revision_proven':False},'trust_remote_code':False,'pickle_loaded':False}
          (root/'CAPTURE_MANIFEST.json').write_text(json.dumps(rep,indent=2,sort_keys=True))
          print(json.dumps({'adapter_bytes':aw.stat().st_size,'adapter_sha256':sha(aw),'base_bytes':bw.stat().st_size,'base_sha256':sha(bw)},indent=2))
          PY
          mkdir -p parts/meta parts/adapter parts/base
          cp bundle/CAPTURE_MANIFEST.json parts/meta/
          find bundle/adapter -type f ! -name adapter_model.safetensors -exec cp --parents '{}' parts/meta/ \;
          find bundle/base -type f ! -name model.safetensors -exec cp --parents '{}' parts/meta/ \;
          cp bundle/adapter/adapter_model.safetensors parts/adapter/
          split -b 180M -d -a 2 bundle/base/model.safetensors parts/base/base.part.
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          rows=[]
          for p in sorted(Path('parts/base').glob('base.part.*')): rows.append({'name':p.name,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          Path('parts/base/PARTS_MANIFEST.json').write_text(json.dumps(rows,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: R22527_C26_R_META, path: parts/meta, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22527_C26_R_ADAPTER, path: parts/adapter, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22527_C26_R_BASE_00, path: parts/base/base.part.00, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22527_C26_R_BASE_01, path: parts/base/base.part.01, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22527_C26_R_BASE_02, path: parts/base/base.part.02, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22527_C26_R_BASE_03, path: parts/base/base.part.03, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22527_C26_R_BASE_04, path: parts/base/base.part.04, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22527_C26_R_BASE_05, path: parts/base/base.part.05, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22527_C26_R_BASE_MANIFEST, path: parts/base/PARTS_MANIFEST.json, compression-level: 0, retention-days: 1}
      - name: Publish run receipt to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          body={'body':f"R22527_C26_COURIER_RUN_ID={os.environ['RUN_ID']}"}
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments",data=json.dumps(body).encode(),headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          print(urllib.request.urlopen(req,timeout=30).read().decode())
          PY
