name: R22590 C71 metadata evidence recovery only
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover one prior metadata run without model network
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT_BRANCH: r22590-c71-metadata-recovery
          TARGET_SHA: 99bc87ea51ef74d5144c2025b5b236d6112082cb
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,urllib.request,base64,datetime
          token=os.environ['GH_TOKEN'];repo=os.environ['REPO'];sha=os.environ['TARGET_SHA'];branch=os.environ['OUT_BRANCH']
          H={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUCIA-AA-R22590-recovery'}
          def api(path):
            req=urllib.request.Request('https://api.github.com'+path,headers=H)
            with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode())
          d=api(f'/repos/{repo}/actions/runs?head_sha={sha}&per_page=100')
          runs=[]
          for r in d.get('workflow_runs',[]):
            if r.get('path')!='.github/workflows/r22590_c71_metadata_audit.yml': continue
            arts=api(f"/repos/{repo}/actions/runs/{r['id']}/artifacts?per_page=100").get('artifacts',[])
            runs.append({'id':r['id'],'name':r.get('name'),'path':r.get('path'),'event':r.get('event'),'status':r.get('status'),'conclusion':r.get('conclusion'),'head_sha':r.get('head_sha'),'created_at':r.get('created_at'),'updated_at':r.get('updated_at'),'artifacts':[{'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'digest':a.get('digest'),'expired':a.get('expired')} for a in arts]})
          out={'schema':'R22590_C71_METADATA_RUN_RECOVERY_V1','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'huggingface_calls':0,'model_or_adapter_network_calls':0,'target_sha':sha,'runs':runs,'run_count':len(runs)}
          b=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode();path='recovery/R22590_C71_METADATA_RUN_RECOVERY.json'
          payload=json.dumps({'message':'Persist R22590 C71 metadata run recovery','content':base64.b64encode(b).decode(),'branch':branch}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=payload,headers={**H,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r:res=json.loads(r.read().decode())
          print(json.dumps({'PASS':True,'run_count':len(runs),'path':path,'content_sha':res.get('content',{}).get('sha')},indent=2))
          PY
