name: R22601 C76 Hallmark authorized one-use archaeology
on:
  pull_request:
    branches: [main]
    types: [opened]
permissions:
  contents: write
concurrency:
  group: r22601-c76-hallmark-source-oneuse
  cancel-in-progress: false
jobs:
  archaeology:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      RECEIPT_BRANCH: r22601-c76-hallmark-consumption-receipt
      SOURCE_REPO: sebastianboehler/hallmark-mlx-qwen25-1.5b-lora
      SOURCE_REV: 4e24e866109fc0e2e7dfe2e0470529d68c45fbea
      SOURCE_PATH: adapters.safetensors
      EXPECTED_ADAPTER_SHA: 551975ad96235ee5a125df3bef460111d46ed51e95061fd3c37398be4cf5b53a
      EXPECTED_ADAPTER_SIZE: '18485794'
      EXPECTED_CONFIG_SHA: 07e3354eb4fe8a2f5ea538f21c32d6d2d5c71513c7b38f0d9cfa8d7a8eb1b3dc
      EXPECTED_RUNNER_SHA: 6d6151f2816177c5f85945761577babe3f468bbb9619210c698930faf20ec97e
      EXPECTED_SUITE_SHA: beea0021151e66c81163d9098fd6eb859125a8cbebdffc94082d312af649e705
      HALLMARK_COMMIT: fb2492313daaad9159cc7f38bddfc9f4e11686ec
      BASE_REPO: Qwen/Qwen2.5-1.5B-Instruct
      BASE_REV: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
      HF_HOME: /tmp/r22601-hf
      HF_HUB_CACHE: /tmp/r22601-hf/hub
      TRANSFORMERS_CACHE: /tmp/r22601-hf/transformers
    steps:
      - name: One-use source archaeology with durable consumption truth
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          CONTROL=/tmp/r22601-control
          UPSTREAM=/tmp/r22601-upstream
          SOURCE=/tmp/r22601-source
          RAWFREE=/tmp/r22601-rawfree
          WORK=/tmp/r22601-behavior-work
          SUITE=/tmp/r22601-suite.jsonl
          mkdir -p "$SOURCE" "$RAWFREE" "$WORK"

          cleanup_raw() {
            rm -rf "$SOURCE" "$WORK" /tmp/r22601-hf /tmp/r22601-tmp
            find /tmp -maxdepth 3 -type f -name '*.safetensors' -path '/tmp/r22601-*' -delete 2>/dev/null || true
          }
          trap 'cleanup_raw' EXIT

          git clone --quiet --filter=blob:none "https://github.com/${GITHUB_REPOSITORY}.git" "$CONTROL"
          git -C "$CONTROL" checkout --quiet --detach "$SOURCE_HEAD"
          test "$(git -C "$CONTROL" rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git -C "$CONTROL" status --porcelain)"
          test "$(shasum -a 256 "$CONTROL/r22601_source/r22601_hallmark_oneuse.py" | awk '{print $1}')" = "$EXPECTED_RUNNER_SHA"

          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/r22601-control/r22601_source/R22601_PRE_SOURCE_AUTHORIZATION.json')
          a=json.loads(p.read_text())
          assert a['strict_l4'] is True and a['strict_run_binding']=='5/5'
          assert all(v.startswith('PASS') for v in a['gates'].values())
          assert a['source']['expected_sha256']=='551975ad96235ee5a125df3bef460111d46ed51e95061fd3c37398be4cf5b53a'
          assert a['source']['expected_size']==18485794
          print('PRE_SOURCE_AUTHORIZATION=PASS')
          PY

          # Recreate the frozen 128-case Hallmark source-free suite exactly.
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          its=['raw_citation_string','bibtex_entry','paragraph_with_citation','claim_for_supporting_refs']
          patterns=['exact_verified','missing_doi','author_mismatch','year_mismatch','venue_mismatch','preprint_as_published','possible_hallucination','insufficient_metadata']
          labels=['VALID','UNCERTAIN','HALLUCINATED','HALLUCINATED','HALLUCINATED','HALLUCINATED','HALLUCINATED','UNCERTAIN']
          issues=[[],['missing_doi'],['author_mismatch'],['year_mismatch'],['venue_mismatch'],['preprint_as_published'],['possible_hallucination'],['insufficient_metadata']]
          lines=[]
          for i,it in enumerate(its):
            for p,pat in enumerate(patterns):
              for v in range(4):
                can={'author':f'Author{v}','doi':f'10.9999/syn.{i}.{v}','title':f'Synthetic Evidence Study {i}-{v}','venue':f'Venue{i}','year':2020+v}
                obs=dict(can)
                if p==1: obs['doi']=None
                elif p==2: obs['author']=f'Other{v}'
                elif p==3: obs['year']=2022+v
                elif p==4: obs['venue']=f'WrongVenue{i}'
                elif p==5: obs['venue']='arXiv preprint'
                elif p==6: obs={'author':'Unknown','doi':f'10.0000/fake.{v}','title':f'Fabricated Result {i}-{v}','venue':'Imaginary','year':2099}
                elif p==7: obs={'author':None,'doi':None,'title':can['title'],'venue':None,'year':None}
                row={'canonical':can,'case_id':f'HK-{i}-{p}-{v}','expected':{'first_action':'query_bibtex_updater' if i==1 else 'parse_input','issue_codes':issues[p],'label':labels[p]},'input_type':it,'observed':obs,'pattern':pat}
                lines.append(json.dumps(row,sort_keys=True))
          raw=('\n'.join(lines)+'\n').encode()
          assert len(lines)==128
          assert hashlib.sha256(raw).hexdigest()=='beea0021151e66c81163d9098fd6eb859125a8cbebdffc94082d312af649e705'
          Path('/tmp/r22601-suite.jsonl').write_bytes(raw)
          print('FROZEN_SUITE_REGENERATED=128')
          PY

          # Exact public training implementation/runtime environment.
          git clone --quiet --filter=blob:none https://github.com/SebastianBoehler/hallmark-mlx.git "$UPSTREAM"
          git -C "$UPSTREAM" checkout --quiet --detach "$HALLMARK_COMMIT"
          test "$(git -C "$UPSTREAM" rev-parse HEAD)" = "$HALLMARK_COMMIT"
          if ! command -v uv >/dev/null 2>&1; then
            python3 -m venv /tmp/r22601-uv-bootstrap
            /tmp/r22601-uv-bootstrap/bin/python -m pip install --disable-pip-version-check 'uv==0.12.5'
            export PATH="/tmp/r22601-uv-bootstrap/bin:$PATH"
          fi
          cd "$UPSTREAM"
          uv sync --locked --no-dev --extra mlx
          python_bin="$UPSTREAM/.venv/bin/python"
          "$python_bin" - <<'PY'
          import importlib.metadata as md
          expected={'mlx':'0.31.1','mlx-lm':'0.31.1','huggingface-hub':'1.9.0','transformers':'5.5.0'}
          for p,e in expected.items():
            g=md.version(p); print(f'LOCKED_VERSION {p}={g}'); assert g==e
          PY

          # Safe config metadata first; no model weight bytes.
          "$python_bin" - <<'PY'
          import hashlib,os,urllib.request
          from pathlib import Path
          repo=os.environ['SOURCE_REPO'];rev=os.environ['SOURCE_REV']
          u=f'https://huggingface.co/{repo}/resolve/{rev}/adapter_config.json'
          req=urllib.request.Request(u,headers={'User-Agent':'LAA-R22601-oneuse/1.0'})
          with urllib.request.urlopen(req,timeout=45) as r: raw=r.read()
          got=hashlib.sha256(raw).hexdigest(); print('ADAPTER_CONFIG_SHA256='+got)
          assert got==os.environ['EXPECTED_CONFIG_SHA']
          Path('/tmp/r22601-source/adapter_config.json').write_bytes(raw)
          PY

          # Durable reservation proves the receipt branch is writable and blocks races before GET.
          "$python_bin" - <<'PY'
          import base64,json,os,urllib.error,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];branch=os.environ['RECEIPT_BRANCH'];token=os.environ['GITHUB_TOKEN']
          consumed='receipts/r22601_c76/R22601_C76_K_SOURCE_CONSUMED.json'
          reserved='receipts/r22601_c76/R22601_C76_K_SOURCE_SLOT_RESERVED.json'
          def api(path): return f'https://api.github.com/repos/{repo}/contents/'+urllib.parse.quote(path,safe='/')
          def get(path):
            req=urllib.request.Request(api(path)+'?ref='+urllib.parse.quote(branch,safe=''),headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LAA-R22601-oneuse'})
            try:
              with urllib.request.urlopen(req,timeout=45) as r:return r.status,r.read()
            except urllib.error.HTTPError as e:return e.code,e.read()
          for p in (consumed,reserved):
            code,_=get(p)
            if code==200: raise SystemExit('FAIL_DURABLE_SOURCE_SLOT_ALREADY_EXISTS '+p)
            if code!=404: raise SystemExit(f'FAIL_RECEIPT_PREFLIGHT {p} HTTP={code}')
          payload={'schema':'R22601_C76K_SOURCE_SLOT_RESERVATION_V1','reserved':True,'consumed':False,'source_head':os.environ['SOURCE_HEAD'],'github_run_id':os.environ['GITHUB_RUN_ID'],'source_repo':os.environ['SOURCE_REPO'],'source_revision':os.environ['SOURCE_REV'],'source_path':os.environ['SOURCE_PATH'],'hard_rule':'ANY_RESERVATION_BLOCKS_ALL_FUTURE_SOURCE_GETS'}
          body=json.dumps({'message':'Reserve R22601 C76-K one-use source slot before GET','content':base64.b64encode((json.dumps(payload,sort_keys=True,indent=2)+'\n').encode()).decode(),'branch':branch}).encode()
          req=urllib.request.Request(api(reserved),data=body,method='PUT',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LAA-R22601-oneuse'})
          with urllib.request.urlopen(req,timeout=45) as r: print('SOURCE_SLOT_RESERVATION_HTTP='+str(r.status))
          code,_=get(reserved);assert code==200
          print('SOURCE_SLOT_RESERVED_DURABLY=true')
          PY

          # ONE logical Adapter GET. No retry. Do not hash until consumed marker is durable.
          "$python_bin" - <<'PY'
          import os,urllib.request
          from pathlib import Path
          u=f"https://huggingface.co/{os.environ['SOURCE_REPO']}/resolve/{os.environ['SOURCE_REV']}/{os.environ['SOURCE_PATH']}"
          req=urllib.request.Request(u,headers={'User-Agent':'LAA-R22601-oneuse/1.0'})
          with urllib.request.urlopen(req,timeout=120) as r:
            with Path('/tmp/r22601-source/adapters.safetensors').open('wb') as f:
              while True:
                b=r.read(1<<20)
                if not b: break
                f.write(b)
          print('ADAPTER_GET_COMPLETED_BYTES='+str(Path('/tmp/r22601-source/adapters.safetensors').stat().st_size))
          PY

          # REQUIRED ORDER: GET completed -> durable consumed marker -> only then identity hash.
          "$python_bin" - <<'PY'
          import base64,json,os,urllib.parse,urllib.request
          from datetime import datetime,timezone
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];branch=os.environ['RECEIPT_BRANCH'];token=os.environ['GITHUB_TOKEN'];path='receipts/r22601_c76/R22601_C76_K_SOURCE_CONSUMED.json'
          payload={'schema':'R22601_C76K_SOURCE_CONSUMED_V1','consumed':True,'status':'CONSUMED_AFTER_GET_BEFORE_IDENTITY_CHECK','source_repo':os.environ['SOURCE_REPO'],'source_revision':os.environ['SOURCE_REV'],'source_path':os.environ['SOURCE_PATH'],'expected_sha256':os.environ['EXPECTED_ADAPTER_SHA'],'expected_size':int(os.environ['EXPECTED_ADAPTER_SIZE']),'observed_size_before_hash':Path('/tmp/r22601-source/adapters.safetensors').stat().st_size,'source_head':os.environ['SOURCE_HEAD'],'github_run_id':os.environ['GITHUB_RUN_ID'],'created_utc':datetime.now(timezone.utc).isoformat(),'no_retry':True}
          url=f'https://api.github.com/repos/{repo}/contents/'+urllib.parse.quote(path,safe='/')
          body=json.dumps({'message':'Persist R22601 C76-K consumed truth after GET before identity check','content':base64.b64encode((json.dumps(payload,sort_keys=True,indent=2)+'\n').encode()).decode(),'branch':branch}).encode()
          req=urllib.request.Request(url,data=body,method='PUT',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LAA-R22601-oneuse'})
          with urllib.request.urlopen(req,timeout=45) as r: print('SOURCE_CONSUMED_MARKER_HTTP='+str(r.status))
          req=urllib.request.Request(url+'?ref='+urllib.parse.quote(branch,safe=''),headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LAA-R22601-oneuse'})
          with urllib.request.urlopen(req,timeout=45) as r:
            obj=json.load(r);raw=base64.b64decode(obj['content']);got=json.loads(raw);assert got['consumed'] is True and got['status']=='CONSUMED_AFTER_GET_BEFORE_IDENTITY_CHECK'
          print('SOURCE_CONSUMED_MARKER_DURABLE=true')
          PY

          # Identity check now permitted because consumed truth is already durable.
          observed_sha="$(shasum -a 256 "$SOURCE/adapters.safetensors" | awk '{print $1}')"
          observed_size="$(stat -f%z "$SOURCE/adapters.safetensors")"
          echo "ADAPTER_OBSERVED_SHA256=$observed_sha"
          echo "ADAPTER_OBSERVED_SIZE=$observed_size"

          set +e
          PYTHONPATH="$CONTROL/r22601_source" "$python_bin" "$CONTROL/r22601_source/r22601_hallmark_oneuse.py" \
            --adapter "$SOURCE/adapters.safetensors" \
            --config "$SOURCE/adapter_config.json" \
            --cases "$SUITE" \
            --out "$RAWFREE" \
            --work "$WORK"
          runner_rc=$?
          set -e
          echo "RUNNER_RC=$runner_rc"

          # No source bytes may survive to receipt upload.
          cleanup_raw
          "$python_bin" - <<PY
          import json,os
          from pathlib import Path
          out=Path('$RAWFREE');out.mkdir(parents=True,exist_ok=True)
          leftovers=[]
          for root in ('/tmp/r22601-source','/tmp/r22601-behavior-work','/tmp/r22601-hf'):
            p=Path(root)
            if p.exists(): leftovers.extend(str(x) for x in p.rglob('*') if x.is_file())
          rec={'schema':'R22601_C76K_DELETION_RECEIPT_V1','source_consumed':True,'runner_rc':int('$runner_rc'),'adapter_path_exists_after_cleanup':Path('/tmp/r22601-source/adapters.safetensors').exists(),'base_cache_exists_after_cleanup':Path('/tmp/r22601-hf').exists(),'work_variant_dir_exists_after_cleanup':Path('/tmp/r22601-behavior-work').exists(),'leftover_files':leftovers,'raw_source_remaining':False if not leftovers else True,'no_retry':True}
          (out/'R22601_C76_K_DELETION_RECEIPT.json').write_text(json.dumps(rec,sort_keys=True,indent=2)+'\n')
          PY

          # Upload only derived/raw-free JSON receipts to the durable receipt branch.
          "$python_bin" - <<'PY'
          import base64,json,os,urllib.parse,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];branch=os.environ['RECEIPT_BRANCH'];token=os.environ['GITHUB_TOKEN'];run=os.environ['GITHUB_RUN_ID'];root=Path('/tmp/r22601-rawfree')
          files=sorted(p for p in root.iterdir() if p.is_file() and p.suffix=='.json')
          if not files: raise SystemExit('FAIL_NO_RAWFREE_RESULTS')
          for p in files:
            raw=p.read_bytes()
            if b'safetensors' in raw and p.name not in {'R22601_C76_K_SOURCE_IDENTITY.json'}:
              pass
            dest=f'receipts/r22601_c76/source_run_{run}/{p.name}'
            url=f'https://api.github.com/repos/{repo}/contents/'+urllib.parse.quote(dest,safe='/')
            body=json.dumps({'message':'Persist R22601 C76-K raw-free archaeology receipt '+p.name,'content':base64.b64encode(raw).decode(),'branch':branch}).encode()
            req=urllib.request.Request(url,data=body,method='PUT',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LAA-R22601-oneuse'})
            with urllib.request.urlopen(req,timeout=45) as r:
              if r.status not in (200,201): raise SystemExit('FAIL_RECEIPT_UPLOAD '+p.name)
            print('UPLOADED_RAWFREE='+dest)
          link={'schema':'R22601_C76K_SOURCE_RUN_INDEX_V1','github_run_id':run,'source_head':os.environ['SOURCE_HEAD'],'files':[p.name for p in files],'raw_free':True,'no_retry':True}
          dest=f'receipts/r22601_c76/source_run_{run}/INDEX.json';url=f'https://api.github.com/repos/{repo}/contents/'+urllib.parse.quote(dest,safe='/')
          raw=(json.dumps(link,sort_keys=True,indent=2)+'\n').encode();body=json.dumps({'message':'Persist R22601 C76-K source run index','content':base64.b64encode(raw).decode(),'branch':branch}).encode();req=urllib.request.Request(url,data=body,method='PUT',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LAA-R22601-oneuse'});urllib.request.urlopen(req,timeout=45).read()
          print('RAWFREE_RECEIPT_COUNT='+str(len(files)))
          PY

          # Runner nonzero is terminal. Receipt/cleanup already persisted. Never rerun this source.
          if [ "$runner_rc" -ne 0 ]; then
            echo "TERMINAL_SOURCE_RUN_RC=$runner_rc"
            exit "$runner_rc"
          fi
          echo 'R22601_C76_K_ONEUSE_SOURCE_RUN_COMPLETE=true'
