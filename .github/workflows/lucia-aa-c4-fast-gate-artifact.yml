name: LUCIA AA C4 artifact-backed fast gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install 'transformers==4.57.1' 'peft==0.17.1' 'safetensors==0.7.0' 'huggingface-hub==0.36.0' 'tokenizers==0.22.1' 'accelerate==1.14.0'
      - name: Download verified adapter capsule
        uses: actions/download-artifact@v4
        with:
          name: lucia-aa-c4-adapter-and-receipts
          path: transport/adapter_receipts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 29771037886
      - name: Download verified Base metadata
        uses: actions/download-artifact@v4
        with:
          name: lucia-aa-c4-base-meta-tokenizer
          path: transport/base_meta
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 29771037886
      - name: Download Base part 00
        uses: actions/download-artifact@v4
        with:
          name: lucia-aa-c4-base-weight-part-00
          path: transport/part00
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 29771037886
      - name: Download Base part 01
        uses: actions/download-artifact@v4
        with:
          name: lucia-aa-c4-base-weight-part-01
          path: transport/part01
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 29771037886
      - name: Download Base part 02
        uses: actions/download-artifact@v4
        with:
          name: lucia-aa-c4-base-weight-part-02
          path: transport/part02
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 29771037886
      - name: Reassemble and reverify exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw/base raw/adapter results
          find transport -maxdepth 4 -type f -print
          cp -r transport/adapter_receipts/adapter/. raw/adapter/
          if [ -d transport/base_meta/base_meta ]; then cp -r transport/base_meta/base_meta/. raw/base/; else cp -r transport/base_meta/. raw/base/; fi
          p0=$(find transport/part00 -type f -name 'model.safetensors.part-00' | head -1)
          p1=$(find transport/part01 -type f -name 'model.safetensors.part-01' | head -1)
          p2=$(find transport/part02 -type f -name 'model.safetensors.part-02' | head -1)
          cat "$p0" "$p1" "$p2" > raw/base/model.safetensors
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,struct
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for c in iter(lambda:f.read(1024*1024),b''):h.update(c)
              return h.hexdigest()
          manifest_candidates=list(Path('transport/adapter_receipts').rglob('BASE_SPLIT_MANIFEST.json'))
          if len(manifest_candidates)!=1: raise SystemExit(f'expected one split manifest: {manifest_candidates}')
          m=json.loads(manifest_candidates[0].read_text())
          base=Path('raw/base/model.safetensors')
          if base.stat().st_size!=m['original_size_bytes'] or sha(base)!=m['original_sha256']: raise SystemExit('reassembled Base mismatch')
          receipt_candidates=list(Path('transport/adapter_receipts').rglob('SOURCE_CAPTURE_RECEIPT.json'))
          if len(receipt_candidates)!=1: raise SystemExit('missing source receipt')
          receipt=json.loads(receipt_candidates[0].read_text())
          expected={r['path']:(r['size_bytes'],r['sha256']) for r in receipt['files']}
          checks={'adapter/adapter_config.json':Path('raw/adapter/adapter_config.json'),'adapter/adapter_model.safetensors':Path('raw/adapter/adapter_model.safetensors'),'base/model.safetensors':base}
          for key,p in checks.items():
              size,digest=expected[key]
              if p.stat().st_size!=size or sha(p)!=digest: raise SystemExit(f'source mismatch: {key}')
          for p in (base,Path('raw/adapter/adapter_model.safetensors')):
              with p.open('rb') as f:
                  n=struct.unpack('<Q',f.read(8))[0];json.loads(f.read(n))
          Path('results/ARTIFACT_SOURCE_REASSEMBLY.json').write_text(json.dumps({'schema':'LUCIA_AA_C4_ARTIFACT_REASSEMBLY_V1','source_capture_run_id':29771037886,'base_size_bytes':base.stat().st_size,'base_sha256':sha(base),'adapter_sha256':sha(Path('raw/adapter/adapter_model.safetensors')),'verdict':'PASS_EXACT_SOURCE_REASSEMBLED'},indent=2)+'\n')
          PY
      - name: Patch evaluation budget only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/lucia_aa_c4_actual_analysis.py');s=p.read_text()
          changes={
            'plan = [("DISCOVERY", 32), ("CONFIRMATION", 20), ("OOD", 16)]':'plan = [("DISCOVERY", 4), ("CONFIRMATION", 8), ("OOD", 8)]',
            'batch_size: int=8':'batch_size: int=16',
            'reps=[c for c in cases if c["split"]=="CONFIRMATION"][:4]+[c for c in cases if c["split"]=="OOD"][:4]':'reps=[c for c in cases if c["split"]=="CONFIRMATION"][:2]+[c for c in cases if c["split"]=="OOD"][:2]',
            'neg_reps=negatives[:4]':'neg_reps=negatives[:2]',
            'max_new_tokens=64':'max_new_tokens=48',
            'max_new_tokens=40':'max_new_tokens=32',
          }
          for old,new in changes.items():
              if old not in s: raise SystemExit(f'missing patch target {old}')
              s=s.replace(old,new)
          p.write_text(s)
          Path('results/FAST_GATE_SCOPE.json').write_text('{"schema":"LUCIA_AA_C4_FAST_GATE_SCOPE_V1","positive_count":200,"confirmation_count":80,"ood_count":80,"discovery_count":40,"negative_count":40,"artifact_backed_source":true,"evidence_contract_unchanged":true}\n')
          PY
      - name: Run artifact-backed fast gate
        shell: bash
        run: python -B tools/lucia_aa_c4_actual_analysis.py --base-dir raw/base --adapter-dir raw/adapter --out-dir results
      - name: Delete all raw transport and source
        if: always()
        shell: bash
        run: |
          rm -rf raw transport
          python - <<'PY'
          from pathlib import Path
          import json
          bad=[str(p) for p in (Path('raw'),Path('transport')) if p.exists()]
          Path('results').mkdir(exist_ok=True)
          Path('results/RAW_SOURCE_DELETION_RECEIPT.json').write_text(json.dumps({'schema':'LUCIA_AA_C4_ARTIFACT_FAST_RAW_DELETION_V1','remaining_roots':bad,'verdict':'PASS_RAW_SOURCE_DELETED' if not bad else 'FAIL'},indent=2)+'\n')
          if bad: raise SystemExit(str(bad))
          PY
      - name: Audit and upload raw-free evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          bad=[p.as_posix() for p in Path('results').rglob('*') if p.is_file() and (p.suffix.lower() in {'.safetensors','.bin','.pt','.pth','.pkl','.pickle','.gguf'} or 'tokenizer' in p.name.lower())]
          Path('results/RAW_FREE_AUDIT.json').write_text(json.dumps({'schema':'LUCIA_AA_C4_ARTIFACT_FAST_RAW_FREE_AUDIT_V1','forbidden_files':bad,'verdict':'PASS_RAW_FREE_RESULTS' if not bad else 'FAIL'},indent=2)+'\n')
          if bad: raise SystemExit(str(bad))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucia-aa-c4-artifact-fast-gate-raw-free-evidence
          path: results/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
