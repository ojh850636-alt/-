name: LAA R22563 C43 exact-once capture science
on:
  push:
    branches: [laa-r22563-c43-onepass]
permissions:
  contents: read
  actions: write
jobs:
  capture_adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Adapter metadata contract then exact raw object
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p escrow_adapter
          A=https://huggingface.co/duoyuncloud/zsh-cli-lora/resolve/884613f1800062085dbdf8fa5790fab0b70388dd
          for f in README.md adapter_config.json added_tokens.json chat_template.jinja config.json merges.txt special_tokens_map.json tokenizer.json tokenizer_config.json vocab.json; do
            curl -L --fail --retry 3 -o "escrow_adapter/$f" "$A/$f"
          done
          python - <<'PY'
          import json,pathlib
          c=json.loads(pathlib.Path('escrow_adapter/adapter_config.json').read_text())
          assert c['base_model_name_or_path']=='Qwen/Qwen2-0.5B'
          assert c['r']==8 and c['lora_alpha']==16
          assert sorted(c['modules_to_save'])==['embed_tokens','lm_head']
          assert c['peft_type']=='LORA' and c['task_type']=='CAUSAL_LM'
          PY
          curl -L --fail --retry 3 -o escrow_adapter/adapter_model.safetensors "$A/adapter_model.safetensors"
          test "$(stat -c%s escrow_adapter/adapter_model.safetensors)" = 1106719360
          test "$(sha256sum escrow_adapter/adapter_model.safetensors | awk '{print $1}')" = 2afafe383fd3070d656b773302c6b4e0623cce20bdbbb5e205a5a01c6c8cf36a
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('escrow_adapter'); files=[]
          for p in sorted(root.iterdir()):
              files.append({'name':p.name,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          pathlib.Path('ADAPTER_ESCROW_MANIFEST.json').write_text(json.dumps({'schema':'LAA_R22563_C43_ADAPTER_ESCROW_V1','source_reacquisition_allowed':False,'files':files},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22563-c43-raw-adapter
          path: |
            escrow_adapter
            ADAPTER_ESCROW_MANIFEST.json
          retention-days: 1
          compression-level: 0
  capture_base:
    needs: capture_adapter
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Base metadata contract then exact raw object
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p escrow_base
          B=https://huggingface.co/Qwen/Qwen2-0.5B/resolve/91d2aff3f957f99e4c74c962f2f408dcc88a18d8
          for f in LICENSE config.json generation_config.json merges.txt tokenizer.json tokenizer_config.json vocab.json; do
            curl -L --fail --retry 3 -o "escrow_base/$f" "$B/$f"
          done
          python - <<'PY'
          import json,pathlib
          c=json.loads(pathlib.Path('escrow_base/config.json').read_text())
          assert c['model_type']=='qwen2'
          PY
          curl -L --fail --retry 3 -o escrow_base/model.safetensors "$B/model.safetensors"
          test "$(stat -c%s escrow_base/model.safetensors)" = 988097824
          test "$(sha256sum escrow_base/model.safetensors | awk '{print $1}')" = 9cd8fc8c85a197b8c551d6b931b5709fe2611889d6b44945876472fecdf77cad
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('escrow_base'); files=[]
          for p in sorted(root.iterdir()):
              files.append({'name':p.name,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          pathlib.Path('BASE_ESCROW_MANIFEST.json').write_text(json.dumps({'schema':'LAA_R22563_C43_BASE_ESCROW_V1','source_reacquisition_allowed':False,'files':files},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22563-c43-raw-base
          path: |
            escrow_base
            BASE_ESCROW_MANIFEST.json
          retention-days: 1
          compression-level: 0
  science:
    needs: [capture_adapter,capture_base]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: r22563-c43-raw-adapter
          path: raw_adapter_artifact
      - uses: actions/download-artifact@v4
        with:
          name: r22563-c43-raw-base
          path: raw_base_artifact
      - name: Reconstruct frozen science and verify escrows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload/research/r22563_c43 payload/configs payload/datasets/r22563_c43 work evidence
          cp r22563/c43_src/c43_forge.py payload/research/r22563_c43/c43_forge.py
          cp r22563/c43_src/c43_verifier.py payload/research/r22563_c43/c43_verifier.py
          cat r22563/c43_src/science_parts/part00.pyfrag r22563/c43_src/science_parts/part01.pyfrag r22563/c43_src/science_parts/part02.pyfrag r22563/c43_src/science_parts/part03.pyfrag r22563/c43_src/science_parts/part04.pyfrag > payload/research/r22563_c43/c43_science.py
          cp r22563/c43_src/R22563_C43_PREOUTPUT_CONTRACT.json payload/configs/R22563_C43_PREOUTPUT_CONTRACT.json
          test "$(sha256sum payload/research/r22563_c43/c43_forge.py | awk '{print $1}')" = 2271dbaeb3b3e4ee85c13adc213d48dde700650af6d75844019298c5a2ecf91a
          test "$(sha256sum payload/research/r22563_c43/c43_verifier.py | awk '{print $1}')" = ff853a4abc3ecb58a51963bd9d6de24a57b007cb977bed80b2aa06996356efce
          test "$(sha256sum payload/research/r22563_c43/c43_science.py | awk '{print $1}')" = 282c6956194cc37c1162da82977db6f43ae0c3d8bd347ac8672fac43d60fb4e9
          python payload/research/r22563_c43/c43_forge.py
          test "$(sha256sum payload/datasets/r22563_c43/C43_ZSH_COMPLETION_SUITE.jsonl | awk '{print $1}')" = 9504316bc8510898ecf6df944ef9713af64bfa714e352dc75e5f13312611818e
          cp -a raw_adapter_artifact/escrow_adapter work/adapter
          cp -a raw_base_artifact/escrow_base work/base
          test "$(sha256sum work/adapter/adapter_model.safetensors | awk '{print $1}')" = 2afafe383fd3070d656b773302c6b4e0623cce20bdbbb5e205a5a01c6c8cf36a
          test "$(sha256sum work/base/model.safetensors | awk '{print $1}')" = 9cd8fc8c85a197b8c551d6b931b5709fe2611889d6b44945876472fecdf77cad
      - name: Install exact runtime and run raw-free archaeology
        shell: bash
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          TOKENIZERS_PARALLELISM: 'false'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m pip install -q torch==2.10.0 transformers==4.57.1 peft==0.18.1 accelerate==1.14.0 safetensors==0.7.0
          python payload/research/r22563_c43/c43_science.py --self-test | tee evidence/C43_RUNTIME_SELFTEST.json
          python payload/research/r22563_c43/c43_science.py --run --work work --suite payload/datasets/r22563_c43/C43_ZSH_COMPLETION_SUITE.jsonl --out evidence --batch 2 | tee evidence/C43_STDOUT_SUMMARY.txt
          if find evidence -type f \( -name '*.safetensors' -o -name '*.bin' -o -name '*.pt' -o -name '*.pkl' \) | grep -q .; then exit 91; fi
          rm -rf work raw_adapter_artifact raw_base_artifact payload
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('evidence'); files=[]
          for p in sorted(root.iterdir()):
              if p.is_file(): files.append({'name':p.name,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'C43_RAW_FREE_MANIFEST.json').write_text(json.dumps({'schema':'LAA_R22563_C43_RAW_FREE_MANIFEST_V1','files':files,'raw_source_present':False},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22563-c43-rawfree-evidence
          path: evidence
          retention-days: 1
  cleanup:
    if: ${{ always() && needs.science.result == 'success' }}
    needs: science
    runs-on: ubuntu-latest
    steps:
      - name: Delete both raw escrows after raw-free evidence exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir cleanup
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > artifacts.json
          python - <<'PY' > cleanup/targets.tsv
          import json
          for a in json.load(open('artifacts.json'))['artifacts']:
              if a['name'] in {'r22563-c43-raw-adapter','r22563-c43-raw-base'}: print(a['id'],a['name'],sep='\t')
          PY
          test "$(wc -l < cleanup/targets.tsv)" = 2
          while IFS=$'\t' read -r id name; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            echo "$id $name DELETED"
          done < cleanup/targets.tsv > cleanup/deleted.txt
          python - <<'PY'
          import json,pathlib
          lines=pathlib.Path('cleanup/deleted.txt').read_text().splitlines()
          pathlib.Path('cleanup/R22563_C43_REMOTE_RAW_DELETION.json').write_text(json.dumps({'schema':'LAA_R22563_C43_REMOTE_RAW_DELETION_V1','deleted':lines,'count':len(lines),'source_reacquisition_allowed':False},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22563-c43-cleanup-receipt
          path: cleanup/R22563_C43_REMOTE_RAW_DELETION.json
          retention-days: 1
