name: R22566 C50 metadata-only size audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query exact Hugging Face revision metadata only
        env:
          ADAPTER_API: https://huggingface.co/api/models/ainouche-abderahmane/koine-t5-omni/revision/3272fae16d13b8ea16d957800df69dbe0d51d247
          BASE_API: https://huggingface.co/api/models/bowphs/GreTa/revision/8fe5b7aa66ddda9fe7a7b8a397f0edd1ac5b5041
        run: |
          python - <<'PY'
          import json, os, urllib.request
          for label,url,target in [('ADAPTER',os.environ['ADAPTER_API'],'adapter_model.safetensors'),('BASE',os.environ['BASE_API'],'model.safetensors')]:
              with urllib.request.urlopen(url, timeout=30) as r:
                  obj=json.load(r)
              row=next(x for x in obj.get('siblings',[]) if x.get('rfilename')==target)
              lfs=row.get('lfs') or {}
              print(json.dumps({'label':label,'sha':obj.get('sha'),'file':target,'size':lfs.get('size') or row.get('size'),'lfs_sha256':lfs.get('sha256'),'xet':row.get('xetHash')},sort_keys=True))
          PY
      - name: Publish metadata receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          body={'body':f"R22566_C50_METADATA_SIZE_RUN_ID={os.environ['RUN_ID']}"}
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments",data=json.dumps(body).encode(),headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          try: urllib.request.urlopen(req,timeout=30).read()
          except Exception as e: print('nonfatal',e)
          PY
