name: R22566 C50 metadata-only size audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install metadata client only
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'huggingface_hub==1.4.1'
      - name: Query exact Hugging Face file metadata only
        run: |
          python - <<'PY'
          import json
          from huggingface_hub import hf_hub_url, get_hf_file_metadata
          rows=[
            ('ADAPTER','ainouche-abderahmane/koine-t5-omni','3272fae16d13b8ea16d957800df69dbe0d51d247','adapter_model.safetensors'),
            ('BASE','bowphs/GreTa','8fe5b7aa66ddda9fe7a7b8a397f0edd1ac5b5041','model.safetensors')]
          for label,repo,rev,file in rows:
              m=get_hf_file_metadata(hf_hub_url(repo,file,revision=rev))
              print(json.dumps({'label':label,'repo':repo,'revision':rev,'file':file,'size':m.size,'etag':m.etag,'commit_hash':m.commit_hash,'location':str(m.location).split('?')[0]},sort_keys=True))
          PY
      - name: Publish metadata receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          body={'body':f"R22566_C50_METADATA_SIZE_RUN_ID={os.environ['RUN_ID']}"}
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments",data=json.dumps(body).encode(),headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          try: urllib.request.urlopen(req,timeout=30).read()
          except Exception as e: print('nonfatal',e)
          PY
