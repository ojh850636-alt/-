name: R22528 C27 exact-source courier

on:
  push:
    branches: [agent/r22528-c27-segmentation-courier]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Capture exact safetensors source
        env: {HF_HUB_DISABLE_TELEMETRY: '1'}
        run: |
          python -m pip install 'huggingface_hub==1.4.1' 'safetensors==0.7.0' 'numpy==2.3.5'
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          from huggingface_hub import snapshot_download
          from safetensors import safe_open
          root=Path('bundle'); a=root/'adapter'; b=root/'base'; a.mkdir(parents=True); b.mkdir(parents=True)
          ar='uga-gaim/CLIPSeg-CloudSEN12Plus-LoRA'; av='1001cdf50bf934d8d605c08cf91d28899087fa69'
          br='CIDAS/clipseg-rd64-refined'; bv='999e0328d9e10b484360c477313983f9afdd7050'
          aa=['README.md','adapter_config.json','adapter_model.safetensors']
          ba=['README.md','config.json','model.safetensors','preprocessor_config.json','processor_config.json','tokenizer.json','tokenizer_config.json','special_tokens_map.json','vocab.json','merges.txt']
          banned=['*.bin','*.pt','*.pth','*.pkl','*.pickle','*.h5','*.msgpack','*.ckpt','*.py','*.ipynb','onnx/**']
          ac=snapshot_download(repo_id=ar,revision=av,allow_patterns=aa,ignore_patterns=banned)
          bc=snapshot_download(repo_id=br,revision=bv,allow_patterns=ba,ignore_patterns=banned)
          def cp(src,dst,names):
            out=[]
            for rel in names:
              p=Path(src)/rel
              if p.is_file(): q=dst/rel; q.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,q); out.append(rel)
            return out
          ca=cp(ac,a,aa); cb=cp(bc,b,ba)
          def sha(p):
            h=hashlib.sha256()
            with open(p,'rb') as f:
              for x in iter(lambda:f.read(1048576),b''): h.update(x)
            return h.hexdigest()
          def ts(p):
            rows=[]
            with safe_open(p,framework='numpy') as f:
              for k in f.keys(): s=f.get_slice(k); rows.append({'key':k,'shape':[int(x) for x in s.get_shape()],'dtype':str(s.get_dtype())})
            return rows
          aw=a/'adapter_model.safetensors'; bw=b/'model.safetensors'
          if aw.stat().st_size!=15957528 or sha(aw)!='18b405c1b2770981afb5f58e69f59fed2fe160455ecdc1c02c5576eec3742f80': raise SystemExit('adapter identity mismatch')
          if bw.stat().st_size!=603049496 or sha(bw)!='d00ca85d6b859f9d07b7cfb8ef26fe9771cb275b34c9368f2ecf603139307f55': raise SystemExit('base identity mismatch')
          rep={'schema':'R22528_C27_EXACT_SOURCE_CAPTURE_V1','adapter':{'repo':ar,'revision':av,'size':aw.stat().st_size,'sha256':sha(aw),'copied':ca,'tensors':ts(aw)},'base':{'repo':br,'revision':bv,'size':bw.stat().st_size,'sha256':sha(bw),'copied':cb,'training_time_revision_proven':False},'trust_remote_code':False,'pickle_loaded':False}
          (root/'CAPTURE_MANIFEST.json').write_text(json.dumps(rep,indent=2,sort_keys=True))
          print(json.dumps({'adapter_bytes':aw.stat().st_size,'adapter_sha256':sha(aw),'base_bytes':bw.stat().st_size,'base_sha256':sha(bw)},indent=2))
          PY
          mkdir -p parts/meta parts/adapter parts/base
          cp bundle/CAPTURE_MANIFEST.json parts/meta/
          find bundle/adapter -type f ! -name adapter_model.safetensors -exec cp --parents '{}' parts/meta/ \;
          find bundle/base -type f ! -name model.safetensors -exec cp --parents '{}' parts/meta/ \;
          cp bundle/adapter/adapter_model.safetensors parts/adapter/
          split -b 180M -d -a 2 bundle/base/model.safetensors parts/base/base.part.
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          rows=[]
          for p in sorted(Path('parts/base').glob('base.part.*')): rows.append({'name':p.name,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          Path('parts/base/PARTS_MANIFEST.json').write_text(json.dumps(rows,indent=2,sort_keys=True))
          print(rows)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: R22528_C27_META, path: parts/meta, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22528_C27_ADAPTER, path: parts/adapter, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22528_C27_BASE_00, path: parts/base/base.part.00, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22528_C27_BASE_01, path: parts/base/base.part.01, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22528_C27_BASE_02, path: parts/base/base.part.02, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22528_C27_BASE_03, path: parts/base/base.part.03, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: R22528_C27_BASE_MANIFEST, path: parts/base/PARTS_MANIFEST.json, compression-level: 0, retention-days: 1}
      - name: Publish source run receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          body={'body':f"R22528_C27_COURIER_RUN_ID={os.environ['RUN_ID']}"}
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues/26/comments",data=json.dumps(body).encode(),headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          print(urllib.request.urlopen(req,timeout=30).read().decode())
          PY

  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Download runtime overlay without torch
        run: |
          mkdir -p wheels
          python -m pip download --dest wheels --only-binary=:all: --no-deps \
            'transformers==5.0.0' 'peft==0.18.1' 'accelerate==1.14.0' \
            'tokenizers==0.22.2' 'safetensors==0.7.0' 'huggingface_hub==1.4.1' \
            'pillow==12.2.0' 'numpy==2.3.5' 'packaging==26.3' 'pyyaml==6.0.3' \
            'regex==2026.7.19' 'requests==2.32.5' 'tqdm==4.70.0' 'filelock==3.32.2' \
            'fsspec==2026.7.0' 'typing_extensions==4.16.0' 'jinja2==3.1.6' \
            'protobuf==6.33.5' 'charset_normalizer==3.4.4' 'idna==3.18' \
            'urllib3==2.6.3' 'certifi==2026.7.22' 'markupsafe==3.0.3'
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          rows=[]
          for p in sorted(Path('wheels').glob('*')): rows.append({'name':p.name,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          Path('wheels/WHEEL_MANIFEST.json').write_text(json.dumps(rows,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: R22528_C27_WHEELS, path: wheels, compression-level: 0, retention-days: 1}
