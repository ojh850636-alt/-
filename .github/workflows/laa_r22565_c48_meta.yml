name: LAA R22565 C48 SaProt DMS metadata-only audit
on:
  push:
    branches: [laa-r22565-c48-saprot-dms-meta]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Exact model/base/dataset metadata only
        shell: bash
        run: |
          set -euo pipefail
          export GIT_LFS_SKIP_SMUDGE=1
          git clone -q --depth 1 https://huggingface.co/SaProtHub/Model-DMS_BLAT_ECOLX-35M cand
          git clone -q --depth 1 https://huggingface.co/westlake-repl/SaProt_35M_AF2 base
          git clone -q --depth 1 https://huggingface.co/datasets/SaProtHub/Dataset-BLAT_ECOLX data
          mkdir out
          python - <<'PY'
          import pathlib,json,subprocess,re,hashlib,csv,collections
          def rev(x): return subprocess.check_output(['git','-C',x,'rev-parse','HEAD'],text=True).strip()
          def ptr(p):
            if not p.exists(): return None
            d={}
            for l in p.read_text(errors='replace').splitlines():
              if l.startswith('oid sha256:'): d['sha256']=l.split(':',1)[1]
              if l.startswith('size '): d['size']=int(l.split()[1])
            return d
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          c=pathlib.Path('cand'); b=pathlib.Path('base'); d=pathlib.Path('data')
          cfg=json.loads((c/'adapter_config.json').read_text())
          cr=(c/'README.md').read_text(errors='replace'); br=(b/'README.md').read_text(errors='replace'); dr=(d/'README.md').read_text(errors='replace')
          csvp=d/'dataset.csv'
          rows=[]; cols=[]; split_counts={}; label_stats={}
          if csvp.exists():
            with csvp.open(newline='',encoding='utf-8-sig') as f:
              rr=csv.DictReader(f); cols=rr.fieldnames or []; rows=list(rr)
            splitcol=next((x for x in cols if x.lower() in {'split','set','subset','partition'}),None)
            if splitcol: split_counts=dict(collections.Counter(r[splitcol] for r in rows))
            labelcol=next((x for x in cols if x.lower() in {'label','fitness','score','target'}),None)
            if labelcol:
              vals=[]
              for r in rows:
                try: vals.append(float(r[labelcol]))
                except: pass
              if vals: label_stats={'column':labelcol,'n':len(vals),'min':min(vals),'max':max(vals),'mean':sum(vals)/len(vals)}
          obj={'schema':'LAA_R22565_C48_META_V1','candidate_revision':rev('cand'),'base_revision':rev('base'),'dataset_revision':rev('data'),
            'adapter_pointer':ptr(c/'adapter_model.safetensors'),'adapter_config':cfg,
            'base_safetensor_pointer':ptr(b/'model.safetensors'),'base_bin_pointer':ptr(b/'pytorch_model.bin'),
            'candidate_license':re.findall(r'(?mi)^license\s*:\s*([^\r\n]+)',cr),'base_license':re.findall(r'(?mi)^license\s*:\s*([^\r\n]+)',br),'dataset_license':re.findall(r'(?mi)^license\s*:\s*([^\r\n]+)',dr),
            'candidate_files':sorted(p.name for p in c.iterdir() if p.name!='.git'),'base_files':sorted(p.name for p in b.iterdir() if p.name!='.git'),'dataset_files':sorted(p.name for p in d.iterdir() if p.name!='.git'),
            'dataset_csv_sha256':sha(csvp) if csvp.exists() else None,'dataset_csv_size':csvp.stat().st_size if csvp.exists() else None,'dataset_rows':len(rows),'dataset_columns':cols,'dataset_split_counts':split_counts,'dataset_label_stats':label_stats}
          pathlib.Path('out/C48_META.json').write_text(json.dumps(obj,indent=2,sort_keys=True)); print(json.dumps(obj,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: r22565-c48-meta, path: out/C48_META.json, retention-days: 1}
