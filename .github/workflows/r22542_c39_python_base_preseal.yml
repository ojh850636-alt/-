name: LAA R22542 C39 source-zero Qwen runtime preseal
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  python-base:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact runtime wheel closure without model weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report wheels
          python -m pip download --quiet --dest wheels --only-binary=:all: 'transformers==5.0.0' 'peft==0.18.1' 'safetensors==0.7.0' 'accelerate==1.14.0' 'huggingface-hub==1.16.1' 'tokenizers==0.22.2'
          python -m pip download --quiet --dest wheels --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install --quiet --no-index --find-links wheels 'torch==2.10.0' 'transformers==5.0.0' 'peft==0.18.1' 'safetensors==0.7.0' 'accelerate==1.14.0' 'huggingface-hub==1.16.1' 'tokenizers==0.22.2'
          python - <<'PY'
          import hashlib,json,platform,sys
          from pathlib import Path
          import torch,transformers,peft,safetensors,accelerate,huggingface_hub,tokenizers
          from huggingface_hub import HfApi,hf_hub_download
          from transformers import AutoConfig,AutoModelForCausalLM
          crepo='markm39/openproof-tactic-2b'; crev='26b4c66606de4e73139a377f8026df93907c12b9'; brepo='Qwen/Qwen3.5-2B'
          api=HfApi(); c=api.model_info(crepo,revision=crev,files_metadata=True); b=api.model_info(brepo,files_metadata=True)
          cfgp=Path(hf_hub_download(brepo,filename='config.json',revision=b.sha)); cb=cfgp.read_bytes()
          cfg=AutoConfig.from_pretrained(brepo,revision=b.sha,trust_remote_code=False)
          model_cls=AutoModelForCausalLM._model_mapping[type(cfg)]
          def select(info):
            rows=[]
            for s in info.siblings:
              if s.rfilename.endswith('.safetensors') or s.rfilename in {'config.json','generation_config.json','tokenizer_config.json','tokenizer.json','adapter_config.json'}:
                l=getattr(s,'lfs',None)
                rows.append({'path':s.rfilename,'size':getattr(s,'size',None),'lfs_sha256':getattr(l,'sha256',None) if l else None})
            return rows
          wheels=[]
          for p in sorted(Path('wheels').glob('*.whl')):
            wheels.append({'file':p.name,'size_bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          out={'schema':'LUCIA_AA_R22542_C39_SOURCE_ZERO_QWEN_RUNTIME_V1','verdict':'PASS_QWEN_RUNTIME_SOURCE_ZERO','candidate_repo':crepo,'candidate_revision':crev,'candidate_files':select(c),'base_repo':brepo,'base_revision':b.sha,'base_files':select(b),'base_config_sha256':hashlib.sha256(cb).hexdigest(),'base_config_size':len(cb),'config_class':type(cfg).__name__,'model_class':model_cls.__name__,'trust_remote_code':False,'imports':{'torch':torch.__version__,'transformers':transformers.__version__,'peft':peft.__version__,'safetensors':safetensors.__version__,'accelerate':accelerate.__version__,'huggingface_hub':huggingface_hub.__version__,'tokenizers':tokenizers.__version__},'primary_wheels':wheels,'python':sys.version,'platform':platform.platform(),'candidate_model_weight_bytes_downloaded':0,'base_model_weight_bytes_downloaded':0,'model_outputs_observed':0,'training_time_exact_base_revision_proven':False}
          Path('report/R22542_C39_SOURCE_ZERO_QWEN_RUNTIME.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r22542-c39-qwen-sourcezero
          path: report/
          retention-days: 1
