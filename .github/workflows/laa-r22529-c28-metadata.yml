name: LAA R22529 C28 Exact Courier

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Exact safe source capture
        shell: bash
        run: |
          set -euo pipefail
          ADAPTER_REPO='5524-Group/10-Epochs'
          ADAPTER_REV='84bba255c3341a062c3129a7c4f3bed75d25629a'
          BASE_REPO='depth-anything/Depth-Anything-V2-Small-hf'
          BASE_REV='5426e4f0f36572d16453bbda7a8389317b1bef99'
          test "$(git ls-remote https://huggingface.co/${ADAPTER_REPO} refs/heads/main | awk '{print $1}')" = "$ADAPTER_REV"
          test "$(git ls-remote https://huggingface.co/${BASE_REPO} refs/heads/main | awk '{print $1}')" = "$BASE_REV"
          python -m pip install --disable-pip-version-check -q 'huggingface_hub[hf_xet]==0.36.0'
          mkdir -p out/adapter out/base out/meta out/wheels
          python - <<'PY'
          from huggingface_hub import snapshot_download
          from pathlib import Path
          import hashlib,json,shutil,struct
          ar='5524-Group/10-Epochs'; av='84bba255c3341a062c3129a7c4f3bed75d25629a'
          br='depth-anything/Depth-Anything-V2-Small-hf'; bv='5426e4f0f36572d16453bbda7a8389317b1bef99'
          a=Path('out/adapter'); b=Path('out/base'); m=Path('out/meta')
          snapshot_download(repo_id=ar,revision=av,allow_patterns=['adapter_config.json','adapter_model.safetensors'],local_dir=a)
          snapshot_download(repo_id=br,revision=bv,allow_patterns=['config.json','model.safetensors','preprocessor_config.json'],local_dir=b)
          for x in (a,b):
              c=x/'.cache'
              if c.exists(): shutil.rmtree(c)
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for z in iter(lambda:f.read(1024*1024),b''):h.update(z)
              return h.hexdigest()
          def header(p):
              with open(p,'rb') as f:
                  n=struct.unpack('<Q',f.read(8))[0]; meta=json.loads(f.read(n))
              keys=[k for k in meta if k!='__metadata__']; return {'tensor_count':len(keys),'sample':[{"key":k,"shape":meta[k].get('shape'),"dtype":meta[k].get('dtype')} for k in keys[:80]]}
          aw=a/'adapter_model.safetensors'; bw=b/'model.safetensors'
          expected={'adapter':{'bytes':385112,'sha256':'22de983a6c40bf96f904d5e5e72839555c89ef3dd7de8ffdf8da905ee5a40275'},'base':{'bytes':99173660,'sha256':'3152477ce0d8d6978d76b995120de97cb5b928701fd0f817769f59e249a16b70'}}
          observed={'adapter':{'bytes':aw.stat().st_size,'sha256':sha(aw),'header':header(aw)},'base':{'bytes':bw.stat().st_size,'sha256':sha(bw),'header':header(bw)}}
          assert observed['adapter']['bytes']==expected['adapter']['bytes'] and observed['adapter']['sha256']==expected['adapter']['sha256']
          assert observed['base']['bytes']==expected['base']['bytes'] and observed['base']['sha256']==expected['base']['sha256']
          blocked=[]
          for root in (a,b):
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix.lower() in {'.bin','.pt','.pth','.pkl','.pickle','.h5','.msgpack'}: blocked.append(str(p))
          assert not blocked
          manifest={'schema':'LUCIA_AA_R22529_C28_COURIER_V1','adapter_repo':ar,'adapter_revision':av,'base_repo':br,'base_revision':bv,'expected':expected,'observed':observed,'blocked_files_present':blocked,'raw_committed_to_git':False,'preseal_sha256':'aeaa420e0453066b061e6aabf5a5589fa17fac1392a864ab85090a15a823d418','suite_sha256':'2ec66373ae3f3037d7157400e34ae18ca77f0d4a72b37558acfbe8ca32db7a30'}
          (m/'SOURCE_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
          python -m pip download --disable-pip-version-check --no-deps -q -d out/wheels \
            'transformers==5.0.0' 'peft==0.18.1' 'tokenizers==0.22.2' 'accelerate==1.14.0' 'huggingface_hub==1.16.1'
          sha256sum out/wheels/* > out/meta/WHEEL_SHA256.txt
      - name: Upload C28 metadata
        uses: actions/upload-artifact@v4
        with: {name: r22529-c28-meta, path: out/meta, retention-days: 1, compression-level: 6}
      - name: Upload C28 adapter
        uses: actions/upload-artifact@v4
        with: {name: r22529-c28-adapter, path: out/adapter, retention-days: 1, compression-level: 0}
      - name: Upload C28 base
        uses: actions/upload-artifact@v4
        with: {name: r22529-c28-base, path: out/base, retention-days: 1, compression-level: 0}
      - name: Upload C28 runtime wheels
        uses: actions/upload-artifact@v4
        with: {name: r22529-c28-wheels, path: out/wheels, retention-days: 1, compression-level: 0}
