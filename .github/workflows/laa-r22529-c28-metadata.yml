name: LAA R22529 C28 Depth Metadata Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Audit candidate metadata only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, subprocess, urllib.request, urllib.parse, pathlib

          candidates = [
            'bhowmikabhimanyu/depth-anything-small-lora',
            'igzi/depth-anything-v2-large-lora-booster',
            'igzi/metric3d-vit-giant2-lora-booster',
            'igzi/depth-lora-checkpoints_hypersim_depth_light-hypersim_near_low_light',
          ]

          def get_json(url):
              req=urllib.request.Request(url, headers={'User-Agent':'LUCIA-AA-R22529-metadata-audit'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))

          def get_text(url):
              req=urllib.request.Request(url, headers={'User-Agent':'LUCIA-AA-R22529-metadata-audit'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None

          def resolve(repo):
              p=subprocess.run(['git','ls-remote',f'https://huggingface.co/{repo}','refs/heads/main'],capture_output=True,text=True,check=True)
              return p.stdout.split()[0]

          rows=[]
          for repo in candidates:
              rev=resolve(repo)
              api=get_json(f'https://huggingface.co/api/models/{repo}?blobs=true')
              cfg_txt=get_text(f'https://huggingface.co/{repo}/raw/{rev}/adapter_config.json')
              readme=get_text(f'https://huggingface.co/{repo}/raw/{rev}/README.md')
              cfg=None
              if cfg_txt:
                  try: cfg=json.loads(cfg_txt)
                  except Exception: cfg={'_parse_error':True,'_raw_prefix':cfg_txt[:2000]}
              siblings=[]
              for s in api.get('siblings',[]):
                  rec={'rfilename':s.get('rfilename'),'size':s.get('size')}
                  if s.get('lfs'): rec['lfs']=s.get('lfs')
                  siblings.append(rec)
              base=(cfg or {}).get('base_model_name_or_path') if isinstance(cfg,dict) else None
              base_meta=None
              if isinstance(base,str) and '/' in base and not base.startswith('/'):
                  try:
                      brev=resolve(base)
                      bapi=get_json(f'https://huggingface.co/api/models/{base}?blobs=true')
                      base_meta={'repo':base,'revision':brev,'license':(bapi.get('cardData') or {}).get('license'),'pipeline_tag':bapi.get('pipeline_tag'),'tags':bapi.get('tags',[]),'siblings':[{'rfilename':x.get('rfilename'),'size':x.get('size'),'lfs':x.get('lfs')} for x in bapi.get('siblings',[])]}
                  except Exception as e:
                      base_meta={'repo':base,'error':repr(e)}
              rows.append({
                  'repo':repo,
                  'revision':rev,
                  'license':(api.get('cardData') or {}).get('license'),
                  'pipeline_tag':api.get('pipeline_tag'),
                  'tags':api.get('tags',[]),
                  'adapter_config':cfg,
                  'siblings':siblings,
                  'readme_prefix':readme[:12000] if readme else None,
                  'base_meta':base_meta,
              })

          # Dynamic discovery for adapters explicitly linked to the small Apache-2.0 HF base.
          filt=urllib.parse.quote('base_model:adapter:depth-anything/Depth-Anything-V2-Small-hf', safe='')
          try:
              discovered=get_json(f'https://huggingface.co/api/models?filter={filt}&limit=50&full=true')
          except Exception as e:
              discovered={'error':repr(e)}

          out={'schema':'LUCIA_AA_R22529_C28_METADATA_AUDIT_V1','raw_weight_bytes_downloaded':0,'model_outputs_observed':0,'candidates':rows,'small_base_adapter_discovery':discovered}
          pathlib.Path('out/C28_METADATA_AUDIT.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'candidate_count':len(rows),'raw_weight_bytes_downloaded':0,'model_outputs_observed':0},indent=2))
          PY
      - name: Upload metadata audit
        uses: actions/upload-artifact@v4
        with:
          name: r22529-c28-metadata
          path: out/C28_METADATA_AUDIT.json
          retention-days: 1
          compression-level: 6
