name: LAA R22530 C29 Exact Courier

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Exact safe source capture
        shell: bash
        run: |
          set -euo pipefail
          ADAPTER_REPO='barvarvara/demucs-guitar-lora'
          ADAPTER_REV='8cb116600d6d7728312247a28c73d652f37c98c2'
          BASE_REPO='adefossez/HTDemucs'
          BASE_REV='bf35a81b663819a8255c8fefee17f9d812b786b5'
          test "$(git ls-remote https://huggingface.co/${ADAPTER_REPO} refs/heads/main | awk '{print $1}')" = "$ADAPTER_REV"
          test "$(git ls-remote https://huggingface.co/${BASE_REPO} refs/heads/main | awk '{print $1}')" = "$BASE_REV"
          python -m pip install --disable-pip-version-check -q 'huggingface_hub[hf_xet]==0.36.0'
          mkdir -p out/adapter out/base out/meta out/wheels
          python - <<'PY'
          from huggingface_hub import snapshot_download
          from pathlib import Path
          import hashlib,json,shutil,struct
          ar='barvarvara/demucs-guitar-lora'; av='8cb116600d6d7728312247a28c73d652f37c98c2'
          br='adefossez/HTDemucs'; bv='bf35a81b663819a8255c8fefee17f9d812b786b5'
          a=Path('out/adapter'); b=Path('out/base'); m=Path('out/meta')
          snapshot_download(repo_id=ar,revision=av,allow_patterns=['adapter_config.json','adapter_model.safetensors','README.md'],local_dir=a)
          snapshot_download(repo_id=br,revision=bv,allow_patterns=['955717e8.safetensors','955717e8.json','htdemucs.yaml','README.md'],local_dir=b)
          for x in (a,b):
              c=x/'.cache'
              if c.exists(): shutil.rmtree(c)
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for z in iter(lambda:f.read(1024*1024),b''):h.update(z)
              return h.hexdigest()
          def header(p):
              with open(p,'rb') as f:
                  n=struct.unpack('<Q',f.read(8))[0]; meta=json.loads(f.read(n))
              keys=[k for k in meta if k!='__metadata__']; return {'tensor_count':len(keys),'sample':[{'key':k,'shape':meta[k].get('shape'),'dtype':meta[k].get('dtype')} for k in keys[:120]],'metadata':meta.get('__metadata__',{})}
          aw=a/'adapter_model.safetensors'; bw=b/'955717e8.safetensors'
          expected={'adapter':{'bytes':1974280,'sha256':'b285eda8a5789d3bee7615c8d82eb510a353034514d67a42191458452433c8d7'},'base':{'bytes':84025440,'sha256':'d9fa14133cfcc034a6758923bb3a8ca9f8dfd0b582134643bbf83f72c17576dd'}}
          observed={'adapter':{'bytes':aw.stat().st_size,'sha256':sha(aw),'header':header(aw)},'base':{'bytes':bw.stat().st_size,'sha256':sha(bw),'header':header(bw)}}
          assert observed['adapter']['bytes']==expected['adapter']['bytes'] and observed['adapter']['sha256']==expected['adapter']['sha256']
          assert observed['base']['bytes']==expected['base']['bytes'] and observed['base']['sha256']==expected['base']['sha256']
          blocked=[]
          for root in (a,b):
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix.lower() in {'.th','.pt','.pth','.bin','.pkl','.pickle','.h5','.msgpack'}: blocked.append(str(p))
          assert not blocked, blocked
          manifest={'schema':'LUCIA_AA_R22530_C29_COURIER_V1','adapter_repo':ar,'adapter_revision':av,'base_repo':br,'base_revision':bv,'expected':expected,'observed':observed,'blocked_files_present':blocked,'raw_committed_to_git':False,'preseal_sha256':'49883a60d9f0b646343112868d71e50b78bcfc0461ee1fef87997f6947a4cab6','suite_sha256':'b48d37be6eb2e00b79c835d709a97f562bc08623718deb11a4138910a1e2543a'}
          (m/'SOURCE_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
          python -m pip download --disable-pip-version-check --no-deps -q -d out/wheels 'demucs==4.0.1'
          sha256sum out/wheels/* > out/meta/WHEEL_SHA256.txt
      - name: Upload C29 metadata
        uses: actions/upload-artifact@v4
        with: {name: r22530-c29-meta, path: out/meta, retention-days: 1, compression-level: 6}
      - name: Upload C29 adapter
        uses: actions/upload-artifact@v4
        with: {name: r22530-c29-adapter, path: out/adapter, retention-days: 1, compression-level: 0}
      - name: Upload C29 base
        uses: actions/upload-artifact@v4
        with: {name: r22530-c29-base, path: out/base, retention-days: 1, compression-level: 0}
      - name: Upload C29 runtime
        uses: actions/upload-artifact@v4
        with: {name: r22530-c29-runtime, path: out/wheels, retention-days: 1, compression-level: 6}
