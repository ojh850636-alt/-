name: R22574 C58 plain runtime source-zero check
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plain_runtime_check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install released dependency contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'portallib[training]==0.2.0'
      - name: Compile and import canonical plain runtime
        run: |
          python -B -m py_compile r22574/runtime_source/c58_prepare_source.py r22574/runtime_source/c58_behavior_causal.py
          python - <<'PY'
          import importlib.util, pathlib, json
          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,path); mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); return mod
          p=load('prep','r22574/runtime_source/c58_prepare_source.py')
          b=load('beh','r22574/runtime_source/c58_behavior_causal.py')
          assert p.REV=='70d244cc86ccca08cf5af4e1e306ecf908b1ad5e'
          assert p.EXPECTED['model-00002-of-00002.safetensors'][0]==622329984
          assert p.EXPECTED['model-00002-of-00002.safetensors'][1]=='912becff8d60672aa8628ef08c05898d9adf17c2ad4ae3caf99b065622fdeff9'
          assert b.POSITIVE=={'natural_min':.03,'confirmation_min':.02,'generator_min':0.0,'control_min':.02}
          assert b.FAILURE=={'natural_max':-.03,'confirmation_max':-.02,'generator_max':0.0,'control_max':-.02}
          # directional exact test: first vector dominates second -> significant in a>b direction only
          p1,gt,lt=b.directional_one_sided_p([1]*8,[0]*8,True); p2,_,_=b.directional_one_sided_p([1]*8,[0]*8,False)
          assert p1==1/256 and p2==1.0 and gt==8 and lt==0,(p1,p2,gt,lt)
          # positive gate uses NATURAL_LOCKED control rows, not aggregate procedural control accuracy
          def rows(split,corrects): return [{'split':split,'correct':int(x),'gold_score':0.0,'margin':0.0} for x in corrects]
          base=rows('NATURAL_LOCKED',[0]*8)+rows('CONFIRMATION',[0]*8)+rows('GENERATOR_HOLDOUT',[0]*8)
          full=rows('NATURAL_LOCKED',[1]*8)+rows('CONFIRMATION',[1]*8)+rows('GENERATOR_HOLDOUT',[1]*8)
          # controls are poor on natural but artificially perfect on unrelated aggregate rows; natural-only gate must still pass.
          ctrls={k:rows('NATURAL_LOCKED',[0]*8)+rows('DISCOVERY',[1]*100) for k in ('RANDOM_NORM_MATCHED','LAYER_SHUFFLE','WRONG_TASK_COPA')}
          g=b.gate_eval(base,full,ctrls); assert g['positive_green'] and not g['failure_green'] and g['full_minus_best_control']==1.0,g
          # symmetric failure gate.
          base2=rows('NATURAL_LOCKED',[1]*8)+rows('CONFIRMATION',[1]*8)+rows('GENERATOR_HOLDOUT',[1]*8)
          full2=rows('NATURAL_LOCKED',[0]*8)+rows('CONFIRMATION',[0]*8)+rows('GENERATOR_HOLDOUT',[0]*8)
          ctrls2={k:rows('NATURAL_LOCKED',[1]*8) for k in ('RANDOM_NORM_MATCHED','LAYER_SHUFFLE','WRONG_TASK_COPA')}
          g2=b.gate_eval(base2,full2,ctrls2); assert g2['failure_green'] and not g2['positive_green'],g2
          text=pathlib.Path('r22574/runtime_source/c58_behavior_causal.py').read_text()
          assert 'both_scored_on_shuffled_prompts' in text
          assert 'paired_one_sided_p' not in text
          out={'schema':'R22574_C58_PLAIN_RUNTIME_CHECK_V1','verdict':'PASS','base_weight_bytes':0,'model_outputs':0,'positive_gate_unit':g,'failure_gate_unit':g2}
          pathlib.Path('C58_PLAIN_RUNTIME_CHECK.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22574-c58-plain-runtime-check
          path: C58_PLAIN_RUNTIME_CHECK.json
          if-no-files-found: error
          retention-days: 1
