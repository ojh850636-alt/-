name: LAA R22543 C40 provenance and ABI source-zero audit
on:
  pull_request:
    branches: [ main ]
    paths: ['laa/r22543/C40_PROVENANCE_ABI_ONCE.txt']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install source-zero runtime dependencies only
        run: python -m pip install --quiet 'transformers==4.48.3' 'peft==0.14.0' 'accelerate==1.2.1' 'safetensors==0.4.5' 'huggingface_hub==0.27.1'
      - name: Provenance, fixture ABI and runtime audit with zero model weights
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          mkdir -p public private
          python - <<'PY'
          from __future__ import annotations
          import hashlib,json,os,re,urllib.parse,urllib.request
          from pathlib import Path
          from transformers import Qwen2ForCausalLM, AutoTokenizer
          from peft import PeftModel

          UA={'User-Agent':'LAA-R22543-sourcezero'}
          def get(url):
            req=urllib.request.Request(url,headers=UA)
            with urllib.request.urlopen(req,timeout=90) as r:return r.read()
          def jget(url):return json.loads(get(url))
          model_repo='chkrishna2001/psm-memory-qwen0.5b'
          data_repo='chkrishna2001/psm-memory-training-data'
          base_repo='Qwen/Qwen2.5-0.5B-Instruct'
          mi=jget(f'https://huggingface.co/api/models/{model_repo}?blobs=true')
          di=jget(f'https://huggingface.co/api/datasets/{data_repo}?blobs=true')
          bi=jget(f'https://huggingface.co/api/models/{base_repo}?blobs=true')
          mhead,dhead,bhead=mi['sha'],di['sha'],bi['sha']
          selected={
            'storage':'lora/storage/adapter_model.safetensors',
            'retrieval_plan':'lora/retrieval_plan/adapter_model.safetensors',
            'consolidation':'lora/consolidation/adapter_model.safetensors',
          }
          sib={x['rfilename']:x for x in mi.get('siblings',[])}
          objs={}
          for k,p in selected.items():
            s=sib[p];l=s.get('lfs') or {};objs[k]={'path':p,'size':s.get('size') or l.get('size'),'sha256':l.get('sha256') or l.get('oid')}
          cfgs={}
          for k,p in selected.items():
            cp=p.replace('adapter_model.safetensors','adapter_config.json')
            cfgs[k]=json.loads(get(f'https://huggingface.co/{model_repo}/resolve/{mhead}/{cp}?download=false'))
          # fixture location and private first-row ABI. semantic suite was already sealed before this step.
          dsibs=[x['rfilename'] for x in di.get('siblings',[])]
          fixture=[p for p in dsibs if p.endswith('holdout-coding-agent-cases.json')]
          assert len(fixture)==1,fixture
          fpath=fixture[0]; fraw=get(f'https://huggingface.co/datasets/{data_repo}/resolve/{dhead}/{fpath}?download=false')
          fsha=hashlib.sha256(fraw).hexdigest(); data=json.loads(fraw)
          rows=data if isinstance(data,list) else (data.get('cases') or data.get('items') or [])
          assert rows and isinstance(rows,list)
          first=rows[0]
          Path('private/FIXTURE_ABI_FIRST_ROW.json').write_text(json.dumps(first,indent=2,ensure_ascii=False)+'\n')
          # public schema-only inventory
          def keys_shape(v,depth=0):
            if depth>4:return type(v).__name__
            if isinstance(v,dict):return {k:keys_shape(v[k],depth+1) for k in sorted(v)}
            if isinstance(v,list):return {'list_len':len(v),'item':keys_shape(v[0],depth+1) if v else None}
            return type(v).__name__
          shape=keys_shape(first)
          # discover action-like string values without exporting case text
          action_vals=set()
          def walk(o,key=''):
            if isinstance(o,dict):
              for k,v in o.items():walk(v,k)
            elif isinstance(o,list):
              for v in o:walk(v,key)
            elif isinstance(o,str) and any(t in key.lower() for t in ('action','decision','operation','label')) and len(o)<80:
              action_vals.add(o)
          for r in rows:walk(r)
          # source repo search via GitHub REST, metadata only
          gh_headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','User-Agent':'LAA-R22543'}
          def gh(url):
            req=urllib.request.Request(url,headers=gh_headers)
            with urllib.request.urlopen(req,timeout=60) as rr:return json.loads(rr.read())
          queries=['psm-model chkrishna2001','psm-memory chkrishna2001','"PSM Memory" qwen']
          repos=[]
          for q in queries:
            try:
              j=gh('https://api.github.com/search/repositories?q='+urllib.parse.quote(q)+'&per_page=20')
              repos += [{'full_name':x['full_name'],'default_branch':x['default_branch'],'html_url':x['html_url'],'pushed_at':x['pushed_at']} for x in j.get('items',[])]
            except Exception: pass
          uniq={x['full_name']:x for x in repos}
          source_candidates=list(uniq.values())
          exact_training_code_revision_proven=False
          exact_training_base_revision_proven=False
          # no explicit revision fields in PEFT configs => pre-output hold
          if all(c.get('base_model_name_or_path')==base_repo for c in cfgs.values()): base_name_agreement=True
          else: base_name_agreement=False
          pub={
            'schema':'LUCIA_AA_R22543_C40_SOURCEZERO_PROVENANCE_ABI_V1',
            'model_repo':model_repo,'model_head':mhead,'dataset_repo':data_repo,'dataset_head':dhead,
            'base_repo':base_repo,'current_base_head':bhead,'selected_adapter_objects':objs,
            'adapter_configs':{k:{x:v.get(x) for x in ['base_model_name_or_path','r','lora_alpha','target_modules','modules_to_save','task_type','peft_type']} for k,v in cfgs.items()},
            'base_name_agreement':base_name_agreement,
            'fixture_path':fpath,'fixture_sha256':fsha,'fixture_row_count':len(rows),'fixture_first_row_shape':shape,
            'action_like_values':sorted(action_vals),
            'github_source_repo_search':source_candidates,
            'exact_training_code_revision_proven':exact_training_code_revision_proven,
            'exact_training_base_revision_proven':exact_training_base_revision_proven,
            'e5_ceiling_preoutput':'BLOCKED_TRAINING_PROVENANCE_UNPROVEN',
            'runtime_smoke':{'transformers':'4.48.3','peft':'0.14.0','qwen2_class_import':Qwen2ForCausalLM.__name__,'peft_class_import':PeftModel.__name__},
            'raw_model_weight_bytes_downloaded':0,'model_outputs_observed':0,
          }
          Path('public/C40_SOURCEZERO_PROVENANCE_ABI.json').write_text(json.dumps(pub,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          print(json.dumps(pub,indent=2,ensure_ascii=False))
          assert pub['raw_model_weight_bytes_downloaded']==0 and pub['model_outputs_observed']==0
          assert len(objs)==3 and all(v['size'] for v in objs.values())
          PY
      - uses: actions/upload-artifact@v4
        with: {name: r22543-c40-sourcezero-provenance-abi, path: public/, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with: {name: r22543-c40-private-fixture-abi, path: private/, retention-days: 1}
