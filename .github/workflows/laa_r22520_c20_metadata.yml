name: Temporary LAA R22520 C20 split existing exact artifact

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Reuse and split already verified C20 exact artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/LAA_R22520_C20_SPLIT"
          mkdir -p "$ROOT/parts"
          curl -L --fail --retry 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o "$ROOT/original.zip" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/8899570964/zip"
          test "$(stat -c%s "$ROOT/original.zip")" = '536945657'
          test "$(sha256sum "$ROOT/original.zip" | awk '{print $1}')" = 'c3c2930e02ac7cf3c57d2aa07b77cf6703ef239212ee0679b60a9f24695a2e4c'
          split -b 200000000 -d -a 2 "$ROOT/original.zip" "$ROOT/parts/LAA_R22520_C20_EXACT_SOURCE.zip.part-"
          rm "$ROOT/original.zip"
          (cd "$ROOT/parts" && sha256sum LAA_R22520_C20_EXACT_SOURCE.zip.part-* > PARTS_SHA256.txt && stat -c '%n %s' LAA_R22520_C20_EXACT_SOURCE.zip.part-* > PARTS_SIZE.txt)
          test "$(find "$ROOT/parts" -name 'LAA_R22520_C20_EXACT_SOURCE.zip.part-*' -type f | wc -l | tr -d ' ')" = '3'
      - uses: actions/upload-artifact@v4
        with:
          name: LAA_R22520_C20_SOURCE_PART_00
          path: ${{ runner.temp }}/LAA_R22520_C20_SPLIT/parts/LAA_R22520_C20_EXACT_SOURCE.zip.part-00
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LAA_R22520_C20_SOURCE_PART_01
          path: ${{ runner.temp }}/LAA_R22520_C20_SPLIT/parts/LAA_R22520_C20_EXACT_SOURCE.zip.part-01
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LAA_R22520_C20_SOURCE_PART_02
          path: ${{ runner.temp }}/LAA_R22520_C20_SPLIT/parts/LAA_R22520_C20_EXACT_SOURCE.zip.part-02
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LAA_R22520_C20_SOURCE_PART_MANIFEST
          path: |
            ${{ runner.temp }}/LAA_R22520_C20_SPLIT/parts/PARTS_SHA256.txt
            ${{ runner.temp }}/LAA_R22520_C20_SPLIT/parts/PARTS_SIZE.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
