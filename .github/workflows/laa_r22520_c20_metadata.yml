name: Temporary LAA R22520 C20 broad metadata discovery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Search Hugging Face metadata only
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/LAA_R22520_C20_METADATA_V2"
          mkdir -p "$ROOT/files"
          python - <<'PY'
          import csv, hashlib, json, os, pathlib, time, urllib.parse, urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'LAA_R22520_C20_METADATA_V2'
          headers={'User-Agent':'LUCIA-AA-R22520-MetadataOnly/2.0'}
          terms=['segformer','segmentation','semantic-segmentation','image-segmentation','detr','object-detection','depth-estimation','depth-anything','image-retrieval','image-feature-extraction','clip-lora','keypoint','pose-estimation','super-resolution']
          def getj(url,t=90):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=t) as r:return json.load(r)
          def getb(url,t=120):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=t) as r:return r.read()
          models={};hits={};errors=[]
          for term in terms:
            total=0
            for params in ({'search':term,'limit':100,'full':'true'},{'filter':'peft','search':term,'limit':100,'full':'true'}):
              url='https://huggingface.co/api/models?'+urllib.parse.urlencode(params)
              try:
                rows=getj(url); total+=len(rows)
                for row in rows:
                  mid=row.get('id') or row.get('modelId')
                  if mid:models[mid]=row
              except Exception as e:errors.append({'term':term,'params':params,'error':type(e).__name__+': '+str(e)})
              time.sleep(.1)
            hits[term]=total
          def objinfo(row):
            if not isinstance(row,dict):return None,None
            size=row.get('size');sha=row.get('blobId') or row.get('xetHash');lfs=row.get('lfs')
            if isinstance(lfs,dict):size=size if isinstance(size,int) else lfs.get('size');sha=lfs.get('sha256') or lfs.get('oid') or sha
            if isinstance(sha,str) and sha.startswith('sha256:'):sha=sha.split(':',1)[1]
            return size if isinstance(size,int) else None,sha
          out=[]
          for mid in sorted(models):
            try:api=getj('https://huggingface.co/api/models/'+urllib.parse.quote(mid,safe='/'))
            except Exception as e:errors.append({'model_id':mid,'stage':'api','error':type(e).__name__+': '+str(e)});continue
            sib=api.get('siblings') or [];by={x.get('rfilename'):x for x in sib if x.get('rfilename')}
            if 'adapter_config.json' not in by or 'adapter_model.safetensors' not in by:continue
            rev=api.get('sha')
            try:cfgb=getb(f'https://huggingface.co/{mid}/resolve/{rev}/adapter_config.json?download=true');cfg=json.loads(cfgb)
            except Exception as e:errors.append({'model_id':mid,'stage':'config','error':type(e).__name__+': '+str(e)});continue
            rmb=b''
            if 'README.md' in by:
              try:rmb=getb(f'https://huggingface.co/{mid}/resolve/{rev}/README.md?download=true')
              except Exception:pass
            card=api.get('cardData') or {};tags=api.get('tags') or [];base=cfg.get('base_model_name_or_path') or card.get('base_model')
            if isinstance(base,list):base=base[0] if base else None
            bapi={};bre=None;bfiles=[];bbytes=None;bcustom=[];blic=None
            if isinstance(base,str) and '/' in base and not base.startswith('/'):
              try:
                bapi=getj('https://huggingface.co/api/models/'+urllib.parse.quote(base,safe='/'));bre=bapi.get('sha');blic=(bapi.get('cardData') or {}).get('license') or bapi.get('license');sizes=[]
                for x in bapi.get('siblings') or []:
                  name=str(x.get('rfilename') or '')
                  if name.endswith('.py'):bcustom.append(name)
                  if name.endswith('.safetensors'):
                    sz,sh=objinfo(x);bfiles.append({'path':name,'size_bytes':sz,'sha256_or_oid':sh});
                    if isinstance(sz,int):sizes.append(sz)
                if sizes and len(sizes)==len(bfiles):bbytes=sum(sizes)
              except Exception as e:errors.append({'model_id':mid,'stage':'base','error':type(e).__name__+': '+str(e)})
            text=' '.join([mid,str(api.get('pipeline_tag') or ''),' '.join(map(str,tags)),json.dumps(card,sort_keys=True),json.dumps(cfg,sort_keys=True),rmb[:20000].decode('utf-8','ignore')]).lower()
            lane='OTHER';geom='unknown'
            if any(x in text for x in ['segformer','semantic-segmentation','semantic segmentation','upernet']):lane='SEMANTIC_SEGMENTATION';geom='per-pixel class mask/logits'
            elif any(x in text for x in ['object-detection','object detection','detr','yolos']):lane='OBJECT_DETECTION';geom='set of boxes/classes/scores'
            elif any(x in text for x in ['depth-estimation','depth estimation','depth-anything','zoedepth','dpt']):lane='DEPTH_ESTIMATION';geom='dense continuous depth map'
            elif any(x in text for x in ['image-retrieval','image retrieval','image-feature-extraction','embedding','contrastive','clip']):lane='RETRIEVAL_EMBEDDING';geom='continuous embedding/ranking'
            elif any(x in text for x in ['keypoint','pose-estimation','pose estimation','landmark']):lane='KEYPOINT';geom='landmark coordinates/confidences'
            elif any(x in text for x in ['super-resolution','image-to-image','denoising','inpainting']):lane='IMAGE_TO_IMAGE';geom='dense pixel field'
            asz,asha=objinfo(by.get('adapter_model.safetensors'));lic=card.get('license') or api.get('license');custom=sorted(x for x in by if str(x).endswith('.py'));holds=[];score=0
            if lane!='OTHER':score+=30
            else:holds.append('LANE_UNKNOWN')
            if lic:score+=10
            else:holds.append('LICENSE_MISSING')
            if isinstance(base,str) and '/' in base:score+=10
            else:holds.append('BASE_UNPINNABLE')
            if bfiles:score+=10
            else:holds.append('BASE_SAFETENSORS_MISSING')
            if not custom and not bcustom:score+=10
            else:holds.append('CUSTOM_PYTHON')
            if cfg.get('target_modules'):score+=10
            else:holds.append('TARGETS_MISSING')
            if not cfg.get('modules_to_save'):score+=5
            else:holds.append('AUXILIARY_MODULES')
            if isinstance(asz,int) and asz<=100_000_000:score+=10
            elif asz is None:holds.append('ADAPTER_SIZE_UNKNOWN')
            if isinstance(bbytes,int) and bbytes<=500_000_000:score+=15
            elif isinstance(bbytes,int) and bbytes<=1_500_000_000:score+=10
            elif bbytes is None:holds.append('BASE_SIZE_UNKNOWN')
            folder=root/'files'/mid.replace('/','__');folder.mkdir(parents=True,exist_ok=True);(folder/'adapter_config.json').write_bytes(cfgb)
            if rmb:(folder/'README.md').write_bytes(rmb)
            out.append({'model_id':mid,'revision':rev,'lane':lane,'output_geometry':geom,'metadata_score':score,'holds':holds,'pipeline_tag':api.get('pipeline_tag'),'library_name':api.get('library_name'),'license':lic,'datasets':card.get('datasets'),'base_model':base,'base_revision_current':bre,'base_license':blic,'base_safetensors_files':bfiles,'base_safetensors_bytes_known':bbytes,'base_custom_python_files':bcustom,'adapter_weight_size_known':asz,'adapter_weight_sha_known':asha,'adapter_config_sha256':hashlib.sha256(cfgb).hexdigest(),'readme_sha256':hashlib.sha256(rmb).hexdigest() if rmb else None,'peft_type':cfg.get('peft_type'),'task_type':cfg.get('task_type'),'rank':cfg.get('r'),'alpha':cfg.get('lora_alpha'),'target_modules':cfg.get('target_modules'),'modules_to_save':cfg.get('modules_to_save'),'use_dora':cfg.get('use_dora'),'use_rslora':cfg.get('use_rslora'),'raw_weight_bytes_downloaded':0,'model_outputs_observed':0,'sibling_names':sorted(by)})
          out.sort(key=lambda x:(-x['metadata_score'],x['lane'],x['model_id']))
          rec={'schema':'LUCIA_AA_R2_25_20_C20_METADATA_DISCOVERY_V2','raw_weight_bytes_downloaded':0,'model_outputs_observed':0,'terms':terms,'query_hits':hits,'unique_models_seen':len(models),'adapter_candidates_found':len(out),'candidates':out,'errors':errors}
          (root/'C20_METADATA_DISCOVERY.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          with (root/'C20_METADATA_DISCOVERY.csv').open('w',newline='') as f:
            w=csv.writer(f);w.writerow(['score','lane','model_id','revision','base_model','rank','adapter_bytes','base_bytes','license','holds']);[w.writerow([x['metadata_score'],x['lane'],x['model_id'],x['revision'],x['base_model'],x['rank'],x['adapter_weight_size_known'],x['base_safetensors_bytes_known'],x['license'],'|'.join(x['holds'])]) for x in out]
          print(json.dumps({'models_seen':len(models),'candidates':len(out),'top':out[:20]},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LAA_R22520_C20_METADATA_ONLY_V2
          path: ${{ runner.temp }}/LAA_R22520_C20_METADATA_V2
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
