name: R22576 C58 orphan RxNorm terminal raw cleanup
on:
  push:
    branches: [lucia-aa-r22574-c58-source]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all known RxNorm C58 raw escrows and verify raw-free evidence remains
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RAW_IDS='9348492049 9348562181 9348566555 9348593504'
          for id in $RAW_IDS; do
            code=$(curl -sS -o /tmp/delete-$id.txt -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GH_REPO/actions/artifacts/$id")
            echo "$id DELETE_HTTP=$code"
            test "$code" = '204' -o "$code" = '404'
          done
          for id in $RAW_IDS; do
            code=$(curl -sS -o /tmp/get-$id.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GH_REPO/actions/artifacts/$id")
            echo "$id GET_HTTP=$code"
            test "$code" = '404'
          done
          # These two are raw-free static/source receipts and must remain available.
          for id in 9348492428 9348565742; do
            code=$(curl -sS -o /tmp/get-$id.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GH_REPO/actions/artifacts/$id")
            echo "$id RAWFREE_GET_HTTP=$code"
            test "$code" = '200'
          done
          cat > C58_RXNORM_ORPHAN_RAW_CLEANUP.json <<'JSON'
          {
            "schema":"R22576_C58_RXNORM_ORPHAN_RAW_CLEANUP_V1",
            "fork_status":"ORPHAN_FORK_SOURCE_CONSUMED_NO_PRIMARY_C58_CREDIT",
            "raw_artifact_ids_deleted":[9348492049,9348562181,9348566555,9348593504],
            "rawfree_artifact_ids_preserved":[9348492428,9348565742],
            "behavior_reexecution":0,
            "scientific_credit":0,
            "verdict":"PASS"
          }
          JSON
      - uses: actions/upload-artifact@v4
        with:
          name: r22576-c58-rxnorm-orphan-cleanup-rawfree
          path: C58_RXNORM_ORPHAN_RAW_CLEANUP.json
          retention-days: 1
          if-no-files-found: error
