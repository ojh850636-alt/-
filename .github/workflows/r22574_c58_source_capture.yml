name: r22574-c58-source-capture
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HOME: /tmp/r22574-c58-hf
      BASE_REPO: unsloth/gemma-3-270m-it
      BASE_REV: 23cf460f6bb16954176b3ddcc8d4f250501458a9
      BASE_SHA: 700b710a9a99c295ed546647aa81cacf9f81f4c573ea2be613a0e2517a44afab
      BASE_SIZE: '536223056'
      ADAPTER_REPO: AXONVERTEX-AI-RESEARCH/IndicRxNorm-Gemma3-270M-LoRA
      ADAPTER_REV: 0c86dacbe408064bba1be4dcf4a46483b3055dd8
    steps:
      - uses: actions/checkout@v4
      - name: Recover immutable preseal and one-use Adapter escrow
        uses: actions/download-artifact@v4
        with:
          name: r22574-c58-preseal
          path: preseal
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ojh850636-alt/-
          run-id: '32203853216'
      - uses: actions/download-artifact@v4
        with:
          name: r22574-c58-adapter-escrow
          path: source/adapter
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ojh850636-alt/-
          run-id: '32204012060'
      - name: Verify immutable Adapter escrow and preseal before Base network
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum source/adapter/adapter_model.safetensors | awk '{print $1}')" = '25e64fc0b48e47238ada87591b1eaa7a6c87e6ff8640b6a9aca88070009ef7b5'
          test "$(stat -c%s source/adapter/adapter_model.safetensors)" = '15220968'
          test "$(sha256sum preseal/C58_PRESEAL_SUITE.jsonl | awk '{print $1}')" = 'a4c9b2475a3fd50115e6d773c847255803cf6f3c2428ac80ff0b7e308bb69159'
      - name: Install exact runtime dependency closure before Base weight ingress
        run: |
          python -m pip install --quiet 'transformers==4.57.1' 'peft==0.19.1' 'accelerate==1.14.0' 'safetensors==0.7.0' 'huggingface_hub>=0.36,<2' sentencepiece protobuf
          python - <<'PY'
          import torch,transformers,peft,accelerate,safetensors,huggingface_hub,google.protobuf
          print('torch',torch.__version__,'transformers',transformers.__version__,'peft',peft.__version__,'accelerate',accelerate.__version__,'safetensors',safetensors.__version__,'hub',huggingface_hub.__version__)
          PY
      - name: Capture exact runtime-reference Base and both tokenizers ONCE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/base source/adapter_tokenizer evidence
          python - <<'PY'
          import os,shutil,hashlib,json,time
          from huggingface_hub import hf_hub_download,snapshot_download
          def cp(repo,rev,fn,dst):
            p=hf_hub_download(repo,fn,revision=rev); shutil.copy2(p,dst+'/'+fn)
          base=os.environ['BASE_REPO']; br=os.environ['BASE_REV']
          for fn in ['model.safetensors','config.json','generation_config.json']:
            cp(base,br,fn,'source/base')
          # tokenizer files are source material but not model weights; capture exactly for semantic audit.
          bp=snapshot_download(base,revision=br,allow_patterns=['tokenizer*','special_tokens_map.json','added_tokens.json','chat_template.jinja'],ignore_patterns=['*.bin','*.pt','*.pth','*.pkl','*.h5','*.msgpack'])
          for root,dirs,files in os.walk(bp):
            for f in files:
              if f.startswith('tokenizer') or f in {'special_tokens_map.json','added_tokens.json','chat_template.jinja'}:
                src=os.path.join(root,f); dst=os.path.join('source/base',f)
                if not os.path.exists(dst): shutil.copy2(src,dst)
          ap=snapshot_download(os.environ['ADAPTER_REPO'],revision=os.environ['ADAPTER_REV'],allow_patterns=['tokenizer*','special_tokens_map.json','added_tokens.json','chat_template.jinja'],ignore_patterns=['*.safetensors','*.bin','*.pt','*.pth','*.pkl','*.h5','*.msgpack'])
          for root,dirs,files in os.walk(ap):
            for f in files:
              if f.startswith('tokenizer') or f in {'special_tokens_map.json','added_tokens.json','chat_template.jinja'}:
                src=os.path.join(root,f); dst=os.path.join('source/adapter_tokenizer',f)
                if not os.path.exists(dst): shutil.copy2(src,dst)
          def sha(p):
            h=hashlib.sha256()
            with open(p,'rb') as x:
              for b in iter(lambda:x.read(1<<20),b''):h.update(b)
            return h.hexdigest()
          w='source/base/model.safetensors'; assert os.path.getsize(w)==int(os.environ['BASE_SIZE']); assert sha(w)==os.environ['BASE_SHA']
          inv=[]
          for d in ['source/base','source/adapter','source/adapter_tokenizer']:
            for f in sorted(os.listdir(d)):
              p=os.path.join(d,f)
              if os.path.isfile(p): inv.append({'path':p,'size':os.path.getsize(p),'sha256':sha(p)})
          json.dump({'schema':'LAA.R22574.C58SourceCapture.v1','base_repo':base,'base_revision':br,'base_training_time_exact_revision_proven':False,'adapter_repo':os.environ['ADAPTER_REPO'],'adapter_revision':os.environ['ADAPTER_REV'],'preseal_suite_sha256':'a4c9b2475a3fd50115e6d773c847255803cf6f3c2428ac80ff0b7e308bb69159','files':inv,'model_output_observed':0,'raw_git_commit':0},open('evidence/C58_SOURCE_CAPTURE_RECEIPT.json','w'),indent=2,sort_keys=True)
          PY
      - name: Create recovery escrow IMMEDIATELY after exact source hash validation
        uses: actions/upload-artifact@v4
        with:
          name: r22574-c58-source-escrow
          path: source
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Tokenizer semantic audit and architecture callable gate
        shell: bash
        run: |
          python - <<'PY'
          import json,hashlib,sys
          from transformers import AutoTokenizer,AutoConfig
          base=AutoTokenizer.from_pretrained('source/base',local_files_only=True,trust_remote_code=False)
          adap=AutoTokenizer.from_pretrained('source/adapter_tokenizer',local_files_only=True,trust_remote_code=False)
          cases=[json.loads(x)['input'] for x in open('preseal/C58_PRESEAL_SUITE.jsonl',encoding='utf-8')]
          cases += [json.dumps(json.loads(x)['expected'],ensure_ascii=False,sort_keys=True) for x in open('preseal/C58_PRESEAL_SUITE.jsonl',encoding='utf-8') if json.loads(x)['kind']=='TERMINOLOGY_POSITIVE']
          mismatch=[]
          h=hashlib.sha256()
          for i,t in enumerate(cases):
            a=base(t,add_special_tokens=True); b=adap(t,add_special_tokens=True)
            if a['input_ids']!=b['input_ids'] or a.get('attention_mask')!=b.get('attention_mask'): mismatch.append(i)
            h.update(json.dumps({'a':a['input_ids'],'b':b['input_ids']},separators=(',',':')).encode())
          cfg=AutoConfig.from_pretrained('source/base',local_files_only=True,trust_remote_code=False)
          out={'schema':'LAA.R22574.C58TokenizerAudit.v1','case_count':len(cases),'token_id_mismatch_count':len(mismatch),'mismatch_indices':mismatch[:20],'batch_digest':h.hexdigest(),'base_vocab_size':len(base),'adapter_vocab_size':len(adap),'base_special_tokens':base.special_tokens_map,'adapter_special_tokens':adap.special_tokens_map,'model_type':cfg.model_type,'architectures':getattr(cfg,'architectures',None),'trust_remote_code':False,'pass':len(mismatch)==0}
          json.dump(out,open('evidence/C58_TOKENIZER_RUNTIME_AUDIT.json','w'),indent=2,sort_keys=True,ensure_ascii=False)
          if mismatch: raise SystemExit(7)
          PY
      - name: Record runtime versions and source-free closure
        run: |
          python - <<'PY'
          import json,torch,transformers,peft,accelerate,safetensors,huggingface_hub
          json.dump({'schema':'LAA.R22574.C58RuntimeClosure.v1','torch':torch.__version__,'transformers':transformers.__version__,'peft':peft.__version__,'accelerate':accelerate.__version__,'safetensors':safetensors.__version__,'huggingface_hub':huggingface_hub.__version__,'dependency_imports':'PASS','tokenizer_instantiate':'PASS','architecture_config':'PASS','model_output_observed':0},open('evidence/C58_RUNTIME_CLOSURE.json','w'),indent=2,sort_keys=True)
          PY
      - name: Delete runner source and HF cache before raw-free evidence export
        run: rm -rf source "$HF_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: r22574-c58-source-capture-rawfree
          path: evidence
          retention-days: 1
          if-no-files-found: error
