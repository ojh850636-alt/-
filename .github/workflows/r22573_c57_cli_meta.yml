name: R22573 C57 CLI Archaeology
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  archaeology:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact presealed runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/scripts/r22573_c57_runner.py)" = '255d1e96dc71b761533f91066433d3c8432a2682'
          PYTHONDONTWRITEBYTECODE=1 python -B -m py_compile .github/scripts/r22573_c57_runner.py
          find . -name '__pycache__' -type d -prune -exec rm -rf {} +
      - name: Source-free preoutput seal and AST verifier mutations
        shell: bash
        run: |
          set -euo pipefail
          rm -rf rawfree c57-work
          PYTHONDONTWRITEBYTECODE=1 python -B .github/scripts/r22573_c57_runner.py preseal --out rawfree
          python - <<'PY'
          import json
          s=json.load(open('rawfree/C57_PREOUTPUT_SEAL.json'))
          assert s['weights_present']==0 and s['model_outputs_observed']==0 and s['training_rows_used']==0
          assert s['suite_n']==64 and s['paired_n']==32 and s['generation_n']==16
          assert s['suite_sha256']=='b1ead8e4e0993728c96f9b6042583a229b34b0f0e83f4c03e614788390bf1c31'
          assert s['verifier_smoke']['perfect']['semantic']==1.0
          assert s['verifier_smoke']['perfect']['exact']==1.0
          assert s['verifier_smoke']['source_copy']['semantic']<0.2
          assert s['verifier_smoke']['mutation']['exact']==0.0
          print('PRESEAL_PASS',s['suite_sha256'])
          PY
      - name: Install bounded exact runtime before binary
        shell: bash
        run: |
          set -euo pipefail
          export HF_HOME="$RUNNER_TEMP/hf-home-c57"
          python -m pip install -q --upgrade pip
          python -m pip install -q 'torch>=2.8,<3' 'transformers>=4.53,<6' 'peft>=0.18,<0.19' 'safetensors>=0.6,<1' 'huggingface_hub>=0.33,<2' 'accelerate>=1,<2' sentencepiece
      - name: Exact architecture wallclock padding and PEFT lifecycle source-free smoke
        id: runtime
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export HF_HOME="$RUNNER_TEMP/hf-home-c57"
          PYTHONDONTWRITEBYTECODE=1 python -B .github/scripts/r22573_c57_runner.py runtime-smoke --out rawfree
          test ! -e c57-work
      - name: One-use exact ingress behavior controls and conditional causal screen
        id: execute
        if: steps.runtime.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export HF_HOME="$RUNNER_TEMP/hf-home-c57"
          PYTHONDONTWRITEBYTECODE=1 python -B .github/scripts/r22573_c57_runner.py execute --out rawfree --work c57-work
      - name: Always destructive cleanup and raw-free export
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export HF_HOME="$RUNNER_TEMP/hf-home-c57"
          rm -rf c57-work "$HF_HOME"
          RUNTIME='${{ steps.runtime.outcome }}'
          EXEC='${{ steps.execute.outcome }}'
          python - "$RUNTIME" "$EXEC" <<'PY'
          import json,pathlib,re,hashlib,sys
          root=pathlib.Path('rawfree');root.mkdir(exist_ok=True);runtime,execute=sys.argv[1:3]
          cp=root/'C57_CLEANUP.json'
          if not cp.exists():cp.write_text(json.dumps({'schema':'R22573_C57_CLEANUP_V1','controlled_cleanup_by_workflow':True,'runtime_outcome':runtime,'execute_outcome':execute,'raw_root_deleted':True,'hf_cache_deleted':True,'raw_weights_remaining':0,'raw_tokenizer_remaining':0},indent=2))
          if execute!='success' and not (root/'C57_ABORT.json').exists():(root/'C57_ABORT.json').write_text(json.dumps({'schema':'R22573_C57_ABORT_V1','runtime_outcome':runtime,'execute_outcome':execute,'scientific_increment':0,'claim':'NO_BEHAVIOR_OR_CAUSAL_CREDIT_FROM_ABORTED_OR_PREINGRESS_REJECTED_RUN'},indent=2))
          bad=[]
          for p in root.rglob('*'):
            if not p.is_file():continue
            n=p.name.lower()
            if re.search(r'\.(safetensors|bin|pt|pth|pkl|pickle|model|npy|npz)$',n):bad.append(str(p))
            if n.startswith('tokenizer') or n in {'vocab.json','merges.txt','special_tokens_map.json','tokenizer.model'}:bad.append(str(p))
          assert not bad,bad
          lines=[]
          for p in sorted(root.rglob('*')):
            if p.is_file() and p.name!='SHA256SUMS.txt':lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}")
          (root/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          print('RAW_FREE_PASS',len(lines),'runtime',runtime,'execute',execute)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r22573-c57-rawfree-evidence
          path: rawfree/
          retention-days: 1
          if-no-files-found: error
      - name: Preserve scientific failure status after evidence escrow
        if: always()
        shell: bash
        run: |
          test '${{ steps.runtime.outcome }}' = 'success'
          test '${{ steps.execute.outcome }}' = 'success'
