name: R22619 C78 CPU behavior and controls from exact one-use artifacts
on:
  push:
    branches: [r22619-c78-behavior]
jobs:
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned CPU runtime only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'transformers==4.57.1' 'peft==0.20.0' 'accelerate==1.10.1' 'bitsandbytes==0.48.1' 'tokenizers==0.22.1' 'huggingface-hub==0.36.0'
      - name: Reuse exact consumed source artifacts without Hugging Face GET
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _a _b src_adapter src_base
          gh api -H 'Accept: application/vnd.github+json' /repos/${GITHUB_REPOSITORY}/actions/artifacts/9992478575/zip > adapter.zip
          gh api -H 'Accept: application/vnd.github+json' /repos/${GITHUB_REPOSITORY}/actions/artifacts/9992533187/zip > base.zip
          unzip -q adapter.zip -d _a
          unzip -q base.zip -d _b
          A=$(find _a -name adapter_model.safetensors -print -quit); AC=$(find _a -name adapter_config.json -print -quit)
          B=$(find _b -name model.safetensors -print -quit)
          test -n "$A"; test -n "$AC"; test -n "$B"
          cp "$A" src_adapter/adapter_model.safetensors; cp "$AC" src_adapter/adapter_config.json
          for f in config.json generation_config.json tokenizer.json tokenizer.model tokenizer_config.json special_tokens_map.json chat_template.jinja; do
            X=$(find _b -name "$f" -print -quit); test -n "$X"; cp "$X" "src_base/$f"
          done
          cp "$B" src_base/model.safetensors
          test "$(stat -c%s src_adapter/adapter_model.safetensors)" = 121537408
          echo '414f0d5db8d6560a12f5841eb4a7fdc8ce558db37f4fe4e1c3c19a249223f918  src_adapter/adapter_model.safetensors' | sha256sum -c -
          test "$(stat -c%s src_base/model.safetensors)" = 393471884
          echo 'd3ae9628a0ed2cfa21b5b8345be4e1d4126794e734f3483dcc275b4735bf5a15  src_base/model.safetensors' | sha256sum -c -
      - name: Execute precommitted behavior controls
        shell: bash
        run: |
          set -euo pipefail
          python r22619/c78_behavior.py
      - name: Delete all raw source before delivery and write absence receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          BEFORE=$(du -sb src_adapter src_base _a _b adapter.zip base.zip | awk '{s+=$1} END{print s+0}')
          rm -rf src_adapter src_base _a _b adapter.zip base.zip ~/.cache/huggingface ~/.cache/torch
          python - <<PY
          import json,pathlib
          targets=['src_adapter','src_base','_a','_b','adapter.zip','base.zip']
          remaining=[p for p in targets if pathlib.Path(p).exists()]
          rec={'schema':'R22619_C78_BEHAVIOR_RAW_DELETION_V1','source_artifact_ids':[9992478575,9992533187],'raw_bytes_deleted':int('$BEFORE'),'remaining_targets':remaining,'raw_git_commit':0,'hf_redownload':0,'final_delivery_contains_model_weights':False}
          pathlib.Path('out/C78_BEHAVIOR_DELETION_RECEIPT.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          assert not remaining
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22619-c78-behavior-rawfree
          path: out
          retention-days: 1
