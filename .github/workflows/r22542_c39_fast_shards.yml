name: LAA R22542 C39 faster resource shards
on:
  pull_request:
    branches: [ main ]
    paths: [ 'laa/r22542/C39_FAST_SHARD_ONCE.txt' ]
permissions: {contents: read, actions: write}
jobs:
  fast:
    if: github.run_number == 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: teacher-base, mode: teacher, condition: BASE, seed: 42}
          - {name: teacher-full, mode: teacher, condition: FULL, seed: 42}
          - {name: teacher-dose025, mode: teacher, condition: DOSE_0.25, seed: 42}
          - {name: teacher-dose05, mode: teacher, condition: DOSE_0.5, seed: 42}
          - {name: teacher-dose15, mode: teacher, condition: DOSE_1.5, seed: 42}
          - {name: teacher-random, mode: teacher, condition: RANDOM_42, seed: 42}
          - {name: teacher-shuffled, mode: teacher, condition: SHUFFLED, seed: 42}
          - {name: gen-base42, mode: generation, condition: BASE, seed: 42}
          - {name: gen-full42, mode: generation, condition: FULL, seed: 42}
          - {name: gen-full224, mode: generation, condition: FULL, seed: 224}
          - {name: gen-full1337, mode: generation, condition: FULL, seed: 1337}
          - {name: gen-random42, mode: generation, condition: RANDOM_42, seed: 42}
          - {name: gen-shuffled42, mode: generation, condition: SHUFFLED, seed: 42}
    runs-on: ubuntu-24.04
    env: {TRANSFORMERS_REV: c7e57f79348480f73d3ef0ad8c47f807ef1378c8, OMP_NUM_THREADS: '4', MKL_NUM_THREADS: '4'}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {name: r22542-c39-escrow-adapter, path: recovered/adapter, github-token: '${{ github.token }}', repository: ojh850636-alt/-, run-id: 31484392389}
      - uses: actions/download-artifact@v4
        with: {name: r22542-c39-escrow-meta, path: recovered/meta, github-token: '${{ github.token }}', repository: ojh850636-alt/-, run-id: 31484392389}
      - uses: actions/download-artifact@v4
        with: {pattern: 'r22542-c39-base-*', path: recovered/base_parts, merge-multiple: true, github-token: '${{ github.token }}', repository: ojh850636-alt/-, run-id: 31484392389}
      - name: Reassemble exact source
        shell: bash
        run: |
          set -euo pipefail; mkdir -p source/base source/adapter public private
          cp recovered/adapter/adapter_model.safetensors source/adapter/; cp recovered/meta/adapter_config.json source/adapter/
          cp recovered/meta/config.json recovered/meta/model.safetensors.index.json recovered/meta/tokenizer_config.json recovered/meta/tokenizer.json source/base/
          cat $(find recovered/base_parts -type f -name 'base.part.*' | sort) > source/base/model.safetensors-00001-of-00001.safetensors
          test "$(sha256sum source/base/model.safetensors-00001-of-00001.safetensors|awk '{print $1}')" = aa33250c4fc64891ddfaba3a314fd9542ea371843c387178b425fbcc5ed680b1
          test "$(sha256sum source/adapter/adapter_model.safetensors|awk '{print $1}')" = 4c4126ec284b9bcd64f2e38a26f242b02dace75b31547a65a9863e7bc10e4312
          rm -rf recovered/base_parts
      - name: Install exact Qwen runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          git clone -q https://github.com/huggingface/transformers.git runtime-transformers; git -C runtime-transformers checkout -q "$TRANSFORMERS_REV"
          python -m pip install --quiet ./runtime-transformers 'peft==0.19.1' 'safetensors==0.8.0' 'accelerate==1.14.0' 'huggingface-hub==1.16.1' 'tokenizers==0.22.2' 'kernels==0.16.0'
      - name: Run fast precommitted shard
        run: python -B laa/r22542/c39_fast_shard.py --mode '${{ matrix.mode }}' --condition '${{ matrix.condition }}' --seed '${{ matrix.seed }}' --base source/base --adapter source/adapter --out public/SHARD.json --private private/TACTICS.jsonl
      - name: Delete model source before verifier
        if: matrix.mode == 'generation'
        run: rm -rf source recovered runtime-transformers "$HOME/.cache/huggingface" "$HOME/.cache/pip"
      - name: Install Lean
        if: matrix.mode == 'generation'
        shell: bash
        run: |
          set -euo pipefail; git clone -q https://github.com/mxthematic/openproof.git openproof; git -C openproof checkout -q d49b7e3223962f806aeabf330f6717b3ecdc914b
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh; sh elan-init.sh -y --default-toolchain leanprover/lean4:v4.28.0; export PATH="$HOME/.elan/bin:$PATH"; cd openproof/lean && lake update && lake exe cache get
      - name: Verify generated tactics and delete raw text
        if: matrix.mode == 'generation'
        shell: bash
        run: |
          set -euo pipefail; export PATH="$HOME/.elan/bin:$PATH"; python -B laa/r22542/c39_verify_shard.py --private private/TACTICS.jsonl --lean-root openproof/lean --out public/LEAN_SHARD.json; rm -rf private openproof "$HOME/.elan" "$HOME/.cache"
      - name: Remove remnants
        if: always()
        run: rm -rf source recovered runtime-transformers private "$HOME/.cache" || true
      - uses: actions/upload-artifact@v4
        if: success()
        with: {name: 'r22542-c39-fast-${{ matrix.name }}', path: public/, retention-days: 1}
