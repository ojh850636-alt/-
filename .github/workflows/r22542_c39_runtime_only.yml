name: LAA R22542 C39 runtime-only wheel escrow
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact primary runtime wheelhouse, no model access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheelhouse report work
          python -m pip install --quiet build wheel
          python -m pip download --no-deps -d wheelhouse \
            'peft==0.19.1' 'accelerate==1.14.0' 'tokenizers==0.22.2' 'safetensors==0.8.0' 'huggingface_hub==1.16.1'
          git clone --quiet https://github.com/huggingface/transformers.git work/transformers
          cd work/transformers
          git checkout --quiet c7e57f79348480f73d3ef0ad8c47f807ef1378c8
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD) python -m build --wheel --outdir ../../wheelhouse >/dev/null
          cd ../..
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,platform,sys
          expected={
            'peft-0.19.1-py3-none-any.whl':'2113f72a81621b5913ef28f9022204c742df111890c5f49d812716a4a301e356',
            'accelerate-1.14.0-py3-none-any.whl':'e94390c2863b873be18f623f9df48a0d8fe5eff13ea7f1a00092b0a7904888c6',
            'huggingface_hub-1.16.1-py3-none-any.whl':'64340de934b9ce37857ef85a82de72f5629e8a270f9119eabb12bf495eb53c22',
            'safetensors-0.8.0-cp310-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl':'fd6f3f93c9a0a7cc2788ee63fb763353d4bd2e89b0751bc78fcf7dda00bea774',
            'tokenizers-0.22.2-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl':'369cc9fc8cc10cb24143873a0d95438bb8ee257bb80c71989e3ee290e8d72c67',
          }
          rows=[]
          for p in sorted(Path('wheelhouse').glob('*.whl')):
            h=hashlib.sha256(p.read_bytes()).hexdigest()
            rows.append({'file':p.name,'size_bytes':p.stat().st_size,'sha256':h,'matches_sourcezero_hash':expected.get(p.name)==h if p.name in expected else None})
          for name,eh in expected.items():
            hit=[r for r in rows if r['file']==name]
            assert hit and hit[0]['sha256']==eh,(name,hit,eh)
          tf=[r for r in rows if r['file'].startswith('transformers-')]
          assert len(tf)==1,tf
          out={'schema':'LUCIA_AA_R22542_C39_RUNTIME_WHEEL_ESCROW_V1','verdict':'PASS_PRIMARY_WHEELS_HASH_MATCH_EXCEPT_REBUILT_TRANSFORMERS_BOUND_TO_EXACT_SOURCE_COMMIT','transformers_source_commit':'c7e57f79348480f73d3ef0ad8c47f807ef1378c8','prior_sourcezero_transformers_wheel_sha256':'d884af8a984b95af0a1345e172f8acd42c3f19db9ea279097c4196afde6549af','rebuilt_transformers_wheel_sha256':tf[0]['sha256'],'model_weight_bytes_downloaded':0,'model_outputs_observed':0,'python':sys.version,'platform':platform.platform(),'wheels':rows}
          Path('report/R22542_C39_RUNTIME_WHEEL_ESCROW.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22542-c39-runtime-wheelhouse
          path: |
            wheelhouse/
            report/
          retention-days: 1
